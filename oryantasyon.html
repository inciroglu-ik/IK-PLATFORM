<style>
/* Oryantasyon Formları — İK Portalı kutucuğu. Kabuk ve bileşenler İK Dashboard ile ortaktır (pano/*.css, pano/ortak.js). */
body.oryantasyon .ust-marka { display: flex; }
.oy-izgara-kart { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.oy-unvan { display: flex; flex-direction: column; gap: 10px; }
.oy-unvan h3 { font-family: var(--font-serif); font-size: 19px; font-weight: 600; color: var(--metin-marka); margin: 0; }
.oy-unvan .oy-alt { font-size: 12.5px; color: var(--metin-3); }
.oy-unvan .oy-durum { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 24px; }
.oy-unvan .oy-durum .cip { height: auto; min-height: 22px; padding: 3px 9px; white-space: normal; line-height: 1.3; }
.oy-unvan .oy-eylem { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.oy-isimler { display: flex; gap: 5px; flex-wrap: wrap; }

  border: 1px solid var(--cizgi-1); border-radius: 14px; padding: 10px 12px; box-shadow: var(--gol-1); }

.oy-bilgi.uyari { background: var(--uy-50); border-color: var(--uy-200); color: var(--uy-700); }
.oy-bilgi b { color: var(--metin-1); }
.oy-lejant { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--metin-2); }

.oy-bolum-ust input.oy-bolum-ad:hover { border-color: var(--cizgi-2); background: #fff; }
.oy-bolum-ust input.oy-bolum-ad:focus { border-color: var(--pir-500); background: #fff; outline: none; box-shadow: var(--odak-halkasi); }
.oy-bolum.yeni { border-color: #9cc9a4; } .oy-bolum.yeni .oy-bolum-ust { background: #eef8f0; }

.oy-plan { flex: 1; min-width: 0; }
.oy-araclar { display: flex; gap: 2px; flex: none; }

.oy-alanlar { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px 12px; margin: 8px 0 0 38px; }

.oy-kisi-bos { color: var(--metin-3); }

button.oy-kisi-cip.kaldir { cursor: pointer; }

.oy-kisi-bilgi { font-size: 12.5px; color: var(--metin-3); padding: 8px; line-height: 1.5; }
.oy-kisi-alt { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* kişiye özel formlar */
.oy-hazirlanacak-liste { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

.oy-sorumlu-girdi { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: var(--lac-50, #eef3f9); color: var(--lac-700, #1b3a5e); font-size: 12px; }
.oy-sorumlu-girdi .ikon { width: 14px; height: 14px; }
.oy-bildirim-satir input { width: 16px; height: 16px; accent-color: var(--pir-500); }
.oy-bildirim-ad { display: grid; gap: 1px; min-width: 0; }
.oy-bildirim-ad b { font-size: 13.5px; }
.oy-bildirim-ad small { font-size: 12px; color: var(--metin-3); overflow: hidden; text-overflow: ellipsis; }
.oy-bildirim-say { font-size: 12px; color: var(--metin-2); }

@media (max-width: 900px) { .oy-personel-izgara { grid-template-columns: repeat(2, minmax(0, 1fr)); } .oy-form { grid-template-columns: minmax(0, 1fr); } }
.oy-alan.degisti .oy-girdi, .oy-plan.degisti .oy-girdi, .oy-ust-alan.degisti .oy-girdi { background: #fff6dd; border-color: #e7c35a; }
.oy-eski { display: block; font-size: 11.5px; color: #8a6a12; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.oy-eski::before { content: 'Önceki: '; font-weight: 700; }
.oy-eski.bos::after { content: '(boştu)'; font-style: italic; }
.oy-etiket-yeni { display: inline-flex; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #2f7d43; background: #e2f4e6; border-radius: 6px; padding: 2px 7px; margin: 0 0 4px 38px; }
.oy-etiket-tasindi { display: inline-flex; font-size: 11px; color: var(--lac-700); background: var(--lac-50); border-radius: 6px; padding: 2px 7px; margin: 0 0 4px 38px; }
.oy-silinenler { margin-top: 8px; padding: 10px 12px; border: 1px dashed #e0a7a0; border-radius: 12px; background: #fdf3f1; }
.oy-silinenler h5 { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: #9b3a2e; letter-spacing: .03em; }
.oy-sil-satir { display: flex; gap: 10px; align-items: center; font-size: 13px; color: #7d3a32; padding: 3px 0; }
.oy-sil-satir s { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.oy-sil-satir .btn { height: 28px; font-size: 12px; padding: 0 10px; flex: none; }
.oy-silinenler.cop { border-color: var(--cizgi-2); background: var(--n-50); }
.oy-silinenler.cop h5 { color: var(--metin-2); }
.oy-silinenler.cop .oy-sil-satir { color: var(--metin-2); }
.oy-sil-alt { font-size: 11.5px; color: var(--metin-3); margin: -2px 0 4px; }
.oy-ekle { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.oy-ekle .btn { height: 32px; font-size: 12.5px; }
.oy-ust-bilgi { display: flex; flex-wrap: wrap; gap: 8px; }
.oy-ust-alan { display: flex; gap: 4px; align-items: center; border: 1px solid var(--cizgi-1); border-radius: 10px; padding: 4px 4px 4px 6px; background: #fff; }
.oy-ust-alan.yeni { border-color: #9cc9a4; background: #f1faf3; }
.oy-ust-alan .oy-girdi { width: 190px; min-height: 30px; padding: 4px 8px; }
.oy-ust-alan .btn { width: 28px; height: 28px; padding: 0; justify-content: center; }
.oy-ust-alan .oy-eski { max-width: 200px; }

/* İnceleme (İK) */
.oy-inceleme { display: grid; grid-template-columns: 290px minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.oy-mudurler { display: grid; gap: 8px; }
.oy-mudur { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 3px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--cizgi-1); background: var(--yuzey-kart); }
.oy-mudur:hover { border-color: var(--pir-300); }
.oy-mudur.secili { border-color: var(--pir-500); box-shadow: 0 0 0 3px var(--pir-100); }
.oy-mudur b { font-size: 13.5px; color: var(--metin-1); }
.oy-mudur small { font-size: 11.5px; color: var(--metin-3); }
.oy-mudur .cip { justify-self: start; height: auto; min-height: 20px; padding: 2px 8px; white-space: normal; line-height: 1.3; }
.oy-notlar { position: sticky; top: 12px; display: grid; gap: 12px; }
.oy-notlar .kart-govde { display: grid; gap: 8px; }
.oy-not { font-size: 12.5px; line-height: 1.45; color: var(--metin-2); border-left: 3px solid var(--cizgi-2); padding: 2px 0 2px 8px; overflow-wrap: anywhere; }
.oy-not.sil { border-left-color: #c96a5d; } .oy-not.ekl { border-left-color: #3f9a55; } .oy-not.tas { border-left-color: var(--pir-400); }
.oy-not b { color: var(--metin-1); }
.oy-oku { font-size: 13.5px; line-height: 1.5; color: var(--metin-1); white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.5em; }
.oy-oku.bos { color: var(--metin-3); }
.oy-alan.degisti .oy-oku, .oy-plan.degisti .oy-oku, .oy-ust-alan.degisti .oy-oku { background: #fff3cd; border-radius: 6px; padding: 2px 6px; margin-left: -6px; }
.oy-madde.silindi, .oy-madde.bolumle-silindi { opacity: .9; border-left-color: #c96a5d; background: #fdf3f1; }
.oy-madde.silindi .oy-oku, .oy-madde.bolumle-silindi .oy-oku { text-decoration: line-through; color: #8a4038; }
.oy-etiket-sil { display: inline-flex; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #9b3a2e; background: #f8dcd7; border-radius: 6px; padding: 2px 7px; margin: 0 0 4px 38px; }
@media (max-width: 1180px) { .oy-inceleme { grid-template-columns: 260px minmax(0, 1fr); } .oy-notlar { grid-column: 1 / -1; position: static; } }
@media (max-width: 760px) {
  .oy-inceleme { grid-template-columns: minmax(0, 1fr); }

  .oy-alan, .oy-alan.s3, .oy-alan.s4, .oy-alan.s6 { grid-column: span 2; } .oy-alan.s1 { grid-column: span 1; }
  .oy-etiket-yeni, .oy-etiket-tasindi, .oy-etiket-sil { margin-left: 0; }

}
@media print {
  .ust-alan, .oy-cubuk, .oy-mudurler-kart, .oy-araclar, .btn, .acilis, .oy-indir { display: none !important; }

  body { background: #fff; }
}
</style>
</head>
<!--
  ORYANTASYON FORMLARI (oryantasyon.html) — İK Portalı'nda kutucuk.
  Müdür/direktör: unvanların ana formunu KENDİ kopyasında düzenler (başkası göremez). İK: ana formu yönetir, müdürlerin
  düzenlemelerini ana formla karşılaştırmalı (değişen/eklenen/silinen işaretli) inceler.
  Veri: oryantasyonFormlari/{unvanKodu} (ana form) · oryantasyonDuzenlemeleri/{unvanKodu}__{hid} (müdür kopyası).
  Karşılaştırma motoru: ortak/oryantasyon-fark.js. Kurallar: guvenlik/firestore.rules → ORYANTASYON FORMLARI.
-->
<body class="oryantasyon">
<div class="acilis" id="acilis" role="status" aria-live="polite">
  <div class="acilis-ic">
    <span class="amblem buyuk" role="img" aria-label="İnciroğlu Otomotiv İK amblemi"></span>
    <div class="acilis-baslik">Oryantasyon Formları</div>
    <div class="acilis-metin" id="acilisMetin">Oturum denetleniyor…</div>
    <div class="acilis-cubuk"><i></i></div>
  </div>
</div>
<div class="ana">
  <div class="ust-alan kokpit">
    <header class="ust-bant">
      <div class="ic ust-ic">
        <div class="ust-marka"><span class="amblem" role="img" aria-label="İnciroğlu Otomotiv İK amblemi"></span></div>
        <div class="uyg-ad"><span>Oryantasyon Formları</span><small id="ustAlt">İnsan Kaynakları</small></div>
        <div class="ust-sag" id="ustSag"></div>
      </div>
    </header>
    <div id="kaputYuva"></div>
  </div>
  <main class="ic icerik" id="icerik"></main>
</div>

<script type="module">
import { doc, getDoc, getDocs, setDoc, updateDoc, writeBatch, collection, collectionGroup, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { db, kimlikBaslat, cikisYap, adBasliklari } from "./ortak/kimlik.js";
import * as O from "./pano/ortak.js";
import * as F from "./ortak/oryantasyon-fark.js";
import * as C from "./ortak/oryantasyon-cikti.js";
import { uygula as hareketUygula } from "./pano/hareket.js";
import * as KS from "./ortak/oryantasyon-kisi.js";

const $ = (id) => document.getElementById(id);
const acilisMetni = (t) => { const e = $('acilisMetin'); if (e) e.textContent = t; };
const acilisGizle = () => { const a = $('acilis'); if (a) { a.classList.add('gizle'); setTimeout(() => a.remove(), 600); } };
const SVG = (yol) => '<svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + yol + '</svg>';
const IK_YUKARI = SVG('<path d="m6 14 6-6 6 6"/>');
const IK_ASAGI = SVG('<path d="m6 10 6 6 6-6"/>');
const IK_EKLE = SVG('<path d="M12 5v14M5 12h14"/>');
const IK_SIL = SVG('<path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9l1-12.5"/>');
const IK_KAYDET = SVG('<path d="M5 4.5h11l3 3V19.5H5z"/><path d="M8 4.5v5h7v-5M8 19.5v-6h8v6"/>');
const IK_GERI = SVG('<path d="M15 6l-6 6 6 6"/>');
const IK_INDIR = SVG('<path d="M12 4.5v10M7.5 10.5 12 15l4.5-4.5"/><path d="M5 17.5v2h14v-2"/>');
const IK_YAZDIR = SVG('<path d="M7 9V4.5h10V9"/><rect x="4" y="9" width="16" height="7.5" rx="1.5"/><path d="M7 14h10v5.5H7z"/>');

/* ============================================================== OTURUM */
const ROLLER = ['ik', 'direktor', 'satis_mudur', 'servis_mudur', 'idari_mudur', 'mudur'];
const ROL_ADI = { ik: 'İnsan Kaynakları', direktor: 'Direktör', satis_mudur: 'Satış Müdürü', servis_mudur: 'Servis Müdürü', idari_mudur: 'İdari Müdür', mudur: 'Departman Müdürü' };
const OTURUM = await kimlikBaslat({ uygulama: 'Oryantasyon Formları', roller: ROLLER });
const HESAP = OTURUM.hesap;
const HID = OTURUM.hid;
const IK = HESAP.roller.indexOf('ik') >= 0;
const AD = adBasliklari(HESAP.ad || '');
const ANA_ROL = ROLLER.find((r) => HESAP.roller.indexOf(r) >= 0) || '';
const ROL_AD = ROL_ADI[ANA_ROL] || ANA_ROL;
acilisMetni('Formlar yükleniyor…');

/* ============================================================== DURUM */
const ANA = new Map();          /* kod → ana form belgesi */
const DUZ = new Map();          /* belge kimliği → müdür düzenlemesi (İK: hepsi · müdür: yalnız kendisininki) */
let ED = null;                  /* açık düzenleyici: { mod:'mudur'|'ana', kod, calisma, taban, tabanSurum, kayit, kirli, cop, taslak } */
let ILK_ANA = false, ILK_DUZ = false, ILK_KISI = false;
const KISI = new Map();         /* kişiye özel oryantasyon formları (yalnız İK) — oryantasyonKisiler/{id} */
let EPOSTALAR = [];             /* çalışan e-posta listesi (yalnız İK) — oryantasyonAyar/epostalar */
let BASARISIZ = new Set();      /* gönderilemeyen / iptal edilen e-posta kayıtlarının kimlikleri (yalnız İK) — epostaKuyrugu */
const YETKI = new Map();        /* sorumlu doldurma bağlantıları (yalnız İK) — oryantasyonYetki/{y_…} */
const GIRDI = new Map();        /* bağlantı → { maddeKimligi: girdi } — oryantasyonYetki/{y_…}/oryGirdi/{madde} (koleksiyon grubu) */
/** Kişi formunun bağlantıları (her birine kendi satır girdileri eklenmiş: girdiler) */
const kisiYetkileri = (kisiId) => [...YETKI.values()].filter((y) => y.kisiId === kisiId).map((y) => Object.assign({}, y, { girdiler: GIRDI.get(y.id) || {} }));
const yetkiBul = (kisiId, anahtar) => kisiYetkileri(kisiId).find((y) => y.anahtar === anahtar) || null;
/** Satır → { termin, saat, sure, aciklama } (İK'nın sorumlu satırında değişiklik yapıp yapmadığını anlamak için) */
function satirDegerleri(form) {
  const r = new Map();
  ((form && form.bolumler) || []).forEach((b) => (b.maddeler || []).forEach((m) => r.set(m.id, { termin: m.termin || '', saat: m.saat || '', sure: m.sure || '', aciklama: m.aciklama || '' })));
  return r;
}
const unvanAdi = (kod) => (F.UNVANLAR.find((u) => u.kod === kod) || {}).ad || (ANA.get(kod) || {}).unvan || kod;
/* Rol bazlı görünürlük (13.11.2026): satış müdürü → satış danışmanı + satış müdürü formları; servis müdürü → servis
   danışmanı + servis müdürü; direktör ve İK → hepsi; idari müdür / departman müdürü → hepsi (değiştirilmedi).
   Birden çok rolü olan kişi rollerinin birleşimini görür. Güvenlik kuralı (oryUnvanIzinli) kopya kaydını aynı eşlemeyle sınırlar. */
const ROL_UNVAN = { satis_mudur: ['satis-danismani', 'satis-muduru'], servis_mudur: ['servis-danismani', 'servis-muduru'] };
const HEPSINI_GOREN = ['ik', 'direktor', 'idari_mudur', 'mudur'];
const GORUNUR = HESAP.roller.some((r) => HEPSINI_GOREN.includes(r)) ? null : new Set(HESAP.roller.flatMap((r) => ROL_UNVAN[r] || []));
const gorebilir = (kod) => !GORUNUR || GORUNUR.has(kod);
const gorunurUnvanlar = () => F.UNVANLAR.filter((u) => gorebilir(u.kod));
const tarihCoz = (t) => (t && typeof t.toDate === 'function' ? t.toDate() : t instanceof Date ? t : (t && typeof t.seconds === 'number' ? new Date(t.seconds * 1000) : null));
const gunSaat = (t) => { const d = tarihCoz(t); return d ? d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '—'; };
const benimKayit = (kod) => DUZ.get(kod + '__' + HID) || null;
const duzenlemeler = (kod) => [...DUZ.values()].filter((d) => d.kod === kod).sort((a, b) => ((tarihCoz(b.guncelleme) || 0) - (tarihCoz(a.guncelleme) || 0)));
/* Bir kopyanın durumu ve sayıları HER ZAMAN kayıttaki form ile tabandan yeniden hesaplanır (kayıttaki özete güvenilmez;
   bozuk bir kayıt da formuDuzenle ile zararsız hâle gelir) — kartlar, liste ve inceleme aynı hesabı kullanır */
function kopyaDurumu(d) {
  const form = F.formuDuzenle(d.form), taban = F.formuDuzenle(d.taban);
  const fark = F.farkHesapla(taban, form);
  return { form, taban, fark, sayac: fark.sayac, duzenlendi: fark.sayac.toplam > 0 };
}
/* Kopya, ana formun eski bir sürümü üzerinden mi? */
const eskiSurum = (d) => { const a = ANA.get(d.kod); return !!(a && Number(d.tabanSurum) < Number(a.surum)); };
/* Çift tıklamada iki öğe silinmesin (ilk tık listeyi yeniden çizer, ikinci tık kayan öğeye denk gelir) */
let SON_SIL = 0;
const silKilit = () => { const t = Date.now(); if (t - SON_SIL < 450) return false; SON_SIL = t; return true; };

/* ============================================================== YÖNLENDİRME */
function rota() {
  const p = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  return { sayfa: p[0] || 'liste', kod: p[1] || '', hid: p[2] || '' };
}
let SON_HASH = location.hash;
window.addEventListener('hashchange', () => {
  /* kayıt sürerken sayfadan çıkılmaz (kayıt tamamlanınca kendiliğinden yönlenir) */
  if (KAYDEDILIYOR) { history.replaceState(null, '', SON_HASH); O.bildirim('Kaydediliyor, lütfen bekleyin…'); return; }
  if (ED && ED.kirli) {
    if (!confirm('Kaydedilmemiş değişiklikleriniz var. Kaydetmeden çıkılsın mı? (Değişiklikler silinir.)')) { history.replaceState(null, '', SON_HASH); return; }
    taslakSil(ED);                 /* bilerek vazgeçti: bu cihazdaki taslak da silinir */
  }
  ED = null; SON_HASH = location.hash; ciz();
});
/* Sayfa kapanırken / oturum düşerken kaydedilmemiş düzenleme taslak olarak hemen yazılır */
window.addEventListener('beforeunload', (e) => { if (ED && ED.kirli) { taslakYaz(ED, true); e.preventDefault(); e.returnValue = ''; } });
const git = (h) => { location.hash = h; };

/* ============================================================== ÜST BANT */
function ustBantKur() {
  const sag = $('ustSag'); sag.textContent = '';
  if (IK) sag.append(O.el('button', { class: 'btn btn-koyu', type: 'button', title: 'Excel’den hazırlanmış ana form dosyasını (.json) yükler', html: O.ikon('yukle') + '<span class="etk">Ana form aktar</span>', on: { click: aktarimSec } }));
  const bas = AD.split(/\s+/).filter(Boolean);
  sag.append(O.el('div', { class: 'kisi' }, O.el('span', { class: 'avatar', text: ((bas[0] || '?')[0] + ((bas[bas.length - 1] || ' ')[0] || '')).toLocaleUpperCase('tr') }),
    O.el('div', { class: 'kisi-ad' }, O.el('div', { text: AD }), O.el('span', { class: 'rozet', text: ROL_AD }))));
  /* bilerek çıkışta bu cihazdaki taslaklar da silinir (ortak bilgisayarda kalmasın) */
  if (window.top === window.self) sag.append(O.el('button', { class: 'btn btn-koyu', type: 'button', html: O.ikon('cikis') + '<span class="etk">Çıkış</span>', on: { click: () => { taslaklariTemizle(); cikisYap('cikis'); } } }));
}

/* ============================================================== ÇİZİM */
function ciz() {
  ustBantKur();
  const r = rota();
  O.grafikleriTemizle();
  const kok = O.el('section', { class: 'pg on', id: 'p-oryantasyon' });
  $('icerik').replaceChildren(kok);
  /* İK kendi kopyasını oluşturmaz (sayıma karışmasın); İK ana formu düzenler */
  if (r.sayfa === 'form' && ANA.get(r.kod) && !IK && gorebilir(r.kod)) duzenleyiciAc(kok, 'mudur', r.kod);
  else if (r.sayfa === 'ana' && IK) duzenleyiciAc(kok, 'ana', r.kod);
  else if (r.sayfa === 'kisi' && IK && KISI.get(r.kod) && ANA.get(KISI.get(r.kod).kod)) duzenleyiciAc(kok, 'kisi', r.kod);
  else if (r.sayfa === 'inceleme' && IK) incelemeCiz(kok, r.kod, r.hid);
  else {
    /* yetkisiz / geçersiz adres: liste gösterilir, adres çubuğu da listeye döner */
    if (r.sayfa !== 'liste') { history.replaceState(null, '', '#/'); SON_HASH = '#/'; }
    listeCiz(kok);
  }
  window.__TEST_HAZIR = true;
}

/* ---------------------------------------------------- 1) LİSTE */

      : 'İnsan Kaynakları’nın hazırladığı oryantasyon formlarını inceleyin; gerekli gördüğünüz yerleri <b>düzenleyin, ekleyin ya da çıkarın</b> ve kaydedin. Düzenlemenizi yalnız siz ve İnsan Kaynakları görür.',

       'Müdürler birbirinin düzenlemesini göremez; düzenlemeleri yalnız İnsan Kaynakları görür.',
       'Ana formu değiştirdiğinizde müdürlerin daha önce kaydettiği düzenlemeler değişmez; karşılaştırma her müdürün başladığı ana form sürümüne göre yapılır.',
       '“Değişiklik önerim yok” diyen müdürler de listede görünür.']
    : ['Kaydetmediğiniz değişiklikler saklanmaz.', 'Hiçbir değişiklik gerekmiyorsa formu açıp “Değişiklik önerim yok” diyebilirsiniz; İnsan Kaynakları formu incelediğinizi görür.']);
}
/* ---------------------------------------------------- KİŞİYE ÖZEL ORYANTASYON FORMLARI (İK)
   Yeni başlayan için unvanın ana formundan kopyalanır (haftalık veri / işe giriş hareketinde İK Dashboard otomatik açar
   ve ik@ adresine bildirir; İK buradan elle de açabilir). İK sorumluları, tarih ve saatleri seçip kaydeder; kayıttan
   sonra seçilen sorumlulara görevlerini içeren e-posta gider (epostaKuyrugu → GitHub Actions → Gmail). */
const kisiListesi = () => [...KISI.values()].sort((a, b) => (a.durum === b.durum ? String(b.iseGiris || '').localeCompare(String(a.iseGiris || '')) : a.durum === 'hazirlanacak' ? -1 : 1));

    O.el('div', { class: 'oy-hazirlanacak-liste' }, ...bek.slice(0, 8).map((k) => O.el('a', { class: 'btn', href: '#/kisi/' + k.id, html: O.ikon('dosya') + '<span>' + O.esc(O.trBaslik(k.ad || '')) + ' · ' + O.esc(k.unvan || unvanAdi(k.kod)) + '</span>' })))));
}
function kisiBolumu(kok) {
  O.akisBaslik(kok, { no: '02', baslik: 'Kişiye özel oryantasyon formları', aciklama: 'Yeni başlayan her personel için sorumlu, tarih ve saatleri belirlenmiş form · kaydedince sorumlulara e-posta gider' });
  const iz = O.izgara(kok);
  const arac = O.el('div', { class: 'kart-arac' },

    O.el('button', { class: 'btn btn-pirinc', type: 'button', html: O.ikon('dosya') + '<span>Yeni kişi formu</span>', on: { click: yeniKisiFormu } }));

  const k = O.kart(iz, { baslik: 'Kişi formları', aciklama: liste.length + ' form · ' + liste.filter((x) => x.durum === 'hazirlanacak').length + ' hazırlanacak' + (EPOSTALAR.length ? '' : ' · e-posta listesi henüz yüklenmedi (sorumlulara e-posta için gerekli)'), sinif: 's12', sag: arac });
  O.tablo(k.govde, {

      { k: 'ad', ad: 'Personel', sinif: 'ad-hucre', bicim: (v) => O.trBaslik(v || '') },

      { k: 'iseGiris', ad: 'İşe giriş', bicim: (v) => (v ? F.tarihGoster(v) : '—'), siralamaDegeri: (r) => String(r.iseGiris || '') },
      { k: 'durum', ad: 'Durum', bicim: (v) => O.el('span', { class: 'cip ' + (v === 'hazirlanacak' ? 'cip-uy' : 'cip-ok'), text: v === 'hazirlanacak' ? 'Hazırlanacak' : 'Hazırlandı' }) },
      { k: '_bild', ad: 'Sorumlu bildirimi', siralanamaz: true, bicim: (v, r) => { const kisiler = [...KS.sorumluGorevleri(r.form).entries()].filter(([ad]) => sorumluKisiMi(ad)), b = r.bildirimler || {};
        /* "bildirildi" = görevleri o günden beri değişmemiş ve e-postası gönderilemez / iptal olmamış (bildirim penceresiyle aynı ölçü) */
        return kisiler.length ? kisiler.filter(([ad, g]) => KS.bildirimDurumu(b[KS.adAnahtari(ad)], KS.gorevImzasi(g), BASARISIZ) === 'ayni' && yetkiBul(r.id, KS.adAnahtari(ad))).length + ' / ' + kisiler.length + ' sorumlu' : '—'; } },
      /* bağlantısı olan sorumluların konularından tarihi ve saati girilmiş olanlar (sorumlu sayfasındaki sayaçla aynı tanım: KS.satirDolu) */
      { k: '_doldur', ad: 'Sorumlu doldurma', siralanamaz: true, bicim: (v, r) => { const ys = kisiYetkileri(r.id); if (!ys.length) return '—';

      { k: 'kaynak', ad: 'Açılış', bicim: (v) => v || '—' },
      { k: '_islem', ad: '', siralanamaz: true, bicim: (v, r) => O.el('div', { class: 'oy-islem' }, O.el('a', { class: 'btn btn-pirinc', href: '#/kisi/' + r.id, html: O.ikon('dosya') + 'Formu aç' }),
        O.el('button', { class: 'btn btn-hayalet oy-kisi-sil', type: 'button', title: 'Bu kişinin oryantasyon formunu sil', 'aria-label': 'Formu sil', html: IK_SIL, on: { click: (e) => kisiSil(r, e.currentTarget) } })) }
    ],

    bos: { baslik: 'Henüz kişi formu yok', metin: 'Haftalık veriye satış / servis danışmanı ya da satış / servis müdürü eklendiğinde form kendiliğinden açılır; “Yeni kişi formu” ile elle de açabilirsiniz.' }
  });
}
/* Yeni kişi formu (elle): unvan + kişi bilgileri → ana formun kopyası */
function yeniKisiFormu() {
  const uygun = F.UNVANLAR.filter((u) => ANA.get(u.kod));
  if (!uygun.length) { alert('Önce bir unvanın ana formunu yükleyin.'); return; }
  const g = (ad, tip = 'text', deger = '') => O.el('input', { class: 'girdi', type: tip, name: ad, value: deger, autocomplete: 'off', maxlength: tip === 'text' ? '80' : null });
  const unvanS = O.el('select', { class: 'girdi', name: 'unvan' }, ...uygun.map((u) => O.el('option', { value: u.kod, text: u.ad })));
  const dl = O.el('datalist', { id: 'oyPersonelListe' }, ...PERSONEL.map((p) => O.el('option', { value: p.ad, label: [p.unvan, p.dept].filter(Boolean).join(' · ') })));
  const fAd = g('ad'); fAd.setAttribute('list', 'oyPersonelListe');
  const fDep = g('dept'), fGir = g('iseGiris', 'date', KS.isoTarih(new Date())), fYon = g('yonetici'); fYon.setAttribute('list', 'oyPersonelListe');
  fAd.addEventListener('change', () => { const p = PERSONEL.find((x) => O.aramaAnahtari(x.ad) === O.aramaAnahtari(fAd.value)); if (p && !fDep.value) fDep.value = p.dept || ''; });
  const hata = O.el('div', { class: 'oy-hata', hidden: true });
  const olustur = O.el('button', { class: 'btn btn-pirinc', type: 'button', html: O.ikon('dosya') + '<span>Formu oluştur</span>' });
  pencereAc('Yeni kişi formu', [
    O.el('div', { class: 'modal-ust' }, O.el('div', null, O.el('h3', { text: 'Yeni kişi formu' }), O.el('p', { text: 'Seçtiğiniz unvanın ana formu bu kişi için kopyalanır; sorumluları, tarih ve saatleri sonra seçersiniz.' }))),
    O.el('div', { class: 'modal-govde' }, O.el('div', { class: 'oy-form' },
      O.el('label', { class: 'genis' }, 'Unvan (oryantasyon formu)', unvanS), O.el('label', { class: 'genis' }, 'Ad Soyad *', fAd, dl),
      O.el('label', null, 'Departman', fDep), O.el('label', null, 'İşe giriş tarihi', fGir), O.el('label', { class: 'genis' }, 'İlk yönetici / amir', fYon)), hata),
    O.el('div', { class: 'modal-alt' }, O.el('button', { class: 'btn', type: 'button', text: 'Vazgeç', on: { click: pencereKapat } }), olustur)]);
  olustur.addEventListener('click', async () => {
    const ad = F.temiz(O.trBaslik(fAd.value.trim()), 80);
    if (ad.length < 3) { hata.textContent = 'Ad soyad girin.'; hata.hidden = false; fAd.focus(); return; }
    const varOlan = [...KISI.values()].find((k) => KS.ayniKisi(k, { ad, iseGiris: fGir.value }));
    if (varOlan && !confirm(ad + ' için zaten bir oryantasyon formu var. Yine de yeni form açılsın mı? (Vazgeçerseniz mevcut form açılır.)')) { pencereKapat(); git('#/kisi/' + varOlan.id); return; }
    olustur.disabled = true;
    try {
      const ref = doc(collection(db, 'oryantasyonKisiler'));
      await setDoc(ref, kisiKaydi({ kod: unvanS.value, ad, dept: fDep.value, iseGiris: fGir.value, yonetici: fYon.value, kaynak: 'Elle (İK)' }));
      pencereKapat(); git('#/kisi/' + ref.id);
    } catch (e) { olustur.disabled = false; hata.textContent = 'Oluşturulamadı: ' + (yetkiHatasi(e) ? 'yetki reddedildi (güvenlik kuralı yayınlanmamış olabilir).' : (e && e.message) || 'bilinmeyen hata'); hata.hidden = false; }
  });
}
/** Kişi formu belgesi (yeni): ana formun kopyası — İK Dashboard da aynı alanlarla oluşturur (kural: oryantasyonKisiler) */
function kisiKaydi({ kod, ad, dept, iseGiris, yonetici, kaynak }) {
  const ana = ANA.get(kod), form = F.formuDuzenle(ana ? ana.form : { alanlar: [], bolumler: [] });
  return { kod, unvan: unvanAdi(kod), ad: F.temiz(ad, 80), dept: F.temiz(dept || '', 80), pozisyon: unvanAdi(kod), iseGiris: KS.isoTarih(iseGiris), yonetici: F.temiz(O.trBaslik(yonetici || ''), 80),
    form, taban: form, tabanSurum: ana ? Number(ana.surum) || 0 : 0, durum: 'hazirlanacak', kaynak: F.temiz(kaynak || '', 60), bildirimler: {},
    olusturma: serverTimestamp(), olusturan: HESAP.ad || '', guncelleme: serverTimestamp(), guncelleyen: HESAP.ad || '' };
}
/* Kişi formunu sil (yanlış açılmış / işe başlamayan): henüz gönderilmemiş e-postaları da iptal edilir; gönderilmiş olanlar geri alınamaz */
async function kisiSil(r, dugme) {
  const bildirilen = Object.keys(r.bildirimler || {}).length;
  if (!confirm(O.trBaslik(r.ad || '') + ' için oryantasyon formu silinecek.' + (bildirilen ? ' Sorumlulara daha önce gönderilmiş ' + bildirilen + ' e-posta geri alınamaz; henüz gönderilmeyenler iptal edilir.' : '') + ' Devam edilsin mi?')) return;
  if (dugme) dugme.disabled = true;
  try {
    /* e-posta tam bu sırada gönderilirse ("bekliyor" → "gönderildi") toplu yazım reddedilir: bir kez yeniden okunup denenir */
    let iptal = 0;
    for (let deneme = 0; ; deneme++) {
      try {
        const bekleyen = (await getDocs(query(collection(db, 'epostaKuyrugu'), where('ilgili', '==', 'oryantasyonKisiler/' + r.id)))).docs.filter((d) => d.data().durum === 'bekliyor');
        /* sorumlu doldurma bağlantıları da silinir (bağlantılar artık açılmaz) */
        const yetkiler = (await getDocs(query(collection(db, 'oryantasyonYetki'), where('kisiId', '==', r.id)))).docs;
        const girdiler = [];
        for (const y of yetkiler) (await getDocs(collection(db, 'oryantasyonYetki', y.id, 'oryGirdi'))).docs.forEach((g) => girdiler.push([y.id, g.id]));
        const wb = writeBatch(db);
        bekleyen.forEach((d) => wb.update(doc(db, 'epostaKuyrugu', d.id), { durum: 'iptal' }));
        girdiler.forEach(([y, g]) => wb.delete(doc(db, 'oryantasyonYetki', y, 'oryGirdi', g)));
        yetkiler.forEach((d) => wb.delete(doc(db, 'oryantasyonYetki', d.id)));
        wb.delete(doc(db, 'oryantasyonKisiler', r.id));
        await wb.commit();
        iptal = bekleyen.length; break;
      } catch (e) { if (deneme >= 1 || !yetkiHatasi(e)) throw e; }
    }
    try { localStorage.removeItem(TASLAK_ON + 'kisi|' + r.id + '|' + String(HID).slice(0, 4)); } catch (e) { /* yok say */ }
    O.bildirim(O.trBaslik(r.ad || '') + ' — oryantasyon formu silindi' + (iptal ? '; gönderilmemiş ' + iptal + ' e-posta iptal edildi' : ''));
  } catch (e) { if (dugme && dugme.isConnected) dugme.disabled = false; alert('Silinemedi: ' + (yetkiHatasi(e) ? 'yetki reddedildi.' : (e && e.message) || 'bilinmeyen hata')); }
}
/* Çalışan e-posta listesi: Excel (.xlsx/.xls) ya da CSV → [{ ad, eposta }] (yalnız @inciroglu.com.tr adresleri) */
const XLSX_JS = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function epostaListesiSec() {
  const inp = O.el('input', { type: 'file', accept: '.xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv', style: 'display:none' });
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    try {
      if (!window.XLSX) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = XLSX_JS; s.onload = ok; s.onerror = () => no(new Error('Excel okuyucu indirilemedi; internet bağlantınızı kontrol edin.')); document.head.append(s); });
      const wb = window.XLSX.read(await f.arrayBuffer(), { type: 'array' });
      const satirlar = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      const sonuc = epostaSatirlari(satirlar);
      if (!sonuc.liste.length) { alert('Dosyada e-posta adresi bulunamadı. İlk satırda “Ad Soyad” (ya da “Ad” ve “Soyad”) ile “E-posta” sütunları olmalı.'); return; }
      if (!confirm(sonuc.liste.length + ' çalışanın e-posta adresi yüklenecek' + (sonuc.disari ? '; @inciroglu.com.tr dışındaki ' + sonuc.disari + ' adres alınmayacak' : '') + '. Önceki liste bununla değiştirilir. Devam edilsin mi?')) return;
      await setDoc(doc(db, 'oryantasyonAyar', 'epostalar'), { liste: sonuc.liste, guncelleme: serverTimestamp(), kaynak: F.temiz(f.name, 80) });
      O.bildirim(sonuc.liste.length + ' e-posta adresi yüklendi');
    } catch (e) { alert('E-posta listesi yüklenemedi: ' + (yetkiHatasi(e) ? 'yetki reddedildi (güvenlik kuralı yayınlanmamış olabilir).' : (e && e.message) || 'bilinmeyen hata')); }
  });
  document.body.append(inp); inp.click();
}
function epostaSatirlari(satirlar) {
  const k = (s) => O.aramaAnahtari(String(s || ''));
  let bas = -1, cAd = -1, cSoyad = -1, cEp = -1;
  for (let i = 0; i < Math.min(15, satirlar.length) && bas < 0; i++) {
    const r = satirlar[i].map(k);
    const e = r.findIndex((x) => /e ?-?posta|e ?-?mail|^mail/.test(x));
    if (e < 0) continue;
    bas = i; cEp = e;
    cAd = r.findIndex((x) => /ad soyad|adi soyadi|isim|personel|calisan/.test(x));
    if (cAd < 0) { cAd = r.findIndex((x) => /^adi?$/.test(x)); cSoyad = r.findIndex((x) => /^soyadi?$/.test(x)); }
  }
  const liste = [], gor = new Set(); let disari = 0;
  if (bas < 0 || cAd < 0) return { liste, disari };
  satirlar.slice(bas + 1).forEach((r) => {
    const ad = O.trBaslik((String(r[cAd] || '') + (cSoyad >= 0 ? ' ' + String(r[cSoyad] || '') : '')).replace(/\s+/g, ' ').trim());
    const ep = String(r[cEp] || '').trim().toLowerCase();
    if (!ad || !ep) return;
    if (!KS.epostaGecerli(ep)) { disari++; return; }
    const a = O.aramaAnahtari(ad); if (gor.has(a)) return; gor.add(a);
    liste.push({ ad: F.temiz(ad, 80), eposta: ep });
  });
  return { liste, disari };
}

  ic.append(ey);

  return kart;

/* ---------------------------------------------------- 2) DÜZENLEYİCİ (müdür kopyası ya da İK ana formu) */
/* Çöp kutusu: silinen madde / bölüm / alan, silindiği andaki (düzenlenmiş) hâliyle saklanır; geri alınınca öyle döner.
   Ana formda olmayan (sonradan eklenip silinen) öğeler de buradan geri alınabilir. */
const yeniCop = () => ({ maddeler: new Map(), bolumler: new Map(), alanlar: new Map() });
/* Yerel taslak: kaydedilmemiş düzenleme bu cihazda (localStorage) tutulur; oturum düşse ya da sayfa kapansa da kaybolmaz.
   Formu yeniden açınca "Taslağı geri yükle" önerilir. Başarılı kayıtta ve bilerek vazgeçildiğinde silinir. */
const TASLAK_ON = 'ory-taslak-v1|';
const TASLAK_GUN = 7;            /* taslak bu cihazda en fazla 7 gün tutulur */
const TASLAK_VAR = (() => { try { localStorage.setItem(TASLAK_ON + 'deneme', '1'); localStorage.removeItem(TASLAK_ON + 'deneme'); return true; } catch (e) { return false; } })();
/* Anahtarda hesap kimliğinin yalnız ilk 4 karakteri kullanılır (kişiyi belirlemeye yetmez; aynı cihazdaki kullanıcıları ayırır) */
const taslakAnahtar = (ed) => TASLAK_ON + ed.mod + '|' + (ed.mod === 'kisi' ? ed.kisiId : ed.kod) + '|' + String(HID).slice(0, 4);
function taslaklariTemizle() { if (!TASLAK_VAR) return; try { Object.keys(localStorage).filter((k) => k.startsWith(TASLAK_ON)).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* yok say */ } }
let taslakZaman = null;
function taslakYaz(ed, hemen) {
  if (!ed || !TASLAK_VAR) return;
  clearTimeout(taslakZaman);
  const yaz = () => { try { if (ed.kirli) localStorage.setItem(taslakAnahtar(ed), JSON.stringify({ calisma: ed.calisma, taban: ed.taban, tabanSurum: ed.tabanSurum, bilgi: ed.bilgi || null, zaman: Date.now() })); } catch (e) { /* depolama dolu ya da kapalı */ } };
  if (hemen) yaz(); else taslakZaman = setTimeout(yaz, 400);
}
function taslakSil(ed) { clearTimeout(taslakZaman); if (!ed || !TASLAK_VAR) return; try { localStorage.removeItem(taslakAnahtar(ed)); } catch (e) { /* yok say */ } }
function taslakOku(ed) {
  if (!TASLAK_VAR) return null;
  try {
    const t = JSON.parse(localStorage.getItem(taslakAnahtar(ed)) || 'null');
    if (!t || typeof t !== 'object' || !t.calisma || typeof t.zaman !== 'number') return null;
    if (Date.now() - t.zaman > TASLAK_GUN * 864e5) { taslakSil(ed); return null; }   /* süresi geçmiş taslak */
    const s = { calisma: F.formuDuzenle(t.calisma), taban: F.formuDuzenle(t.taban), tabanSurum: Number(t.tabanSurum) || 0, bilgi: t.bilgi && typeof t.bilgi === 'object' ? t.bilgi : null, zaman: t.zaman };
    if (s.tabanSurum === ed.tabanSurum && F.ayniMi(s.calisma, ed.calisma)) { taslakSil(ed); return null; }   /* kayıtlı hâlle aynı */
    return s;
  } catch (e) { return null; }
}
function taslakGeriYukle() {
  const t = ED && ED.taslak; if (!t) return;
  ED.calisma = t.calisma; ED.taban = t.taban; ED.tabanSurum = t.tabanSurum; if (ED.mod === 'kisi' && t.bilgi) ED.bilgi = Object.assign({}, ED.bilgi, t.bilgi); ED.kirli = true; ED.taslak = null; ED.cop = yeniCop(); ED.rev = (ED.rev || 0) + 1;
  ciz();
  O.bildirim('Taslak geri yüklendi · kaydetmeyi unutmayın');
}

function duzenleyiciAc(kok, mod, kodVeyaId) {

  const kod = kisi ? kisi.kod : kodVeyaId;

  if (!ED || ED.mod !== mod || (mod === 'kisi' ? ED.kisiId !== kodVeyaId : ED.kod !== kod)) {
    if (mod === 'kisi') {
      /* sorumluların kendi satırlarına girdiği tarih / saat / süre / not forma uygulanır (etkin form) */
      const etkin = KS.etkinForm(kisi.form, kisiYetkileri(kodVeyaId));
      ED = { mod, kod, kisiId: kodVeyaId, calisma: F.formuDuzenle(etkin.form), taban: F.formuDuzenle(kisi.taban), tabanSurum: Number(kisi.tabanSurum) || 0, kayit: kisi, kirli: false,

  if (ED.taslak) {

  const govde = O.el('div', { id: 'oyGovde', style: 'display:grid;gap:16px' });
  kok.append(govde);
  formuCiz();

/* Geri alma: önce çöp kutusundaki (düzenlenmiş) hâl, yoksa ana formdaki hâl.

function geriYeri(liste, tabanListe, id, yedekSira) {
  const ti = new Map(tabanListe.map((x, i) => [x.id, i]));
  if (!ti.has(id)) return Math.min(yedekSira, liste.length);
  const hedef = ti.get(id);
  const sonra = liste.findIndex((x) => ti.has(x.id) && ti.get(x.id) > hedef);
  if (sonra >= 0) return sonra;
  let once = -1; liste.forEach((x, i) => { if (ti.has(x.id) && ti.get(x.id) < hedef) once = i; });
  return once >= 0 ? once + 1 : Math.min(yedekSira, liste.length);
}
function alanGeriAl(id, yedek, sira) {
  if (ED.calisma.alanlar.some((a) => a.id === id)) return;
  if (ED.calisma.alanlar.length >= F.EN_FAZLA.alan) { alert(SINIR_MESAJ.alan); return; }
  const c = ED.cop.alanlar.get(id);
  ED.calisma.alanlar.splice(geriYeri(ED.calisma.alanlar, ED.taban.alanlar, id, c ? c.sira : sira), 0, F.kopya(c ? c.alan : yedek));

function bolumGeriAl(id, yedek, sira) {

  const kullanilan = new Set(ED.calisma.bolumler.flatMap((x) => x.maddeler.map((m) => m.id)));
  const geri = F.kopya(c ? c.bolum : yedek);
  geri.maddeler = geri.maddeler.filter((m) => !kullanilan.has(m.id));
  ED.calisma.bolumler.splice(geriYeri(ED.calisma.bolumler, ED.taban.bolumler, id, c ? c.sira : sira), 0, geri);

}

  const tb = ED.taban.bolumler.find((x) => x.id === b.id);

    O.el('div', { class: 'modal-ust' }, O.el('div', null, O.el('h3', { text: 'Oryantasyon sorumlularına bildirim' }),
      O.el('p', { text: O.trBaslik(bilgi.ad) + ' · ' + unvan + ' — her sorumluya kendi konularını ve kişiye özel bağlantıyı içeren e-posta gider; sorumlu planın tamamını görür, yalnız kendi konularının tarih, saat, süre ve notunu doldurur.' }))),
    O.el('div', { class: 'modal-govde' }, liste,
      eksik ? O.el('p', { class: 'oy-bilgi uyari', style: 'margin-top:10px', text: eksik + ' sorumlunun e-posta adresi listede yok. “Kişi formları” bölümündeki “E-posta listesi” ile çalışan e-posta listesini yükleyin; sonra formu yeniden kaydederek bildirebilirsiniz.' }) : null,
      roller.length ? O.el('p', { class: 'oy-bilgi oy-bildirim-rol', style: 'margin-top:10px', text: roller.length + ' sorumlu aktif personel listesinde yok (' + roller.slice(0, 3).join(' · ') + (roller.length > 3 ? ' …' : '') + '); bunlara e-posta gitmez. Çoğu ana formdan gelen unvan yazısıdır — sorumluyu personel listesinden seçip yeniden kaydederseniz bildirilir.' }) : null,
      O.el('p', { class: 'oy-kisi-bilgi-not', text: 'E-postalar birkaç dakika içinde (en geç yarım saat) gönderilir.' })),
    O.el('div', { class: 'modal-alt' }, O.el('button', { class: 'btn', type: 'button', text: 'Şimdi değil', on: { click: pencereKapat } }), gonder)]);
  gonder.addEventListener('click', async () => {
    const secilen = satirlar.filter((s) => s.eposta && kutular.get(s.anahtar).checked);
    if (!secilen.length) { pencereKapat(); return; }
    gonder.disabled = true;
    try {
      const wb = writeBatch(db);
      const yeniBildirim = Object.assign({}, onceki);
      /* sorumlu doldurma bağlantısı: varsa aynısı, yoksa yeni (planın görünümü sorumluların girdileri uygulanmış hâli) */
      const varolan = kisiYetkileri(kisiId);
      const gorunum = KS.gorunumYap(KS.etkinForm(form, varolan).form);
      const kb = kisiBilgisi(Object.assign({}, kayit, { ad: bilgi.ad, dept: bilgi.dept, pozisyon: bilgi.pozisyon, iseGiris: bilgi.iseGiris }));
      secilen.forEach((s) => {
        let tok = (yetkiBul(kisiId, s.anahtar) || {}).id;
        const satirlar = KS.sahipSatirlari(form, s.ad), durum = satirlar.length ? 'acik' : 'kapali';

            olusturma: serverTimestamp(), guncelleme: serverTimestamp() });
        } else {
          /* var olan bağlantı: e-postayla aynı anda güncel satırlar / plan / açık durumu yazılır (kapalıysa yeniden açılır) */
          wb.update(doc(db, 'oryantasyonYetki', tok), { satirlar, gorunum, kisi: kb, durum, guncelleme: serverTimestamp() });
        }
        const e = KS.sorumluEpostasi({ sorumlu: s.ad, kisi: O.trBaslik(bilgi.ad), unvan, dept: bilgi.dept, iseGiris: bilgi.iseGiris, gorevler: s.gorevler, guncelleme: s.durum === 'degisti', baglanti: sorumluBaglantisi(tok) });
        const q = doc(collection(db, 'epostaKuyrugu'));
        wb.set(q, Object.assign(KS.kuyrukKaydi({ kime: s.eposta, kimeAd: s.ad, konu: e.konu, html: e.html, kaynak: 'oryantasyon-sorumlu', ilgili: 'oryantasyonKisiler/' + kisiId }),
          { olusturma: serverTimestamp(), olusturan: HESAP.ad || '' }));
        /* kuyruk: e-posta kaydının kimliği — gönderilemez / iptal edilirse sorumlu "bildirilmedi" sayılır */
        yeniBildirim[s.anahtar] = { ad: s.ad, eposta: s.eposta, imza: s.imza, zaman: new Date().toISOString(), kuyruk: q.id };
      });
      wb.update(doc(db, 'oryantasyonKisiler', kisiId), { bildirimler: yeniBildirim, guncelleme: serverTimestamp(), guncelleyen: HESAP.ad || '' });
      await wb.commit();
      pencereKapat();
      yetkiEsitleSirala(kisiId);
      O.bildirim(secilen.length + ' sorumluya e-posta sıraya alındı; birkaç dakika içinde gönderilir');
    } catch (e) { gonder.disabled = false; alert('E-posta sıraya alınamadı: ' + (yetkiHatasi(e) ? 'yetki reddedildi (güvenlik kuralı yayınlanmamış olabilir).' : (e && e.message) || 'bilinmeyen hata')); }
  });
}
/* Kayıt sürerken (yavaş bağlantı) yazılmaya devam edildiyse: kayıt tamamlandı ama son yazılanlar ekranda ve taslakta kalır */
function kayitSirasindaDegisti(ed) {
  O.bildirim('Kaydedildi. Kayıt sürerken yaptığınız son değişiklikler için yeniden “Kaydet”e basın.');
  if (ED === ed) cubukCiz();
}
let KAYDEDILIYOR = false;
async function kaydet(degisiklikYok) {
  const ed = ED;                       /* kayıt sürerken sayfa değişse de bu düzenleyiciyle çalışılır */
  if (KAYDEDILIYOR || !ed) return;
  const b = $('oyKaydet');
  taslakYaz(ed, true);
  try {
    KAYDEDILIYOR = true; if (b) b.disabled = true;
    if (ed.mod === 'kisi') {
      /* kişi formu: kaydet → ardından seçilen sorumlulara bildirim penceresi */
      const form = F.formuDuzenle(bosYenileriAt(ed.calisma, ed.taban));
      const bl = ed.bilgi;
      if (F.sade(bl.ad).length < 3) { alert('Personelin adını girin.'); return; }
      const rev = ed.rev || 0;
      await updateDoc(doc(db, 'oryantasyonKisiler', ed.kisiId), {
        form, ad: F.temiz(O.trBaslik(bl.ad), 80), dept: F.temiz(bl.dept, 80), pozisyon: F.temiz(bl.pozisyon, 120), iseGiris: KS.isoTarih(bl.iseGiris), yonetici: F.temiz(bl.yonetici, 120),
        tabanSurum: ed.tabanSurum, taban: F.formuDuzenle(ed.taban), durum: 'hazirlandi', guncelleme: serverTimestamp(), guncelleyen: HESAP.ad || '' });
      /* İK'nın sorumlu satırlarında yaptığı düzeltmeler sorumlunun bağlantısına da yazılır */
      try { await ikDuzeltmeleri(ed, form); } catch (e) { console.warn('Sorumlu girdileri güncellenemedi', e); }
      if ((ed.rev || 0) !== rev) { taslakYaz(ed, true); kayitSirasindaDegisti(ed); return; }
      ed.kirli = false; taslakSil(ed);
      O.bildirim('Kişi formu kaydedildi');
      /* sorumlu bağlantıları hemen eşitlenir (sekme kapatılsa da formdan çıkarılan sorumlunun bağlantısı kapanır) */
      try { await yetkiEsitle(ed.kisiId, { form, ad: F.temiz(O.trBaslik(bl.ad), 80), dept: F.temiz(bl.dept, 80), pozisyon: F.temiz(bl.pozisyon, 120), iseGiris: KS.isoTarih(bl.iseGiris) }); }
      catch (e) { console.warn('Sorumlu bağlantıları eşitlenemedi', e); }
      sorumluBildirimi(ed.kisiId, form, Object.assign({}, bl));
      return;
    }
    if (ed.mod === 'ana') {
      const form = F.formuDuzenle(bosYenileriAt(ed.calisma, ed.taban));
      if (!form.bolumler.length) { alert('Ana formda en az bir bölüm olmalı.'); return; }
      const ana = ANA.get(ed.kod);
      const guncel = ana ? Number(ana.surum) || 0 : 0;
      if (guncel !== ed.tabanSurum) {
        if (!confirm('Siz düzenlerken bu ana form ' + (ana && ana.guncelleyen ? adBasliklari(ana.guncelleyen) + ' tarafından ' : '') + 'güncellendi (şu an ' + guncel + '. sürüm). Kaydederseniz o değişikliklerin yerine ekranınızdaki hâl geçer. Yine de kaydedilsin mi?')) return;
      } else if (!confirm((ana ? 'Ana form güncellenecek (sürüm ' + (guncel + 1) + ').' : 'Ana form oluşturulacak.') + ' Formu henüz düzenlememiş müdürler yeni hâli görür. Devam edilsin mi?')) return;
      const n = guncel + 1;
      const rev = ed.rev || 0;
      const wb = writeBatch(db);
      wb.set(doc(db, 'oryantasyonFormlari', ed.kod), {
        kod: ed.kod, unvan: F.temiz(unvanAdi(ed.kod), 80), form, surum: n,
        guncelleme: serverTimestamp(), guncelleyen: HESAP.ad || '', kaynak: F.temiz((ana && ana.kaynak) || 'Panodan oluşturuldu', 200)
      });
      wb.set(doc(db, 'oryantasyonFormlari', ed.kod, 'surumler', String(n)), { surum: n, form, guncelleme: serverTimestamp(), guncelleyen: HESAP.ad || '' });
      await wb.commit();
      delete YENI_ANA[ed.kod];
      /* kaydedilen hâl yeni taban olur (kayıt sürerken yazılan varsa ekranda kalır ve bir sonraki kayıtla gider) */
      ed.taban = F.kopya(form); ed.tabanSurum = n; ed.kayit = { surum: n };
      if ((ed.rev || 0) !== rev) { taslakYaz(ed, true); kayitSirasindaDegisti(ed); return; }
      ed.kirli = false; taslakSil(ed);
      O.bildirim('Ana form kaydedildi · sürüm ' + n);
      if (ED === ed) git('#/inceleme/' + ed.kod);
      return;
    }
    const taban = F.formuDuzenle(ed.taban);
    let calisma = F.formuDuzenle(bosYenileriAt(ed.calisma, taban));
    if (degisiklikYok) {
      if (!confirm('Formu olduğu gibi uygun bulduğunuz İnsan Kaynakları’na bildirilecek. Devam edilsin mi?')) return;
    } else if (!F.farkHesapla(taban, calisma).sayac.toplam) {
      if (!confirm('Formda değişiklik yapmadınız. “Değişiklik önerim yok” olarak kaydedilsin mi?')) return;
      degisiklikYok = true;
    }
    if (degisiklikYok) calisma = F.kopya(taban);
    const s = F.farkHesapla(taban, calisma).sayac;
    const ref = doc(db, 'oryantasyonDuzenlemeleri', ed.kod + '__' + HID);
    const veri = { kod: ed.kod, hid: HID, ad: HESAP.ad || '', rol: ROL_AD, durum: s.toplam ? 'duzenlendi' : 'onaylandi',
      form: calisma, taban, tabanSurum: ed.tabanSurum, ozet: s, guncelleme: serverTimestamp() };
    /* var olan kopyada oluşturma zamanı korunur (updateDoc ona dokunmaz); yeni kopyada sunucu saatiyle yazılır */
    const rev = ed.rev || 0;
    if (benimKayit(ed.kod) || ed.kaydedildi) {
      try { await updateDoc(ref, veri); }
      catch (e) { if (e && e.code === 'not-found') await setDoc(ref, Object.assign({ olusturma: serverTimestamp() }, veri)); else throw e; }
    } else await setDoc(ref, Object.assign({ olusturma: serverTimestamp() }, veri));
    ed.kaydedildi = true;
    if ((ed.rev || 0) !== rev) { taslakYaz(ed, true); kayitSirasindaDegisti(ed); return; }
    ed.kirli = false; taslakSil(ed);
    if (degisiklikYok) ed.calisma = F.kopya(taban);
    O.bildirim(s.toplam ? 'Düzenlemeniz kaydedildi · İnsan Kaynakları görebilir' : 'Kaydedildi: değişiklik önermediniz');
    if (ED === ed) git('#/');
  } catch (e) {
    if (ed.kirli) taslakYaz(ed, true);
    const neden = !yetkiHatasi(e) ? ((e && e.message) || 'bilinmeyen hata')
      : ed.mod === 'ana' ? 'yetkiniz yok, oturumunuzun süresi dolmuş, güvenlik kuralı henüz yayınlanmamış ya da ana form bu sırada başka biri tarafından güncellenmiş olabilir.'
      : 'oturumunuzun süresi dolmuş ya da yetkiniz değişmiş olabilir.';
    alert('Kaydedilemedi: ' + neden + (ed.kirli && TASLAK_VAR ? '\n\nDeğişiklikleriniz bu cihazda taslak olarak saklandı. Sayfayı yenileyip formu yeniden açtığınızda “Taslağı geri yükle” ile kaldığınız yerden devam edebilirsiniz.' : ''));
  } finally { KAYDEDILIYOR = false; if (b && b.isConnected) b.disabled = false; }
}

/* ---------------------------------------------------- 3) İNCELEME (İK) */

      O.el('button', { class: 'btn', type: 'button', 'data-indir': 'pdf', title: 'Seçili kişinin formunu PDF olarak indir', html: IK_INDIR + 'PDF', on: { click: (e) => ciktiAl('pdf', incelemeCiktisi, e.currentTarget) } }),
      O.el('label', { class: 'oy-isaret-sec', title: 'İşaretliyken değişen hücreler sarı (önceki hâliyle), eklenenler yeşil, silinenler üstü çizili gelir; ayrıca değişiklik notları eklenir' },

  if (!dz.length) { const k = O.kart(kok, { baslik: 'Düzenleme yok' }); O.bosDurum(k.govde, { ikon: 'kisiler', baslik: 'Henüz düzenleme yapan olmadı', metin: 'Müdürler formu kaydettiğinde burada isimleriyle listelenir.' }); return; }

function okumaFormu(form, fark) {

    const f = fark.alan[a.id] || { tur: 'ayni' };
    const k = O.el('div', { class: 'oy-ust-alan ' + (f.tur !== 'ayni' ? f.tur : ''), 'data-alan-id': a.id }, O.el('span', { class: 'oy-oku', text: a.ad || '—' }));
    if (f.tur === 'degisti') k.append(eskiEl(f.eskiAd));
    liste.append(k);
  });
  fark.silinenAlanlar.forEach((s) => liste.append(O.el('div', { class: 'oy-ust-alan silindi', style: 'background:#fdf3f1;border-style:dashed;border-color:#e0a7a0' }, O.el('s', { class: 'oy-oku', text: s.alan.ad || '—' }))));
  ub.govde.append(liste);
  form.bolumler.forEach((b) => {
    const fb = fark.bolum[b.id] || { tur: 'ayni' };
    const bk = O.el('div', { class: 'oy-bolum ' + (fb.tur !== 'ayni' ? fb.tur : ''), 'data-bolum': b.id });
    const ust = O.el('div', { class: 'oy-bolum-ust' }, O.el('div', { class: 'oy-bolum-ad', text: b.ad || '—' }), O.el('span', { style: 'font-size:12px;color:var(--metin-3)', text: b.maddeler.length + ' madde' }));
    if (fb.tur === 'yeni') ust.append(O.el('span', { class: 'oy-etiket-yeni', style: 'margin:0', text: 'Yeni bölüm' }));
    if (fb.tur === 'degisti') ust.append(O.el('div', { style: 'flex-basis:100%' }, eskiEl(fb.eskiAd)));
    bk.append(ust);
    const g = O.el('div', { class: 'oy-bolum-govde' });
    b.maddeler.forEach((m, i) => g.append(okumaMadde(m, i, fark.madde[m.id] || { tur: 'ayni', eski: {} }, false)));
    fark.silinenMaddeler.filter((s) => s.bolumId === b.id).forEach((s) => g.append(okumaMadde(s.madde, s.sira, { tur: 'silindi', eski: {} }, true)));
    bk.append(g);
    kap.append(bk);
  });
  /* silinen bölümler: bölümle birlikte giden maddeler de üstü çizili listelenir */

/* bolumle: bölümle birlikte silinen madde — ayrı işaret (tek tek silinenlerin sayısına karışmaz; özette "içindeki N maddeyle") */
function okumaMadde(m, i, fm, silindi, bolumle) {

  const oku = (v) => O.el('div', { class: 'oy-oku' + (F.sade(v) ? '' : ' bos'), text: F.sade(v) ? v : '—' });
  const planDeg = !!(fm.eski && 'plan' in fm.eski);
  const planKap = O.el('div', { class: 'oy-plan' + (planDeg ? ' degisti' : ''), 'data-alan': 'plan' }, O.el('b', null, oku(m.plan)));
  if (planDeg) planKap.append(eskiEl(fm.eski.plan));
  kap.append(O.el('div', { class: 'oy-madde-ust' }, O.el('span', { class: 'oy-no', text: silindi ? '–' : String(i + 1) }), planKap));
  const izgara = O.el('div', { class: 'oy-alanlar' });
  const yerlesim = { kapsam: 's4', sorumlu: '', termin: '', saat: 's1', sure: 's1', aciklama: 's4' };
  ['kapsam', 'sorumlu', 'termin', 'saat', 'sure', 'aciklama'].forEach((k) => {
    const deg = !!(fm.eski && k in fm.eski);
    if (!deg && !F.sade(m[k])) return;          /* boş ve değişmemiş alan gösterilmez (okuma sade kalsın) */
    const a = O.el('div', { class: 'oy-alan ' + (yerlesim[k] || '') + (deg ? ' degisti' : ''), 'data-alan': k }, O.el('span', { text: F.ALAN_AD[k] }), oku(eskiDeger(k, m[k])));
    if (deg) a.append(eskiEl(eskiDeger(k, fm.eski[k])));

/* Sağdaki notlar: önce silinenler (kullanıcı isteği: "sildiği yer varsa yanda not olarak yazsın"), sonra eklenenler,
   yeri değişenler, bölüm / üst bilgi değişiklikleri. Sayılar sayaçla birebir aynıdır. */
function notlarEl(fark, form) {
  const kap = O.el('div', { class: 'oy-notlar' });
  const k = O.kart(kap, { baslik: 'Notlar', aciklama: F.ozetMetni(fark.sayac) });
  const not = (sinif, html, tur) => O.el('div', { class: 'oy-not ' + sinif, 'data-not': tur || '', html });
  const soluk = (t) => ' <span style="color:var(--metin-3)">' + t + '</span>';
  const s = fark.sayac;
  if (!s.toplam) k.govde.append(not('', 'Bu kişi formu <b>değiştirmeden</b> kaydetti; ana formu uygun buluyor.', 'yok'));
  /* silinenler */
  fark.silinenMaddeler.forEach((x) => k.govde.append(not('sil', '<b>Silindi:</b> ' + O.esc(x.madde.plan || '(adsız madde)') + soluk('· ' + O.esc(x.bolumAd || '') + (F.sade(x.madde.sorumlu) ? ' · ' + O.esc(x.madde.sorumlu) : '')), 'silinen')));
  fark.silinenBolumler.forEach((x) => k.govde.append(not('sil', '<b>Bölüm silindi:</b> ' + O.esc(x.bolum.ad || '(adsız)') + ' (içindeki ' + x.maddeler.length + ' maddeyle)' +
    (x.maddeler.length ? '<br>' + soluk(x.maddeler.map((m) => O.esc(m.plan || '(adsız madde)')).join(' · ')) : ''), 'bolumSilinen')));
  fark.silinenAlanlar.forEach((x) => k.govde.append(not('sil', '<b>Üst bilgi alanı silindi:</b> ' + O.esc(x.alan.ad || '(adsız)'), 'alanSilinen')));
  /* eklenenler ve yeri değişenler (formdaki sırayla) */
  const ekl = [], yer = [];
  form.bolumler.forEach((b) => b.maddeler.forEach((m, i) => {
    const f = fark.madde[m.id]; if (!f) return;
    if (f.tur === 'yeni') ekl.push({ m, b });
    if (f.tasindi || f.siraDegisti) yer.push({ m, b, f, i });
  }));
  ekl.forEach((x) => k.govde.append(not('ekl', '<b>Eklendi:</b> ' + O.esc(x.m.plan || '(adsız madde)') + soluk('· ' + O.esc(x.b.ad || '')), 'eklenen')));
  yer.forEach((x) => k.govde.append(not('tas', x.f.tasindi
    ? '<b>Taşındı:</b> ' + O.esc(x.m.plan || '(adsız)') + ' → ' + O.esc(x.b.ad || '') + soluk('(önceki bölüm: ' + O.esc(x.f.eskiBolum || '') + ')')
    : '<b>Yeri değişti:</b> ' + O.esc(x.m.plan || '(adsız)') + soluk('(ana formda ' + (Number(x.f.eskiSira) + 1) + '. sıradaydı, şimdi ' + (x.i + 1) + '. · ' + O.esc(x.b.ad || '') + ')'), 'sira')));
  /* bölüm ve üst bilgi değişiklikleri */
  form.bolumler.forEach((b) => {
    const f = fark.bolum[b.id];
    if (f && f.tur === 'yeni') k.govde.append(not('ekl', '<b>Yeni bölüm:</b> ' + O.esc(b.ad || ''), 'bolumEklenen'));
    if (f && f.tur === 'degisti') k.govde.append(not('', '<b>Bölüm adı değişti:</b> ' + O.esc(f.eskiAd || '') + ' → ' + O.esc(b.ad || ''), 'bolumDegisen'));
  });
  form.alanlar.forEach((a) => {
    const f = fark.alan[a.id];
    if (f && f.tur === 'yeni') k.govde.append(not('ekl', '<b>Üst bilgi alanı eklendi:</b> ' + O.esc(a.ad || '(adsız)'), 'alanEklenen'));
    if (f && f.tur === 'degisti') k.govde.append(not('', '<b>Üst bilgi alanı değişti:</b> ' + O.esc(f.eskiAd || '') + ' → ' + O.esc(a.ad || ''), 'alanDegisen'));
  });
  if (s.degisen) k.govde.append(not('', '<b>' + s.degisen + ' maddede</b> içerik değişikliği var (sarı işaretli alanlar; altında önceki hâli).', 'degisen'));
  return kap;
}

let PENCERE = null;

function aktarimSec() {

async function personelYukle() {

    liste.sort((x, y) => O.trKarsilastir(x.ad, y.ad));

    ILK_KISI = true; guncellendi();
  }, (e) => { console.warn('Kişi formları okunamadı', e); ILK_KISI = true; guncellendi(); });
  onSnapshot(doc(db, 'oryantasyonAyar', 'epostalar'), (s) => { EPOSTALAR = s.exists() && Array.isArray(s.data().liste) ? s.data().liste : []; guncellendi(); }, (e) => console.warn('E-posta listesi okunamadı', e));
  /* gönderilemeyen ya da iptal edilen e-postalar: o sorumlu "bildirilmedi" sayılır, bildirim penceresinde yeniden önerilir */
  onSnapshot(query(collection(db, 'epostaKuyrugu'), where('durum', 'in', ['hata', 'iptal'])), (snap) => {
    BASARISIZ = new Set(snap.docs.map((d) => d.id)); guncellendi();
  }, (e) => console.warn('E-posta kuyruğu okunamadı', e));
  /* sorumlu doldurma bağlantıları: sorumlu bir şey girince form ekranı yenilenir ve diğer sorumluların görünümü eşitlenir */
  onSnapshot(collection(db, 'oryantasyonYetki'), (snap) => {
    YETKI.clear(); snap.docs.forEach((d) => YETKI.set(d.id, Object.assign({ id: d.id }, d.data())));
    new Set([...YETKI.values()].map((y) => y.kisiId)).forEach(yetkiEsitleSirala);
    guncellendi();
  }, (e) => console.warn('Sorumlu bağlantıları okunamadı', e));
  /* sorumluların satır girdileri (her bağlantının oryGirdi alt koleksiyonu, tek sorguda) */
  onSnapshot(collectionGroup(db, 'oryGirdi'), (snap) => {
    GIRDI.clear();
    snap.docs.forEach((d) => { const p = d.ref.path.split('/'); if (p[0] !== 'oryantasyonYetki') return; const y = p[1]; if (!GIRDI.has(y)) GIRDI.set(y, {}); GIRDI.get(y)[d.id] = d.data(); });
    new Set([...YETKI.values()].map((y) => y.kisiId)).forEach(yetkiEsitleSirala);
    guncellendi();
  }, (e) => console.warn('Sorumlu girdileri okunamadı', e));
}
window.__ORY = { ana: () => ANA, duz: () => DUZ, ed: () => ED, kisi: () => KISI, eposta: () => EPOSTALAR, yetki: () => YETKI };
</script>
