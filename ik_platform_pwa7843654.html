<script>
/* Sayaç animasyonu */
function animateCounters() {
  document.querySelectorAll('.kv').forEach(function(el) {
    var txt = el.textContent.replace(/[^0-9.,]/g,'').replace(',','.');
    var val = parseFloat(txt);
    if (isNaN(val) || val <= 0 || val > 99999) return;
    var isFloat = val % 1 !== 0;
    var start = 0, dur = 800, step = val/(dur/16);
    el.textContent = isFloat ? '0.00' : '0';
    var timer = setInterval(function() {
      start = Math.min(start+step, val);
      el.textContent = isFloat ? start.toFixed(2) : Math.floor(start).toLocaleString('tr-TR');
      if (start >= val) clearInterval(timer);
    }, 16);
  });
}

/* goPage override — animasyon için */
(function() {
  var orig = window.goPage;
  if (typeof orig === 'function') {
    window.goPage = function(id) {
      orig(id);
      if (id === 'ov') setTimeout(animateCounters, 50);
    };
  }
})();
