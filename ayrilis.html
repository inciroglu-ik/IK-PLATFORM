<style>
/* İşten Ayrılış Anketleri — İK Portalı kutucuğu. Kabuk ve bileşenler İK Dashboard ile ortaktır (pano/*.css, pano/ortak.js);
   burada yalnız sol menüsüz yerleşim ve bu sayfaya özel küçük parçalar var. */
body.ayrilis .ust-marka { display: flex; }
.ay-araclar { display: flex; gap: 8px; flex-wrap: wrap; }
.ay-araclar .btn { height: 32px; padding: 0 10px; font-size: 12.5px; }
.ay-islem { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.ay-suzgec { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin: 0 0 12px; }

.ay-suzgec .btn { height: 38px; }
.ay-yorumlar { display: grid; gap: 10px; max-width: 980px; }
.ay-yorumlar p { margin: 0; font-size: 14px; line-height: 1.65; color: var(--metin-2); }

.ay-kosul { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 320px; min-width: 180px; white-space: normal; font-size: 12.5px; line-height: 1.45; color: var(--metin-2); }
/* grafikten kişi listesi: tıklanır öğeler */
.ay-tik { cursor: pointer; }
.ay-tik:focus-visible { outline: 2px solid var(--pir-400); outline-offset: 2px; }
tr.ay-tik:hover td { background: var(--lac-50, #eef3f9); }
.ay-sayi-kutu.ay-tik { transition: border-color .15s, box-shadow .15s; }
.ay-sayi-kutu.ay-tik:hover { border-color: var(--pir-400); box-shadow: 0 6px 18px rgba(15, 27, 45, .08); }
.serit > i.ay-tik:hover, .ay-serit > i.ay-tik:hover { filter: brightness(1.12) saturate(1.1); }
.ay-serit-lejant span.ay-tik:hover { color: var(--metin-1); text-decoration: underline; }
.cubuk-satir.ay-tik { border-radius: 8px; }
.cubuk-satir.ay-tik:hover { background: var(--n-50, #f5f7fa); }
.ay-kisi-ad { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--lac-700, #1b3a5e); }
.ay-kisi-ok { color: var(--pir-500); font-weight: 700; }
.ay-kisi-pasif { display: inline-flex; align-items: baseline; gap: 8px; color: var(--metin-2); }
.ay-kisi-pasif small { font-size: 11px; color: var(--metin-3); font-weight: 500; }
.kadran-alt .ay-kadran-birim { color: var(--pir-300, #e9d5a8); font-weight: 700; letter-spacing: .02em; }
.ay-islem .btn { height: 30px; padding: 0 10px; font-size: 12px; white-space: nowrap; }
.ay-islem .btn svg { width: 14px; height: 14px; }
.ay-soluk { color: var(--metin-3); font-size: 12px; }
.ay-not-hucre { max-width: 260px; white-space: normal; line-height: 1.35; }
.ay-cipler { display: flex; gap: 4px; flex-wrap: wrap; }
.ay-cipler .cip { height: auto; min-height: 20px; padding: 2px 7px; white-space: normal; line-height: 1.25; }
.ay-oran { display: grid; gap: 14px; }
.ay-oran-blok h4 { font-size: 13px; font-weight: 600; color: var(--metin-1); margin: 0 0 4px; }
.ay-oran-blok p { font-size: 12px; color: var(--metin-3); margin: 6px 0 0; line-height: 1.5; }
.ay-buyuk { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 8px; }
.ay-buyuk b { font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--metin-marka); font-variant-numeric: tabular-nums; }
.ay-buyuk span { font-size: 12.5px; color: var(--metin-3); }
.ay-serit { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--n-100); }
.ay-serit i { display: block; height: 100%; }

.ay-serit-lejant i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
/* Pencere (ayrıntı, bağlantı oluşturma) */
.ay-modal .modal { width: min(720px, 100%); }
.ay-modal.dar .modal { width: min(560px, 100%); }

.ay-modal .modal-ust > div { flex: 1; min-width: 0; }
.ay-kapat { margin-left: auto; }
.ay-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.ay-form label { display: grid; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--metin-2); }
.ay-form label.genis { grid-column: 1 / -1; }
.ay-form .girdi { height: 40px; font-size: 14px; }
.ay-link-kutu { display: flex; gap: 8px; align-items: center; background: var(--n-50); border: 1px solid var(--cizgi-1); border-radius: 12px; padding: 10px 12px; }
.ay-link-kutu code { flex: 1; min-width: 0; font-size: 12.5px; overflow-wrap: anywhere; color: var(--metin-1); }
.ay-mesaj { width: 100%; min-height: 120px; box-sizing: border-box; font: inherit; font-size: 13px; line-height: 1.5; border: 1px solid var(--cizgi-2); border-radius: 12px; padding: 10px 12px; color: var(--metin-1); background: var(--yuzey-kart); resize: vertical; }
.ay-bilgi { font-size: 12.5px; color: var(--metin-3); line-height: 1.55; }
.ay-hata { background: var(--ht-50); color: var(--ht-700); border: 1px solid var(--ht-200); border-radius: 10px; padding: 9px 12px; font-size: 13px; }
.ay-ozet-satir { display: flex; gap: 8px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--metin-3); margin-top: 6px; }
.ay-ozet-satir b { color: var(--metin-1); font-weight: 600; }
.ay-puanlar { display: grid; gap: 6px; }
.ay-puan-satir { display: grid; grid-template-columns: minmax(0, 1fr) 96px 118px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--cizgi-1); }
.ay-puan-satir:last-child { border-bottom: 0; }
.ay-puan-cubuk { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.ay-puan-cubuk i { height: 8px; border-radius: 2px; background: var(--n-150); }
.ay-puan-cubuk i.dolu { background: var(--pir-500); }
.ay-puan-satir.guclu .ay-puan-cubuk i.dolu { background: var(--pir-700); }
.ay-puan-satir.guclu b { color: var(--metin-marka); }
.ay-puan-etiket { font-size: 12px; color: var(--metin-3); text-align: right; }
.ay-soru-izgara { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }

.ay-soru.genis { grid-column: 1 / -1; }
.ay-soru span { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--metin-3); margin-bottom: 3px; }
.ay-soru p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--metin-1); white-space: pre-wrap; overflow-wrap: anywhere; }
.ay-ozet-tablo { margin-top: 12px; }
.ay-ozet-tablo tfoot td { font-weight: 700; border-top: 1px solid var(--lac-300); }
.ay-renkli { display: inline-flex; align-items: center; gap: 8px; }
.ay-renkli i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.ay-uc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.ay-sayi-kutu { border: 1px solid var(--cizgi-1); border-radius: 12px; padding: 10px 12px; background: var(--n-50); min-width: 0; }
.ay-sayi-kutu span { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--metin-3); }
.ay-sayi-kutu b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -.02em; color: var(--metin-marka); font-variant-numeric: tabular-nums; margin-top: 2px; }
.ay-sayi-kutu small { display: block; font-size: 12.5px; font-weight: 600; color: var(--metin-3); }
.ay-sayi-kutu.iyi b, .ay-sayi-kutu.iyi small { color: var(--pir-700); }
.ay-sayi-kutu.kotu b, .ay-sayi-kutu.kotu small { color: var(--ht-700); }
.ay-alt-baslik { font-size: 13px; font-weight: 600; color: var(--metin-1); margin: 16px 0 6px; }
.ay-bolum-baslik { font-family: var(--font-serif); font-size: 16px; font-weight: 600; color: var(--metin-marka); margin: 4px 0 0; }
@media (max-width: 640px) {
  .ay-form, .ay-soru-izgara { grid-template-columns: minmax(0, 1fr); }
  .ay-puan-satir { grid-template-columns: minmax(0, 1fr) 70px; }
  .ay-puan-etiket { display: none; }
}
</style>

<!--
  İŞTEN AYRILIŞ ANKETLERİ (ayrilis.html) — İK Portalı'nda kutucuk.
  Görenler: İK + direktörler (ortak kimlik, Firestore kuralı ayrilisAnketleri). Bağlantı üretme / iptal / aktarım: yalnız İK.
  Veri: ayrilisAnketleri koleksiyonu (canlı, onSnapshot) + satisVeri/ikPano (istifa listesi ve anket oranı için).
  Çalışanın doldurduğu sayfa: anket.html#a_<anahtar>. Sorular: ortak/ayrilis-sorular.js.
-->
<body class="ayrilis">
<div class="acilis" id="acilis" role="status" aria-live="polite">
  <div class="acilis-ic">
    <span class="amblem buyuk" role="img" aria-label="İnciroğlu Otomotiv İK amblemi"></span>
    <div class="acilis-baslik">İşten Ayrılış Anketleri</div>
    <div class="acilis-metin" id="acilisMetin">Oturum denetleniyor…</div>
    <div class="acilis-cubuk"><i></i></div>
  </div>
</div>
<div class="ana">
  <div class="ust-alan kokpit">
    <header class="ust-bant">
      <div class="ic ust-ic">
        <div class="ust-marka"><span class="amblem" role="img" aria-label="İnciroğlu Otomotiv İK amblemi"></span></div>
        <div class="uyg-ad"><span>İşten Ayrılış Anketleri</span><small id="ustAlt">İnsan Kaynakları</small></div>
        <div class="ust-sag" id="ustSag"></div>
      </div>
    </header>
    <div id="kaputYuva"></div>
  </div>
  <main class="ic icerik" id="icerik"></main>
</div>

<script type="module">
import { doc, getDoc, setDoc, deleteDoc, collection, query, where, onSnapshot, writeBatch, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { db, kimlikBaslat, cikisYap, adBasliklari } from "./ortak/kimlik.js";
import * as O from "./pano/ortak.js";
import * as A from "./ortak/ayrilis-sorular.js";
import * as AB from "./ortak/ayrilis-baglanti.js";
import { uygula as hareketUygula } from "./pano/hareket.js";

const $ = (id) => document.getElementById(id);
const acilisMetni = (t) => { const e = $('acilisMetin'); if (e) e.textContent = t; };
const acilisGizle = () => { const a = $('acilis'); if (a) { a.classList.add('gizle'); setTimeout(() => a.remove(), 600); } };
const SVG = (yol) => '<svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + yol + '</svg>';
const IK_LINK = SVG('<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/>');
const IK_KOPYA = SVG('<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/>');
const IK_GONDER = SVG('<path d="M20.5 3.5 3.5 10.5l7 3 3 7z"/><path d="m10.5 13.5 4-4"/>');
const IK_SIL = SVG('<path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9l1-12.5"/>');
const IK_GERI = SVG('<path d="M15 6l-6 6 6 6"/>');

/* ============================================================== OTURUM */
const OTURUM = await kimlikBaslat({ uygulama: 'İşten Ayrılış Anketleri', roller: ['ik', 'direktor'] });
const IK = OTURUM.hesap.roller.indexOf('ik') >= 0;
const AD = adBasliklari(OTURUM.hesap.ad || '');
const ROL_AD = IK ? 'İnsan Kaynakları' : 'Direktör';
const KOL = collection(db, 'ayrilisAnketleri');
acilisMetni('Anketler yükleniyor…');

/* ============================================================== YARDIMCILAR */
function tarihCoz(s) {
  if (!s) return null;
  if (s instanceof Date) return s;
  if (typeof s.toDate === 'function') return s.toDate();
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = /^(\d{1,2})[./](\d{1,2})[./](\d{4})/.exec(String(s));
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  return null;
}
const isoGun = (d) => (d ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') : '');
const gunYaz = (d) => (d ? String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear() : '—');
/** Anket kaydı ↔ pano ayrılan kaydı: aynı ad (Türkçe katlamalı) ve yakın çıkış tarihi; küçük yazım farkı tolere edilir.
    İK Dashboard'daki otomatik bağlantı da AYNI eşleştirmeyi kullanır (ortak/ayrilis-baglanti.js) */
const eslesir = AB.eslesir;
function satirBol(s, n) {
  const k = String(s).split(' '); const r = []; let c = '';
  k.forEach((w) => { if ((c + ' ' + w).trim().length > n && c) { r.push(c); c = w; } else c = (c + ' ' + w).trim(); });
  if (c) r.push(c);
  return r.length > 1 ? r : r[0] || '';
}
const anketLinki = (id) => AB.anketLinki(id, location.href);
const davetMesaji = AB.davetMesaji;
async function kopyala(metin, bildirim) {
  try { await navigator.clipboard.writeText(metin); }
  catch (e) {
    const t = document.createElement('textarea'); t.value = metin; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.append(t); t.select(); try { document.execCommand('copy'); } catch (e2) { /* elle kopyalanır */ } t.remove();
  }
  O.bildirim(bildirim || 'Kopyalandı');
}
const yuzdeTam = (a, b) => (b ? Math.round((a / b) * 100) : 0);

/* ============================================================== DURUM */
let KAYITLAR = [];          /* ayrilisAnketleri (canlı) */
let AYRILANLAR = [];        /* satisVeri/ikPano → D.ayrilanlar (haftalık paket + İK Dashboard'dan girilen hareketler) */
let HAREKET_SAYI = 0;       /* paketteki çıkışlara panodan eklenen (Excel'e henüz işlenmemiş) çıkış sayısı */
let PANO_ETIKET = '';
let PANO_HATA = null;
let YIL = new Date().getFullYear();
let ILK = true;
const GORULEN = new Set();

const istifaMi = (a) => (a.neden === 'İstifa' || a.neden === 'Deneme (İşçi)') && !O.isVI(a.dept);
const yilOf = (s) => { const d = tarihCoz(s); return d ? d.getFullYear() : null; };
/* Yanıtın yılı: çıkış tarihi; yoksa yanıt / oluşturma tarihi (tarihsiz kayıt hiçbir yılda kaybolmasın) */
const kayitYili = (k) => yilOf(k.cikis) || yilOf(k.tamamlanma) || yilOf(k.olusturma);
/* KVKK: "ONAYLAMIYORUM" diyen kişi yanıtlarının anonim veri olarak kullanılmasına izin vermemiştir. Bu yanıtlar anket oranında
   sayılır (kişi formu doldurdu) ama grafik/istatistiklere girmez ve ayrıntısını yalnız İK görür. Kurum kararı değişirse false yapın. */
const KVKK_RET_HARIC = true;
const onayYok = (k) => !!(k.cevaplar && k.cevaplar.kvkk === 'ONAYLAMIYORUM.');
const tamamlananlar = () => KAYITLAR.filter((k) => k.durum === 'tamamlandi' && kayitYili(k) === YIL);
const bekleyenler = () => KAYITLAR.filter((k) => k.durum === 'bekliyor');
const istifalar = () => AYRILANLAR.filter((a) => istifaMi(a) && yilOf(a.tarih) === YIL);

function nedenIstatistik(liste) {
  return A.FAKTORLER.map((f) => {
    const v = liste.map((k) => k.cevaplar && k.cevaplar.puan ? k.cevaplar.puan[f.k] : null).filter((x) => Number.isInteger(x));
    const etkili = v.filter((x) => x >= A.ETKILI_ESIK).length;
    return { k: f.k, ad: f.ad, n: v.length, etkili, oran: v.length ? (etkili / v.length) * 100 : 0, ort: v.length ? v.reduce((s, x) => s + x, 0) / v.length : null };
  }).sort((a, b) => b.oran - a.oran || (b.ort || 0) - (a.ort || 0));
}
/* Çıkış nedeni grupları (İK pano paketindeki `neden` kategorisinden; renkler İK Dashboard ile aynı) */
const CIK_GRUPLARI = [
  { ad: 'İstifa', renk: O.NEDEN_RENK['İstifa'] },
  { ad: 'İşveren feshi', renk: O.NEDEN_RENK['İşveren Feshi'] },
  { ad: 'Deneme süresinde işveren feshi', renk: O.NEDEN_RENK['Deneme (İşveren)'] },
  { ad: 'Askerlik', renk: O.NEDEN_RENK['Askerlik'] },
  { ad: '25. madde (haklı fesih)', renk: O.NEDEN_RENK['25. Madde'] },
  { ad: 'Diğer', renk: O.NEDEN_RENK['Diğer'] }
];
function cikisGrubu(a) {
  if (istifaMi(a)) return 'İstifa';                              /* deneme süresinde işçinin feshi de istifadır */
  return { 'İşveren Feshi': 'İşveren feshi', 'Deneme (İşveren)': 'Deneme süresinde işveren feshi', 'Askerlik': 'Askerlik', '25. Madde': '25. madde (haklı fesih)' }[a.neden] || 'Diğer';
}
/* Çıkış görüşmesi yapılmama nedeni: haftalık rapordaki "Açıklama" (gerçek ayrılış nedeni) metninden */
function yapilmamaNedeni(a) {
  const n = O.katla(a.aciklama || '');
  if (/ihtar/.test(n)) return 'İhtar çekerek ayrıldı';
  if (/25\s*\/\s*2|arabul|arabuc|isveren feshi olacak|disiplin/.test(n)) return 'Anlaşmalı çıkış (25/2 · arabulucu · disiplin)';
  if (/devamsiz/.test(n)) return 'Devamsızlık';
  if (/performans/.test(n)) return 'Performans nedeniyle çıkış';
  if (/kaza|istifa ettiril/.test(n)) return 'İstifa ettirildi';
  return 'Henüz yapılmadı';
}
/* Küçük özet tablosu: başlıklar, satırlar ([hücre…], ilk sütun metin/düğüm, diğerleri sağa yaslı), toplam satırı */
function ozetTablo(kap, basliklar, satirlar, toplam, tiklar) {
  const hucre = (etiket, v, i) => O.el(etiket, { class: i ? 'sag' : null }, v instanceof Node ? v : String(v));
  const t = O.el('table', { class: 'tablo ay-ozet-tablo' },
    O.el('thead', null, O.el('tr', null, ...basliklar.map((b, i) => hucre('th', b, i)))),
    O.el('tbody', null, ...satirlar.map((r, j) => { const tr = O.el('tr', null, ...r.map((v, i) => hucre('td', v, i))); if (tiklar && tiklar[j]) tikBagla(tr, tiklar[j]); return tr; })),
    toplam ? O.el('tfoot', null, O.el('tr', null, ...toplam.map((v, i) => hucre('td', v, i)))) : null);
  kap.append(O.el('div', { class: 'tablo-kap' }, t));
}
function sayim(liste, fn, sira) {
  const m = new Map(); liste.forEach((k) => { [].concat(fn(k)).forEach((v) => { if (v) m.set(v, (m.get(v) || 0) + 1); }); });
  const r = [...m.entries()].map(([ad, deger]) => ({ ad, deger }));
  if (sira) r.sort((a, b) => sira.indexOf(a.ad) - sira.indexOf(b.ad)); else r.sort((a, b) => b.deger - a.deger);
  return r;
}

/* ============================================================== PENCERE */
let acik = null;
/* Açık pencere varken gelen canlı güncelleme sayfayı yeniden çizmez (yazılan form kaybolmasın); pencere kapanınca çizilir */
let BEKLEYEN_CIZIM = false;
function pencereKapat() {
  if (!acik) return;
  const p = acik; acik = null;
  document.removeEventListener('keydown', p.tus, true);
  p.ort.classList.remove('acik');
  setTimeout(() => p.ort.remove(), O.azHareket() ? 0 : 240);
  if (p.onceki && document.contains(p.onceki)) p.onceki.focus({ preventScroll: true });
  if (BEKLEYEN_CIZIM) { BEKLEYEN_CIZIM = false; setTimeout(ciz, 0); }
}
function pencereAc(etiket, parcalar, { dar = false } = {}) {
  const onceki = acik ? acik.onceki : document.activeElement;
  if (acik) { const p = acik; acik = null; document.removeEventListener('keydown', p.tus, true); p.ort.remove(); }
  const pen = O.el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': etiket }, ...parcalar);
  const ort = O.el('div', { class: 'modal-ort ay-modal' + (dar ? ' dar' : '') }, pen);
  const tus = (e) => { if (e.key === 'Escape') { e.preventDefault(); pencereKapat(); } };
  ort.addEventListener('click', (e) => { if (e.target === ort) pencereKapat(); });
  document.addEventListener('keydown', tus, true);
  document.body.append(ort);
  acik = { ort, onceki, tus };
  requestAnimationFrame(() => { ort.classList.add('acik'); const o = pen.querySelector('input, textarea, .modal-alt .btn'); if (o) o.focus({ preventScroll: true }); });
  return pen;
}
function ustParca(baslik, alt) {
  const x = O.el('button', { class: 'btn btn-hayalet ay-kapat', type: 'button', 'aria-label': 'Kapat', html: O.ikon('carpi'), on: { click: pencereKapat } });
  return O.el('div', { class: 'modal-ust' }, O.el('div', null, O.el('h3', { text: baslik }), alt ? (alt instanceof Node ? alt : O.el('p', { text: alt })) : null), x);
}

/* ============================================================== ESKİ YANITLARI AKTAR (İK) */
function aktarimSec() {
  const inp = O.el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    let o = null; try { o = JSON.parse(await f.text()); } catch (e) { o = null; }
    const ham = o && o.tur === 'inciroglu-ayrilis-anketi' && Array.isArray(o.kayitlar) ? o.kayitlar : null;
    if (!ham || !ham.length) { alert('Bu dosya bir ayrılış anketi aktarım dosyası değil. Lütfen size verilen “ayrilis_anketi_…_aktarim.json” dosyasını seçin.'); return; }
    if (ham.length > 450) { alert('Tek seferde en fazla 450 yanıt aktarılabilir.'); return; }
    /* Kayıt kayıt denetim: bozuk kayıt atlanır (tüm aktarım düşmesin) */
    const tarihGecerli = (d) => d instanceof Date && !isNaN(d.getTime());
    const kayitlar = [], atlanan = [];
    ham.forEach((r, i) => {
      const ad = r && A.metinTemizle(r.ad, 80);
      const c = r && r.cevaplar;
      const cik = r && tarihCoz(r.cikis);
      let tam = r && typeof r.tamamlanma === 'string' && /T/.test(r.tamamlanma) ? new Date(r.tamamlanma) : (r && tarihCoz(r.tamamlanma));
      if (!tarihGecerli(tam)) tam = cik;
      const iyi = r && A.anahtarGecerli(r.id) && ad && ad.length >= 3 && ['google_form', 'ik'].indexOf(r.kaynak) >= 0
        && c && typeof c === 'object' && !Array.isArray(c) && c.puan && typeof c.puan === 'object' && !Array.isArray(c.puan)
        && tarihGecerli(cik) && tarihGecerli(tam);
      if (!iyi) { atlanan.push(i + 1); return; }
      kayitlar.push({ id: r.id, veri: {
        ad, departman: A.metinTemizle(r.departman, 80), pozisyon: A.metinTemizle(r.pozisyon, 120),
        giris: typeof r.giris === 'string' ? r.giris : '', cikis: isoGun(cik), durum: 'tamamlandi', kaynak: r.kaynak,
        olusturma: serverTimestamp(), olusturan: AD, ikKodu: A.metinTemizle(r.ikKodu || '', 80),
        tamamlanma: Timestamp.fromDate(tam), cevaplar: c } });
    });
    if (!kayitlar.length) { alert('Dosyada aktarılabilecek geçerli yanıt bulunamadı.'); return; }
    if (!confirm(kayitlar.length + ' yanıt aktarılacak' + (atlanan.length ? '; ' + atlanan.length + ' bozuk kayıt atlanacak' : '') + '. Daha önce aktarılmış aynı yanıtlar güncellenir, mükerrer kayıt oluşmaz. Devam edilsin mi?')) return;
    /* Güvenlik kuralı her yazımda yetkiyi okur; toplu yazma okuma sınırına takılmasın diye 8'erli parçalar hâlinde.
       Bir parça reddedilirse o parçanın kayıtları TEK TEK yeniden denenir; yine yazılamayanlar adıyla ve hata koduyla bildirilir. */
    let yazilan = 0;
    const hatali = [];
    for (let i = 0; i < kayitlar.length; i += 8) {
      const parca = kayitlar.slice(i, i + 8);
      try {
        const b = writeBatch(db);
        parca.forEach((r) => b.set(doc(KOL, r.id), r.veri));
        await b.commit();
        yazilan += parca.length;
      } catch (e) {
        console.warn('Aktarım parçası reddedildi, kayıtlar tek tek deneniyor', e);
        for (const r of parca) {
          try { await setDoc(doc(KOL, r.id), r.veri); yazilan++; }
          catch (e2) { hatali.push(O.trBaslik(r.veri.ad) + ' (' + ((e2 && e2.code) || (e2 && e2.message) || 'hata') + ')'); }
        }
      }
    }
    if (!hatali.length) O.bildirim(yazilan + ' yanıt aktarıldı' + (atlanan.length ? ' · ' + atlanan.length + ' kayıt atlandı' : ''));
    else alert('Aktarım: ' + yazilan + ' / ' + kayitlar.length + ' yanıt yazıldı. Yazılamayanlar (' + hatali.length + '):\n' + hatali.join('\n') +
      '\n\nTekrar aktarabilirsiniz, mükerrer kayıt oluşmaz. “permission-denied” görünüyorsa güvenlik kuralı yayınlanmamış ya da yetkiniz yok demektir.');
  });
  document.body.append(inp);
  inp.click();
}

/** Chart.js seçeneklerine tıklama ekler: tıklanan sütun / dilim → fn(sıra, seri); üzerine gelince el imleci ve
    ipucunun altında "tıklayın" notu (var olan ipucu ayarları korunur) */
function tikEkle(opt, fn) {
  const o = Object.assign({}, opt || {}, {
    onClick: (e, els) => { if (els && els.length) fn(els[0].index, els[0].datasetIndex); },
    onHover: (e, els) => { const t = e.native && e.native.target; if (t) t.style.cursor = els && els.length ? 'pointer' : 'default'; }
  });
  const p = Object.assign({}, o.plugins), tt = Object.assign({}, p.tooltip);
  tt.callbacks = Object.assign({}, tt.callbacks, { footer: () => 'Kişileri görmek için tıklayın' });
  p.tooltip = tt; o.plugins = p;
  return o;
}
/** HTML öğesini (kutu, şerit parçası, liste satırı) tıklanır yapar: klavyeyle de açılır */
function tikBagla(el, fn, etiket) {
  if (!el) return el;
  el.classList.add('ay-tik'); el.setAttribute('role', 'button'); el.tabIndex = 0;
  if (etiket) el.setAttribute('title', etiket + ' · kişileri görmek için tıklayın');
  el.addEventListener('click', fn);
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
  return el;
}

];
function temaPayi(liste, t) {
  const n = liste.filter((k) => k.cevaplar && k.cevaplar.puan).length;
  const v = liste.filter((k) => k.cevaplar && k.cevaplar.puan && t.k.some((f) => Number.isInteger(k.cevaplar.puan[f]) && k.cevaplar.puan[f] >= A.ETKILI_ESIK)).length;

/** "Yorumlar": seçili birimin (ya da tüm birimlerin) anket yanıtlarından üretilen değerlendirme — yalnız veriye dayanır */
function yorumlar(Sf, Sall, birim, deptOf) {
  const b = (s) => '<b>' + O.esc(s) + '</b>';
  const N = nedenIstatistik(Sf).filter((x) => x.n > 0);
  const p = [];
  if (!N.length) return ['Bu seçimde değerlendirilecek yanıt yok.'];
  const [n1, n2, n3] = N;
  const yer = birim ? b(birim) + ' biriminde' : 'Tüm birimlerde';
  /* oranı sözle anlatır (yalnız orana gerçekten uyan aralıklarda) */
  const kesir = (o) => (o >= 45 && o < 56 ? ' — yaklaşık her iki kişiden biri' : o >= 62 && o < 71 ? ' — yaklaşık her üç kişiden ikisi' : o >= 72 && o < 79 ? ' — yaklaşık her dört kişiden üçü' : o >= 30 && o < 36 ? ' — yaklaşık her üç kişiden biri' : '');
  p.push(yer + ' ' + Sf.length + ' anket değerlendirildi. ' + (birim ? 'Bu birimde ayrılışlarda en çok öne çıkan neden ' : 'Ayrılışlarda en belirleyici neden ') + b(n1.ad) +
    ': bu nedeni “etkili” ya da “çok etkili” bulanların oranı ' + b('%' + Math.round(n1.oran)) + kesir(Math.round(n1.oran)) + '.' +
    (n2 ? ' Onu ' + b(n2.ad) + ' (%' + Math.round(n2.oran) + ')' + (n3 ? ' ve ' + b(n3.ad) + ' (%' + Math.round(n3.oran) + ')' : '') + ' izliyor.' : ''));
  /* konu başlıkları */
  const tm = TEMALAR.map((t) => Object.assign({}, t, temaPayi(Sf, t))).sort((a, c) => c.oran - a.oran);
  const sirket = tm.filter((t) => !t.kisisel), kis = tm.find((t) => t.kisisel);
  if (sirket[0] && sirket[0].oran) {
    let s = 'Konu başlıklarına bakıldığında ' + b(sirket[0].ad) + ' öne çıkıyor: katılımcıların ' + b('%' + sirket[0].oran) + ' kadarı bu başlıktaki nedenlerden en az birini etkili buldu';
    s += sirket[1] && sirket[1].oran ? '; ' + O.esc(sirket[1].ad) + ' %' + sirket[1].oran + ' ile ikinci sırada.' : '.';
    /* kişisel başlık, şirket kaynaklı başlıklarla gerçekten kıyaslanarak anlatılır (ikinci başlıktan yüksekse "sınırlı" denmez) */
    if (kis && sirket[1] && kis.oran < sirket[1].oran) s += ' Kişisel nedenler ve sektör değişikliği %' + kis.oran + ' ile daha sınırlı; ayrılışların büyük kısmı şirketin etkileyebileceği nedenlerden kaynaklanıyor.';
    else if (kis && kis.oran < sirket[0].oran) s += ' Kişisel nedenler ve sektör değişikliği de %' + kis.oran + ' ile azımsanmayacak düzeyde; yine de en güçlü başlık ' + O.esc(sirket[0].ad) + '.';
    else if (kis) s += ' Kişisel nedenler ve sektör değişikliği %' + kis.oran + ' ile en az şirket kaynaklı nedenler kadar belirleyici; bu ayrılışlarda şirketin etki alanı daha dar.';
    p.push(s);
  }
  /* birim ↔ şirket geneli, ya da birim bazında öne çıkanlar */
  if (birim) {
    const G = new Map(nedenIstatistik(Sall).map((x) => [x.k, x]));
    const fark = N.filter((x) => x.n >= 2 && G.get(x.k)).map((x) => ({ x, g: G.get(x.k), d: x.oran - G.get(x.k).oran }));
    const ust = fark.filter((f) => f.d >= 10).sort((a, c) => c.d - a.d)[0], alt = fark.filter((f) => f.d <= -10).sort((a, c) => a.d - c.d)[0];
    if (ust || alt) p.push('Şirket geneliyle karşılaştırıldığında ' + (ust ? b(ust.x.ad) + ' bu birimde belirgin biçimde daha yüksek (%' + Math.round(ust.x.oran) + ', şirket genelinde %' + Math.round(ust.g.oran) + ')' : '') +
      (ust && alt ? '; ' : '') + (alt ? b(alt.x.ad) + ' ise genelin altında (%' + Math.round(alt.x.oran) + ', genelde %' + Math.round(alt.g.oran) + ')' : '') + '.');
    else p.push('Nedenlerin dağılımı şirket geneline benziyor; bu birime özgü belirgin bir sapma görünmüyor.');
  } else {
    const dm = new Map(); Sall.forEach((k) => { const d = deptOf(k); if (!dm.has(d)) dm.set(d, []); dm.get(d).push(k); });
    const buyuk = [...dm.entries()].filter(([d, l]) => l.length >= 4 && d !== 'Belirtilmemiş').sort((a, c) => c[1].length - a[1].length).slice(0, 3)
      .map(([d, l]) => { const t = nedenIstatistik(l).filter((x) => x.n > 0)[0]; return t ? b(d) + ' — ' + O.esc(t.ad) + ' (%' + Math.round(t.oran) + ', ' + l.length + ' anket)' : null; }).filter(Boolean);
    if (buyuk.length) p.push('En çok anket gelen birimlerde öne çıkan nedenler: ' + buyuk.join(' · ') + '. Birim seçerek her birimin ayrıntısını görebilirsiniz.');
  }
  /* karar, iletişim, bağlılık */
  const yanit = (alan) => Sf.map((k) => k.cevaplar && k.cevaplar[alan]).filter(Boolean);
  const kr = yanit('karar'), hizli = kr.filter((x) => x === 'Bir hafta içinde' || x === 'Bir ay içinde' || x === 'İşe başladıktan hemen sonra').length, uzun = kr.filter((x) => x === 'Uzun zamandan beri').length;
  const km = yanit('kime').map((x) => [].concat(x)), yon = km.filter((x) => x.indexOf('Yöneticilerime') >= 0).length;
  const tk = yanit('tekrar'), evet = tk.filter((x) => x === 'Evet').length;
  const c = [];
  if (kr.length) c.push('İstifa kararını kısa sürede (bir ay içinde) verenlerin oranı ' + b('%' + pct(hizli, kr.length)) + (uzun ? ', uzun zamandır düşünenlerin oranı %' + pct(uzun, kr.length) : '') + '.');
  if (km.length) c.push('Ayrılma fikrini önce yöneticisine açanların oranı ' + b('%' + pct(yon, km.length)) + (pct(yon, km.length) >= 50 ? '; yöneticiler ayrılma sinyalini ilk duyan kişiler.' : '.'));
  if (tk.length) { const o = pct(evet, tk.length); c.push('Gelecekte yeniden İnciroğlu’nda çalışmayı düşünenlerin oranı ' + b('%' + o) + (o >= 60 ? '; ayrılışlar çoğunlukla olumlu kapanıyor.' : o < 40 ? '; ayrılışların önemli kısmı olumsuz bir izle kapanıyor.' : '.')); }
  if (c.length) p.push(c.join(' '));
  /* öneri */
  const on = sirket[0] && sirket[0].oran ? sirket[0] : null;
  if (on && (!kis || on.oran >= kis.oran)) p.push('<b>Öneri:</b> Öne çıkan başlık ' + O.esc(on.ad) + ' olduğundan ' + on.oneri + ' faydalı olabilir' + (km.length && pct(yon, km.length) >= 50 ? '; ayrıca ayrılma sinyali veren çalışanlarla yöneticilerin erken görüşme yapması önerilir.' : '.'));
  if (Sf.length < 8) p.push('<i>Not: ' + (birim ? 'Bu birimde' : 'Bu seçimde') + ' yalnız ' + Sf.length + ' anket olduğu için sonuçlar yön göstericidir; tek bir kişinin yanıtı oranları belirgin biçimde değiştirebilir.</i>');
  return p;
}

      ? YIL + ' yılında istifayla ayrılan <b>' + O.sayi(IST.length) + '</b> kişi var; bunların <b>' + O.sayi(istFormlu.length) + '</b> tanesinin ayrılış anketi bulunuyor.'
      : YIL + ' yılında <b>' + O.sayi(T.length) + '</b> ayrılış anketi var.') +
      (enUst ? ' Ayrılmada en çok öne çıkan neden: <b>' + O.esc(enUst.ad) + '</b>.' : ''),
    meta: [{ ikon: 'saat', html: 'Canlı · anket gönderildiği anda burada görünür' }, { ikon: 'dosya', html: 'Çıkış listesi: <b>' + O.esc(PANO_ETIKET || 'haftalık İK pano verisi') + '</b>' + (HAREKET_SAYI ? ' + panodan girilen ' + HAREKET_SAYI + ' hareket' : '') }],
    kadranlar: IST.length ? [kadranVeri()] : []
  });
  /* birim süzgeci değişince yalnız kadran yeniden çizilir */
  const kadranGuncelle = () => {
    const h = kaputEl.querySelector('.kadran-hucre'); if (!h) return;
    const v = kadranVeri(), alt = h.querySelector('.kadran-alt');
    if (alt) alt.innerHTML = v.alt;
    O.kadran(h.firstElementChild, Object.assign({ boyut: window.matchMedia('(max-width: 760px)').matches ? 100 : 146 }, v));
  };
  O.kpiSatiri(kok, [
    { anahtar: 'anket', etiket: 'Anket', deger: T.length, alt: YIL + ' yanıtı', ikon: 'dosya', renk: 'var(--g1)' },
    { anahtar: 'tekrar', etiket: 'Tekrar çalışırım', deger: yuzdeTam(tekrar.evet, tekrar.n), onek: '%', alt: tekrar.evet + ' / ' + tekrar.n + ' kişi “Evet”', ikon: 'donus', renk: 'var(--g2)' }
  ], { sinif: 'bindir' });

  let no = 0;
  const akis = (baslik, aciklama) => O.akisBaslik(kok, { no: String(++no).padStart(2, '0'), baslik, aciklama });
  const RET_NOT = RET ? ' · kişisel veri onayı vermeyen ' + RET + ' yanıt hariç' : '';

  /* ---- 01 NEDEN AYRILIYORLAR? (sayfanın ilk grafiği; birim süzgeci + yorumlar) */
  akis('Neden ayrılıyorlar?', 'Her neden için “Etkili” ya da “Çok etkili” diyenlerin oranı · birime göre süzülebilir');
  if (S.length) { const nKap = O.el('div', { class: 'ay-neden-bolum' }); kok.append(nKap); nedenBolumuCiz(nKap, S, RET, kayitDept, kadranGuncelle, kisiK); }
  else {
    const b = O.kart(kok, { baslik: YIL + ' yanıtı yok' });
    O.bosDurum(b.govde, IK
      ? { ikon: 'dosya', baslik: 'Henüz anket yanıtı yok', metin: 'Eski Google Form yanıtlarını “Yanıt aktar” ile yükleyebilir ya da istifa eden kişilere bağlantı gönderebilirsiniz.', eylem: { metin: 'Yanıt aktar', fn: aktarimSec } }
      : { ikon: 'dosya', baslik: 'Henüz anket yanıtı yok', metin: 'İnsan Kaynakları yanıtları ekledikçe burada görünecek.' });
  }

  /* ---- 02 ÇIKIŞLAR VE ÇIKIŞ GÖRÜŞMESİ (haftalık İK pano verisi + panodan girilen hareketler + anketler) */
  if (CIK.length) {
    akis('Çıkışlar ve çıkış görüşmesi', YIL + ' · tüm çıkışlar ve istifa edenlerle yapılan çıkış görüşmesi (V.İ. ve stajyer hariç)');
    const izC = O.izgara(kok);
    /* (a) Çıkış nedenleri: sayı + yüzde */
    const grupSay = new Map(CIK_GRUPLARI.map((g) => [g.ad, 0]));
    CIK.forEach((a) => { const g = cikisGrubu(a); grupSay.set(g, (grupSay.get(g) || 0) + 1); });
    const nedenler = CIK_GRUPLARI.map((g) => ({ ad: g.ad, deger: grupSay.get(g.ad) || 0, renk: g.renk })).filter((x) => x.deger > 0).sort((a, b) => b.deger - a.deger);
    const kN = O.kart(izC, { baslik: 'Çıkış nedenleri', aciklama: YIL + ' · kişi sayısı ve toplam çıkış içindeki payı', sinif: 's5' });
    kN.govde.append(O.el('div', { class: 'ay-buyuk' }, O.el('b', { text: O.sayi(CIK.length) }), O.el('span', { text: 'toplam çıkış' })));
    const nedenAc = (x) => kisiListesiAc('Çıkış nedeni · ' + x.ad, YIL + ' · %' + yuzdeTam(x.deger, CIK.length) + ' (toplam ' + CIK.length + ' çıkış içinde)', CIK.filter((a) => cikisGrubu(a) === x.ad).map(kisiC));
    const nSerit = O.dagilimSeridi(kN.govde, nedenler);
    [...nSerit.children].forEach((p, i) => { if (nedenler[i]) tikBagla(p, () => nedenAc(nedenler[i])); });
    ozetTablo(kN.govde, ['Neden', 'Kişi', 'Oran'],
      nedenler.map((x) => [O.el('span', { class: 'ay-renkli' }, O.el('i', { style: 'background:' + x.renk }), x.ad), O.sayi(x.deger), '%' + yuzdeTam(x.deger, CIK.length)]),
      ['Toplam çıkış', O.sayi(CIK.length), '%100'], nedenler.map((x) => () => nedenAc(x)));
    /* (b) Çıkış görüşmesi: tabi olan = toplam istifa; yapılan / yapılmayan + yapılmama nedenleri */
    const yapilmayanlar = IST.filter((a) => !T.some((k) => eslesir(k, a)));
    const yapilan = IST.length - yapilmayanlar.length;
    const kG = O.kart(izC, { baslik: 'Çıkış görüşmesi (ayrılış anketi)', aciklama: 'Çıkış görüşmesine tabi olanlar = toplam istifa (deneme süresinde istifa dahil)', sinif: 's7' });
    const kutu = (et, deger, alt, sinif) => O.el('div', { class: 'ay-sayi-kutu ' + (sinif || '') }, O.el('span', { text: et }), O.el('b', { text: O.sayi(deger) }), O.el('small', { text: alt }));
    const yapilanlar = IST.filter(anketVar);
    const tabiAc = () => kisiListesiAc('Çıkış görüşmesine tabi', YIL + ' · toplam istifa', IST.map(kisiC));
    const yapilanAc = () => kisiListesiAc('Çıkış görüşmesi yapılan', YIL + ' · istifa edip anketi olanlar (%' + yuzdeTam(yapilan, IST.length) + ')', yapilanlar.map(kisiC));
    const yapilmayanAc = () => kisiListesiAc('Çıkış görüşmesi yapılmayan', YIL + ' · istifa edip anketi olmayanlar (%' + yuzdeTam(yapilmayanlar.length, IST.length) + ')', yapilmayanlar.map(kisiC));
    kG.govde.append(O.el('div', { class: 'ay-uc' },
      tikBagla(kutu('Görüşmeye tabi', IST.length, 'toplam istifa', ''), tabiAc, 'Görüşmeye tabi'),
      tikBagla(kutu('Yapılan', yapilan, '%' + yuzdeTam(yapilan, IST.length), 'iyi'), yapilanAc, 'Yapılan'),
      tikBagla(kutu('Yapılmayan', yapilmayanlar.length, '%' + yuzdeTam(yapilmayanlar.length, IST.length), 'kotu'), yapilmayanAc, 'Yapılmayan')));
    const gSerit = O.dagilimSeridi(kG.govde, [{ ad: 'Yapılan', deger: yapilan, renk: O.RENK.g1 }, { ad: 'Yapılmayan', deger: yapilmayanlar.length, renk: O.RENK.g8 }]);
    const gParca = [yapilan ? yapilanAc : null, yapilmayanlar.length ? yapilmayanAc : null].filter(Boolean);
    [...gSerit.children].forEach((p, i) => { if (gParca[i]) tikBagla(p, gParca[i]); });
    const ynSay = new Map(); yapilmayanlar.forEach((a) => { const n = yapilmamaNedeni(a); ynSay.set(n, (ynSay.get(n) || 0) + 1); });
    const yn = [...ynSay.entries()].map(([ad, deger]) => ({ ad, deger })).sort((a, b) => b.deger - a.deger || O.trKarsilastir(a.ad, b.ad));
    kG.govde.append(O.el('h4', { class: 'ay-alt-baslik', text: 'Yapılmama nedenleri (' + O.sayi(yapilmayanlar.length) + ' kişi)' }));
    const ynListe = O.cubukListe(kG.govde, yn, { renk: O.RENK.g8, bicim: (v) => O.sayi(v) + ' · %' + yuzdeTam(v, yapilmayanlar.length), bos: 'Yapılmayan görüşme yok' });
    [...ynListe.querySelectorAll('.cubuk-satir')].forEach((r, i) => { const x = yn[i]; if (x) tikBagla(r, () => kisiListesiAc('Görüşme yapılmama nedeni · ' + x.ad, YIL + ' · ' + x.deger + ' kişi', yapilmayanlar.filter((a) => yapilmamaNedeni(a) === x.ad).map(kisiC)), x.ad); });
    kG.govde.append(O.el('p', { class: 'ay-bilgi', style: 'margin-top:10px', text: 'Yapılmama nedeni, haftalık rapordaki “Açıklama” (gerçek ayrılış nedeni) sütunundan okunur.' }));
    /* (c) Departmanlara göre: yapılması gereken / yapılan / yapılmayan — kümelenmiş sütun (tablo ikizinde aynı sayılar) */
    const dep = new Map();
    IST.forEach((a) => { const d = a.dept || 'Belirtilmemiş'; const r = dep.get(d) || { dept: d, gereken: 0, yapilan: 0, yapilmayan: 0 }; r.gereken++; if (T.some((k) => eslesir(k, a))) r.yapilan++; else r.yapilmayan++; dep.set(d, r); });
    const depSatir = [...dep.values()].sort((a, b) => b.gereken - a.gereken || O.trKarsilastir(a.dept, b.dept));
    const SERI = [{ k: 'gereken', ad: 'Yapılması gereken', renk: O.RENK.lac300 }, { k: 'yapilan', ad: 'Yapılan', renk: O.RENK.g1 }, { k: 'yapilmayan', ad: 'Yapılmayan', renk: O.RENK.g8 }];
    const gDep = O.grafikKarti(izC, { baslik: 'Departmanlara göre çıkış görüşmesi', aciklama: YIL + ' · istifa edenler üzerinden · toplam ' + IST.length + ' gereken, ' + yapilan + ' yapılan, ' + yapilmayanlar.length + ' yapılmayan', sinif: 's12', yukseklik: 320,
      lejant: SERI.map((s) => ({ ad: s.ad, renk: s.renk })),
      tablo: () => ({ sutunlar: [{ ad: 'Departman' }, { ad: 'Yapılması gereken', sag: true }, { ad: 'Yapılan', sag: true }, { ad: 'Yapılmayan', sag: true }],
        satirlar: depSatir.map((r) => [r.dept, O.sayi(r.gereken), O.sayi(r.yapilan), O.sayi(r.yapilmayan)]).concat([['Toplam', O.sayi(IST.length), O.sayi(yapilan), O.sayi(yapilmayanlar.length)]]) }) });
    if (depSatir.length) kumeGrafik(gDep, depSatir.map((r) => r.dept), SERI.map((s) => ({ ad: s.ad, renk: s.renk, veri: depSatir.map((r) => r[s.k]) })), {
      tikla: (i, si) => { const r = depSatir[i], se = SERI[si]; if (!r || !se) return;
        const ist = IST.filter((a) => (a.dept || 'Belirtilmemiş') === r.dept);
        const grup = se.k === 'yapilan' ? ist.filter(anketVar) : se.k === 'yapilmayan' ? ist.filter((a) => !anketVar(a)) : ist;
        kisiListesiAc(r.dept + ' · çıkış görüşmesi ' + se.ad.toLocaleLowerCase('tr'), YIL + ' · istifa edenler', grup.map(kisiC)); } });
  }

  /* ---- 03 KARAR VE İLETİŞİM (yüzdesel halka grafikler) + bağlılık */
  if (S.length) {
    akis('Karar ve iletişim', 'İstifa kararının zamanı, fikrin ilk kime açıldığı ve bağlılık');
    const iz3 = O.izgara(kok);
    const KRENK = [O.RENK.g1, O.RENK.g4, O.RENK.g5, O.RENK.g3, O.RENK.g2];
    const kararSay = A.KARARLAR.map((x, i) => ({ ad: x, deger: S.filter((k) => k.cevaplar && k.cevaplar.karar === x).length, renk: KRENK[i] })).filter((d) => d.deger > 0);
    const kararTop = kararSay.reduce((s, d) => s + d.deger, 0);
    halkaGrafik(iz3, { baslik: 'İstifa kararı ne zaman verildi?', aciklama: 'Yanıtlayanların dağılımı (' + O.sayi(kararTop) + ' kişi' + RET_NOT + ')', dilimler: kararSay,
      tikla: (d) => kisiListesiAc('İstifa kararı · ' + d.ad, '%' + pct(d.deger, kararTop) + ' (' + kararTop + ' yanıt içinde)', S.filter((k) => k.cevaplar && k.cevaplar.karar === d.ad).map(kisiK)) });
    /* Birden fazla seçilebilen soru: dilimler birbirini dışlar (yalnız yönetici · yalnız arkadaş · ikisi de) → toplam %100 */
    const kimeOf = (k) => [].concat((k.cevaplar && k.cevaplar.kime) || []);
    const KIME_GRUP = {
      'Yalnız yöneticisine': (x) => x.indexOf('Yöneticilerime') >= 0 && x.indexOf('Mesai arkadaşlarıma') < 0,
      'Yalnız mesai arkadaşlarına': (x) => x.indexOf('Mesai arkadaşlarıma') >= 0 && x.indexOf('Yöneticilerime') < 0,
      'İkisine de': (x) => x.indexOf('Yöneticilerime') >= 0 && x.indexOf('Mesai arkadaşlarıma') >= 0
    };
    const yY = S.filter((k) => KIME_GRUP['Yalnız yöneticisine'](kimeOf(k))).length;
    const yA = S.filter((k) => KIME_GRUP['Yalnız mesai arkadaşlarına'](kimeOf(k))).length;
    const yI = S.filter((k) => KIME_GRUP['İkisine de'](kimeOf(k))).length;
    const kimeTop = yY + yA + yI;
    halkaGrafik(iz3, { baslik: 'Fikrini işyerinde önce kime açtı?', aciklama: 'Yanıtlayanların dağılımı (' + O.sayi(kimeTop) + ' kişi' + RET_NOT + ')',
      tikla: (d) => kisiListesiAc('Fikrini önce kime açtı · ' + d.ad, '%' + pct(d.deger, kimeTop) + ' (' + kimeTop + ' yanıt içinde)', S.filter((k) => KIME_GRUP[d.ad](kimeOf(k))).map(kisiK)),
      dilimler: [{ ad: 'Yalnız yöneticisine', deger: yY, renk: O.RENK.g5 }, { ad: 'Yalnız mesai arkadaşlarına', deger: yA, renk: O.RENK.g4 }, { ad: 'İkisine de', deger: yI, renk: O.RENK.g7 }].filter((d) => d.deger > 0),
      alt: 'Toplamda yöneticisine açan: <b>%' + pct(yY + yI, kimeTop) + '</b> (' + (yY + yI) + ') · mesai arkadaşlarına açan: <b>%' + pct(yA + yI, kimeTop) + '</b> (' + (yA + yI) + ')' });
    const k3 = O.kart(iz3, { baslik: 'Bağlılık ve deneyim', aciklama: 'Evet / Hayır yanıtlarına göre' + RET_NOT, sinif: 's4' });
    const serit = (baslik, d, renkE, aciklama, alan) => {
      const h = d.n - d.evet;
      /* Evet / Hayır parçası ve lejantı tıklanır: o cevabı verenler */
      const ac = (cevap) => () => kisiListesiAc(baslik + ' · “' + cevap + '”', '%' + yuzdeTam(cevap === 'Evet' ? d.evet : h, d.n) + ' (' + d.n + ' yanıt içinde)', S.filter((k) => k.cevaplar && k.cevaplar[alan] === cevap).map(kisiK));
      const pE = O.el('i', { style: 'width:' + (d.n ? (d.evet / d.n) * 100 : 0) + '%;background:' + renkE }), pH = O.el('i', { style: 'width:' + (d.n ? (h / d.n) * 100 : 0) + '%;background:var(--n-300)' });
      const lE = O.el('span', null, O.el('i', { style: 'background:' + renkE }), 'Evet ' + d.evet), lH = O.el('span', null, O.el('i', { style: 'background:var(--n-300)' }), 'Hayır ' + h);
      if (d.evet) { tikBagla(pE, ac('Evet'), 'Evet'); tikBagla(lE, ac('Evet'), 'Evet'); }
      if (h) { tikBagla(pH, ac('Hayır'), 'Hayır'); tikBagla(lH, ac('Hayır'), 'Hayır'); }
      return O.el('div', { class: 'ay-oran-blok' },
        O.el('h4', { text: baslik }),
        O.el('div', { class: 'ay-buyuk' }, O.el('b', { text: '%' + yuzdeTam(d.evet, d.n) }), O.el('span', { text: '“Evet” · ' + d.evet + ' / ' + d.n + ' kişi' })),
        O.el('div', { class: 'ay-serit', 'aria-label': baslik + ': ' + d.evet + ' evet, ' + h + ' hayır' }, pE, pH),
        O.el('div', { class: 'ay-serit-lejant' }, lE, lH),
        aciklama ? O.el('p', { text: aciklama }) : null);
    };
    k3.govde.append(O.el('div', { class: 'ay-oran' },
      serit('Gelecekte tekrar İnciroğlu’nda çalışmayı düşünür', tekrar, O.RENK.g1, 'Yüksek olması, ayrılanların şirketle ilişkisini olumlu kapattığını gösterir.', 'tekrar'),
      serit('Ayrılmasına sebep olan olumsuz bir olay yaşadı', olay, O.RENK.g8, 'Olumsuz olayı açıklayanların metni yanıt ayrıntısında görülür.', 'olay')));
  }

  /* ---- 04 KIRILIM */
  if (CIK.length || T.length) {
    akis('Kırılım', 'Departmanlara göre anket oranı ve aylara göre yapılması gereken / yapılan anket');
    const iz4 = O.izgara(kok);
    /* (a) Departmanlara göre: toplam çıkışların yüzde kaçında anket var (tüm çıkış nedenleri) */
    const dm = new Map();
    CIK.forEach((a) => { const d = a.dept || 'Belirtilmemiş'; const r = dm.get(d) || { ad: d, toplam: 0, anket: 0 }; r.toplam++; if (T.some((k) => eslesir(k, a))) r.anket++; dm.set(d, r); });
    const dRows = [...dm.values()].sort((a, b) => b.toplam - a.toplam || O.trKarsilastir(a.ad, b.ad)).map((r) => Object.assign(r, { deger: pct(r.anket, r.toplam) }));
    const cAnket = dRows.reduce((s, r) => s + r.anket, 0);
    const kD = O.kart(iz4, { baslik: 'Departmanlara göre anket oranı', aciklama: 'Toplam çıkışlar içinde anketi olanların payı · genel %' + pct(cAnket, CIK.length) + ' (' + cAnket + ' / ' + CIK.length + ') · tüm çıkış nedenleri', sinif: 's6' });
    const dListe = O.cubukListe(kD.govde, dRows, { max: 100, renk: O.RENK.g1, kaydir: 330, bicim: (v, r) => '%' + v + ' · ' + r.anket + '/' + r.toplam, bos: 'Çıkış verisi yok' });
    /* departman satırı: o departmanın tüm çıkışları (anketi olanların adı tıklanır) */
    [...dListe.querySelectorAll('.cubuk-satir')].forEach((el, i) => { const r = dRows[i]; if (r) tikBagla(el, () => kisiListesiAc(r.ad + ' · çıkışlar', YIL + ' · anketi olan ' + r.anket + ' / ' + r.toplam + ' çıkış (%' + r.deger + ')', CIK.filter((a) => (a.dept || 'Belirtilmemiş') === r.ad).map(kisiC)), r.ad); });
    /* (b) Aylara göre: yapılması gereken (istifa) ve yapılan anket — kümelenmiş sütun */
    const sonAy = YIL === simdi.getFullYear() ? simdi.getMonth() + 1 : 12;
    const aylar = Array.from({ length: sonAy }, (_, i) => i + 1);
    const ayOf = (a) => { const d = tarihCoz(a.tarih); return d ? d.getMonth() + 1 : null; };
    const ayG = aylar.map((m) => IST.filter((a) => ayOf(a) === m).length);
    const ayY = aylar.map((m) => IST.filter((a) => ayOf(a) === m && T.some((k) => eslesir(k, a))).length);
    const AYSERI = [{ ad: 'Yapılması gereken', renk: O.RENK.lac300, veri: ayG }, { ad: 'Yapılan', renk: O.RENK.g1, veri: ayY }];
    const gA = O.grafikKarti(iz4, { baslik: 'Aylara göre anket', aciklama: 'Çıkış ayına göre yapılması gereken (istifa) ve yapılan anket · toplam ' + ayG.reduce((s, x) => s + x, 0) + ' / ' + ayY.reduce((s, x) => s + x, 0), sinif: 's6', yukseklik: 300,
      lejant: AYSERI.map((s) => ({ ad: s.ad, renk: s.renk })),
      tablo: () => ({ sutunlar: [{ ad: 'Ay' }, { ad: 'Yapılması gereken', sag: true }, { ad: 'Yapılan', sag: true }, { ad: 'Yapılmayan', sag: true }, { ad: 'Oran', sag: true }],
        satirlar: aylar.map((m, i) => [O.ayAdi(m), O.sayi(ayG[i]), O.sayi(ayY[i]), O.sayi(ayG[i] - ayY[i]), ayG[i] ? '%' + pct(ayY[i], ayG[i]) : '—']) }) });
    kumeGrafik(gA, aylar.map(O.ayKisa), AYSERI, {
      tikla: (i, si) => { const m = aylar[i]; if (!m) return; const ist = IST.filter((a) => ayOf(a) === m);
        kisiListesiAc(O.ayAdi(m) + ' · ' + (si === 1 ? 'yapılan anket' : 'yapılması gereken anket'), YIL + ' · ' + (si === 1 ? 'istifa edip anketi olanlar' : 'istifa edenler'), (si === 1 ? ist.filter(anketVar) : ist).map(kisiC)); } });
  }

  /* ---- 05 BAĞLANTILAR (yalnız İK) — otomatik ve elle oluşturulan, yanıt bekleyen bağlantılar */
  if (IK) {
    akis('Anket bağlantıları', 'İstifa, deneme süresinde işçi feshi, emeklilik ve askerlik çıkışlarında bağlantı kendiliğinden oluşur (İK Dashboard › Personel hareketi ya da haftalık veri yüklemesi); buradan kopyalayıp gönderin.');
    const k2 = O.kart(O.izgara(kok), { baslik: 'Bekleyen bağlantılar', aciklama: 'Kişiye gönderilecek ya da gönderilmiş, yanıt bekleyen bağlantılar (' + BEK.length + ')', sinif: 's12' });
    O.tablo(k2.govde, {
      sutunlar: [
        { k: 'ad', ad: 'Ad Soyad', sinif: 'ad-hucre', bicim: (v) => O.trBaslik(v) },
        { k: 'departman', ad: 'Departman', bicim: (v) => v || '—' },
        { k: 'cikis', ad: 'Çıkış', tip: 'tarih', bicim: (v) => gunYaz(tarihCoz(v)), siralamaDegeri: (r) => { const d = tarihCoz(r.cikis); return d ? d.getTime() : 0; } },
        { k: 'olusturan', ad: 'Oluşturan', bicim: (v) => v || '—' },
        { k: 'olusturma', ad: 'Oluşturma', tip: 'tarih', bicim: (v) => gunYaz(tarihCoz(v)), siralamaDegeri: (r) => { const d = tarihCoz(r.olusturma); return d ? d.getTime() : 0; } },
        { k: '_islem', ad: '', siralanamaz: true, bicim: (v, r) => O.el('div', { class: 'ay-islem' },
          O.el('button', { class: 'btn btn-pirinc', type: 'button', title: 'Bağlantıyı ve hazır mesajı göster', html: IK_KOPYA + 'Gönder', on: { click: () => baglantiGoster(r) } }),
          O.el('button', { class: 'btn btn-hayalet', type: 'button', title: 'Bağlantıyı iptal et', 'aria-label': 'İptal et', html: IK_SIL, on: { click: () => baglantiIptal(r) } })) }
      ],
      satirlar: BEK, sayfaBoyu: 10, varsayilanSira: { k: 'olusturma', y: 'azalan' }, ara: BEK.length > 10, araAlanlari: ['ad', 'departman'],
      bos: { baslik: 'Bekleyen bağlantı yok', metin: 'Yeni bir çıkış girildiğinde bağlantı kendiliğinden oluşur; üstteki “Bağlantı oluştur” ile elle de oluşturabilirsiniz.' }
    });
  }

  if (!T.length) { bitir(kok, kaydirma); return; }

  /* ---- 06 YANITLAR */
  akis('Yanıtlar', 'Satıra tıklayınca kişinin tüm cevapları açılır');
  /* Onay vermeyenlerin yanıtını yalnız İK görür (listede işaretli); direktör listesinde yer almaz */
  const listelenen = KVKK_RET_HARIC && !IK ? S : T;
  const kY = O.kart(kok, { baslik: 'Anket yanıtları', aciklama: O.sayi(listelenen.length) + ' yanıt · ' + YIL + (KVKK_RET_HARIC && !IK && RET ? ' · kişisel veri onayı vermeyen ' + RET + ' yanıt gösterilmez' : '') });
  const satirlar = listelenen.map((k) => {
    const p = (k.cevaplar && k.cevaplar.puan) || {};
    const ust = A.FAKTORLER.map((f) => ({ ad: f.ad, v: p[f.k] })).filter((x) => Number.isInteger(x.v) && x.v >= A.ETKILI_ESIK).sort((a, b) => b.v - a.v).slice(0, 2);
    return Object.assign({}, k, { _t: tarihCoz(k.cikis), _ust: ust, _tekrar: (k.cevaplar && k.cevaplar.tekrar) || '—', _kosul: String((k.cevaplar && k.cevaplar.kosul) || '').replace(/\s+/g, ' ').trim() });
  });
  O.tablo(kY.govde, {
    sutunlar: [
      { k: 'ad', ad: 'Ad Soyad', sinif: 'ad-hucre', bicim: (v, r) => (IK && onayYok(r)
        ? O.el('div', { class: 'ay-cipler' }, O.el('span', { text: O.trBaslik(v) }), O.el('span', { class: 'cip cip-uy', title: 'Kişi, yanıtlarının anonim veri olarak kullanılmasını onaylamadı; istatistiklere dahil edilmez.', text: 'KVKK onayı yok' }))
        : O.trBaslik(v)) },
      { k: 'departman', ad: 'Departman' },
      { k: 'pozisyon', ad: 'Pozisyon', bicim: (v) => (v ? O.trBaslik(v) : '—') },
      { k: '_t', ad: 'Çıkış', tip: 'tarih', bicim: (v) => gunYaz(v), siralamaDegeri: (r) => (r._t ? r._t.getTime() : 0) },
      { k: '_ust', ad: 'En etkili nedenler', siralanamaz: true, bicim: (v) => (v && v.length ? O.el('div', { class: 'ay-cipler' }, ...v.map((x) => O.el('span', { class: 'cip cip-bilgi', text: x.ad }))) : '—') },
      { k: '_tekrar', ad: 'Tekrar çalışır' },
      /* "Hangi koşullar sağlanırsa çalışmaya devam ederdiniz?" — uzun cevap kısaltılır, tamamı üzerine gelince / satıra tıklayınca */
      { k: '_kosul', ad: 'Hangi koşullarda devam ederdi', bicim: (v) => (v ? O.el('span', { class: 'ay-kosul', title: v, text: v }) : '—') }
    ],
    satirlar, sayfaBoyu: 12, siraNo: true, varsayilanSira: { k: '_t', y: 'azalan' }, araYer: 'Ad, departman, pozisyon ara…', araAlanlari: ['ad', 'departman', 'pozisyon'],
    satirTikla: (r) => ayrintiAc(KAYITLAR.find((x) => x.id === r.id) || r)
  });
  O.notlar(kok, [
    'Kaynak: ayrılış anketi yanıtları (canlı) · çıkış listesi: haftalık İK pano verisi' + (PANO_ETIKET ? ' (' + PANO_ETIKET + ')' : '') + (HAREKET_SAYI ? ' ve İK Dashboard’dan girilen personel hareketleri' : '') + '.',
    'Anket oranı ve “yapılması gereken”: istifayla ayrılanlar (V.İ. ve stajyer hariç; deneme süresinde işçi feshi dahil) içinde anketi olanlar. Eşleştirme ad soyad ve çıkış tarihiyle yapılır. “Neden ayrılıyorlar?” bölümünde birim seçilince sağ üstteki anket oranı o birimin istifalarına göre hesaplanır.',
    'Departmanlara göre anket oranı: o departmanın tüm çıkışları (her neden) içinde anketi olanların payı.',
    '“Etkili” payı: 6’lı ölçekte “Etkili” ya da “Çok etkili” işaretleyenlerin, o soruyu yanıtlayanlara oranı. Yorumlar bölümü yalnız bu yanıtlardan hesaplanır.',
    KVKK_RET_HARIC ? 'Kişisel veri onayı: yanıtlarının anonim veri olarak kullanılmasını onaylamayan kişilerin yanıtları anket oranında sayılır, grafik ve istatistiklere dahil edilmez; ayrıntısını yalnız İK görür.' : null
  ].filter(Boolean));
  bitir(kok, kaydirma);
}
function bitir(kok, kaydirma) {
  if (!ILK) window.scrollTo({ top: kaydirma });
  ILK = false;
  window.__TEST_HAZIR = true;
}

function durumEkrani(baslik, metin) {
  acilisGizle();
  const kart = O.el('div', { class: 'durum-kart', role: 'alert' },
    O.el('span', { class: 'amblem', role: 'img', 'aria-label': 'İnciroğlu Otomotiv İK amblemi' }),
    O.el('div', { class: 'ust-etiket', text: 'İnciroğlu Otomotiv · İşten Ayrılış Anketleri' }),
    O.el('div', { class: 'durum-ikon hata', html: O.ikon('uyari') }), O.el('h2', { text: baslik }), O.el('p', { text: metin }));
  const eylem = O.el('div', { class: 'durum-eylem' },
    O.el('button', { type: 'button', class: 'btn', html: O.ikon('sifirla') + 'Yeniden dene', on: { click: () => location.reload() } }));
  kart.append(eylem, O.el('div', { class: 'durum-alt', text: AD + ' · ' + ROL_AD }));
  document.body.append(O.el('div', { class: 'durum-ekran' }, kart));
  window.__TEST_HAZIR = true;
}

/* ============================================================== VERİ */
O.grafikVarsayilan();
/* Grafik eksen etiketleri Inter ile ölçülsün (yazı tipi gelmeden ölçülürse uzun etiketin başı kesilir); en çok 2,5 sn beklenir */
try { await Promise.race([Promise.all([document.fonts.load('500 11.5px Inter'), document.fonts.load('600 11px Inter')]), new Promise((r) => setTimeout(r, 2500))]); } catch (e) { /* yazı tipi gelmezse sistem yazısı */ }
try {
  const s = await getDoc(doc(db, 'satisVeri', 'ikPano'));
  if (s.exists() && s.data().json) {
    const p = JSON.parse(s.data().json);
    AYRILANLAR = (p && p.D && Array.isArray(p.D.ayrilanlar)) ? p.D.ayrilanlar : [];
    PANO_ETIKET = (p && p.etiket && (p.etiket.short || p.etiket.label)) || '';
    /* İK Dashboard › Personel hareketi ile girilen (Excel'e henüz işlenmemiş) çıkışlar da listeye eklenir — Dashboard'la aynı motor */
    const hareketler = Array.isArray(s.data().hareketler) ? s.data().hareketler : [];
    if (hareketler.length && p && p.D) {
      try {
        const g = hareketUygula({ D: p.D, MONTHLY_HC: p.MONTHLY_HC, etiket: p.etiket }, hareketler);
        if (g && g.D && Array.isArray(g.D.ayrilanlar)) { HAREKET_SAYI = Math.max(0, g.D.ayrilanlar.length - AYRILANLAR.length); AYRILANLAR = g.D.ayrilanlar; }
      } catch (e) { console.warn('Personel hareketleri uygulanamadı', e); }
    }
  }
} catch (e) { PANO_HATA = e; console.warn('İK pano verisi okunamadı', e); }

/* Art arda gelen canlı güncellemeler (ör. aktarımın 8'erli parçaları) tek çizimde birleştirilir; açık pencere varken
   çizim pencere kapanana kadar ertelenir */
let cizZaman = null;
function cizPlanla() {
  clearTimeout(cizZaman);
  cizZaman = setTimeout(() => { cizZaman = null; if (acik) { BEKLEYEN_CIZIM = true; return; } ciz(); acilisGizle(); }, ILK ? 0 : 250);
}
/* Direktör yalnız tamamlanmış yanıtları okur (kural da sorgunun bu süzgeçle yapılmasını ister); bekleyen bağlantıların
   kimliği gizli anahtardır, yalnız İK görür. */
onSnapshot(IK ? KOL : query(KOL, where('durum', '==', 'tamamlandi')), (snap) => {
  KAYITLAR = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
  const tam = KAYITLAR.filter((k) => k.durum === 'tamamlandi');
  if (!ILK) tam.filter((k) => !GORULEN.has(k.id) && k.kaynak === 'link').forEach((k) => O.bildirim('Yeni anket geldi: ' + O.trBaslik(k.ad)));
  tam.forEach((k) => GORULEN.add(k.id));
  cizPlanla();
}, (e) => {
  console.warn('Anketler okunamadı', e);
  durumEkrani('Anketler okunamadı', e && e.code === 'permission-denied'
    ? 'Bu sayfayı görme yetkiniz yok ya da güvenlik kuralı henüz yayınlanmadı. Yetki gerekiyorsa İnsan Kaynakları ile görüşün.'
    : 'Bağlantı sorunu olabilir. Sayfayı yenileyip tekrar deneyin.');
});
window.__AYRILIS = { kayitlar: () => KAYITLAR, ayrilanlar: () => AYRILANLAR, yil: () => YIL };
</script>
