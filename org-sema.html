<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">

<style>
/* Organizasyon Şeması — İK Portalı kutucuğu (tüm yönetim rolleri görür, yalnız İK yükler). Kabuk ve bileşenler İK Dashboard ile ortaktır.
   Yerleşim: solda sayfa listesi (küçük resimli, PowerPoint gibi), sağda seçili sayfa; sayfa her ekranda bütünüyle sığar, yakınlaştırılabilir. */
body.orgsema .ust-marka { display: flex; }
.os-araclar { display: flex; gap: 8px; align-items: center; }
.os-baslik { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 14px; }
.os-baslik h1 { font-family: var(--font-serif); font-size: 24px; font-weight: 600; color: var(--metin-marka); margin: 0; }
.os-baslik-alt { font-size: 13px; color: var(--metin-2); }
.os-kaynak { margin-left: auto; font-size: 12px; color: var(--metin-3); }
.os-yerlesim { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 18px; align-items: start; }
/* ---- sol: sayfa listesi */
.os-yan { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; background: var(--yuzey-kart); border: 1px solid var(--cizgi-1); border-radius: 14px; box-shadow: var(--gol-1); padding: 8px; display: grid; gap: 2px; align-content: start; scrollbar-width: thin; }
.os-yan-baslik { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--metin-3); padding: 8px 8px 6px; }
.os-oge { display: grid; gap: 6px; width: 100%; border: 0; background: none; border-radius: 10px; padding: 7px; cursor: pointer; text-align: left; font: inherit; color: var(--metin-1); transition: background .12s; }
.os-oge:hover { background: var(--n-50); }
.os-oge:focus-visible { outline: none; box-shadow: var(--odak-halkasi); }
.os-kucuk { position: relative; width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--cizgi-1); background: #fff; }
.os-kucuk > .ps-slayt { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
.os-oge-ad { display: flex; gap: 7px; align-items: baseline; font-size: 12.5px; line-height: 1.35; min-width: 0; }
.os-oge-ad b { flex: none; min-width: 16px; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--metin-3); }
.os-oge-ad span { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.os-oge[aria-current="page"] { background: var(--lac-50); box-shadow: inset 0 0 0 1.5px var(--pir-500); }
.os-oge[aria-current="page"] .os-oge-ad b { color: var(--pir-800); }
.os-oge[aria-current="page"] .os-kucuk { border-color: var(--pir-300); }
/* ---- sağ: sahne */
.os-sahne { min-width: 0; display: grid; gap: 10px; }
.os-arac { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--yuzey-kart); border: 1px solid var(--cizgi-1); border-radius: 12px; padding: 6px 8px; box-shadow: var(--gol-1); }
.os-dugme { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 34px; height: 34px; padding: 0 9px; border: 1px solid var(--cizgi-2); border-radius: 9px; background: #fff; color: var(--metin-1); cursor: pointer; font: 600 13px/1 var(--font-sans); white-space: nowrap; }
.os-dugme:hover:not(:disabled) { background: var(--n-50); border-color: var(--cizgi-3); }
.os-dugme:disabled { opacity: .4; cursor: default; }
.os-dugme:focus-visible { outline: none; box-shadow: var(--odak-halkasi); }
.os-dugme svg { width: 16px; height: 16px; flex: none; }
.os-sayfa { min-width: 64px; text-align: center; font: 600 13px/1 var(--font-sans); font-variant-numeric: tabular-nums; color: var(--metin-1); }
.os-ad { flex: 1 1 180px; min-width: 0; font-size: 14px; font-weight: 600; color: var(--metin-marka); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.os-yakin { display: flex; align-items: center; gap: 4px; }
.os-yuzde { min-width: 64px; }
.os-cerceve { position: relative; display: flex; overflow: auto; scrollbar-gutter: stable both-edges; background: var(--n-50, #f4f6f9); border: 1px solid var(--cizgi-1); border-radius: 14px; padding: 14px; }
.os-cerceve.surukle { cursor: grab; }
.os-cerceve.surukleniyor { cursor: grabbing; user-select: none; }
.os-olcek { position: relative; flex: none; margin: auto; overflow: hidden; border-radius: 3px; background: #fff; box-shadow: 0 10px 30px -12px rgba(15, 27, 45, .28), 0 0 0 1px rgba(15, 27, 45, .07); }
.os-olcek > .ps-slayt { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.os-dip { margin: 0; font-size: 12px; color: var(--metin-3); line-height: 1.6; }
@media (max-width: 640px), (pointer: coarse) { .os-dip.ipucu { display: none; } }   /* klavye / fare ipucu dokunmatikte anlamsız */
.os-uyari { margin: 0; font-size: 12.5px; color: var(--uy-700); background: var(--uy-50); border: 1px solid var(--uy-200); border-radius: 10px; padding: 8px 12px; }
/* ---- tam ekran */
.os-sahne:fullscreen { background: #0b1424; padding: 12px; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; }
.os-sahne:fullscreen .os-cerceve { order: -1; background: transparent; border: 0; padding: 4px; height: 100% !important; }
.os-sahne:fullscreen .os-arac { justify-self: center; max-width: 100%; }
.os-sahne:fullscreen .os-dip, .os-sahne:fullscreen .os-uyari { display: none; }
/* ---- önizleme (İK, yüklemeden önce) */
.os-onizleme { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 14px; margin: 0 0 14px; border-radius: 12px; background: var(--uy-50); border: 1px solid var(--uy-200); color: var(--uy-700); font-size: 13.5px; line-height: 1.5; }
.os-onizleme b { color: inherit; }
.os-onizleme .alt { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
/* dar ekran: sayfa listesi üstte yatay kayan şerit olur */
@media (max-width: 1100px) {
  .os-yerlesim { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .os-yan { position: static; max-height: none; display: flex; overflow-x: auto; gap: 4px; padding: 6px; }
  .os-yan-baslik { display: none; }
  .os-oge { flex: none; width: 156px; }
}
@media (max-width: 640px) {
  .os-oge { width: 124px; padding: 5px; }
  .os-oge-ad { font-size: 11.5px; }
  .os-ad { flex-basis: 100%; order: 9; }
  .os-kaynak { margin-left: 0; }
  .os-cerceve { padding: 8px; }
  .os-yuzde { min-width: 54px; }
}
@media print {
  .ust-alan, .os-yan, .os-arac, .os-onizleme, .os-dip { display: none !important; }
  .os-yerlesim { display: block; }
  .os-cerceve { border: 0; padding: 0; background: none; overflow: visible; height: auto !important; }
  .os-olcek { box-shadow: none; }
}
</style>
</head>
<!--
  Organizasyon Şeması (İK Portalı) — 21.11.2026
  Kaynak: İK'nın PowerPoint dosyası (ör. "İNCİROĞLU ORGANİZASYON ŞEMASI - KASIM 2026.pptx"). Dosya tarayıcıda açılır
  (ortak/pptx-gorunum.js, JSZip) ve olduğu gibi orgSemasi/guncel belgesine (base64) yazılır; sayfalar her açılışta bu dosyadan
  çizilir. Şema verisi (isimler) bu depoda YOKTUR.
  GÖRENLER: tüm yönetim rolleri (ik, direktor, satis_mudur, servis_mudur, idari_mudur, mudur). YÜKLEYEN: yalnız İK.
  Kural: guvenlik/firestore.rules → ORGANİZASYON ŞEMASI.
-->
<body class="orgsema">
<div class="acilis" id="acilis" role="status" aria-live="polite">
  <div class="acilis-ic">
    <span class="amblem buyuk" role="img" aria-label="İnciroğlu Otomotiv İK amblemi"></span>
    <div class="acilis-baslik">Organizasyon Şeması</div>
    <div class="acilis-metin" id="acilisMetin">Oturum denetleniyor…</div>
    <div class="acilis-cubuk"><i></i></div>
  </div>
</div>
<div class="ana">
  <div class="ust-alan kokpit">
    <header class="ust-bant">
      <div class="ic ust-ic">
        <div class="ust-marka"><span class="amblem" role="img" aria-label="İnciroğlu Otomotiv İK amblemi"></span></div>
        <div class="uyg-ad"><span>Organizasyon Şeması</span><small id="ustAlt">İnsan Kaynakları · Kurumsal yapı</small></div>
        <div class="ust-sag" id="ustSag"></div>
      </div>
    </header>
  </div>
  <main class="ic icerik" id="icerik"></main>
</div>
<input type="file" id="dosyaSec" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>

<script type="module">
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { db, kimlikBaslat, cikisYap, adBasliklari } from "./ortak/kimlik.js";
import * as O from "./pano/ortak.js";
import { pptxOku, slaytCiz, modelBirak } from "./ortak/pptx-gorunum.js?v=20261121a";

const $ = (id) => document.getElementById(id);
const el = O.el;
const acilisMetni = (t) => { const m = $('acilisMetin'); if (m) m.textContent = t; };
const acilisGizle = () => { const a = $('acilis'); if (a) { a.classList.add('gizle'); setTimeout(() => a.remove(), 600); } };
const SVG = (yol) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + yol + '</svg>';
const IK_ONCEKI = SVG('<path d="m15 18-6-6 6-6"/>');
const IK_SONRAKI = SVG('<path d="m9 18 6-6-6-6"/>');
const IK_EKSI = SVG('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/>');
const IK_ARTI = SVG('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/>');
const IK_TAM = SVG('<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>');
const IK_KUCUL = SVG('<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>');
const PX = 4 / 3;                                   /* pptx-gorunum.js ile aynı: 1 pt = 4/3 px */
const SINIR_BAYT = 750000;                          /* base64 ≤ 1.000.000 karakter (kural sınırı) */
const ADIM = 1.25;                                  /* yakınlaştırma adımı */
const EN_YAKIN = 4;

/* ============================================================== OTURUM */
const ROLLER = ['ik', 'direktor', 'satis_mudur', 'servis_mudur', 'idari_mudur', 'mudur'];
const ROL_ADI = { ik: 'İnsan Kaynakları', direktor: 'Direktör', satis_mudur: 'Satış Müdürü', servis_mudur: 'Servis Müdürü', idari_mudur: 'İdari Müdür', mudur: 'Departman Müdürü' };
const OTURUM = await kimlikBaslat({ uygulama: 'Organizasyon Şeması', roller: ROLLER });
const HESAP = OTURUM.hesap;
const AD = adBasliklari(HESAP.ad || '');
const ANA_ROL = ROLLER.find((r) => HESAP.roller.indexOf(r) >= 0) || '';
const ROL_AD = ROL_ADI[ANA_ROL] || ANA_ROL;
const IK = HESAP.roller.indexOf('ik') >= 0;
const BELGE = doc(db, 'orgSemasi', 'guncel');
acilisMetni('Organizasyon şeması yükleniyor…');

/* ============================================================== DURUM */
let KAYIT = null;      /* kayıtlı şema: { ad, boyut, yukleyen, yukleme, b64 } */
let MODEL = null;      /* kayıtlı şemanın çizim modeli */
let ONIZ = null;       /* İK'nın seçtiği, henüz yüklenmemiş dosya: { model, ad, boyut, b64 } */
let HATA = null;       /* okuma hatası (Firestore) ya da bozuk dosya */
let SIRA = 0;          /* gösterilen sayfa (0'dan) */
let YAKIN = 1;         /* 1 = sayfayı ekrana sığdır; > 1 yakınlaştırılmış */
let OLCEK = 1;         /* uygulanan gerçek ölçek (test ve yüzde göstergesi) */
const gorunen = () => (ONIZ ? ONIZ.model : MODEL);

function b64Yap(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64Coz(t) {
  const s = atob(t), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}
const kb = (n) => O.sayi(Math.max(1, Math.round((n || 0) / 1024))) + ' KB';
function tarihSaat(ts) {
  try {
    const d = ts instanceof Date ? ts : ts && typeof ts.toDate === 'function' ? ts.toDate() : (ts && ts.seconds ? new Date(ts.seconds * 1000) : null);
    if (!d || isNaN(d)) return '';
    return d.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return ''; }
}
const dosyaBasligi = (ad) => O.trBaslik(String(ad || '').replace(/\.pptx$/i, '').replace(/[_]+/g, ' ').trim()) || 'Organizasyon şeması';

async function oku() {
  try {
    const s = await getDoc(BELGE);
    if (s.exists()) {
      const d = s.data();
      if (typeof d.dosya === 'string' && d.dosya) {
        KAYIT = { ad: d.ad || 'Organizasyon Şeması.pptx', boyut: +d.boyut || 0, yukleyen: d.yukleyen || '', yukleme: d.yukleme || null, b64: d.dosya };
        try { MODEL = await pptxOku(b64Coz(d.dosya)); }
        catch (e) { HATA = { bozuk: true, message: e && e.message }; }
      }
    }
  } catch (e) { HATA = e; }
}

/* ============================================================== ÜST BANT */
function ustBantKur() {
  const sag = $('ustSag'); sag.textContent = '';
  const ar = el('div', { class: 'os-araclar' });
  if (IK && !ONIZ) ar.append(el('button', { class: 'btn btn-pirinc', type: 'button', id: 'osSec', title: 'PowerPoint dosyasını (.pptx) seçin; önce önizleme açılır, onaylayınca herkes bu sürümü görür', html: O.ikon('yukle') + '<span class="etk">PowerPoint\'ten yükle</span>', on: { click: () => $('dosyaSec').click() } }));
  if (KAYIT && MODEL && !ONIZ) ar.append(el('button', { class: 'btn', type: 'button', id: 'osIndir', title: 'Şemanın PowerPoint dosyasını indirir', html: O.ikon('indir') + '<span class="etk">İndir</span>', on: { click: indir } }));
  sag.append(ar);
  const bas = AD.split(/\s+/).filter(Boolean);
  sag.append(el('div', { class: 'kisi' }, el('span', { class: 'avatar', text: ((bas[0] || '?')[0] + ((bas[bas.length - 1] || ' ')[0] || '')).toLocaleUpperCase('tr') }),
    el('div', { class: 'kisi-ad' }, el('div', { text: AD }), el('span', { class: 'rozet', text: ROL_AD }))));
  if (window.top === window.self) sag.append(el('button', { class: 'btn btn-koyu', type: 'button', html: O.ikon('cikis') + '<span class="etk">Çıkış</span>', on: { click: () => cikisYap('cikis') } }));
}

/* ============================================================== ÇİZİM */
let CER = null, OLC = null, SAHNE = null, YAN = null;
function ciz() {
  const kok = $('icerik'); kok.textContent = '';
  CER = OLC = SAHNE = YAN = null;
  ustBantKur();
  const m = gorunen();
  if (!m) {
    const pg = el('div', { class: 'pg giris' }); kok.append(pg);
    if (HATA && !HATA.bozuk) O.bosDurum(pg, { ikon: 'uyari', baslik: 'Organizasyon şeması okunamadı', metin: HATA.code === 'permission-denied' ? 'Bu sayfanın güvenlik kuralı henüz yayınlanmamış ya da erişiminiz kaldırılmış olabilir.' : 'Bağlantıyı kontrol edip sayfayı yenileyin.', eylem: { metin: 'Yeniden dene', fn: () => location.reload() } });
    else if (HATA && HATA.bozuk) O.bosDurum(pg, { ikon: 'uyari', baslik: 'Kayıtlı şema dosyası açılamadı', metin: (HATA.message || '') + (IK ? ' Doğru PowerPoint dosyasını yeniden yükleyin.' : ' İK\'ya bildirin.'), eylem: IK ? { metin: 'PowerPoint\'ten yükle', fn: () => $('dosyaSec').click() } : null });
    else if (IK) O.bosDurum(pg, { ikon: 'yukle', baslik: 'Organizasyon şeması henüz yüklenmedi', metin: 'PowerPoint dosyasını (.pptx) seçin. Önce önizleme açılır; sayfaları kontrol edip onayladığınızda portaldaki herkes bu sürümü görür.', eylem: { metin: 'PowerPoint\'ten yükle', fn: () => $('dosyaSec').click() } });
    else O.bosDurum(pg, { ikon: 'dosya', baslik: 'Organizasyon şeması henüz yüklenmedi', metin: 'İnsan Kaynakları şemayı yüklediğinde burada görünecek.' });
    hazir(); return;
  }
  if (SIRA >= m.slaytlar.length) SIRA = m.slaytlar.length - 1;
  if (SIRA < 0) SIRA = 0;

  const ad = ONIZ ? ONIZ.ad : KAYIT.ad;
  const b = el('div', { class: 'os-baslik' }, el('h1', { text: 'Organizasyon Şeması' }), el('span', { class: 'os-baslik-alt', id: 'osDosya', text: dosyaBasligi(ad) + ' · ' + m.slaytlar.length + ' sayfa' }));
  if (!ONIZ && KAYIT) {
    const p = []; const ts = tarihSaat(KAYIT.yukleme); if (ts) p.push('Güncelleme: ' + ts); if (KAYIT.yukleyen) p.push(adBasliklari(KAYIT.yukleyen));
    if (p.length) b.append(el('span', { class: 'os-kaynak', text: p.join(' · ') }));
  }
  kok.append(b);
  if (ONIZ) {
    const bant = el('div', { class: 'os-onizleme', id: 'osOnizleme', role: 'status' },
      el('div', { html: '<b>Önizleme — henüz yüklenmedi.</b> ' + O.esc(ONIZ.ad) + ' · ' + m.slaytlar.length + ' sayfa · ' + kb(ONIZ.boyut) + '. Sayfaları kontrol edin; uygunsa yükleyin. ' + (KAYIT ? 'Yüklenince portaldaki şimdiki şemanın yerini alır.' : 'Yüklenince portaldaki herkes görür.') }),
      el('div', { class: 'alt' },
        el('button', { class: 'btn', type: 'button', id: 'osVazgec', text: 'Vazgeç', on: { click: vazgec } }),
        el('button', { class: 'btn btn-pirinc', type: 'button', id: 'osYukle', html: O.ikon('yukle') + 'Portala yükle', on: { click: kaydet } })));
    kok.append(bant);
  }
  const yer = el('div', { class: 'os-yerlesim' });
  YAN = yanCiz(m);
  SAHNE = el('section', { class: 'os-sahne', id: 'osSahne', 'aria-label': 'Seçili sayfa' });
  yer.append(YAN, SAHNE); kok.append(yer);
  sahneKur(m);
  sayfaGoster(SIRA, true);
  hazir();
}
function hazir() { acilisGizle(); window.__TEST_HAZIR = true; }

/* ---- sol: sayfa listesi (küçük resimli) */
function yanCiz(m) {
  const y = el('nav', { class: 'os-yan', id: 'osYan', 'aria-label': 'Sayfalar' });
  y.append(el('div', { class: 'os-yan-baslik', text: 'Sayfalar · ' + m.slaytlar.length }));
  m.slaytlar.forEach((s, i) => {
    const baslik = s.baslik || ('Sayfa ' + (i + 1));
    const kucuk = el('div', { class: 'os-kucuk' });
    kucuk.style.aspectRatio = m.w + ' / ' + m.h;
    kucuk.append(slaytCiz(s, m));
    const b = el('button', { class: 'os-oge', type: 'button', 'data-sira': String(i), title: (i + 1) + '. sayfa · ' + baslik }, kucuk, el('span', { class: 'os-oge-ad' }, el('b', { text: String(i + 1) }), el('span', { text: baslik })));
    b.addEventListener('click', () => sayfaGoster(i));
    y.append(b);
  });
  return y;
}
function kucukleriOlcekle() {
  const m = gorunen(); if (!m || !YAN) return;
  YAN.querySelectorAll('.os-kucuk').forEach((k) => { const sl = k.firstElementChild; if (sl) sl.style.transform = 'scale(' + (k.clientWidth / (m.w * PX)).toFixed(5) + ')'; });
}

/* ---- sağ: araç çubuğu + sahne */
function sahneKur(m) {
  const tek = m.slaytlar.length < 2;
  const arac = el('div', { class: 'os-arac', role: 'toolbar', 'aria-label': 'Sayfa ve görünüm' },
    el('button', { class: 'os-dugme', type: 'button', id: 'osOnceki', title: 'Önceki sayfa (←)', 'aria-label': 'Önceki sayfa', html: IK_ONCEKI, disabled: tek ? '' : null, on: { click: () => sayfaGoster(SIRA - 1) } }),
    el('span', { class: 'os-sayfa', id: 'osSayfa', 'aria-live': 'polite' }),
    el('button', { class: 'os-dugme', type: 'button', id: 'osSonraki', title: 'Sonraki sayfa (→)', 'aria-label': 'Sonraki sayfa', html: IK_SONRAKI, disabled: tek ? '' : null, on: { click: () => sayfaGoster(SIRA + 1) } }),
    el('span', { class: 'os-ad', id: 'osAd' }),
    el('div', { class: 'os-yakin' },
      el('button', { class: 'os-dugme', type: 'button', id: 'osUzak', title: 'Uzaklaştır (−)', 'aria-label': 'Uzaklaştır', html: IK_EKSI, on: { click: () => yakinlastir(YAKIN / ADIM) } }),
      el('button', { class: 'os-dugme os-yuzde', type: 'button', id: 'osSigdir', title: 'Sayfayı ekrana sığdır (0)', on: { click: () => yakinlastir(1) } }),
      el('button', { class: 'os-dugme', type: 'button', id: 'osYakin', title: 'Yakınlaştır (+)', 'aria-label': 'Yakınlaştır', html: IK_ARTI, on: { click: () => yakinlastir(YAKIN * ADIM) } })));
  if (document.fullscreenEnabled) arac.append(el('button', { class: 'os-dugme', type: 'button', id: 'osTam', title: 'Tam ekran (sunum için)', html: IK_TAM + '<span class="etk">Tam ekran</span>', on: { click: tamEkran } }));
  CER = el('div', { class: 'os-cerceve', id: 'osCerceve', tabindex: '0', 'aria-label': 'Şema sayfası' });
  OLC = el('div', { class: 'os-olcek', id: 'osOlcek' });
  CER.append(OLC);
  SAHNE.append(arac, CER, el('p', { class: 'os-dip', id: 'osDip' }));
  suruklemeBagla();
}

function sayfaGoster(i, ilk) {
  const m = gorunen(); if (!m || !OLC) return;
  i = Math.max(0, Math.min(m.slaytlar.length - 1, i));
  const degisti = i !== SIRA;
  SIRA = i;
  const s = m.slaytlar[i];
  OLC.textContent = '';
  OLC.append(slaytCiz(s, m));
  $('osSayfa').textContent = (i + 1) + ' / ' + m.slaytlar.length;
  $('osAd').textContent = s.baslik || ('Sayfa ' + (i + 1));
  $('osAd').title = s.baslik || '';
  $('osOnceki').disabled = i === 0;
  $('osSonraki').disabled = i === m.slaytlar.length - 1;
  YAN.querySelectorAll('.os-oge').forEach((b) => { if (+b.dataset.sira === i) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const cur = YAN.querySelector('.os-oge[aria-current]');
  if (cur && !ilk) { try { cur.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) { /* eski tarayıcı */ } }
  const dip = $('osDip');
  dip.textContent = '';
  dip.classList.toggle('ipucu', !s.atlanan);
  if (s.atlanan) dip.append(el('span', { class: 'os-uyari', text: 'Bu sayfada portalda gösterilemeyen ' + s.atlanan + ' öğe var (tablo, grafik ya da SmartArt). Tamamını görmek için dosyayı indirip PowerPoint\'te açın.' }));
  else dip.textContent = 'İpucu: ← → tuşlarıyla sayfa değiştirin; yakınlaştırınca sayfayı fareyle sürükleyerek gezebilirsiniz.';
  if (degisti && YAKIN !== 1) YAKIN = 1;
  olcekUygula();
  if (!ONIZ) { try { history.replaceState(null, '', '#s' + (i + 1)); } catch (e) { /* önemsiz */ } }
}

/* Ölçek: sayfa her zaman bütünüyle görünür (genişliğe ve ekranda kalan yüksekliğe sığar); YAKIN > 1 ise kaydırılabilir. */
function olcekUygula() {
  const m = gorunen(); if (!m || !CER || !OLC || !OLC.firstElementChild) return;
  const W = m.w * PX, H = m.h * PX;
  const tam = document.fullscreenElement === SAHNE;
  const cs = getComputedStyle(CER);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight), padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const genislik = CER.clientWidth - padX;
  let yukseklik;
  if (tam) yukseklik = CER.clientHeight - padY;
  else {
    const ust = CER.getBoundingClientRect().top + window.scrollY;
    yukseklik = Math.max(240, window.innerHeight - ust - 26 - padY - ($('osDip') ? $('osDip').offsetHeight + 10 : 0));
  }
  const sig = Math.max(0.05, Math.min(genislik / W, yukseklik / H));
  OLCEK = sig * YAKIN;
  const sw = W * OLCEK, sh = H * OLCEK;
  OLC.style.width = sw.toFixed(1) + 'px';
  OLC.style.height = sh.toFixed(1) + 'px';
  OLC.firstElementChild.style.transform = 'scale(' + OLCEK.toFixed(5) + ')';
  if (!tam) { const h = (H * sig + padY + 2).toFixed(1) + 'px'; if (CER.style.height !== h) CER.style.height = h; }
  CER.classList.toggle('surukle', YAKIN > 1.001);
  const y = $('osSigdir');
  if (y) { y.textContent = '%' + Math.round(OLCEK * 100); y.setAttribute('aria-label', 'Ölçek yüzde ' + Math.round(OLCEK * 100) + ', sığdırmak için tıklayın'); }
  if ($('osUzak')) $('osUzak').disabled = YAKIN <= 1.001;
  if ($('osYakin')) $('osYakin').disabled = YAKIN >= EN_YAKIN - 0.001;
  kucukleriOlcekle();
}
function yakinlastir(z) {
  if (!CER) return;
  z = Math.max(1, Math.min(EN_YAKIN, z));
  if (Math.abs(z - 1) < 0.02) z = 1;
  /* görünen merkez korunur */
  const ox = (CER.scrollLeft + CER.clientWidth / 2) / Math.max(1, CER.scrollWidth), oy = (CER.scrollTop + CER.clientHeight / 2) / Math.max(1, CER.scrollHeight);
  YAKIN = z;
  olcekUygula();
  CER.scrollLeft = ox * CER.scrollWidth - CER.clientWidth / 2;
  CER.scrollTop = oy * CER.scrollHeight - CER.clientHeight / 2;
}
function suruklemeBagla() {
  let s = null;
  CER.addEventListener('pointerdown', (e) => {
    if (YAKIN <= 1.001 || e.button !== 0 || e.pointerType !== 'mouse') return;
    s = { x: e.clientX, y: e.clientY, l: CER.scrollLeft, t: CER.scrollTop, id: e.pointerId };
    try { CER.setPointerCapture(e.pointerId); } catch (x) { /* önemsiz */ }
    CER.classList.add('surukleniyor');
  });
  CER.addEventListener('pointermove', (e) => { if (!s || e.pointerId !== s.id) return; CER.scrollLeft = s.l - (e.clientX - s.x); CER.scrollTop = s.t - (e.clientY - s.y); });
  const bit = () => { s = null; CER.classList.remove('surukleniyor'); };
  CER.addEventListener('pointerup', bit);
  CER.addEventListener('pointercancel', bit);
  CER.addEventListener('dblclick', () => yakinlastir(YAKIN > 1.001 ? 1 : 2));
}
async function tamEkran() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (SAHNE) await SAHNE.requestFullscreen();
  } catch (e) { O.bildirim('Tam ekran açılamadı; sayfayı "Yeni sekmede aç" ile açıp yeniden deneyin.'); }
}
document.addEventListener('fullscreenchange', () => {
  const b = $('osTam');
  if (b) b.innerHTML = (document.fullscreenElement ? IK_KUCUL + '<span class="etk">Küçült</span>' : IK_TAM + '<span class="etk">Tam ekran</span>');
  YAKIN = 1;
  requestAnimationFrame(olcekUygula);
});
window.addEventListener('hashchange', () => {
  const h = /^#s(\d+)$/.exec(location.hash);
  if (h && !ONIZ && gorunen() && +h[1] - 1 !== SIRA) sayfaGoster(+h[1] - 1);
});
new ResizeObserver(() => olcekUygula()).observe(document.documentElement);
window.addEventListener('resize', () => olcekUygula());
document.addEventListener('keydown', (e) => {
  if (!gorunen() || !OLC || e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target; if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  if (document.querySelector('.pr-perde, .perde.acik')) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') { sayfaGoster(SIRA + 1); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { sayfaGoster(SIRA - 1); e.preventDefault(); }
  else if (k === 'Home') { sayfaGoster(0); e.preventDefault(); }
  else if (k === 'End') { sayfaGoster(gorunen().slaytlar.length - 1); e.preventDefault(); }
  else if (k === '+' || k === '=') { yakinlastir(YAKIN * ADIM); e.preventDefault(); }
  else if (k === '-' || k === '_') { yakinlastir(YAKIN / ADIM); e.preventDefault(); }
  else if (k === '0') { yakinlastir(1); e.preventDefault(); }
});

/* ============================================================== YÜKLEME (yalnız İK) */
$('dosyaSec').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f || !IK) return;
  if (!/\.pptx$/i.test(f.name)) { O.bildirim('Yalnız PowerPoint (.pptx) dosyası yüklenebilir. Eski .ppt dosyasını PowerPoint\'te "Farklı Kaydet › PowerPoint Sunusu (.pptx)" ile dönüştürün.'); return; }
  if (f.size > SINIR_BAYT) { O.bildirim('Dosya çok büyük (' + kb(f.size) + '). En fazla 700 KB olabilir; PowerPoint\'te "Resimleri Sıkıştır" ile küçültüp yeniden deneyin.'); return; }
  const dugme = $('osSec'); if (dugme) { dugme.disabled = true; dugme.querySelector('.etk').textContent = 'Okunuyor…'; }
  try {
    const u8 = new Uint8Array(await f.arrayBuffer());
    const model = await pptxOku(u8);
    if (ONIZ) modelBirak(ONIZ.model);
    ONIZ = { model, ad: f.name.slice(0, 200), boyut: f.size, b64: b64Yap(u8) };
    SIRA = 0; YAKIN = 1;
    ciz();
    window.scrollTo(0, 0);
  } catch (err) {
    O.bildirim((err && err.message) || 'Dosya okunamadı.');
    if (dugme) { dugme.disabled = false; dugme.querySelector('.etk').textContent = 'PowerPoint\'ten yükle'; }
  }
});
function vazgec() {
  if (ONIZ) modelBirak(ONIZ.model);
  ONIZ = null; SIRA = 0; YAKIN = 1;
  const h = /^#s(\d+)$/.exec(location.hash); if (h) SIRA = +h[1] - 1;
  ciz();
}
async function kaydet() {
  if (!ONIZ || !IK) return;
  const b = $('osYukle'), v = $('osVazgec');
  b.disabled = true; v.disabled = true; b.textContent = 'Yükleniyor…';
  try {
    /* alanlar kuralla birebir (orgSemaGecerli): yukleyen = hesap adı, yukleme = sunucu saati */
    await setDoc(BELGE, { dosya: ONIZ.b64, ad: ONIZ.ad, boyut: ONIZ.boyut, yukleyen: HESAP.ad || '', yukleme: serverTimestamp() });
    if (MODEL) modelBirak(MODEL);
    MODEL = ONIZ.model;
    KAYIT = { ad: ONIZ.ad, boyut: ONIZ.boyut, yukleyen: HESAP.ad || '', yukleme: new Date(), b64: ONIZ.b64 };
    ONIZ = null; HATA = null; SIRA = 0; YAKIN = 1;
    ciz();
    O.bildirim('Organizasyon şeması güncellendi. Portalı açan herkes bu sürümü görür.');
  } catch (e) {
    b.disabled = false; v.disabled = false; b.innerHTML = O.ikon('yukle') + 'Portala yükle';
    O.bildirim(e && e.code === 'permission-denied' ? 'Yükleme reddedildi: güvenlik kuralı henüz yayınlanmamış olabilir.' : 'Yüklenemedi; bağlantıyı kontrol edip yeniden deneyin.');
  }
}
function indir() {
  if (!KAYIT) return;
  const blob = new Blob([b64Coz(KAYIT.b64)], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = KAYIT.ad;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  O.bildirim('İndirildi: ' + KAYIT.ad + ' (İndirilenler klasörü)');
}

/* ============================================================== TEST KANCASI (yalnız okuma) */
window.__org = {
  durum: () => ({ ik: IK, kayit: KAYIT ? { ad: KAYIT.ad, boyut: KAYIT.boyut, yukleyen: KAYIT.yukleyen } : null, onizleme: !!ONIZ, sira: SIRA, yakin: YAKIN, olcek: OLCEK, sayfa: gorunen() ? gorunen().slaytlar.length : 0, hata: HATA ? (HATA.code || (HATA.bozuk ? 'bozuk' : 'hata')) : null }),
  model: () => gorunen()
};

/* ============================================================== BAŞLAT */
await oku();
{ const h = /^#s(\d+)$/.exec(location.hash); if (h) SIRA = +h[1] - 1; }
ciz();
