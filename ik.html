<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İnciroğlu İK · Personel Yönetim Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#132a44; --navy-2:#1c3d5f; --navy-900:#0c1c2e;
  --brass:#c9a227; --brass-2:#e0be4f;
  --page:#f1f4f7; --surface:#ffffff; --ink:#0e1b28; --ink-2:#52606b; --muted:#8a929b;
  --line:#e0e5ea; --line-2:#d5dbe1; --ok:#1b8a4b; --ok-bg:#eaf7ef; --bad:#c0392b; --bad-bg:#fbeceb;
  --warn:#b26a00; --warn-bg:#fff4e0; --blue:#2563eb; --blue-bg:#eef2fb;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
  --sb:244px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--page);color:var(--ink);line-height:1.5}
.hidden{display:none!important}
button{font-family:var(--font);cursor:pointer}
a{color:var(--navy-2);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cdd4db;border-radius:8px;border:2px solid var(--page)}
.sb{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.sb .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.sb .brand .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--navy-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;font-family:var(--serif)}
.sb .brand b{font-family:var(--serif);font-size:15px;color:var(--navy);line-height:1.15;font-weight:700}
.sb .brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:1px}
.sb nav{flex:1;overflow:auto;padding:8px 10px}
.sb .nav-sec{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.sb a.item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--ink-2);font-size:13.5px;font-weight:500;margin-bottom:1px}
.sb a.item:hover{background:var(--page);color:var(--navy)}
.sb a.item.on{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;font-weight:600;box-shadow:0 8px 18px -10px rgba(19,42,68,.8)}
.sb a.item svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sb a.item .cnt{margin-left:auto;font-size:10px;font-weight:700;background:#eef1f4;color:var(--ink-2);border-radius:20px;padding:1px 8px}
.sb a.item.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.sb .foot{padding:10px;border-top:1px solid var(--line)}
.sb .who{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px}
.sb .who .av{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brass),var(--brass-2));color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sb .who b{display:block;font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.15}.sb .who small{display:block;font-size:10.5px;color:var(--muted)}
.sb .lo{margin-top:4px;width:100%;text-align:left;background:none;border:none;color:var(--muted);font-size:12px;padding:7px 10px;border-radius:8px}
.sb .lo:hover{background:var(--bad-bg);color:var(--bad)}
.main{margin-left:var(--sb);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:60px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:20}
.topbar h1{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--navy)}
.topbar .sp{flex:1}
.gsearch{position:relative;width:min(300px,30vw)}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line-2);border-radius:9px;font-size:13px;outline:none;background:var(--page)}
.gsearch input:focus{border-color:var(--navy-2);background:#fff;box-shadow:0 0 0 3px rgba(28,61,95,.1)}
.gsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.content{flex:1;padding:24px 26px 70px;max-width:1380px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px}.pad{padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--brass),var(--brass-2))}
.kpi .ic{width:36px;height:36px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.kpi .ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9}
.kpi .n{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--navy);line-height:1}
.kpi .l{font-size:11.5px;color:var(--ink-2);margin-top:5px;font-weight:600}
.kpi.warn .n{color:var(--warn)}.kpi.warn .ic{background:var(--warn)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sec-h h2{font-family:var(--serif);font-size:16.5px;font-weight:700;color:var(--navy)}.sec-h .mini{font-size:12px;color:var(--muted)}
.btn{border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy-2));box-shadow:0 8px 18px -12px rgba(19,42,68,.8);display:inline-flex;align-items:center;gap:7px}
.btn:hover{filter:brightness(1.1)}.btn.g{background:#fff;color:var(--navy);border:1px solid var(--line-2);box-shadow:none}.btn.sm{padding:7px 12px;font-size:12px}
.btn.ok{background:linear-gradient(135deg,#1b8a4b,#15713d)}.btn.bad{background:linear-gradient(135deg,#b23a2b,#c0392b)}.btn.warn{background:linear-gradient(135deg,#b26a00,#946100)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:7px 12px;border:1px solid var(--line-2);border-radius:9px;background:#fff;cursor:pointer;user-select:none}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap;background:#eef2f6;color:var(--navy-2);border:1px solid #dce6f0}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:#c7e8d4}.b-bad{background:var(--bad-bg);color:var(--bad);border-color:#f0cdc8}
.b-bol{background:#eef7f0;color:#1b6b3a;border-color:#cfe8d6}.b-warn{background:var(--warn-bg);color:var(--warn);border-color:#e9c48f}.b-gray{background:#f0f1f4;color:#6b7280;border-color:#e2e5ea}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line-2);border-radius:9px;font-size:14px;outline:none}
.search input:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(28,61,95,.1)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.sel{padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;font-size:13px;background:#fff;outline:none}
.empcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:14px}
.ec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:transform .16s,box-shadow .18s,border-color .16s}
.ec:hover{transform:translateY(-3px);box-shadow:0 16px 34px -20px rgba(15,26,32,.5);border-color:#cdd6df}
.ec .av{width:60px;height:60px;border-radius:14px;margin:0 auto 11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;font-family:var(--serif)}
.ec .nm{font-weight:600;color:var(--navy);font-size:13.5px;line-height:1.2}.ec .de{font-size:11.5px;color:var(--ink-2);margin-top:3px}.ec .em{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
table.tbl thead th{background:#f6f8fa;text-align:left;padding:11px 14px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
table.tbl thead th.srt{cursor:pointer}
table.tbl tbody td{padding:10px 14px;border-bottom:1px solid #eef1f4;vertical-align:middle}
table.tbl tbody tr.clk{cursor:pointer}table.tbl tbody tr.clk:hover{background:#f8fafc}
.ar{opacity:.5;font-size:10px;margin-left:3px}.mini{font-size:11.5px;color:var(--muted)}
.empty{padding:46px;text-align:center;color:var(--muted);font-size:14px}
.subtabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtab{border:none;background:none;padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--ink-2);border-bottom:2.5px solid transparent;white-space:nowrap}
.subtab.on{color:var(--navy);border-bottom-color:var(--brass)}
.pf-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.pf-av{width:82px;height:82px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:29px;color:#fff;font-family:var(--serif);flex:none}
.pf-head h2{font-family:var(--serif);font-size:23px;color:var(--navy);font-weight:700}.pf-head .sub{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin:18px 0 0;overflow-x:auto}
.tab{border:none;background:none;padding:11px 15px;font-size:13.5px;font-weight:600;color:var(--ink-2);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--brass)}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px 28px}
.fld-v .k{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.fld-v .v{font-size:14px;color:var(--ink);font-weight:500;word-break:break-word}.fld-v .v.em{color:var(--muted);font-style:italic;font-weight:400}
.grp{margin-bottom:18px}.grp>.gh{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brass);margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.ba-wrap{height:9px;background:#eceff3;border-radius:6px;overflow:hidden;margin:7px 0}
.ba-wrap i{display:block;height:100%}
.ovl{position:fixed;inset:0;background:rgba(12,28,46,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
.ovl.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.modal.wide{width:min(820px,100%)}
.modal .mh{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}
.modal .mh h3{font-family:var(--serif);font-size:19px;color:var(--navy)}.modal .mx{background:none;border:none;font-size:22px;color:var(--muted)}
.modal .mb{padding:18px 22px}.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.f{margin-bottom:12px}.f.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f label{display:block;font-size:11px;font-weight:700;color:var(--ink-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.f input,.f select,.f textarea{width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;font-size:14px;font-family:var(--font);outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(28,61,95,.1)}
.f .chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}.f .chk input{width:auto}
.menu{position:absolute;z-index:80;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 36px -12px rgba(0,0,0,.35);padding:5px;min-width:200px}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 11px;font-size:13px;color:var(--ink);border-radius:7px}
.menu button:hover{background:#f1f4f8}.menu button.dng{color:var(--bad)}.menu button.dng:hover{background:var(--bad-bg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px}
.cal .dc{min-height:92px;border:1px solid var(--line);border-radius:9px;padding:5px 6px;background:#fff;font-size:11px}
.cal .dc.off{background:#fafbfc;color:var(--muted)}.cal .dc .dn{font-weight:700;color:var(--ink-2);font-size:12px;margin-bottom:3px}
.cal .ev{font-size:10px;border-radius:5px;padding:1px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.rep-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.rc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:transform .15s,box-shadow .18s}
.rc:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(15,26,32,.5)}
.rc .ic{width:40px;height:40px;border-radius:10px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.rc .ic svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:1.8}
.rc h3{font-size:14px;color:var(--navy);font-weight:700;margin-bottom:4px}.rc p{font-size:12px;color:var(--ink-2)}
.pz{overflow:auto}.pz table{border-collapse:collapse;font-size:12px;white-space:nowrap}
.pz th,.pz td{border:1px solid var(--line);padding:5px 7px;text-align:center}.pz th{background:#f6f8fa;position:sticky;top:0}
.pz td.nm{text-align:left;font-weight:600;color:var(--navy);position:sticky;left:0;background:#fff;min-width:160px}
.pz .cell{cursor:pointer;min-width:30px}.pz .c-C{background:#eaf7ef;color:#15713d}.pz .c-I{background:#eef2fb;color:#2563eb}.pz .c-T{background:#fff4e0;color:#b26a00}.pz .c-R{background:#f6ecfb;color:#8e44ad}.pz .c-Y{background:#fff;color:#cbd2da}
.tag{display:inline-block;font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;background:#eef1f4;color:var(--ink-2)}
.gate{max-width:460px;margin:90px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px;text-align:center}
.gate h2{font-family:var(--serif);color:var(--navy);margin-bottom:8px}.gate p{color:var(--ink-2);font-size:14px;margin-bottom:16px}
@media(max-width:860px){ :root{--sb:0px} .sb{transform:translateX(-100%)} .main{margin-left:0} .f.two,.f.three{grid-template-columns:1fr} }
</style>
</head>

<div id="gate" class="gate hidden"><h2 id="gateH">Oturum bulunamadı</h2><p id="gateP">Bu sisteme İK Portalı üzerinden giriş yaparak ulaşabilirsiniz.</p><a class="btn" href="portal.html">İK Portalı'na git →</a></div>

<aside class="sb" id="sb">
  <div class="brand"><div class="mk">İH</div><div><b>İnciroğlu İK</b><small>Personel Yönetim Sistemi</small></div></div>
  <nav id="nav"></nav>
  <div class="foot"><div class="who"><div class="av" id="meAv">İK</div><div><b id="meAd">İnsan Kaynakları</b><small id="meRol">İK / Tam Yetki</small></div></div>
  <button class="lo" id="logout">← Portala dön</button></div>
</aside>

<div class="main" id="appMain">
  <div class="topbar"><div><h1 id="pgTitle">Ana Sayfa</h1></div><div class="sp"></div>
    <div class="gsearch" id="gsWrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="gq" placeholder="Çalışan ara…"></div></div>

<script src="mr_data.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ===== OTURUM (yalnız İK) ===== */
function trLower(s){return String(s||'').replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase();}
function trTitle(s){return trLower(s).split(/\s+/).map(w=>{if(!w)return w;const f=w.charAt(0);const up=(f==='i')?'İ':(f==='ı'?'I':f.toLocaleUpperCase('tr'));return up+w.slice(1);}).join(' ');}
let SES=null; try{ SES=JSON.parse(localStorage.getItem('inc_portal_sso')||'null'); }catch(e){}
const IS_IK=!!(SES&&(SES.rol==='ik'||SES.u==='ik123'));
if(!SES||!SES.ok||!IS_IK){
  const g=document.getElementById('gate'); g.classList.remove('hidden');
  document.getElementById('sb').style.display='none'; document.getElementById('appMain').style.display='none';
  if(SES&&SES.ok&&!IS_IK){ document.getElementById('gateH').textContent='Erişim yetkiniz yok'; document.getElementById('gateP').textContent='Bu sistem yalnızca İnsan Kaynakları erişimine açıktır.'; }
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function nkey(s){return trLower(s).replace(/\s+/g,' ').trim();}
function dkey(s){const m=String(s||'').match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);if(!m)return 0;return (+m[3])*10000+(+m[2])*100+(+m[1]);}
function dObj(s){const m=String(s||'').match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);if(!m)return null;const d=new Date(+m[3],+m[2]-1,+m[1]);return isNaN(d)?null:d;}
function uid(p){return (p||'p')+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function trFromISO(s){try{const[y,m,d]=s.split('-');return d+'.'+m+'.'+y;}catch(e){return s;}}
function isoFromTR(s){const m=String(s).match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);if(!m)return '';return m[3].padStart(4,'20')+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
const AVC=['#2f6fed','#1b8a4b','#b26a00','#8e44ad','#c0392b','#0d9488','#4f46e5','#be123c','#0369a1','#7c3aa6','#ca8a04'];
function avColor(s){let h=0;for(const c of String(s)){h=(h*31+c.charCodeAt(0))>>>0;}return AVC[h%AVC.length];}
function initials(ad){const p=String(ad||'').trim().split(/\s+/);return ((p[0]||'?').charAt(0)+((p[p.length-1]||' ').charAt(0))).toLocaleUpperCase('tr');}
function kidemYil(giris){const d=dObj(giris);if(!d)return 0;return (new Date()-d)/(1000*3600*24*365.25);}
function calismaSuresi(giris){const y=kidemYil(giris);if(!y)return '—';const yil=Math.floor(y);const ay=Math.floor((y-yil)*12);return (yil>0?yil+' yıl ':'')+(ay>0?ay+' ay':'')||'<1 ay';}
function allEmp(){return AKTIF.concat(AYRILAN);}
function empById(id){return AKTIF.find(x=>x.id===id)||AYRILAN.find(x=>x.id===id);}
function empAktifMi(id){return !!AKTIF.find(x=>x.id===id);}
function buYil(){return new Date().getFullYear();}
function yilEq(d,yy){const k=dkey(d);return !!k&&Math.floor(k/10000)===yy;}
function ayrilanBuYil(){return AYRILAN.filter(p=>yilEq(p.cikis,buYil())).length;}
function girenBuYil(){return allEmp().filter(p=>yilEq(p.giris,buYil())).length;}

/* AYAR varsayılanları */
function ensureAyar(){
  const deps=[...new Set(allEmp().map(p=>p.departman).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
  const bols=[...new Set(allEmp().map(p=>p.bolum).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
  const unv=[...new Set(allEmp().map(p=>p.unvan).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
  const d=AYAR||{};
  return {
    departmanlar:(d.departmanlar&&d.departmanlar.length)?d.departmanlar:deps,
    bolumler:(d.bolumler&&d.bolumler.length)?d.bolumler:bols,
    unvanlar:(d.unvanlar&&d.unvanlar.length)?d.unvanlar:unv,
    izinTurleri:(d.izinTurleri&&d.izinTurleri.length)?d.izinTurleri:['Yıllık İzin','Ücretsiz İzin','Rapor (İstirahat)','Mazeret İzni','Doğum İzni','Evlilik İzni','Ölüm İzni','İdari İzin'],
    harcamaTurleri:(d.harcamaTurleri&&d.harcamaTurleri.length)?d.harcamaTurleri:['Yol','Yemek','Konaklama','Akaryakıt','Ofis/Kırtasiye','Temsil/Ağırlama','Diğer'],
    yillikKural:(d.yillikKural&&d.yillikKural.length)?d.yillikKural:[{min:0,max:5,gun:14},{min:5,max:15,gun:20},{min:15,max:99,gun:26}]
  };
}
function yillikHak(giris){const k=ensureAyar().yillikKural;const y=kidemYil(giris);for(const r of k){if(y>=r.min&&y<r.max)return r.gun;}return k.length?k[k.length-1].gun:14;}
function izinKullanilan(empId){return IZIN.filter(z=>z.empId===empId&&z.durum==='onaylandi'&&/yıllık/i.test(z.tur)).reduce((s,z)=>s+(+z.gun||0),0);}
function izinBakiye(emp){const hak=yillikHak(emp.giris);return {hak,kullanilan:izinKullanilan(emp.id),kalan:hak-izinKullanilan(emp.id)};}

/* ===== BOOT ===== */
function sub(ref,cb){ onSnapshot(ref,s=>{cb(s.exists()?s.data():null);},e=>console.error(e)); }
let ready=0;
function boot(){
  bindGlobal();
  sub(refPers,d=>{ if(d&&(Array.isArray(d.aktif)||Array.isArray(d.ayrilan))){AKTIF=d.aktif||[];AYRILAN=d.ayrilan||[];} else {AKTIF=SEED_AKTIF.slice();AYRILAN=SEED_AYRILAN.slice();setDoc(refPers,{aktif:AKTIF,ayrilan:AYRILAN,guncelleme:new Date().toISOString(),_init:true},{merge:true}).catch(()=>{});} ready=1; render(); });
  sub(refIzin,d=>{ IZIN=(d&&Array.isArray(d.izinler))?d.izinler:[]; if(ready)render(); });
  sub(refHarc,d=>{ HARC=(d&&Array.isArray(d.harcamalar))?d.harcamalar:[]; if(ready)render(); });
  sub(refPuan,d=>{ PUAN=(d&&d.veri)?d.veri:{}; if(ready)render(); });
  sub(refAyar,d=>{ AYAR=d||null; if(ready)render(); });
  sub(refTalep,d=>{ TALEP=(d&&Array.isArray(d.talepler))?d.talepler:[]; if(ready)render(); });
}

function depDagilim(){const o={};AKTIF.forEach(p=>{const d=p.departman||'—';o[d]=(o[d]||0)+1;});return Object.entries(o).sort((a,b)=>b[1]-a[1]);}
function bolDagilim(){const o={};AKTIF.forEach(p=>{const d=p.bolum||'—';o[d]=(o[d]||0)+1;});return Object.entries(o).sort((a,b)=>b[1]-a[1]);}
function yaklasanIzin(){const bugun=new Date();bugun.setHours(0,0,0,0);const son=new Date(bugun);son.setDate(son.getDate()+30);return IZIN.filter(z=>z.durum==='onaylandi').map(z=>({z,d:dObj(z.baslangic)})).filter(x=>x.d&&x.d>=bugun&&x.d<=son).sort((a,b)=>a.d-b.d).slice(0,8);}

    +'<div class="kpis">'
    +kpi('<circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>',AKTIF.length,'Aktif Çalışan')
    +kpi('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',ayrilanBuYil(),'İşten Ayrılan ('+buYil()+')')

function listesi(){return ST.durum==='aktif'?AKTIF:AYRILAN;}
function filtreli(){
  const q=nkey(ST.q);
  let L=listesi().filter(p=>(!q||nkey(p.ad).indexOf(q)>=0)&&(!ST.dep||p.departman===ST.dep)&&(!ST.bol||p.bolum===ST.bol));
  const c=ST.sortCol,d=ST.sortDir;
  return L.slice().sort((a,b)=>{let r;if(c==='giris'||c==='cikis')r=dkey(a[c])-dkey(b[c]);else r=String(a[c]||'').localeCompare(String(b[c]||''),'tr');return r*d;});
}

    +'<div class="card" style="overflow:auto"><table class="tbl"><thead><tr><th>Ad Soyad</th><th>Başlangıç</th><th>Bitiş</th><th>Gün</th><th>Tür</th><th>Açıklama</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>'

/* ===== TAKVİM ===== */
function viewTakvim(){
  const [Y,M]=ST.pzAy.split('-').map(Number);
  const first=new Date(Y,M-1,1); let start=(first.getDay()+6)%7; const gun=ayGunSayi(ST.pzAy);
  const izinGun={}; IZIN.filter(z=>z.durum==='onaylandi').forEach(z=>{let a=dObj(z.baslangic),b=dObj(z.bitis);if(!a||!b)return;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){if(d.getFullYear()===Y&&d.getMonth()===M-1){(izinGun[d.getDate()]=izinGun[d.getDate()]||[]).push(z);}}});
  const dh=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  let cells='';for(let i=0;i<start;i++)cells+='<div class="dc off"></div>';
  for(let d=1;d<=gun;d++){const evs=(izinGun[d]||[]).slice(0,4).map(z=>'<div class="ev" style="background:'+(/ücretsiz/i.test(z.tur)?'#b26a00':/rapor/i.test(z.tur)?'#8e44ad':'#1b8a4b')+'">'+esc(trTitle(z.empAd.split(' ')[0]))+' · '+esc(z.tur.split(' ')[0])+'</div>').join('');const extra=(izinGun[d]||[]).length>4?'<div class="mini">+'+((izinGun[d].length)-4)+' daha</div>':'';cells+='<div class="dc"><div class="dn">'+d+'</div>'+evs+extra+'</div>';}
  return '<div class="toolbar"><button class="btn g sm" id="ayGeri">←</button><div style="font-family:var(--serif);font-size:18px;font-weight:700;color:var(--navy);min-width:150px;text-align:center">'+ayAd(ST.pzAy)+'</div><button class="btn g sm" id="ayIleri">→</button><div style="flex:1"></div><span class="badge b-ok">Yıllık</span><span class="badge b-warn">Ücretsiz</span><span class="badge" style="background:#f6ecfb;color:#8e44ad;border-color:#e3d0f2">Rapor</span></div>'
    +'<div class="card pad"><div class="cal">'+dh.map(d=>'<div class="dh">'+d+'</div>').join('')+cells+'</div></div>';
}

/* ===== PUANTAJ ===== */
function ayGunSayi(ym){const [Y,M]=ym.split('-').map(Number);return new Date(Y,M,0).getDate();}
function ayAd(ym){const [Y,M]=ym.split('-').map(Number);return new Date(Y,M-1,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'}).replace(/^\w/,c=>c.toLocaleUpperCase('tr'));}
const PZ_NEXT={'Y':'C','C':'I','I':'T','T':'R','R':'Y'}; const PZ_AD={C:'Çalıştı',I:'İzinli',T:'Tatil',R:'Rapor',Y:'—'};
function puanIzinUygula(){ // onaylı izinleri puantaja yansıt (sadece boş hücreler)
  const [Y,M]=ST.pzAy.split('-').map(Number); const av=PUAN[ST.pzAy]=PUAN[ST.pzAy]||{};
  IZIN.filter(z=>z.durum==='onaylandi').forEach(z=>{let a=dObj(z.baslangic),b=dObj(z.bitis);if(!a||!b)return;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){if(d.getFullYear()===Y&&d.getMonth()===M-1){const row=av[z.empId]=av[z.empId]||{};const dd=d.getDate();if(!row[dd]||row[dd]==='Y')row[dd]=/rapor/i.test(z.tur)?'R':'I';}}});
}
function viewPuantaj(){
  puanIzinUygula();
  const gun=ayGunSayi(ST.pzAy); const [Y,M]=ST.pzAy.split('-').map(Number);
  const emps=AKTIF.slice().sort((a,b)=>String(a.ad).localeCompare(String(b.ad),'tr'));
  const av=PUAN[ST.pzAy]||{};
  let head='<tr><th class="nm" style="text-align:left">Çalışan</th>';for(let d=1;d<=gun;d++){const wd=(new Date(Y,M-1,d).getDay());const we=(wd===0||wd===6);head+='<th'+(we?' style="background:#eef1f4"':'')+'>'+d+'</th>';}head+='<th>Top.</th></tr>';

function raporData(id){
  if(id==='calisan') return {baslik:'Mevcut Çalışan Listesi',cols:['Ad Soyad','Departman','Bölüm','Unvan','İşe Giriş'],rows:AKTIF.map(p=>[trTitle(p.ad),p.departman,p.bolum,p.unvan,p.giris])};
  if(id==='ayrilan') return {baslik:'İşten Ayrılan Çalışanlar',cols:['Ad Soyad','TC','Departman','Bölüm','Unvan','İşe Giriş','İşten Çıkış','Ayrılma Nedeni','Çalışma Süresi'],rows:AYRILAN.map(p=>[trTitle(p.ad),p.tc,p.departman,p.bolum,p.unvan,p.giris,p.cikis,p.ayrilmaNedeni,p.calismaSuresi])};
  if(id==='izinbakiye') return {baslik:'İzin Bakiye Raporu',cols:['Ad Soyad','Departman','Kıdem','Hak Edilen','Kullanılan','Kalan'],rows:AKTIF.map(p=>{const b=izinBakiye(p);return [trTitle(p.ad),p.departman,calismaSuresi(p.giris),b.hak,b.kullanilan,b.kalan];})};
  if(id==='izinkullanim') return {baslik:'Kullanılan İzin Raporu',cols:['Ad Soyad','Tür','Başlangıç','Bitiş','Gün','Durum'],rows:IZIN.filter(z=>z.durum==='onaylandi').map(z=>[trTitle(z.empAd),z.tur,z.baslangic,z.bitis,z.gun,'Onaylandı'])};
  if(id==='departman'){const d=depDagilim();return {baslik:'Departman Dağılımı',cols:['Departman','Çalışan Sayısı','Oran %'],rows:d.map(([k,v])=>[k,v,Math.round(v/AKTIF.length*100)])};}
  if(id==='maas') return {baslik:'Maaş Bilgileri',cols:['Ad Soyad','Departman','Unvan','Maaş','Periyot','Net/Brüt'],rows:AKTIF.filter(p=>p.maas).map(p=>[trTitle(p.ad),p.departman,p.unvan,p.maas+' '+(p.maasBirim||'TL'),p.maasPeriyot||'Aylık',p.netBrut||''])};
  if(id==='harcama') return {baslik:'Harcama Raporu',cols:['Ad Soyad','Tür','Tutar','Tarih','Durum'],rows:HARC.map(h=>[trTitle(h.empAd),h.tur,h.tutar,h.tarih,h.durum==='onaylandi'?'Onaylandı':h.durum==='reddedildi'?'Reddedildi':'Bekliyor'])};
  if(id==='turnover'){
    const y=buYil();
    const girisBuYil=girenBuYil();
    const cikisBuYil=ayrilanBuYil();
    const donemSonu=AKTIF.length;
    const donemBasi=Math.max(0,donemSonu-girisBuYil+cikisBuYil);
    const ort=(donemBasi+donemSonu)/2;
    const oran=ort?((cikisBuYil/ort)*100).toFixed(1):0;
    return {baslik:'Turnover (Dönüşüm) Raporu — '+y,cols:['Gösterge','Değer'],rows:[['Aktif çalışan (dönem sonu)',donemSonu],['Dönem başı mevcut (tahmini)',donemBasi],['Bu yıl işe giren',girisBuYil],['Bu yıl işten ayrılan',cikisBuYil],['Dönem ortalama çalışan',Math.round(ort)],['Turnover oranı (%)',oran]]};
  }
  return {baslik:'—',cols:[],rows:[]};
}
function renderRapor(id){
  const d=raporData(id);
  const html='<div class="card pad"><div class="sec-h"><h2>'+esc(d.baslik)+' <span class="mini">('+d.rows.length+' kayıt)</span></h2><button class="btn sm" id="rapCsv">⬇ Excel indir</button></div>'

  const body=d.rows.map(r=>'<tr>'+r.map(c=>'<td>'+h(c)+'</td>').join('')+'</tr>').join('');
  const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'
    +'<style>table{border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:11pt}'
    +'caption{font-size:14pt;font-weight:bold;color:#132a44;text-align:left;padding:8px 0;mso-number-format:"\\@"}'
    +'th{background:#132a44;color:#ffffff;font-weight:bold;border:1px solid #0c1c2e;padding:7px 12px;text-align:left;white-space:nowrap}'
    +'td{border:1px solid #d5dbe1;padding:5px 11px;vertical-align:top;mso-number-format:"\\@"}'
    +'tr:nth-child(even) td{background:#f6f8fa}</style></head><body>'
    +'<table><caption>'+h(d.baslik)+' — İnciroğlu Otomotiv ('+new Date().toLocaleDateString('tr-TR')+')</caption><thead>'+head+'</thead><tbody>'+body+'</tbody></table></body></html>';
  const blob=new Blob(['﻿'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(d.baslik.replace(/[^\wğüşıöçĞÜŞİÖÇ ]/g,'').trim()||'rapor')+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);

    document.querySelectorAll('[data-tlred]').forEach(b=>b.onclick=()=>talepDurum(b.getAttribute('data-tlred'),'reddedildi'));
  }
  if(r.page==='takvim'||r.page==='puantaj'){

    if(r.page==='puantaj') document.querySelectorAll('.pz .cell').forEach(c=>c.onclick=async()=>{const e=c.getAttribute('data-emp'),d=c.getAttribute('data-gun');const av=PUAN[ST.pzAy]=PUAN[ST.pzAy]||{};const row=av[e]=av[e]||{};row[d]=PZ_NEXT[row[d]||'Y'];await kaydetPuan();});
  }
  if(r.page==='harcamalar'){
    document.getElementById('btnHarc').onclick=()=>openHarc();
    document.querySelectorAll('[data-hconay]').forEach(b=>b.onclick=()=>hcDurum(b.getAttribute('data-hconay'),'onaylandi'));
    document.querySelectorAll('[data-hcred]').forEach(b=>b.onclick=()=>hcDurum(b.getAttribute('data-hcred'),'reddedildi'));
    document.querySelectorAll('[data-hcode]').forEach(b=>b.onclick=()=>hcOdendi(b.getAttribute('data-hcode')));
    document.querySelectorAll('[data-hcsil]').forEach(b=>b.onclick=()=>hcSil(b.getAttribute('data-hcsil')));

    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>ayarSil(b.getAttribute('data-del')));
  }
}
function ayKaydir(ym,n){let[Y,M]=ym.split('-').map(Number);M+=n;while(M<1){M+=12;Y--;}while(M>12){M-=12;Y++;}return Y+'-'+String(M).padStart(2,'0');}

function bindRows(){document.querySelectorAll('.ec[data-id]').forEach(c=>c.onclick=()=>{pfTab='profil';go('calisan/'+c.getAttribute('data-id'));});document.querySelectorAll('tr.clk[data-id]').forEach(tr=>tr.onclick=()=>{pfTab='profil';go('calisan/'+tr.getAttribute('data-id'));});document.querySelectorAll('thead th.srt[data-sort]').forEach(h=>h.onclick=()=>{const c=h.getAttribute('data-sort');if(ST.sortCol===c)ST.sortDir*=-1;else{ST.sortCol=c;ST.sortDir=1;}render();});}

  const data={ad:ad.toLocaleUpperCase('tr'),tc:v('eTc'),dogum:dog?trFromISO(dog):'',cinsiyet:v('eCins'),medeni:v('eMedeni'),uyruk:v('eUyruk'),cocuk:v('eCocuk'),
    departman:v('eDep'),bolum:v('eBol'),unvan:v('eUnvan'),giris:g?trFromISO(g):'',sozlesmeTuru:v('eSozl'),calismaSekli:v('eCalis'),mudurluk:v('eMud'),direktor:v('eDir'),yonetici:v('eYon'),
    epostaIs:v('eEpIs'),epostaKisisel:v('eEpKis'),telefonIs:v('eTelIs'),telefonKisisel:v('eTelKis'),sehir:v('eSehir'),banka:v('eBanka'),adres:v('eAdres'),iban:v('eIban'),
    maas:v('eMaas'),maasPeriyot:v('eMaasP'),netBrut:v('eNetB')};
  if(editId){const arr=empAktifMi(editId)?AKTIF:AYRILAN;const pp=arr.find(x=>x.id===editId);Object.assign(pp,data);}
  else AKTIF=AKTIF.concat([Object.assign({id:uid()},data)]);
  await kaydetPers(); closeModals();
}

/* ===== İZİN FORM ===== */
let izEmpFix=null;
function openIzin(empId){
  izEmpFix=empId||null; const a=ensureAyar();
  const emps=AKTIF.slice().sort((x,y)=>String(x.ad).localeCompare(String(y.ad),'tr'));
  const opt=emps.map(e=>'<option value="'+e.id+'"'+(empId===e.id?' selected':'')+'>'+esc(trTitle(e.ad))+'</option>').join('');
  document.getElementById('izinBody').innerHTML=
    '<div class="f"><label>Çalışan</label><select id="izEmp"'+(empId?' disabled':'')+'><option value=""></option>'+opt+'</select></div>'
    +'<div class="f two"><div><label>İzin Türü</label><select id="izTur">'+a.izinTurleri.map(t=>'<option'+(/yıllık/i.test(t)?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div><div><label>Gün</label><input id="izGun" type="number" min="0" step="0.5" value="1"></div></div>'
    +'<div class="f two"><div><label>Başlangıç</label><input id="izBas" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div><label>Bitiş</label><input id="izBit" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div></div>'
    +'<div class="f"><label>Açıklama</label><textarea id="izAcik" rows="2" placeholder="Opsiyonel"></textarea></div>'
    +'<div class="f"><label>Yerine Bakacak Kişi (ops.)</label><input id="izYerine"></div>'
    +'<div class="f"><label class="chk"><input type="checkbox" id="izOnayli" checked> Onaylı olarak ekle</label></div>';
  document.getElementById('izinOvl').classList.add('on');
  const bas=document.getElementById('izBas'),bit=document.getElementById('izBit'),gun=document.getElementById('izGun');
  const calc=()=>{const a=new Date(bas.value),b=new Date(bit.value);if(!isNaN(a)&&!isNaN(b)&&b>=a){gun.value=Math.round((b-a)/(1000*3600*24))+1;}};
  bas.onchange=calc; bit.onchange=calc;
}
async function saveIzin(){
  const empId=izEmpFix||v('izEmp'); if(!empId){alert('Çalışan seçin.');return;}
  const emp=empById(empId); const bas=v('izBas'),bit=v('izBit');
  const rec={id:uid('z'),empId,empAd:emp?emp.ad:'',tur:v('izTur'),gun:+v('izGun')||0,baslangic:bas?trFromISO(bas):'',bitis:bit?trFromISO(bit):'',aciklama:v('izAcik'),yerine:v('izYerine'),durum:document.getElementById('izOnayli').checked?'onaylandi':'bekliyor',olusturma:new Date().toISOString()};
  IZIN=IZIN.concat([rec]); await kaydetIzin(); closeModals();
}
function bindIzinActions(){
  document.querySelectorAll('[data-izonay]').forEach(b=>b.onclick=()=>izDurum(b.getAttribute('data-izonay'),'onaylandi'));
  document.querySelectorAll('[data-izred]').forEach(b=>b.onclick=()=>izDurum(b.getAttribute('data-izred'),'reddedildi'));
  document.querySelectorAll('[data-izsil]').forEach(b=>b.onclick=()=>izSil(b.getAttribute('data-izsil')));
  document.querySelectorAll('[data-izform]').forEach(b=>b.onclick=()=>izinFormu(b.getAttribute('data-izform')));
}
async function izDurum(id,d){const z=IZIN.find(x=>x.id===id);if(!z)return;z.durum=d;await kaydetIzin();}
async function izSil(id){if(!confirm('İzin kaydı silinsin mi?'))return;IZIN=IZIN.filter(x=>x.id!==id);await kaydetIzin();}
function izinFormu(id){
  const z=IZIN.find(x=>x.id===id);if(!z)return;const e=empById(z.empId)||{};const b=izinBakiye(e);
  const w=window.open('','_blank');if(!w){alert('Açılır pencere engellendi.');return;}
  w.document.write('<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>İzin Formu</title><style>body{font-family:Arial,sans-serif;color:#1c2530;padding:40px;max-width:800px;margin:auto;font-size:13px}h1{font-family:Georgia,serif;color:#132a44;font-size:20px}.row{display:flex;border-bottom:1px solid #e5e5e5;padding:7px 0}.k{width:190px;color:#667;font-weight:bold}.v{flex:1}.sec{font-weight:bold;margin:22px 0 6px;color:#132a44}.sign{display:flex;gap:40px;margin-top:50px}.sign div{flex:1;border-top:1px solid #333;padding-top:6px;font-size:12px}@media print{.noprint{display:none}}</style></head><body>'
    +'<div style="display:flex;justify-content:space-between;align-items:center"><h1>İnciroğlu Otomotiv</h1><div>'+new Date().toLocaleDateString('tr-TR')+'</div></div><hr>'
    +'<div class="sec">Çalışan Bilgileri</div>'
    +row('Adı Soyadı',trTitle(e.ad||z.empAd))+row('TC Kimlik No',e.tc||'')+row('Departman / Bölüm',(e.departman||'')+' / '+(e.bolum||''))+row('Unvan',e.unvan||'')+row('İşe Başlama Tarihi',e.giris||'')+row('Telefon',e.telefonIs||e.telefonKisisel||'')+row('Yerine Bakacak Kişi',z.yerine||'')
    +'<div class="sec">İzin Detayları</div>'
    +row('İzin Türü',z.tur)+row('Kullanılan Gün Sayısı',z.gun)+row('Başlangıç Tarihi',z.baslangic)+row('Bitiş Tarihi',z.bitis)+row('Toplam Kalan İzin',b.kalan+' gün')+row('Açıklama',z.aciklama||'')
    +'<p style="margin-top:24px">Yukarıda belirttiğim tarihler arasında izin hakkımı kullanacağımı beyan ederim.</p>'
    +'<div class="sign"><div>Çalışan<br>'+trTitle(e.ad||z.empAd)+'<br>İmza</div><div>Yönetici Onayı<br>'+(e.yonetici||'')+'</div><div>İnsan Kaynakları Onayı</div></div>'
    +'<div class="noprint" style="margin-top:30px;text-align:center"><button onclick="window.print()" style="padding:10px 22px;font-size:14px;cursor:pointer">Yazdır / PDF</button></div>'
    +'</body></html>');
  w.document.close();
  function row(k,v){return '<div class="row"><div class="k">'+k+'</div><div class="v">'+String(v==null?'':v)+'</div></div>';}
}

/* ===== HARCAMA ===== */
function openHarc(){
  const a=ensureAyar(); const emps=AKTIF.slice().sort((x,y)=>String(x.ad).localeCompare(String(y.ad),'tr'));
  document.getElementById('harcBody').innerHTML=
    '<div class="f"><label>Çalışan</label><select id="hcEmp"><option value=""></option>'+emps.map(e=>'<option value="'+e.id+'">'+esc(trTitle(e.ad))+'</option>').join('')+'</select></div>'
    +'<div class="f two"><div><label>Tür</label><select id="hcTur">'+a.harcamaTurleri.map(t=>'<option>'+esc(t)+'</option>').join('')+'</select></div><div><label>Tutar (TL)</label><input id="hcTutar" type="number" min="0" step="0.01"></div></div>'
    +'<div class="f"><label>Tarih</label><input id="hcTarih" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
    +'<div class="f"><label>Açıklama</label><textarea id="hcAcik" rows="2"></textarea></div>';
  document.getElementById('harcOvl').classList.add('on');
}
async function saveHarc(){
  const empId=v('hcEmp'); if(!empId){alert('Çalışan seçin.');return;} const t=v('hcTutar'); if(!t){alert('Tutar girin.');return;}
  const e=empById(empId); const tr=v('hcTarih');
  HARC=HARC.concat([{id:uid('h'),empId,empAd:e?e.ad:'',tur:v('hcTur'),tutar:+t,tarih:tr?trFromISO(tr):'',aciklama:v('hcAcik'),durum:'bekliyor',odendi:false,olusturma:new Date().toISOString()}]);
  await kaydetHarc(); closeModals();
}
async function hcDurum(id,d){const h=HARC.find(x=>x.id===id);if(!h)return;h.durum=d;await kaydetHarc();}
async function hcOdendi(id){const h=HARC.find(x=>x.id===id);if(!h)return;h.odendi=true;await kaydetHarc();}
async function hcSil(id){if(!confirm('Harcama silinsin mi?'))return;HARC=HARC.filter(x=>x.id!==id);await kaydetHarc();}

/* ===== MESAİ / AVANS TALEP ===== */
let talepTip=null;
function yeniTalep(tip){ if(tip==='İzin')return openIzin(); if(tip==='Harcama')return openHarc(); openTalep(tip); }
function openTalep(tip){
  talepTip=tip; const emps=AKTIF.slice().sort((x,y)=>String(x.ad).localeCompare(String(y.ad),'tr'));
  document.getElementById('talepTitle').textContent=tip+' Talebi';
  const opt='<option value=""></option>'+emps.map(e=>'<option value="'+e.id+'">'+esc(trTitle(e.ad))+'</option>').join('');
  let f='<div class="f"><label>Çalışan</label><select id="tlEmp">'+opt+'</select></div><div class="f"><label>Tarih</label><input id="tlTarih" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>';
  if(tip==='Mesai') f+='<div class="f"><label>Mesai Süresi (saat)</label><input id="tlVal" type="number" min="0" step="0.5" placeholder="örn. 3"></div>';
  else f+='<div class="f"><label>Avans Tutarı (TL)</label><input id="tlVal" type="number" min="0" step="0.01"></div>';
  f+='<div class="f"><label>Açıklama</label><textarea id="tlAcik" rows="2"></textarea></div><div class="f"><label class="chk"><input type="checkbox" id="tlOnayli"> Onaylı olarak ekle</label></div>';
  document.getElementById('talepBody').innerHTML=f;
  document.getElementById('talepOvl').classList.add('on');
}
async function saveTalep(){
  const empId=v('tlEmp'); if(!empId){alert('Çalışan seçin.');return;}
  const val=v('tlVal'); if(!val){alert(talepTip==='Mesai'?'Mesai süresi girin.':'Tutar girin.');return;}
  const e=empById(empId); const tr=v('tlTarih');
  const ozet=talepTip==='Mesai'?(val+' saat mesai'):(val+' TL avans');
  TALEP=TALEP.concat([{id:uid('t'),tip:talepTip,empId,empAd:e?e.ad:'',tarih:tr?trFromISO(tr):'',deger:+val,ozet,aciklama:v('tlAcik'),durum:document.getElementById('tlOnayli').checked?'onaylandi':'bekliyor',olusturma:new Date().toISOString()}]);
  await kaydetTalep(); closeModals();
}
async function talepDurum(spec,d){ const i=spec.indexOf('|'); const k=spec.slice(0,i),id=spec.slice(i+1);
  if(k==='izin'){const z=IZIN.find(x=>x.id===id);if(z){z.durum=d;await kaydetIzin();}}
  else if(k==='harc'){const h=HARC.find(x=>x.id===id);if(h){h.durum=d;await kaydetHarc();}}
  else {const t=TALEP.find(x=>x.id===id);if(t){t.durum=d;await kaydetTalep();}}
}

/* ===== İŞTEN AYRILDI ===== */
let delId=null;
function openDel(id){const p=AKTIF.find(x=>x.id===id);if(!p)return;delId=id;document.getElementById('delWho').innerHTML='<b>'+esc(trTitle(p.ad))+'</b> — '+esc(p.departman||'')+' · '+esc(p.bolum||'');document.getElementById('delCikis').value=new Date().toISOString().slice(0,10);document.getElementById('delOvl').classList.add('on');}
async function doDel(){if(!delId)return;const p=AKTIF.find(x=>x.id===delId);if(!p)return;const c=v('delCikis')||document.getElementById('delCikis').value;AKTIF=AKTIF.filter(x=>x.id!==delId);AYRILAN=[Object.assign({},p,{cikis:c?trFromISO(c):new Date().toLocaleDateString('tr-TR')})].concat(AYRILAN);await kaydetPers();closeModals();go('calisanlar');}

/* ===== AYARLAR CRUD ===== */
async function ayarEkle(key){const el=document.getElementById('add_'+key);const val=(el.value||'').trim();if(!val)return;const a=ensureAyar();const arr=a[key].slice();if(!arr.includes(val))arr.push(val);arr.sort((x,y)=>x.localeCompare(y,'tr'));const o={};o[key]=arr;await kaydetAyar(o);}
async function ayarSil(spec){const i=spec.indexOf('|');const key=spec.slice(0,i),val=spec.slice(i+1);const a=ensureAyar();const o={};o[key]=a[key].filter(x=>x!==val);await kaydetAyar(o);}

/* ===== ORTAK ===== */
function closeModals(){['empOvl','izinOvl','harcOvl','talepOvl','delOvl'].forEach(id=>document.getElementById(id).classList.remove('on'));delId=null;editId=null;izEmpFix=null;talepTip=null;}
let openMenu=null; function closeMenu(){if(openMenu){openMenu.remove();openMenu=null;}}
function bindGlobal(){
  document.getElementById('logout').onclick=()=>{location.href='portal.html';};
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);
  document.getElementById('eSave').onclick=saveEmp;
  document.getElementById('izSave').onclick=saveIzin;
  document.getElementById('hcSave').onclick=saveHarc;
  document.getElementById('tlSave').onclick=saveTalep;
  document.getElementById('delGo').onclick=doDel;
  const gq=document.getElementById('gq');gq.oninput=()=>{if(route().page!=='calisanlar'){ST.q=gq.value;go('calisanlar');}else{ST.q=gq.value;const lq=document.getElementById('lq');if(lq)lq.value=gq.value;softList();}};
  window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals();});
}

if(SES&&SES.ok&&IS_IK){ if(!location.hash)location.hash='#/'; boot(); }
</script>
</body>
