<!--

  Veri: ayrilisAnketleri koleksiyonu (canlı, onSnapshot) + satisVeri/ikPano (istifa listesi ve anket oranı için).
  Çalışanın doldurduğu sayfa: anket.html#a_<anahtar>. Sorular: ortak/ayrilis-sorular.js.
-->
<body class="ayrilis">

<div class="ana">

<script type="module">
import { doc, getDoc, setDoc, deleteDoc, collection, query, where, onSnapshot, writeBatch, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { db, kimlikBaslat, cikisYap, adBasliklari } from "./ortak/kimlik.js";
import * as O from "./pano/ortak.js";
import * as A from "./ortak/ayrilis-sorular.js";

const $ = (id) => document.getElementById(id);
const acilisMetni = (t) => { const e = $('acilisMetin'); if (e) e.textContent = t; };
const acilisGizle = () => { const a = $('acilis'); if (a) { a.classList.add('gizle'); setTimeout(() => a.remove(), 600); } };
const SVG = (yol) => '<svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + yol + '</svg>';
const IK_LINK = SVG('<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/>');
const IK_KOPYA = SVG('<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/>');
const IK_GONDER = SVG('<path d="M20.5 3.5 3.5 10.5l7 3 3 7z"/><path d="m10.5 13.5 4-4"/>');
const IK_SIL = SVG('<path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9l1-12.5"/>');

/* ============================================================== OTURUM */
const OTURUM = await kimlikBaslat({ uygulama: 'İşten Ayrılış Anketleri', roller: ['ik', 'direktor'] });
const IK = OTURUM.hesap.roller.indexOf('ik') >= 0;
const AD = adBasliklari(OTURUM.hesap.ad || '');
const ROL_AD = IK ? 'İnsan Kaynakları' : 'Direktör';
const KOL = collection(db, 'ayrilisAnketleri');
acilisMetni('Anketler yükleniyor…');

/* ============================================================== YARDIMCILAR */
function tarihCoz(s) {
  if (!s) return null;
  if (s instanceof Date) return s;
  if (typeof s.toDate === 'function') return s.toDate();
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = /^(\d{1,2})[./](\d{1,2})[./](\d{4})/.exec(String(s));
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  return null;
}
const isoGun = (d) => (d ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') : '');
const gunYaz = (d) => (d ? String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear() : '—');
const adAnahtari = (s) => O.katla(s).replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b) {
  if (a === b) return 0;
  const p = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let onceki = p[0]; p[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = p[j]; p[j] = Math.min(p[j] + 1, p[j - 1] + 1, onceki + (a[i - 1] === b[j - 1] ? 0 : 1)); onceki = t; }
  }
  return p[b.length];
}
/** Anket kaydı ↔ pano ayrılan kaydı: aynı ad (Türkçe katlamalı) ve yakın çıkış tarihi; küçük yazım farkı tolere edilir */
function eslesir(kayit, a) {
  const x = adAnahtari(kayit.ad), y = adAnahtari(a.ad);
  const t1 = tarihCoz(kayit.cikis), t2 = tarihCoz(a.tarih);
  if (!t1 || !t2) return x === y;                 /* tarih yoksa yalnız birebir ad */
  const gun = Math.abs(t1 - t2) / 864e5;
  return (x === y && gun <= 45) || (lev(x, y) <= 2 && gun <= 10);
}
function satirBol(s, n) {
  const k = String(s).split(' '); const r = []; let c = '';
  k.forEach((w) => { if ((c + ' ' + w).trim().length > n && c) { r.push(c); c = w; } else c = (c + ' ' + w).trim(); });
  if (c) r.push(c);
  return r.length > 1 ? r : r[0] || '';
}
function anketLinki(id) { return new URL('anket.html', location.href).href.split('#')[0].split('?')[0] + '#' + id; }
function davetMesaji(ad, link) {
  const ilk = String(ad || '').trim().split(/\s+/)[0] || '';
  return 'Merhaba ' + O.trBaslik(ilk) + ',\n\nİnciroğlu Otomotiv’de birlikte çalıştığımız süre için teşekkür ederiz. Ayrılış nedenlerinizi anlamak ve çalışma koşullarımızı iyileştirmek için hazırladığımız kısa anketi (yaklaşık 5 dakika) doldurmanızı rica ederiz:\n\n' + link + '\n\nBağlantı size özeldir ve tek kullanımlıktır.\nİnciroğlu Otomotiv · İnsan Kaynakları';
}
async function kopyala(metin, bildirim) {
  try { await navigator.clipboard.writeText(metin); }
  catch (e) {
    const t = document.createElement('textarea'); t.value = metin; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.append(t); t.select(); try { document.execCommand('copy'); } catch (e2) { /* elle kopyalanır */ } t.remove();
  }
  O.bildirim(bildirim || 'Kopyalandı');
}
const yuzdeTam = (a, b) => (b ? Math.round((a / b) * 100) : 0);

/* ============================================================== DURUM */
let KAYITLAR = [];          /* ayrilisAnketleri (canlı) */
let AYRILANLAR = [];        /* satisVeri/ikPano → D.ayrilanlar (istifa listesi) */
let PANO_ETIKET = '';
let PANO_HATA = null;
let YIL = new Date().getFullYear();
let ILK = true;
const GORULEN = new Set();

const istifaMi = (a) => (a.neden === 'İstifa' || a.neden === 'Deneme (İşçi)') && !O.isVI(a.dept);
const yilOf = (s) => { const d = tarihCoz(s); return d ? d.getFullYear() : null; };
/* Yanıtın yılı: çıkış tarihi; yoksa yanıt / oluşturma tarihi (tarihsiz kayıt hiçbir yılda kaybolmasın) */
const kayitYili = (k) => yilOf(k.cikis) || yilOf(k.tamamlanma) || yilOf(k.olusturma);
/* KVKK: "ONAYLAMIYORUM" diyen kişi yanıtlarının anonim veri olarak kullanılmasına izin vermemiştir. Bu yanıtlar anket oranında
   sayılır (kişi formu doldurdu) ama grafik/istatistiklere girmez ve ayrıntısını yalnız İK görür. Kurum kararı değişirse false yapın. */
const KVKK_RET_HARIC = true;
const onayYok = (k) => !!(k.cevaplar && k.cevaplar.kvkk === 'ONAYLAMIYORUM.');
const tamamlananlar = () => KAYITLAR.filter((k) => k.durum === 'tamamlandi' && kayitYili(k) === YIL);
const bekleyenler = () => KAYITLAR.filter((k) => k.durum === 'bekliyor');
const istifalar = () => AYRILANLAR.filter((a) => istifaMi(a) && yilOf(a.tarih) === YIL);

function nedenIstatistik(liste) {
  return A.FAKTORLER.map((f) => {
    const v = liste.map((k) => k.cevaplar && k.cevaplar.puan ? k.cevaplar.puan[f.k] : null).filter((x) => Number.isInteger(x));
    const etkili = v.filter((x) => x >= A.ETKILI_ESIK).length;
    return { k: f.k, ad: f.ad, n: v.length, etkili, oran: v.length ? (etkili / v.length) * 100 : 0, ort: v.length ? v.reduce((s, x) => s + x, 0) / v.length : null };
  }).sort((a, b) => b.oran - a.oran || (b.ort || 0) - (a.ort || 0));
}
/* Çıkış nedeni grupları (İK pano paketindeki `neden` kategorisinden; renkler İK Dashboard ile aynı) */
const CIK_GRUPLARI = [
  { ad: 'İstifa', renk: O.NEDEN_RENK['İstifa'] },
  { ad: 'İşveren feshi', renk: O.NEDEN_RENK['İşveren Feshi'] },
  { ad: 'Deneme süresinde işveren feshi', renk: O.NEDEN_RENK['Deneme (İşveren)'] },
  { ad: 'Askerlik', renk: O.NEDEN_RENK['Askerlik'] },
  { ad: '25. madde (haklı fesih)', renk: O.NEDEN_RENK['25. Madde'] },
  { ad: 'Diğer', renk: O.NEDEN_RENK['Diğer'] }
];
function cikisGrubu(a) {
  if (istifaMi(a)) return 'İstifa';                              /* deneme süresinde işçinin feshi de istifadır */
  return { 'İşveren Feshi': 'İşveren feshi', 'Deneme (İşveren)': 'Deneme süresinde işveren feshi', 'Askerlik': 'Askerlik', '25. Madde': '25. madde (haklı fesih)' }[a.neden] || 'Diğer';
}
/* Çıkış görüşmesi yapılmama nedeni: haftalık rapordaki "Açıklama" (gerçek ayrılış nedeni) metninden */
function yapilmamaNedeni(a) {
  const n = O.katla(a.aciklama || '');
  if (/ihtar/.test(n)) return 'İhtar çekerek ayrıldı';
  if (/25\s*\/\s*2|arabul|arabuc|isveren feshi olacak|disiplin/.test(n)) return 'Anlaşmalı çıkış (25/2 · arabulucu · disiplin)';
  if (/devamsiz/.test(n)) return 'Devamsızlık';
  if (/performans/.test(n)) return 'Performans nedeniyle çıkış';
  if (/kaza|istifa ettiril/.test(n)) return 'İstifa ettirildi';
  return 'Henüz yapılmadı';
}
/* Küçük özet tablosu: başlıklar, satırlar ([hücre…], ilk sütun metin/düğüm, diğerleri sağa yaslı), toplam satırı */
function ozetTablo(kap, basliklar, satirlar, toplam) {
  const hucre = (etiket, v, i) => O.el(etiket, { class: i ? 'sag' : null }, v instanceof Node ? v : String(v));
  const t = O.el('table', { class: 'tablo ay-ozet-tablo' },
    O.el('thead', null, O.el('tr', null, ...basliklar.map((b, i) => hucre('th', b, i)))),
    O.el('tbody', null, ...satirlar.map((r) => O.el('tr', null, ...r.map((v, i) => hucre('td', v, i))))),
    toplam ? O.el('tfoot', null, O.el('tr', null, ...toplam.map((v, i) => hucre('td', v, i)))) : null);
  kap.append(O.el('div', { class: 'tablo-kap' }, t));
}
function sayim(liste, fn, sira) {
  const m = new Map(); liste.forEach((k) => { [].concat(fn(k)).forEach((v) => { if (v) m.set(v, (m.get(v) || 0) + 1); }); });
  const r = [...m.entries()].map(([ad, deger]) => ({ ad, deger }));
  if (sira) r.sort((a, b) => sira.indexOf(a.ad) - sira.indexOf(b.ad)); else r.sort((a, b) => b.deger - a.deger);
  return r;
}

/* ============================================================== PENCERE */
let acik = null;
/* Açık pencere varken gelen canlı güncelleme sayfayı yeniden çizmez (yazılan form kaybolmasın); pencere kapanınca çizilir */
let BEKLEYEN_CIZIM = false;
function pencereKapat() {
  if (!acik) return;
  const p = acik; acik = null;
  document.removeEventListener('keydown', p.tus, true);
  p.ort.classList.remove('acik');
  setTimeout(() => p.ort.remove(), O.azHareket() ? 0 : 240);
  if (p.onceki && document.contains(p.onceki)) p.onceki.focus({ preventScroll: true });
  if (BEKLEYEN_CIZIM) { BEKLEYEN_CIZIM = false; setTimeout(ciz, 0); }
}
function pencereAc(etiket, parcalar, { dar = false } = {}) {
  const onceki = acik ? acik.onceki : document.activeElement;
  if (acik) { const p = acik; acik = null; document.removeEventListener('keydown', p.tus, true); p.ort.remove(); }

/* ============================================================== ESKİ YANITLARI AKTAR (İK) */
function aktarimSec() {
  const inp = O.el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    let o = null; try { o = JSON.parse(await f.text()); } catch (e) { o = null; }
    const ham = o && o.tur === 'inciroglu-ayrilis-anketi' && Array.isArray(o.kayitlar) ? o.kayitlar : null;
    if (!ham || !ham.length) { alert('Bu dosya bir ayrılış anketi aktarım dosyası değil. Lütfen size verilen “ayrilis_anketi_…_aktarim.json” dosyasını seçin.'); return; }
    if (ham.length > 450) { alert('Tek seferde en fazla 450 yanıt aktarılabilir.'); return; }
    /* Kayıt kayıt denetim: bozuk kayıt atlanır (tüm aktarım düşmesin) */
    const tarihGecerli = (d) => d instanceof Date && !isNaN(d.getTime());
    const kayitlar = [], atlanan = [];
    ham.forEach((r, i) => {
      const ad = r && A.metinTemizle(r.ad, 80);
      const c = r && r.cevaplar;
      const cik = r && tarihCoz(r.cikis);
      let tam = r && typeof r.tamamlanma === 'string' && /T/.test(r.tamamlanma) ? new Date(r.tamamlanma) : (r && tarihCoz(r.tamamlanma));
      if (!tarihGecerli(tam)) tam = cik;
      const iyi = r && A.anahtarGecerli(r.id) && ad && ad.length >= 3 && ['google_form', 'ik'].indexOf(r.kaynak) >= 0
        && c && typeof c === 'object' && !Array.isArray(c) && c.puan && typeof c.puan === 'object' && !Array.isArray(c.puan)
        && tarihGecerli(cik) && tarihGecerli(tam);
      if (!iyi) { atlanan.push(i + 1); return; }
      kayitlar.push({ id: r.id, veri: {
        ad, departman: A.metinTemizle(r.departman, 80), pozisyon: A.metinTemizle(r.pozisyon, 120),
        giris: typeof r.giris === 'string' ? r.giris : '', cikis: isoGun(cik), durum: 'tamamlandi', kaynak: r.kaynak,
        olusturma: serverTimestamp(), olusturan: AD, ikKodu: A.metinTemizle(r.ikKodu || '', 80),
        tamamlanma: Timestamp.fromDate(tam), cevaplar: c } });
    });
    if (!kayitlar.length) { alert('Dosyada aktarılabilecek geçerli yanıt bulunamadı.'); return; }
    if (!confirm(kayitlar.length + ' yanıt aktarılacak' + (atlanan.length ? '; ' + atlanan.length + ' bozuk kayıt atlanacak' : '') + '. Daha önce aktarılmış aynı yanıtlar güncellenir, mükerrer kayıt oluşmaz. Devam edilsin mi?')) return;
    /* Güvenlik kuralı her yazımda yetkiyi okur; toplu yazma okuma sınırına takılmasın diye 8'erli parçalar hâlinde.
       Bir parça reddedilirse o parçanın kayıtları TEK TEK yeniden denenir; yine yazılamayanlar adıyla ve hata koduyla bildirilir. */
    let yazilan = 0;
    const hatali = [];
    for (let i = 0; i < kayitlar.length; i += 8) {
      const parca = kayitlar.slice(i, i + 8);
      try {
        const b = writeBatch(db);
        parca.forEach((r) => b.set(doc(KOL, r.id), r.veri));
        await b.commit();
        yazilan += parca.length;
      } catch (e) {
        console.warn('Aktarım parçası reddedildi, kayıtlar tek tek deneniyor', e);
        for (const r of parca) {
          try { await setDoc(doc(KOL, r.id), r.veri); yazilan++; }
          catch (e2) { hatali.push(O.trBaslik(r.veri.ad) + ' (' + ((e2 && e2.code) || (e2 && e2.message) || 'hata') + ')'); }
        }
      }
    }
    if (!hatali.length) O.bildirim(yazilan + ' yanıt aktarıldı' + (atlanan.length ? ' · ' + atlanan.length + ' kayıt atlandı' : ''));
    else alert('Aktarım: ' + yazilan + ' / ' + kayitlar.length + ' yanıt yazıldı. Yazılamayanlar (' + hatali.length + '):\n' + hatali.join('\n') +
      '\n\nTekrar aktarabilirsiniz, mükerrer kayıt oluşmaz. “permission-denied” görünüyorsa güvenlik kuralı yayınlanmamış ya da yetkiniz yok demektir.');
  });
  document.body.append(inp);
  inp.click();
}

    CIK.forEach((a) => { const g = cikisGrubu(a); grupSay.set(g, (grupSay.get(g) || 0) + 1); });
    const nedenler = CIK_GRUPLARI.map((g) => ({ ad: g.ad, deger: grupSay.get(g.ad) || 0, renk: g.renk })).filter((x) => x.deger > 0).sort((a, b) => b.deger - a.deger);
    const kN = O.kart(izC, { baslik: 'Çıkış nedenleri', aciklama: YIL + ' · kişi sayısı ve toplam çıkış içindeki payı', sinif: 's5' });
    kN.govde.append(O.el('div', { class: 'ay-buyuk' }, O.el('b', { text: O.sayi(CIK.length) }), O.el('span', { text: 'toplam çıkış' })));
    O.dagilimSeridi(kN.govde, nedenler);
    ozetTablo(kN.govde, ['Neden', 'Kişi', 'Oran'],
      nedenler.map((x) => [O.el('span', { class: 'ay-renkli' }, O.el('i', { style: 'background:' + x.renk }), x.ad), O.sayi(x.deger), '%' + yuzdeTam(x.deger, CIK.length)]),
      ['Toplam çıkış', O.sayi(CIK.length), '%100']);
    /* (b) Çıkış görüşmesi: tabi olan = toplam istifa; yapılan / yapılmayan + yapılmama nedenleri */
    const yapilmayanlar = IST.filter((a) => !T.some((k) => eslesir(k, a)));
    const yapilan = IST.length - yapilmayanlar.length;
    const kG = O.kart(izC, { baslik: 'Çıkış görüşmesi (ayrılış anketi)', aciklama: 'Çıkış görüşmesine tabi olanlar = toplam istifa (deneme süresinde istifa dahil)', sinif: 's7' });
    const kutu = (et, deger, alt, sinif) => O.el('div', { class: 'ay-sayi-kutu ' + (sinif || '') }, O.el('span', { text: et }), O.el('b', { text: O.sayi(deger) }), O.el('small', { text: alt }));
    kG.govde.append(O.el('div', { class: 'ay-uc' },
      kutu('Görüşmeye tabi', IST.length, 'toplam istifa', ''),
      kutu('Yapılan', yapilan, '%' + yuzdeTam(yapilan, IST.length), 'iyi'),
      kutu('Yapılmayan', yapilmayanlar.length, '%' + yuzdeTam(yapilmayanlar.length, IST.length), 'kotu')));
    O.dagilimSeridi(kG.govde, [{ ad: 'Yapılan', deger: yapilan, renk: O.RENK.g1 }, { ad: 'Yapılmayan', deger: yapilmayanlar.length, renk: O.RENK.g8 }]);
    const ynSay = new Map(); yapilmayanlar.forEach((a) => { const n = yapilmamaNedeni(a); ynSay.set(n, (ynSay.get(n) || 0) + 1); });
    const yn = [...ynSay.entries()].map(([ad, deger]) => ({ ad, deger })).sort((a, b) => b.deger - a.deger || O.trKarsilastir(a.ad, b.ad));
    kG.govde.append(O.el('h4', { class: 'ay-alt-baslik', text: 'Yapılmama nedenleri (' + O.sayi(yapilmayanlar.length) + ' kişi)' }));
    O.cubukListe(kG.govde, yn, { renk: O.RENK.g8, bicim: (v) => O.sayi(v) + ' · %' + yuzdeTam(v, yapilmayanlar.length), bos: 'Yapılmayan görüşme yok' });
    kG.govde.append(O.el('p', { class: 'ay-bilgi', style: 'margin-top:10px', text: 'Yapılmama nedeni, haftalık rapordaki “Açıklama” (gerçek ayrılış nedeni) sütunundan okunur. “Henüz yapılmadı” olanlara bağlantı gönderilebilir.' }));
    /* (c) Departmanlara göre: yapılması gereken / yapılan / yapılmayan */
    const dep = new Map();
    IST.forEach((a) => { const d = a.dept || 'Belirtilmemiş'; const r = dep.get(d) || { dept: d, gereken: 0, yapilan: 0, yapilmayan: 0 }; r.gereken++; if (T.some((k) => eslesir(k, a))) r.yapilan++; else r.yapilmayan++; dep.set(d, r); });
    const depSatir = [...dep.values()].sort((a, b) => b.gereken - a.gereken || O.trKarsilastir(a.dept, b.dept));
    const kDep = O.kart(izC, { baslik: 'Departmanlara göre çıkış görüşmesi', aciklama: YIL + ' · istifa edenler üzerinden', sinif: 's12' });
    O.tablo(kDep.govde, {
      sutunlar: [
        { k: 'dept', ad: 'Departman' },
        { k: 'gereken', ad: 'Yapılması gereken', tip: 'sayi', sag: true },
        { k: 'yapilan', ad: 'Yapılan', tip: 'sayi', sag: true },
        { k: 'yapilmayan', ad: 'Yapılmayan', tip: 'sayi', sag: true, hucreSinif: (v) => (v > 0 ? 'negatif' : '') }
      ],
      satirlar: depSatir, ara: false, sayfaBoyu: 60,
      toplamSatir: { dept: 'Toplam', gereken: IST.length, yapilan, yapilmayan: yapilmayanlar.length }
    });
  }

  /* ---- 2) BAĞLANTILAR (yalnız İK) */
  if (IK) {
    akis('Anket bağlantıları', 'İstifayla ayrılan kişiye tek kullanımlık bağlantı gönderin; kişi anketi gönderdiği anda sonuç bu sayfaya düşer.');
    const iz = O.izgara(kok);
    const eksik = IST.filter((a) => !T.some((k) => eslesir(k, a))).map((a) => Object.assign({}, a, { _bek: BEK.find((k) => eslesir(k, a)) || null, _t: tarihCoz(a.tarih) }));
    const k1 = O.kart(iz, { baslik: 'Anketi olmayan istifalar', aciklama: YIL + ' · haftalık İK pano verisindeki istifalar içinde anketi bulunmayanlar (' + eksik.length + ' kişi)', sinif: 's12' });
    if (!AYRILANLAR.length) O.bosDurum(k1.govde, { ikon: 'dosya', baslik: 'İstifa listesi okunamadı', metin: PANO_HATA ? 'Haftalık İK pano verisine erişilemedi.' : 'Haftalık İK pano verisi henüz yüklenmemiş.', kucuk: true });
    else O.tablo(k1.govde, {
      sutunlar: [
        { k: 'ad', ad: 'Ad Soyad', sinif: 'ad-hucre', bicim: (v) => O.trBaslik(v) },
        { k: 'dept', ad: 'Departman' },
        { k: '_t', ad: 'Çıkış', tip: 'tarih', bicim: (v) => gunYaz(v), siralamaDegeri: (r) => (r._t ? r._t.getTime() : 0) },
        { k: 'aciklama', ad: 'İK notu', hucreSinif: () => 'ay-not-hucre ay-soluk', bicim: (v) => v && v !== '-' ? v : '—' },
        { k: '_islem', ad: '', siralanamaz: true, bicim: (v, r) => r._bek
          ? O.el('div', { class: 'ay-islem' }, O.el('span', { class: 'cip cip-uy', text: 'Bağlantı gönderildi' }), O.el('button', { class: 'btn', type: 'button', html: IK_KOPYA + 'Kopyala', on: { click: (e) => { e.stopPropagation(); baglantiGoster(r._bek); } } }))
          : O.el('div', { class: 'ay-islem' }, O.el('button', { class: 'btn btn-pirinc', type: 'button', html: IK_LINK + 'Bağlantı oluştur', on: { click: (e) => { e.stopPropagation(); baglantiFormu(r); } } })) }
      ],
      satirlar: eksik, sayfaBoyu: 8, varsayilanSira: { k: '_t', y: 'azalan' }, araYer: 'Ad, departman ara…', araAlanlari: ['ad', 'dept', 'aciklama'],
      bos: { baslik: 'Tüm istifaların anketi var', metin: '' }
    });
    const k2 = O.kart(iz, { baslik: 'Bekleyen bağlantılar', aciklama: 'Gönderildi, yanıt bekleniyor (' + BEK.length + ')', sinif: 's12' });
    O.tablo(k2.govde, {
      sutunlar: [
        { k: 'ad', ad: 'Ad Soyad', sinif: 'ad-hucre', bicim: (v) => O.trBaslik(v) },
        { k: 'olusturma', ad: 'Oluşturma', tip: 'tarih', bicim: (v) => gunYaz(tarihCoz(v)), siralamaDegeri: (r) => { const d = tarihCoz(r.olusturma); return d ? d.getTime() : 0; } },
        { k: '_islem', ad: '', siralanamaz: true, bicim: (v, r) => O.el('div', { class: 'ay-islem' },
          O.el('button', { class: 'btn', type: 'button', title: 'Bağlantıyı ve mesajı göster', html: IK_KOPYA + 'Gönder', on: { click: () => baglantiGoster(r) } }),
          O.el('button', { class: 'btn btn-hayalet', type: 'button', title: 'Bağlantıyı iptal et', 'aria-label': 'İptal et', html: IK_SIL, on: { click: () => baglantiIptal(r) } })) }
      ],
      satirlar: BEK, sayfaBoyu: 8, varsayilanSira: { k: 'olusturma', y: 'azalan' }, ara: BEK.length > 8, araAlanlari: ['ad'],
      bos: { baslik: 'Bekleyen bağlantı yok', metin: 'Soldaki listeden ya da üstteki “Bağlantı oluştur” ile yeni bağlantı oluşturun.' }
    });
  }

  if (!T.length) {
    akis('Yanıtlar', '');
    const b = O.kart(kok, { baslik: YIL + ' yanıtı yok' });
    O.bosDurum(b.govde, IK
      ? { ikon: 'dosya', baslik: 'Henüz anket yanıtı yok', metin: 'Eski Google Form yanıtlarını “Yanıt aktar” ile yükleyebilir ya da istifa eden kişilere bağlantı gönderebilirsiniz.', eylem: { metin: 'Yanıt aktar', fn: aktarimSec } }
      : { ikon: 'dosya', baslik: 'Henüz anket yanıtı yok', metin: 'İnsan Kaynakları yanıtları ekledikçe burada görünecek.' });
    bitir(kok, kaydirma);
    return;
  }

  /* ---- 3) NEDENLER */
  akis('Neden ayrılıyorlar?', 'Her neden için “Etkili” ya da “Çok etkili” diyenlerin oranı');
  const iz2 = O.izgara(kok);
  const ilk10 = NED.slice(0, 10);
  const g = O.grafikKarti(iz2, {
    baslik: 'En etkili 10 neden', aciklama: O.sayi(S.length) + ' anket · “Etkili” + “Çok etkili” payı' + (RET ? ' · kişisel veri onayı vermeyen ' + RET + ' yanıt hariç' : ''), sinif: 's8', yukseklik: 440,
    tablo: () => ({ sutunlar: [{ ad: 'Neden' }, { ad: 'Etkili / Çok etkili', sag: true }, { ad: 'Kişi', sag: true }, { ad: 'Ortalama (0–5)', sag: true }],
      satirlar: NED.map((x) => [x.ad, O.yuzde(x.oran, 0), O.sayi(x.etkili) + ' / ' + O.sayi(x.n), x.ort === null ? '—' : O.sayi(x.ort, 1)]) }),
    not: 'Tablo görünümünde 23 nedenin tamamı var. Ölçek: Etkisi yok · Çok az · Az · Orta · Etkili · Çok etkili.'
  });
  O.grafik(g.canvas, {
    type: 'bar',
    data: { labels: ilk10.map((x) => satirBol(x.ad, 24)), datasets: [{ label: 'Etkili / Çok etkili', data: ilk10.map((x) => Math.round(x.oran)), backgroundColor: O.RENK.g1, maxBarThickness: 20, datalabels: O.etiket.sag({ onek: '%' }) }] },
    options: { indexAxis: 'y', layout: { padding: { right: 40, left: 14 } },
      scales: { x: O.eksenY({ max: 100, ticks: { callback: (v) => '%' + v } }), y: O.eksenX({ ticks: { autoSkip: false, font: { size: 11.5 }, color: O.RENK.n700 } }) },
      plugins: { tooltip: { callbacks: { title: (c) => ilk10[c[0].dataIndex].ad, label: (c) => ' %' + c.parsed.x + ' · ' + ilk10[c.dataIndex].etkili + ' / ' + ilk10[c.dataIndex].n + ' kişi' } } } }
  });
  const RET_NOT = RET ? ' · kişisel veri onayı vermeyen ' + RET + ' yanıt hariç' : '';
  const k3 = O.kart(iz2, { baslik: 'Bağlılık ve deneyim', aciklama: 'Evet / Hayır yanıtlarına göre' + RET_NOT, sinif: 's4' });
  const serit = (baslik, d, renkE, aciklama) => {
    const h = d.n - d.evet;
    return O.el('div', { class: 'ay-oran-blok' },
      O.el('h4', { text: baslik }),
      O.el('div', { class: 'ay-buyuk' }, O.el('b', { text: '%' + yuzdeTam(d.evet, d.n) }), O.el('span', { text: '“Evet” · ' + d.evet + ' / ' + d.n + ' kişi' })),
      O.el('div', { class: 'ay-serit', role: 'img', 'aria-label': baslik + ': ' + d.evet + ' evet, ' + h + ' hayır' }, O.el('i', { style: 'width:' + (d.n ? (d.evet / d.n) * 100 : 0) + '%;background:' + renkE }), O.el('i', { style: 'width:' + (d.n ? (h / d.n) * 100 : 0) + '%;background:var(--n-300)' })),
      O.el('div', { class: 'ay-serit-lejant' }, O.el('span', null, O.el('i', { style: 'background:' + renkE }), 'Evet ' + d.evet), O.el('span', null, O.el('i', { style: 'background:var(--n-300)' }), 'Hayır ' + h)),
      aciklama ? O.el('p', { text: aciklama }) : null);
  };
  k3.govde.append(O.el('div', { class: 'ay-oran' },
    serit('Gelecekte tekrar İnciroğlu’nda çalışmayı düşünür', tekrar, O.RENK.g1, 'Yüksek olması, ayrılanların şirketle ilişkisini olumlu kapattığını gösterir.'),
    serit('Ayrılmasına sebep olan olumsuz bir olay yaşadı', olay, O.RENK.g8, 'Olumsuz olayı açıklayanların metni yanıt ayrıntısında görülür.')));

  /* ---- 4) KARAR VE İLETİŞİM */
  akis('Karar ve iletişim', 'İstifa kararının zamanı ve ilk kime açıldığı');
  const iz3 = O.izgara(kok);
  const kK = O.kart(iz3, { baslik: 'İstifa kararı ne zaman verildi?', aciklama: 'Kişi sayısı (' + O.sayi(S.length) + ' yanıt' + RET_NOT + ')', sinif: 's6' });
  O.cubukListe(kK.govde, sayim(S, (k) => k.cevaplar && k.cevaplar.karar, A.KARARLAR), { renk: O.RENK.g4 });
  const kM = O.kart(iz3, { baslik: 'Fikrini işyerinde önce kime açtı?', aciklama: 'Kişi sayısı, birden fazla seçilebilir (' + O.sayi(S.length) + ' yanıt' + RET_NOT + ')', sinif: 's6' });
  O.cubukListe(kM.govde, sayim(S, (k) => (k.cevaplar && k.cevaplar.kime) || [], A.KIME), { renk: O.RENK.g5 });

  /* ---- 5) KIRILIM */
  akis('Kırılım', 'Departman ve çıkış ayına göre anket sayısı');
  const iz4 = O.izgara(kok);
  /* SAYIM kartları TÜM yanıtları sayar (kaç kişinin anketi var); KVKK istisnası yalnız cevap içeriğinden üretilen
     istatistiklere uygulanır. Departman, "Departmanlara göre çıkış görüşmesi" tablosuyla AYNI eşleştirmeden alınır
     (istifa listesindeki departman) → iki yerde aynı departmanın sayısı her zaman aynıdır. */
  const kayitDept = (k) => { const a = IST.find((x) => eslesir(k, x)); return (a && a.dept) || k.departman || 'Belirtilmemiş'; };
  const kD = O.kart(iz4, { baslik: 'Departmanlara göre anket', aciklama: 'Anket sayısı (tüm yanıtlar · ' + O.sayi(T.length) + ')', sinif: 's6' });
  O.cubukListe(kD.govde, sayim(T, kayitDept), { renk: O.RENK.g6, kaydir: 330 });
  const aylar = Array.from({ length: 12 }, (_, i) => i + 1);
  const aySay = aylar.map((m) => T.filter((k) => { const d = tarihCoz(k.cikis) || tarihCoz(k.tamamlanma); return d && d.getMonth() + 1 === m; }).length);
  const sonAy = Math.max(...aylar.filter((m, i) => aySay[i] > 0), (YIL === simdi.getFullYear() ? simdi.getMonth() + 1 : 12));
  const gA = O.grafikKarti(iz4, { baslik: 'Aylara göre anket', aciklama: 'Çıkış ayına göre anket sayısı (tüm yanıtlar · ' + O.sayi(T.length) + ')', sinif: 's6', yukseklik: 300,
    tablo: () => ({ sutunlar: [{ ad: 'Ay' }, { ad: 'Anket', sag: true }], satirlar: aylar.slice(0, sonAy).map((m, i) => [O.ayAdi(m), O.sayi(aySay[i])]) }) });
  O.grafik(gA.canvas, { type: 'bar', data: { labels: aylar.slice(0, sonAy).map(O.ayKisa), datasets: [{ label: 'Anket', data: aySay.slice(0, sonAy), backgroundColor: O.RENK.g1, maxBarThickness: 22, datalabels: O.etiket.ust({ secim: 'hepsi' }) }] },
    options: { scales: { x: O.eksenX(), y: O.eksenY({ grace: '15%' }) } } });

  /* ---- 6) YANITLAR */
  akis('Yanıtlar', 'Satıra tıklayınca kişinin tüm cevapları açılır');
  /* Onay vermeyenlerin yanıtını yalnız İK görür (listede işaretli); direktör listesinde yer almaz */
  const listelenen = KVKK_RET_HARIC && !IK ? S : T;
  const kY = O.kart(kok, { baslik: 'Anket yanıtları', aciklama: O.sayi(listelenen.length) + ' yanıt · ' + YIL + (KVKK_RET_HARIC && !IK && RET ? ' · kişisel veri onayı vermeyen ' + RET + ' yanıt gösterilmez' : '') });
  const satirlar = listelenen.map((k) => {
    const p = (k.cevaplar && k.cevaplar.puan) || {};
    const ust = A.FAKTORLER.map((f) => ({ ad: f.ad, v: p[f.k] })).filter((x) => Number.isInteger(x.v) && x.v >= A.ETKILI_ESIK).sort((a, b) => b.v - a.v).slice(0, 2);
    return Object.assign({}, k, { _t: tarihCoz(k.cikis), _ust: ust, _tekrar: (k.cevaplar && k.cevaplar.tekrar) || '—' });
  });
  O.tablo(kY.govde, {
    sutunlar: [
      { k: 'ad', ad: 'Ad Soyad', sinif: 'ad-hucre', bicim: (v, r) => (IK && onayYok(r)
        ? O.el('div', { class: 'ay-cipler' }, O.el('span', { text: O.trBaslik(v) }), O.el('span', { class: 'cip cip-uy', title: 'Kişi, yanıtlarının anonim veri olarak kullanılmasını onaylamadı; istatistiklere dahil edilmez.', text: 'KVKK onayı yok' }))
        : O.trBaslik(v)) },
      { k: 'departman', ad: 'Departman' },
      { k: 'pozisyon', ad: 'Pozisyon', bicim: (v) => (v ? O.trBaslik(v) : '—') },
      { k: '_t', ad: 'Çıkış', tip: 'tarih', bicim: (v) => gunYaz(v), siralamaDegeri: (r) => (r._t ? r._t.getTime() : 0) },
      { k: '_ust', ad: 'En etkili nedenler', siralanamaz: true, bicim: (v) => (v && v.length ? O.el('div', { class: 'ay-cipler' }, ...v.map((x) => O.el('span', { class: 'cip cip-bilgi', text: x.ad }))) : '—') },
      { k: '_tekrar', ad: 'Tekrar çalışır' }
    ],
    satirlar, sayfaBoyu: 12, siraNo: true, varsayilanSira: { k: '_t', y: 'azalan' }, araYer: 'Ad, departman, pozisyon ara…', araAlanlari: ['ad', 'departman', 'pozisyon'],
    satirTikla: (r) => ayrintiAc(KAYITLAR.find((x) => x.id === r.id) || r)
  });
  O.notlar(kok, [
    'Kaynak: ayrılış anketi yanıtları (canlı) · istifa listesi ve anket oranı: haftalık İK pano verisi' + (PANO_ETIKET ? ' (' + PANO_ETIKET + ')' : '') + '.',
    'Anket oranı: istifayla ayrılanlar (V.İ. ve stajyer hariç; deneme süresinde işçi feshi dahil) içinde anketi olanlar. Eşleştirme ad soyad ve çıkış tarihiyle yapılır.',
    '“Etkili” payı: 6’lı ölçekte “Etkili” ya da “Çok etkili” işaretleyenlerin, o soruyu yanıtlayanlara oranı.',
    KVKK_RET_HARIC ? 'Kişisel veri onayı: yanıtlarının anonim veri olarak kullanılmasını onaylamayan kişilerin yanıtları anket oranında sayılır, grafik ve istatistiklere dahil edilmez; ayrıntısını yalnız İK görür.' : null
  ].filter(Boolean));
  bitir(kok, kaydirma);
}
function bitir(kok, kaydirma) {
  if (!ILK) window.scrollTo({ top: kaydirma });
  ILK = false;
  window.__TEST_HAZIR = true;
}

function durumEkrani(baslik, metin) {
  acilisGizle();
  const kart = O.el('div', { class: 'durum-kart', role: 'alert' },
    O.el('span', { class: 'amblem', role: 'img', 'aria-label': 'İnciroğlu Otomotiv İK amblemi' }),
    O.el('div', { class: 'ust-etiket', text: 'İnciroğlu Otomotiv · İşten Ayrılış Anketleri' }),
    O.el('div', { class: 'durum-ikon hata', html: O.ikon('uyari') }), O.el('h2', { text: baslik }), O.el('p', { text: metin }));
  const eylem = O.el('div', { class: 'durum-eylem' },
    O.el('button', { type: 'button', class: 'btn', html: O.ikon('sifirla') + 'Yeniden dene', on: { click: () => location.reload() } }));
  kart.append(eylem, O.el('div', { class: 'durum-alt', text: AD + ' · ' + ROL_AD }));
  document.body.append(O.el('div', { class: 'durum-ekran' }, kart));
  window.__TEST_HAZIR = true;
}

/* ============================================================== VERİ */
O.grafikVarsayilan();
/* Grafik eksen etiketleri Inter ile ölçülsün (yazı tipi gelmeden ölçülürse uzun etiketin başı kesilir); en çok 2,5 sn beklenir */
try { await Promise.race([Promise.all([document.fonts.load('500 11.5px Inter'), document.fonts.load('600 11px Inter')]), new Promise((r) => setTimeout(r, 2500))]); } catch (e) { /* yazı tipi gelmezse sistem yazısı */ }
try {
  const s = await getDoc(doc(db, 'satisVeri', 'ikPano'));
  if (s.exists() && s.data().json) {
    const p = JSON.parse(s.data().json);
    AYRILANLAR = (p && p.D && Array.isArray(p.D.ayrilanlar)) ? p.D.ayrilanlar : [];
    PANO_ETIKET = (p && p.etiket && (p.etiket.short || p.etiket.label)) || '';
  }
} catch (e) { PANO_HATA = e; console.warn('İK pano verisi okunamadı', e); }

/* Art arda gelen canlı güncellemeler (ör. aktarımın 8'erli parçaları) tek çizimde birleştirilir; açık pencere varken
   çizim pencere kapanana kadar ertelenir */
let cizZaman = null;
function cizPlanla() {
  clearTimeout(cizZaman);
  cizZaman = setTimeout(() => { cizZaman = null; if (acik) { BEKLEYEN_CIZIM = true; return; } ciz(); acilisGizle(); }, ILK ? 0 : 250);
}
/* Direktör yalnız tamamlanmış yanıtları okur (kural da sorgunun bu süzgeçle yapılmasını ister); bekleyen bağlantıların
   kimliği gizli anahtardır, yalnız İK görür. */
onSnapshot(IK ? KOL : query(KOL, where('durum', '==', 'tamamlandi')), (snap) => {
  KAYITLAR = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
  const tam = KAYITLAR.filter((k) => k.durum === 'tamamlandi');
  if (!ILK) tam.filter((k) => !GORULEN.has(k.id) && k.kaynak === 'link').forEach((k) => O.bildirim('Yeni anket geldi: ' + O.trBaslik(k.ad)));
  tam.forEach((k) => GORULEN.add(k.id));
  cizPlanla();
}, (e) => {
  console.warn('Anketler okunamadı', e);
  durumEkrani('Anketler okunamadı', e && e.code === 'permission-denied'
    ? 'Bu sayfayı görme yetkiniz yok ya da güvenlik kuralı henüz yayınlanmadı. Yetki gerekiyorsa İnsan Kaynakları ile görüşün.'
    : 'Bağlantı sorunu olabilir. Sayfayı yenileyip tekrar deneyin.');
});
window.__AYRILIS = { kayitlar: () => KAYITLAR, ayrilanlar: () => AYRILANLAR, yil: () => YIL };
</script>
