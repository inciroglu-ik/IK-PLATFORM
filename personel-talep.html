<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personel Talepleri · İnciroğlu Otomotiv</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1b2d">
<link rel="icon" href="pano/amblem.svg" type="image/svg+xml">
<link rel="icon" href="pano/amblem-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pano/kokpit.css">
<link rel="stylesheet" href="pano/pano.css">
<style>
/* Personel Talepleri + Açık Pozisyonlar — İK Portalı kutucukları. Kabuk ve bileşenler İK Dashboard ile ortaktır. */
body.talep .ust-marka { display: flex; }
.pt-sekmeler { display: flex; gap: 4px; border-bottom: 1px solid var(--cizgi-2); margin: 0 0 18px; overflow-x: auto; scrollbar-width: none; }
.pt-sekmeler a { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 11px 14px; font-size: 14px; font-weight: 500; color: var(--metin-2); text-decoration: none; white-space: nowrap; }
.pt-sekmeler a:hover { color: var(--metin-1); }
.pt-sekmeler a.secili { color: var(--metin-marka); font-weight: 600; }
.pt-sekmeler a.secili::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--pir-500); }
.pt-sekmeler .ikon { width: 16px; height: 16px; }
.pt-sayi { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--pir-500); color: #fff; font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; }
.pt-sayi.sonuk { background: var(--n-150); color: var(--metin-2); }
.pt-arac { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 16px; }
.pt-arac .bosluk { margin-left: auto; }
.pt-arac .btn { height: 38px; }
.pt-bilgi { background: var(--lac-50); border: 1px solid var(--lac-100); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; color: var(--metin-2); line-height: 1.6; margin: 0 0 16px; }
.pt-bilgi.uyari { background: var(--uy-50); border-color: var(--uy-200); color: var(--uy-700); }
.pt-bilgi.hata { background: var(--ht-50); border-color: var(--ht-200); color: var(--ht-700); }
.pt-bilgi b { color: inherit; }
.pt-bilgi a { color: inherit; font-weight: 600; }
/* durum çipi */
.pt-durum { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pt-durum::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .85; }
.pt-durum.bekliyor { background: var(--pir-100); color: var(--pir-800); }
.pt-durum.onay { background: var(--ok-100); color: var(--ok-700); }
.pt-durum.revize { background: var(--uy-100); color: var(--uy-700); }
.pt-durum.red { background: var(--ht-100); color: var(--ht-700); }
.pt-durum.kapali { background: var(--ey-100); color: var(--ey-600); }
/* bekleyen listesi */
.pt-bekleyen { display: grid; gap: 10px; }
.pt-bekleyen-satir { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--cizgi-1); border-radius: 12px; background: #fff; text-decoration: none; color: inherit; transition: border-color .15s, box-shadow .15s; }
.pt-bekleyen-satir:hover { border-color: var(--pir-300); box-shadow: var(--gol-1); }
.pt-bekleyen-satir b { font-size: 15px; color: var(--metin-1); display: block; }
.pt-bekleyen-satir small { font-size: 12.5px; color: var(--metin-3); }
.pt-bekleyen-satir .btn { height: 34px; pointer-events: none; }
/* aşama şeridi */
.pt-serit { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; position: relative; }
.pt-adim { position: relative; display: grid; justify-items: center; text-align: center; gap: 4px; padding: 0 6px; min-width: 0; }
.pt-adim::before { content: ''; position: absolute; top: 15px; left: -50%; right: 50%; height: 2px; background: var(--n-200); z-index: 0; }
.pt-adim:first-child::before { display: none; }
.pt-adim.tamam::before, .pt-adim.red::before, .pt-adim.revize::before, .pt-adim.sirada::before { background: var(--pir-400); }
.pt-nokta { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px solid var(--n-200); color: var(--n-400); font-size: 13px; font-weight: 700; }
.pt-nokta .ikon { width: 15px; height: 15px; }
.pt-adim.tamam .pt-nokta { background: var(--pir-500); border-color: var(--pir-500); color: #fff; }
.pt-adim.sirada .pt-nokta { border-color: var(--pir-500); color: var(--pir-600); box-shadow: 0 0 0 5px var(--pir-100); }
.pt-adim.red .pt-nokta { background: var(--ht-600); border-color: var(--ht-600); color: #fff; }
.pt-adim.revize .pt-nokta { background: var(--uy-500); border-color: var(--uy-500); color: #fff; }
.pt-adim-ad { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--metin-3); }
.pt-adim-kisi { font-size: 13px; font-weight: 600; color: var(--metin-1); overflow-wrap: anywhere; }
.pt-adim-durum { font-size: 12px; color: var(--metin-3); }
.pt-adim.sirada .pt-adim-durum { color: var(--pir-700); font-weight: 600; }
.pt-adim.red .pt-adim-durum { color: var(--ht-700); font-weight: 600; }
.pt-adim.revize .pt-adim-durum { color: var(--uy-700); font-weight: 600; }
.pt-mini { display: inline-flex; gap: 4px; align-items: center; }
.pt-mini i { width: 9px; height: 9px; border-radius: 50%; background: var(--n-200); display: inline-block; }
.pt-mini i.tamam { background: var(--pir-500); }
.pt-mini i.sirada { background: #fff; box-shadow: inset 0 0 0 2px var(--pir-500); }
.pt-mini i.red { background: var(--ht-600); }
.pt-mini i.revize { background: var(--uy-500); }
/* form */
.pt-form { display: grid; gap: 16px; }
.pt-kart { border: 1px solid var(--cizgi-1); border-radius: 16px; background: var(--yuzey-kart, #fff); box-shadow: var(--gol-1); overflow: hidden; }
.pt-kart-ust { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 13px 18px; background: var(--n-50); border-bottom: 1px solid var(--cizgi-1); }
.pt-kart-ust h3 { margin: 0; font-family: var(--font-serif); font-size: 17px; font-weight: 600; color: var(--metin-marka); }
.pt-kart-ust small { font-size: 12.5px; color: var(--metin-3); }
.pt-kart-ust .sag { margin-left: auto; }
.pt-kart-govde { padding: 16px 18px 18px; }
.pt-izgara { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px 16px; }
.pt-alan { display: grid; gap: 6px; min-width: 0; grid-column: span 2; align-content: start; }
.pt-alan.s3 { grid-column: span 3; } .pt-alan.s4 { grid-column: span 4; } .pt-alan.s6 { grid-column: 1 / -1; }
.pt-etiket { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--metin-3); display: flex; gap: 6px; align-items: center; }
.pt-etiket .zorunlu { color: var(--ht-600); }
.pt-girdi { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; line-height: 1.45; color: var(--metin-1); border: 1px solid var(--cizgi-2); border-radius: 10px; padding: 8px 11px; background: #fff; min-height: 40px; }
textarea.pt-girdi { resize: vertical; min-height: 84px; }
select.pt-girdi { cursor: pointer; }
.pt-girdi:focus { outline: none; border-color: var(--pir-500); box-shadow: var(--odak-halkasi); }
.pt-girdi[disabled] { background: var(--n-50); color: var(--metin-3); }
.pt-tl { position: relative; }
.pt-tl .pt-girdi { padding-right: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.pt-tl::after { content: 'TL'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 600; color: var(--metin-3); pointer-events: none; }
.pt-ipucu { font-size: 12px; color: var(--metin-3); line-height: 1.45; }
.pt-hata { font-size: 12.5px; color: var(--ht-700); font-weight: 500; }
.pt-alan.hatali .pt-girdi, .pt-alan.hatali .pt-secenekler { border-color: var(--ht-500); box-shadow: 0 0 0 3px var(--ht-100); border-radius: 10px; }
.pt-secenekler { display: flex; flex-wrap: wrap; gap: 8px; border: 1px solid transparent; }
.pt-secenekler.dikey { display: grid; }
.pt-secenek { display: inline-flex; align-items: center; gap: 9px; padding: 8px 12px; border: 1px solid var(--cizgi-2); border-radius: 10px; background: #fff; cursor: pointer; font-size: 13.5px; color: var(--metin-1); line-height: 1.35; user-select: none; }
.pt-secenek:hover { border-color: var(--pir-300); }
.pt-secenek input { width: 17px; height: 17px; margin: 0; accent-color: var(--pir-500); flex: none; }
.pt-secenek.secili { border-color: var(--pir-500); background: var(--pir-50); box-shadow: inset 0 0 0 1px var(--pir-500); }
.pt-iki { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.pt-alt-baslik { font-size: 13px; font-weight: 700; color: var(--metin-1); margin: 4px 0 8px; }
.pt-grup { display: grid; gap: 10px; padding: 0 0 16px; margin: 0 0 16px; border-bottom: 1px dashed var(--cizgi-2); }
.pt-grup:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.pt-salt { font-size: 12.5px; color: var(--metin-3); background: var(--n-50); border: 1px dashed var(--cizgi-2); border-radius: 10px; padding: 9px 11px; }
.pt-alt-cubuk { position: sticky; bottom: 0; z-index: 25; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; margin-top: 4px; background: rgba(255,255,255,.97); backdrop-filter: blur(6px); border: 1px solid var(--cizgi-1); border-radius: 14px; box-shadow: 0 -6px 24px rgba(15,27,45,.08); }
.pt-alt-cubuk .not { font-size: 12.5px; color: var(--metin-3); margin-right: auto; min-width: 0; }
.pt-alt-cubuk .not b { color: var(--ht-700); }
.pt-alt-cubuk .btn { height: 40px; }
/* zincir önizleme / imzalar */
.pt-imzalar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.pt-imza { border: 1px solid var(--cizgi-1); border-radius: 12px; padding: 11px 12px; background: #fff; display: grid; gap: 4px; align-content: start; min-height: 92px; }
.pt-imza .ad { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--metin-3); }
.pt-imza b { font-size: 14px; color: var(--metin-1); overflow-wrap: anywhere; }
.pt-imza small { font-size: 12px; color: var(--metin-3); line-height: 1.4; overflow-wrap: anywhere; }
.pt-imza .karar { font-size: 12.5px; font-weight: 600; }
.pt-imza.tamam { border-color: var(--pir-200); background: var(--pir-50); }
.pt-imza.tamam .karar { color: var(--pir-700); }
.pt-imza.red { border-color: var(--ht-200); background: var(--ht-50); } .pt-imza.red .karar { color: var(--ht-700); }
.pt-imza.revize { border-color: var(--uy-200); background: var(--uy-50); } .pt-imza.revize .karar { color: var(--uy-700); }
.pt-imza.sirada { border-color: var(--pir-400); box-shadow: 0 0 0 3px var(--pir-100); }
.pt-imza .eksik { color: var(--ht-700); }
/* görüntüleme */
.pt-ozet-bas { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
.pt-ozet-bas h2 { margin: 0; font-family: var(--font-serif); font-size: 22px; font-weight: 600; color: var(--metin-marka); }
.pt-ozet-bas .no { font-size: 12.5px; font-weight: 700; color: var(--metin-3); letter-spacing: .05em; }
.pt-dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 18px; margin: 0; }
.pt-dl > div { min-width: 0; }
.pt-dl dt { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--metin-3); margin: 0 0 3px; }
.pt-dl dd { margin: 0; font-size: 14px; color: var(--metin-1); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.pt-dl .genis { grid-column: 1 / -1; }
.pt-dl .iki { grid-column: span 2; }
.pt-isaret { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.pt-isaret span { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--metin-3); }
.pt-isaret span i { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--n-300); display: inline-grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; }
.pt-isaret span.var { color: var(--metin-1); font-weight: 600; }
.pt-isaret span.var i { background: var(--pir-500); border-color: var(--pir-500); color: #fff; }
.pt-detay { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.pt-detay > aside { position: sticky; top: 12px; display: grid; gap: 14px; }
.pt-karar { border: 1px solid var(--pir-300); border-radius: 16px; background: #fff; box-shadow: 0 10px 30px -12px rgba(29,79,140,.35); overflow: hidden; }
.pt-karar-ust { background: linear-gradient(135deg, var(--lac-800), var(--lac-600)); color: #fff; padding: 14px 16px; }
.pt-karar-ust small { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #c8d6ea; }
.pt-karar-ust b { font-family: var(--font-serif); font-size: 18px; font-weight: 600; }
.pt-karar-govde { padding: 14px 16px 16px; display: grid; gap: 12px; }
.pt-karar .pt-secenek { width: 100%; box-sizing: border-box; }
.pt-karar .pt-secenek.onay.secili { border-color: var(--pir-500); background: var(--pir-50); }
.pt-karar .pt-secenek.red.secili { border-color: var(--ht-500); background: var(--ht-50); box-shadow: inset 0 0 0 1px var(--ht-500); }
.pt-karar .pt-secenek.revize.secili, .pt-karar .pt-secenek.erteleme.secili { border-color: var(--uy-500); background: var(--uy-50); box-shadow: inset 0 0 0 1px var(--uy-500); }
.pt-onay-kutu { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; color: var(--metin-2); line-height: 1.45; cursor: pointer; }
.pt-onay-kutu input { width: 17px; height: 17px; margin: 1px 0 0; accent-color: var(--pir-500); flex: none; }
.pt-karar .btn { height: 42px; justify-content: center; }
.pt-yan-kart { border: 1px solid var(--cizgi-1); border-radius: 14px; background: #fff; padding: 14px 16px; display: grid; gap: 10px; }
.pt-yan-kart h4 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--metin-3); }
.pt-yan-kart .btn { justify-content: flex-start; height: 38px; }
.pt-gecmis { display: grid; gap: 0; }
.pt-olay { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; position: relative; padding: 0 0 14px; }
.pt-olay::before { content: ''; position: absolute; left: 6px; top: 14px; bottom: 0; width: 2px; background: var(--n-150); }
.pt-olay:last-child::before { display: none; }
.pt-olay i { width: 14px; height: 14px; border-radius: 50%; background: var(--pir-500); margin-top: 3px; box-shadow: 0 0 0 3px var(--pir-100); }
.pt-olay b { font-size: 13.5px; color: var(--metin-1); font-weight: 600; display: block; }
.pt-olay small { font-size: 12px; color: var(--metin-3); }
.pt-olay p { margin: 4px 0 0; font-size: 13px; color: var(--metin-2); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--n-50); border-radius: 8px; padding: 6px 9px; }
/* ayar */
.pt-ayar-tablo { width: 100%; border-collapse: collapse; }
.pt-ayar-tablo th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--metin-3); padding: 8px 8px; border-bottom: 1px solid var(--cizgi-2); }
.pt-ayar-tablo td { padding: 7px 8px; border-bottom: 1px solid var(--cizgi-1); vertical-align: middle; }
.pt-ayar-tablo td.dep b { font-size: 13.5px; color: var(--metin-1); }
.pt-ayar-tablo td.dep small { display: block; font-size: 12px; color: var(--metin-3); }
.pt-ayar-tablo .pt-girdi { min-height: 36px; padding: 6px 9px; font-size: 13.5px; }
.pt-ayar-tablo tr.eksik td { background: var(--ht-50); }
.pt-ayar-tablo .btn { height: 34px; padding: 0 10px; }
/* modal */
.pt-modal-ort { position: fixed; inset: 0; z-index: 200; background: rgba(9,12,17,.48); display: grid; place-items: center; padding: 16px; }
.pt-modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #fff; border-radius: 16px; box-shadow: 0 30px 80px rgba(9,12,17,.4); }
.pt-modal-ust { padding: 16px 18px 6px; } .pt-modal-ust h3 { margin: 0; font-family: var(--font-serif); font-size: 19px; color: var(--metin-marka); }
.pt-modal-govde { padding: 8px 18px 6px; display: grid; gap: 12px; font-size: 14px; color: var(--metin-2); line-height: 1.55; }
.pt-modal-alt { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.pt-modal-alt .btn { height: 38px; }
/* yazdırma */
#baski { display: none; }
@media (max-width: 1100px) { .pt-detay { grid-template-columns: minmax(0, 1fr); } .pt-detay > aside { position: static; order: -1; } }
@media (max-width: 900px) {
  .pt-izgara { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pt-alan, .pt-alan.s3, .pt-alan.s4 { grid-column: span 2; } .pt-alan.s1y { grid-column: span 1; }
  .pt-iki { grid-template-columns: minmax(0, 1fr); } .pt-dl { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pt-dl .iki { grid-column: 1 / -1; }
  .pt-imzalar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .pt-dl { grid-template-columns: minmax(0, 1fr); } .pt-imzalar { grid-template-columns: minmax(0, 1fr); }
  .pt-serit .pt-adim-kisi { font-size: 11.5px; } .pt-serit .pt-adim-durum { font-size: 11px; } .pt-adim-ad { font-size: 9.5px; }
  .pt-kart-govde { padding: 14px 13px 15px; } .pt-alt-cubuk .btn { flex: 1 1 auto; justify-content: center; }
  .pt-bekleyen-satir { grid-template-columns: minmax(0, 1fr); }
}
@media print {
  @page { size: A4 portrait; margin: 11mm 12mm; }
  body > *:not(#baski) { display: none !important; }
  html, body { background: #fff !important; }
  #baski { display: block !important; }
}
#baski { font-family: Inter, Arial, sans-serif; color: #111; font-size: 10.5pt; }
#baski .b-ust { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #16294a; padding-bottom: 6px; }
#baski .b-marka { font-size: 15pt; font-weight: 700; color: #16294a; letter-spacing: -.01em; } #baski .b-marka span { font-weight: 400; }
#baski .b-tarih { font-size: 9.5pt; text-align: right; line-height: 1.5; }
#baski h1 { text-align: center; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 19pt; margin: 10px 0 2px; color: #16294a; letter-spacing: .02em; }
#baski h2 { font-size: 9.5pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #16294a; margin: 10px 0 5px; border-bottom: 1px solid #c9d3e2; padding-bottom: 2px; }
#baski .b-izgara { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px 8px; }
#baski .b-kutu { background: #eef1f5; border-radius: 8px; padding: 4px 8px; min-height: 22px; break-inside: avoid; }
#baski .b-kutu i { display: block; font-style: italic; font-size: 7.5pt; color: #555; text-transform: uppercase; letter-spacing: .03em; }
#baski .b-kutu span { font-size: 9.5pt; white-space: pre-wrap; overflow-wrap: anywhere; }
#baski .b-kutu.genis { grid-column: 1 / -1; }
#baski .b-sec { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 9.5pt; }
#baski .b-sec span::before, #baski .b-k { content: ''; display: inline-block; box-sizing: border-box; width: 9pt; height: 9pt; border: 1px solid #444; border-radius: 2px; margin-right: 4px; vertical-align: -1px; font-size: 7pt; line-height: 7.5pt; text-align: center; font-weight: 700; }
#baski .b-sec span.var::before, #baski .b-k.var { content: '✓'; background: #16294a; border-color: #16294a; color: #fff; }
#baski .b-k.var::after { content: '✓'; }
#baski .b-sec span.var { font-weight: 700; }
#baski .b-iki { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

<!--
  Personel Talepleri + Açık Pozisyonlar (İK Portalı) — 16.11.2026
  Akış: talep eden yönetici (müdür / yönetici / şef) → departman direktörü → İK Direktörü → CEO. Direktör ve İK Direktörü
  İK Portalı girişiyle kendi hesaplarıyla onaylar (e-postadaki bağlantı formu açar). Direktöre ve İK Direktörüne otomatik
  e-posta gider (epostaKuyrugu → ise-alim-sureci GitHub Actions). CEO sisteme girmez, e-posta almaz: kararını İK (İK rolü
  ya da talebin İK Direktörü) "CEO onay verdi / reddetti / erteledi / revize istedi" diye işaretler (kullanıcı kararı 16.11).
  CEO onayı işaretlenince talep acikPozisyonlar koleksiyonunda kendiliğinden açık pozisyon olur (Açık Pozisyonlar: ONAYLI);
  süreçteki talepler orada ONAY AŞAMASINDA, reddedilenler ONAYLI DEĞİL görünür.
  Koleksiyonlar: personelTalepFormlari, acikPozisyonlar, talepAyar/zincir. Kurallar: guvenlik/firestore.rules → PERSONEL TALEPLERİ.
  Seçenek listeleri ve form alanları: ortak/personel-talep.js (kuralla birebir).
-->
<body class="talep">

</div>

  <div class="ust-alan kokpit">
    <header class="ust-bant">
      <div class="ic ust-ic">
        <div class="ust-marka"><span class="amblem" role="img" aria-label="İnciroğlu Otomotiv İK amblemi"></span></div>
        <div class="uyg-ad"><span id="ustBaslik">Personel Talepleri</span><small id="ustAlt">İnsan Kaynakları</small></div>
        <div class="ust-sag" id="ustSag"></div>
      </div>
    </header>
    <div id="kaputYuva"></div>
  </div>
  <main class="ic icerik" id="icerik"></main>
</div>

<script type="module">
import { doc, getDoc, getDocs, setDoc, writeBatch, runTransaction, collection, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { db, kimlikBaslat, cikisYap, adBasliklari } from "./ortak/kimlik.js";
import * as O from "./pano/ortak.js";
import * as T from "./ortak/personel-talep.js";

const $ = (id) => document.getElementById(id);
const acilisMetni = (t) => { const e = $('acilis'); if (e) { const m = $('acilisMetin'); if (m) m.textContent = t; } };
const acilisGizle = () => { const a = $('acilis'); if (a) { a.classList.add('gizle'); setTimeout(() => a.remove(), 600); } };
const SVG = (yol) => '<svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + yol + '</svg>';
const IK_TIK = SVG('<path d="m5 12.5 4.2 4.2L19 7"/>');
const IK_CARPI = SVG('<path d="M6 6l12 12M18 6 6 18"/>');
const IK_DONUS = SVG('<path d="M4 9h11a5 5 0 0 1 0 10H9"/><path d="m8 5-4 4 4 4"/>');
const IK_SAAT = SVG('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>');
const IK_EKLE = SVG('<path d="M12 5v14M5 12h14"/>');
const IK_GERI = SVG('<path d="M15 6l-6 6 6 6"/>');
const IK_YAZDIR = SVG('<path d="M7 9V4.5h10V9"/><rect x="4" y="9" width="16" height="7.5" rx="1.5"/><path d="M7 14h10v5.5H7z"/>');
const IK_TALEP = SVG('<rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8h6M9 12h6M9 16h3.5"/>');
const IK_POZ = SVG('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 13h18"/>');
const IK_ZINCIR = SVG('<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="12" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8.3 7.2l7.4 3.6M8.3 16.8l7.4-3.6"/>');
const IK_POSTA = SVG('<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/>');

/* ============================================================== OTURUM */
const ROLLER = ['ik', 'direktor', 'satis_mudur', 'servis_mudur', 'idari_mudur', 'mudur'];
const ROL_ADI = { ik: 'İnsan Kaynakları', direktor: 'Direktör', satis_mudur: 'Satış Müdürü', servis_mudur: 'Servis Müdürü', idari_mudur: 'İdari Müdür', mudur: 'Departman Müdürü' };
const OTURUM = await kimlikBaslat({ uygulama: 'Personel Talepleri', roller: ROLLER });
const HESAP = OTURUM.hesap;
const HID = OTURUM.hid;
const IK = HESAP.roller.indexOf('ik') >= 0;
const HAM_AD = String(HESAP.ad || '');            /* kuraldaki hesap().ad ile birebir (onay ve geçmiş kayıtlarına bu yazılır) */
const AD = adBasliklari(HAM_AD);
const ANA_ROL = ROLLER.find((r) => HESAP.roller.indexOf(r) >= 0) || '';
const ROL_AD = ROL_ADI[ANA_ROL] || ANA_ROL;
acilisMetni('Talepler yükleniyor…');

/* ============================================================== DURUM */
let AYAR = null, AYAR_HAZIR = false, AYAR_HATA = null;
const TALEP = new Map(); let TALEP_HAZIR = false, TALEP_HATA = null;
const POZ = new Map(); let POZ_HAZIR = false, POZ_HATA = null;
let PERSONEL = [];
let HESAPLAR = null;            /* yalnız İK, onay zinciri ayarı için: [{pid, ad, roller}] (hesap kimliği hid ekranda/kayıtta kullanılmaz) */
/* TALEP KİMLİĞİ (pid): hesap kimliği (hid = TC özeti, TC'ye geri çevrilebilir) bu modülde HİÇBİR belgeye yazılmaz.
   Her yönetim hesabına İK bir kez rastgele kimlik verir: talepKimlik/{hid} = { pid }. Kişi yalnız kendi kaydını okur. */
let PID = '';
const yeniPid = () => 'p' + Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, '0')).join('');
/** İK: aktif yönetim hesaplarından talep kimliği olmayanlara kimlik verir; HESAPLAR listesini kurar */
async function talepKimlikleriHazirla() {
  const [hs, ks] = await Promise.all([getDocs(collection(db, 'hesaplar')), getDocs(collection(db, 'talepKimlik'))]);
  const pidler = new Map(); ks.forEach((d) => { const p = d.data() && d.data().pid; if (p) pidler.set(d.id, p); });
  const yazilacak = [], l = [];
  hs.forEach((d) => {
    const x = d.data() || {}; const roller = Array.isArray(x.roller) ? x.roller.slice() : [];
    if (x.aktif === false || !roller.some((r) => r !== 'calisan')) return;
    let p = pidler.get(d.id);
    if (!p) { p = yeniPid(); yazilacak.push([d.id, p]); }
    l.push({ pid: p, ad: String(x.ad || ''), roller, _h: d.id });
  });
  /* tek tek yazılır: aynı anda sayfayı açan başka bir İK kullanıcısı kimliği önce verdiyse (kural güncellemeye izin
     vermez) yalnız o kayıt düşer; sonra gerçek kimlikler yeniden okunur */
  if (yazilacak.length) {
    await Promise.allSettled(yazilacak.map(([h, p]) => setDoc(doc(db, 'talepKimlik', h), { pid: p, olusturma: serverTimestamp() })));
    const ks2 = await getDocs(collection(db, 'talepKimlik'));
    const gercek = new Map(); ks2.forEach((d) => { const p = d.data() && d.data().pid; if (p) gercek.set(d.id, p); });
    l.forEach((x) => { if (gercek.has(x._h)) x.pid = gercek.get(x._h); });
  }
  l.splice(0, l.length, ...l.filter((x) => /^p[0-9a-f]{32}$/.test(x.pid)));
  const ben = l.find((x) => x._h === HID); if (ben) PID = ben.pid;
  l.forEach((x) => { delete x._h; });
  HESAPLAR = l.sort((a, b) => O.trKarsilastir(a.ad, b.ad));
  return yazilacak.length;
}
try {
  if (IK) await talepKimlikleriHazirla();
  if (!PID) { const s = await getDoc(doc(db, 'talepKimlik', HID)); if (s.exists() && /^p[0-9a-f]{32}$/.test(String(s.data().pid || ''))) PID = s.data().pid; }
} catch (e) { console.warn('Talep kimliği okunamadı', e); }
let ED = null;                  /* açık form: { mod:'yeni'|'duzenle', id, form, depKey, denendi } */
let AY = null;                  /* açık onay zinciri düzenleyicisi (İK) */
let MESGUL = false;
const KARAR_TASLAK = new Map(); /* talep kimliği → { karar, not, ucretIk, kadroUygun, onay } (ekran yenilense de kaybolmaz) */
const EPOSTA_DURUM = new Map(); /* yalnız İK: kuyruk kimliği → durum */
const SUZ = { talep: 'hepsi', poz: 'acik' };

/* ============================================================== YARDIMCILAR */
const git = (h) => { if (location.hash === h) ciz(); else location.hash = h; };
const kisiAd = (ad) => T.trBaslik(ad || '');
const olay = (metin, not) => ({ zaman: Date.now(), kim: HAM_AD, olay: T.temiz(metin, 200), not: T.temiz(not || '', T.SINIR.not) });
const sirala = (a, b) => ((T.zamanCoz(b.guncelleme) || T.zamanCoz(b.olusturma) || 0) - (T.zamanCoz(a.guncelleme) || T.zamanCoz(a.olusturma) || 0));
const talepler = () => [...TALEP.values()].sort(sirala);
const pozisyonlar = () => [...POZ.values()].sort((a, b) => (T.zamanCoz(b.acilis) || 0) - (T.zamanCoz(a.acilis) || 0));
const depAdi = (t) => String(t.departman || '') + (t.bolum ? ' · ' + t.bolum : '');
/** Sıra bu oturumdaki kişide mi? (direktör ve İK Direktörü aşaması; CEO kararını İK işaretler, aşağıda) */
function siraBende(t) {
  const z = t.zincir || {};
  return (t.durum === 'direktor' && z.direktor && z.direktor.pid === PID)
    || (t.durum === 'ik' && z.ik && z.ik.pid === PID);
}
/** İK yetkisi bu talepte: İK rolü ya da talebin İK Direktörü (kural: ptIkYetkili) */
const ikYetkili = (t) => IK || !!(t && t.zincir && t.zincir.ik && t.zincir.ik.pid === PID);
/** CEO kararı işaretlenebilir mi? (CEO sisteme girmez; İK "CEO onay verdi" der) */
const ceoIsaretlenebilir = (t) => t.durum === 'ceo' && ikYetkili(t);
const talepEdenBenim = (t) => t.talepEden && t.talepEden.pid === PID;
const durumCip = (d, poz) => { const x = (poz ? T.POZ_DURUM : T.DURUM)[d] || { ad: d || '—', sinif: 'kapali' }; return O.el('span', { class: 'pt-durum ' + x.sinif, text: x.ad }); };
function asamaDurumu(t, kod) {
  const o = (t.onaylar || {})[kod];
  if (kod === 'talep') return { sinif: 'tamam', metin: 'Talebi oluşturdu' };
  if (o && o.karar) {
    const s = o.karar === 'onay' ? 'tamam' : o.karar === 'red' ? 'red' : 'revize';
    return { sinif: s, metin: T.KARAR_SONUC[o.karar] + (o.adina ? ' (İK işaretledi)' : ''), zaman: o.zaman };
  }
  if (t.durum === kod) return { sinif: 'sirada', metin: kod === 'ceo' ? 'CEO kararı bekleniyor' : 'Onay bekleniyor' };
  if (t.durum === 'iptal') return { sinif: '', metin: 'İptal edildi' };
  return { sinif: '', metin: T.surecteMi(t.durum) ? 'Sırada' : '—' };
}
/** İmza kutusundaki ad: kararı veren kişinin KENDİ kaydı (zincir sonradan değişse de imza atanın adı görünür);
    CEO kararını İK işaretlediyse CEO'nun adı (işaretleyen ayrıca yazılır); karar yoksa zincirdeki kişi */
function imzaAdi(t, kod) {
  if (kod === 'talep') return (t.talepEden || {}).ad || '';
  const o = (t.onaylar || {})[kod];
  if (o && o.karar && !o.adina && o.ad) return o.ad;
  return ((t.zincir || {})[kod] || {}).ad || '';
}
/** Alan sırasından bağımsız derin eşitlik (Firestore haritaları alfabetik sırayla döndürür) */
const sirali = (v) => (Array.isArray(v) ? v.map(sirali) : v && typeof v === 'object' ? Object.keys(v).sort().reduce((o, k) => (o[k] = sirali(v[k]), o), {}) : v);
const esitDerin = (a, b) => JSON.stringify(sirali(a)) === JSON.stringify(sirali(b));
/** Onay zinciri güncellenebilir mi? (kural: ptZincirYenile — imzalanmış aşamanın kişisi değişmez) */
function zincirYenilenebilir(t, z) {
  if (!z || !T.surecteMi(t.durum) || esitDerin(z, t.zincir)) return false;
  if (t.durum !== 'direktor' && !esitDerin(z.direktor, t.zincir.direktor)) return false;
  if (t.durum === 'ceo' && !esitDerin(z.ik, t.zincir.ik)) return false;
  return true;
}
function taslaklariSil() {
  try { Object.keys(localStorage).filter((k) => k.startsWith('pt-taslak-v1|' + PID + '|')).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* yok */ }
}
function seritEl(t) {
  const s = O.el('div', { class: 'pt-serit', role: 'list', 'aria-label': 'Onay aşamaları' });
  T.ASAMALAR.forEach((a, i) => {
    const d = asamaDurumu(t, a.kod);
    const kisi = imzaAdi(t, a.kod);
    const zaman = a.kod === 'talep' ? t.olusturma : d.zaman;
    const nokta = d.sinif === 'tamam' ? IK_TIK : d.sinif === 'red' ? IK_CARPI : d.sinif === 'revize' ? IK_DONUS : d.sinif === 'sirada' ? IK_SAAT : String(i + 1);
    s.append(O.el('div', { class: 'pt-adim ' + d.sinif, role: 'listitem' },
      O.el('span', { class: 'pt-nokta', html: nokta }),
      O.el('span', { class: 'pt-adim-ad', text: a.kisa }),
      O.el('span', { class: 'pt-adim-kisi', text: kisiAd(kisi) || '—' }),
      O.el('span', { class: 'pt-adim-durum', text: d.metin + (zaman ? ' · ' + T.zamanTR(zaman, false) : '') })));
  });
  return s;
}
function miniSerit(t) {
  const m = O.el('span', { class: 'pt-mini', title: T.durumAdi(t.durum) });
  T.ASAMALAR.forEach((a) => m.append(O.el('i', { class: asamaDurumu(t, a.kod).sinif })));
  return m;
}
/** Bu oturumun unvanı: aktif personel listesinden (yoksa rol adı) */
function benimKaydim() { const a = T.adAnahtari(HAM_AD); return PERSONEL.find((p) => T.adAnahtari(p.ad) === a) || null; }
const benimUnvan = () => T.temiz((benimKaydim() || {}).unvan || ROL_AD, 120);
/** E-posta kuyruğu kaydı. İÇERİK YAZILMAZ (konu ve gövde boş): gönderici (ise-alim-sureci scripts/eposta-kuyrugu.js)
    talep kaydından kendi şablonuyla üretir (scripts/personel-talep-eposta.js). Kural: ptEposta. */
function epostaKaydi(tur, t, id) {
  const z = t.zincir[tur];
  return {
    kime: z.eposta, kimeAd: T.temiz(kisiAd(z.ad), 120).replace(/[@,;"]/g, ' '), konu: '', html: '', sablon: tur,
    kaynak: 'personel-talebi', ilgili: id, durum: 'bekliyor', olusturma: serverTimestamp(), olusturan: HAM_AD
  };
}
function hataMetni(e) {
  const k = (e && e.code) || '';
  if (k === 'permission-denied') return 'Yetkiniz yok ya da güvenlik kuralı henüz yayınlanmamış. İnsan Kaynakları ile görüşün.';
  if (k === 'unavailable' || k === 'deadline-exceeded') return 'Bağlantı kurulamadı. İnternet bağlantınızı kontrol edip yeniden deneyin.';
  return (e && e.message) || 'Beklenmeyen bir hata oluştu.';
}

/* ---------------------------------------------------- modal */
function modal({ baslik, govde, dugmeler = [] }) {
  const ort = O.el('div', { class: 'pt-modal-ort', role: 'dialog', 'aria-modal': 'true', 'aria-label': baslik });
  const kutu = O.el('div', { class: 'pt-modal' }, O.el('div', { class: 'pt-modal-ust' }, O.el('h3', { text: baslik })), O.el('div', { class: 'pt-modal-govde' }, govde));
  const alt = O.el('div', { class: 'pt-modal-alt' });
  const kapat = () => { ort.remove(); document.removeEventListener('keydown', tus); };
  const tus = (e) => { if (e.key === 'Escape') kapat(); };
  dugmeler.forEach((d) => alt.append(O.el('button', { class: 'btn ' + (d.sinif || ''), type: 'button', html: d.html || O.esc(d.metin), on: { click: () => d.tikla ? d.tikla(kapat) : kapat() } })));
  kutu.append(alt); ort.append(kutu);
  ort.addEventListener('click', (e) => { if (e.target === ort) kapat(); });
  document.addEventListener('keydown', tus);
  document.body.append(ort);
  const ilk = kutu.querySelector('textarea, input, select'); if (ilk) setTimeout(() => ilk.focus(), 30);
  return { kapat, kutu };
}

/* ============================================================== VERİ */
const tq = IK ? collection(db, 'personelTalepFormlari') : query(collection(db, 'personelTalepFormlari'), where('pidler', 'array-contains', PID));
const pq = IK ? collection(db, 'acikPozisyonlar') : query(collection(db, 'acikPozisyonlar'), where('pidler', 'array-contains', PID));
let ZAMANLAYICI = null;
function guncellendi() {
  if (!(AYAR_HAZIR && TALEP_HAZIR && POZ_HAZIR)) return;
  acilisGizle();
  clearTimeout(ZAMANLAYICI);
  ZAMANLAYICI = setTimeout(() => {
    /* açık formdaki yazılanlar kaybolmasın: form ve ayar ekranı canlı veriyle yeniden çizilmez */
    const r = rota();
    if ((r.sayfa === 'yeni' || r.sayfa === 'duzenle') && ED) return;
    if (r.sayfa === 'ayar' && AY) return;
    ciz();
  }, 60);
}
onSnapshot(doc(db, 'talepAyar', 'zincir'), (s) => { AYAR = s.exists() ? s.data() : null; AYAR_HAZIR = true; guncellendi(); },
  (e) => { AYAR_HATA = e; AYAR_HAZIR = true; guncellendi(); });
if (IK || PID) {
  onSnapshot(tq, (qs) => { TALEP.clear(); qs.forEach((d) => TALEP.set(d.id, Object.assign({}, d.data(), { id: d.id }))); TALEP_HAZIR = true; TALEP_HATA = null; guncellendi(); },
    (e) => { TALEP_HATA = e; TALEP_HAZIR = true; guncellendi(); });
  onSnapshot(pq, (qs) => { POZ.clear(); qs.forEach((d) => POZ.set(d.id, Object.assign({}, d.data(), { id: d.id }))); POZ_HAZIR = true; POZ_HATA = null; guncellendi(); },
    (e) => { POZ_HATA = e; POZ_HAZIR = true; guncellendi(); });
} else { TALEP_HAZIR = POZ_HAZIR = true; }        /* talep kimliği yok: liste okunmaz (kural reddeder), ekranda açıklama çıkar */
getDoc(doc(db, 'oryantasyonAyar', 'personel')).then((s) => { if (s.exists() && Array.isArray(s.data().liste)) { PERSONEL = s.data().liste; guncellendi(); } }).catch(() => {});

/* ============================================================== YÖNLENDİRME */
function rota() {
  const h = (location.hash || '').replace(/\?.*$/, '').replace(/^#\/?/, '');
  const p = h.split('/').filter(Boolean);
  let id = p[1] || ''; try { id = decodeURIComponent(id); } catch (e) { id = ''; }
  return { sayfa: p[0] || 'talepler', id };
}
window.addEventListener('hashchange', () => {
  if (MESGUL) return;
  if (ED) { taslakYaz(true); ED = null; }
  AY = null;
  ciz();
  window.scrollTo(0, 0);
});

/* ============================================================== ÜST BANT + SEKMELER */
function ustBantKur(baslik) {
  $('ustBaslik').textContent = baslik;
  const sag = $('ustSag'); sag.textContent = '';
  const bas = AD.split(/\s+/).filter(Boolean);

function ciz() {
  const r = rota();
  O.grafikleriTemizle();
  const kok = O.el('section', { class: 'pg on', id: 'p-talep' });
  $('icerik').replaceChildren(kok);
  if (r.sayfa === 'yeni') formSayfasi(kok, 'yeni');
  else if (r.sayfa === 'duzenle' && TALEP.get(r.id)) formSayfasi(kok, 'duzenle', r.id);
  else if (r.sayfa === 'talep' && r.id) talepSayfasi(kok, r.id);
  else if (r.sayfa === 'pozisyonlar') pozisyonlarSayfasi(kok);
  else if (r.sayfa === 'pozisyon' && POZ.get(r.id)) pozisyonSayfasi(kok, r.id);
  else if (r.sayfa === 'ayar' && IK) ayarSayfasi(kok);
  else {
    if (r.sayfa !== 'talepler') history.replaceState(null, '', '#/talepler');
    taleplerSayfasi(kok);

}

/* cihazdaki taslak anahtarı talep kimliğiyle (hesap kimliği tarayıcıya da yazılmaz); kimlik yoksa taslak tutulmaz */
const TASLAK_ANAHTAR = (mod, id) => 'pt-taslak-v1|' + PID + '|' + mod + '|' + (id || '');
function taslakYaz(hemen) {
  if (!ED || !ED.kirli || !PID) return;
  const yaz = () => { try { localStorage.setItem(TASLAK_ANAHTAR(ED.mod, ED.id), JSON.stringify({ form: ED.form, depKey: ED.depKey, zaman: Date.now() })); } catch (e) { /* özel pencere */ } };
  if (hemen) yaz(); else { clearTimeout(taslakYaz.z); taslakYaz.z = setTimeout(yaz, 400); }
}
function taslakOku(mod, id) { try { return JSON.parse(localStorage.getItem(TASLAK_ANAHTAR(mod, id)) || 'null'); } catch (e) { return null; } }
function taslakSil(mod, id) { try { localStorage.removeItem(TASLAK_ANAHTAR(mod, id)); } catch (e) { /* yok */ } }
/** Varsayılan departman: personel listesindeki departman + unvandaki satış/servis ipucu */
function varsayilanDep() {
  const k = benimKaydim(); if (!k || !AYAR) return '';
  const adaylar = Object.keys(AYAR.departmanlar || {}).filter((key) => T.katla(AYAR.departmanlar[key].ad) === T.katla(k.dept));
  if (adaylar.length === 1) return adaylar[0];
  const u = T.katla(k.unvan);
  const b = /servis|hasar|teknisyen|mekanik/.test(u) ? 'servis' : /satis/.test(u) ? 'satis' : '';
  const x = adaylar.filter((key) => T.katla(AYAR.departmanlar[key].bolum) === b);
  return x.length === 1 ? x[0] : '';
}

/** Yeni talep ya da revize sonrası yeniden gönderim (kural: personelTalepFormlari create / ptYenidenGonder) */
async function talepGonder() {
  const f = T.formTemizle(ED.form);
  const dep = AYAR.departmanlar[ED.depKey];
  const z = T.zincirKur(AYAR, ED.depKey);
  const benDir = z.direktor.pid === PID;
  const durum = benDir ? 'ik' : 'direktor';
  const onaylar = benDir ? { direktor: { karar: 'onay', not: 'Talebi departmanın direktörü oluşturdu.', ad: HAM_AD, pid: PID, zaman: serverTimestamp(), adina: false } } : {};
  const alici = benDir ? 'ik' : 'direktor';
  const eposta = T.epostaGecerli(z[alici].eposta);
  const qref = eposta ? doc(collection(db, 'epostaKuyrugu')) : null;
  const temel = { durum, depKey: ED.depKey, departman: dep.ad, bolum: dep.bolum, form: f, ikDeg: {}, zincir: z, pidler: T.pidler(PID, z), onaylar };
  if (ED.mod === 'yeni') {
    const ref = doc(collection(db, 'personelTalepFormlari'));
    const t = Object.assign({ no: T.talepNo(ref.id) }, temel, {
      talepEden: { pid: PID, ad: HAM_AD, unvan: benimUnvan() },
      gecmis: [olay(benDir ? 'Talep oluşturuldu; direktör onayı verilerek İK Direktörüne gönderildi' : 'Talep oluşturuldu ve direktöre gönderildi')],
      surum: 1, olusturma: serverTimestamp(), guncelleme: serverTimestamp(), sonBildirim: qref ? qref.id : ''
    });
    const b = writeBatch(db);
    b.set(ref, t);
    if (qref) b.set(qref, epostaKaydi(alici, t, ref.id));
    await b.commit();
    return ref.id;
  }
  const ref = doc(db, 'personelTalepFormlari', ED.id);
  await runTransaction(db, async (tx) => {
    const s = await tx.get(ref);
    if (!s.exists()) throw new Error('Talep bulunamadı.');
    const o = s.data();
    if (o.durum !== 'revize' || !o.talepEden || o.talepEden.pid !== PID) throw new Error('Bu talep artık düzeltilemez (durumu değişti).');
    const yeni = Object.assign({}, o, temel, {
      gecmis: (o.gecmis || []).concat([olay('Talep düzeltildi ve yeniden gönderildi (' + ((o.surum || 1) + 1) + '. tur)')]),
      surum: (o.surum || 1) + 1, guncelleme: serverTimestamp(), sonBildirim: qref ? qref.id : (o.sonBildirim || '')
    });
    tx.set(ref, yeni);
    if (qref) tx.set(qref, epostaKaydi(alici, yeni, ED.id));
  });
  return ED.id;
}

async function kararGonder(t, asama, adina, btn, hataEl) {
  if (MESGUL) return;
  const tsl = KARAR_TASLAK.get(t.id) || {};
  const not = T.temiz(tsl.not || '', T.SINIR.not);
  const h = [];
  if (!tsl.karar) h.push('Kararınızı seçin.');
  if (tsl.karar && tsl.karar !== 'onay' && !not) h.push('Revize / ret / erteleme için gerekçe yazın.');
  let ikDeg = null;
  if (asama === 'ik' && tsl.karar === 'onay') {
    const n = T.sayiCoz(tsl.ucretIk);
    if (!isFinite(n) || n < 0 || n > T.UCRET_UST) h.push('İK ücret önerisini TL olarak yazın.');
    if (typeof tsl.kadroUygun !== 'boolean') h.push('Kadro planına uygunluğu işaretleyin.');
    ikDeg = { ucretIk: Math.round(n * 100) / 100, kadroUygun: tsl.kadroUygun };
  }
  if (!tsl.onay) h.push('Onay kutusunu işaretleyin.');
  if (h.length) { hataEl.textContent = h.join(' '); return; }
  hataEl.textContent = '';
  MESGUL = true; btn.disabled = true; btn.querySelector('span').textContent = 'Kaydediliyor…';
  try {
    await kararKaydet(t.id, asama, tsl.karar, not, ikDeg, adina);
    KARAR_TASLAK.delete(t.id);
    MESGUL = false;
    O.bildirim('Kararınız kaydedildi.');
    ciz();
  } catch (e) {
    MESGUL = false; btn.disabled = false; btn.querySelector('span').textContent = 'Kararı kaydet';
    console.error(e); hataEl.textContent = hataMetni(e);
  }
}
/** Karar (kural: ptKarar) — tek işlemde talep + gerekirse e-posta + CEO onayında açık pozisyon */
async function kararKaydet(id, asama, karar, not, ikDeg, adina) {
  const ref = doc(db, 'personelTalepFormlari', id);
  await runTransaction(db, async (tx) => {
    const s = await tx.get(ref);
    if (!s.exists()) throw new Error('Talep bulunamadı.');
    const o = s.data();
    if (o.durum !== asama) throw new Error('Bu talebin aşaması değişti; ekran yenilendi.');
    const sonraki = T.SONRAKI[asama][karar];
    const yeni = Object.assign({}, o, {
      durum: sonraki,
      onaylar: Object.assign({}, o.onaylar || {}, { [asama]: { karar, not, ad: HAM_AD, pid: PID, zaman: serverTimestamp(), adina: !!adina } }),
      gecmis: (o.gecmis || []).concat([olay(adina ? T.CEO_SECIM[karar] + ' (İK işaretledi)' : T.ASAMALAR.find((a) => a.kod === asama).ad + ' · ' + T.KARAR_SONUC[karar], not)]),
      guncelleme: serverTimestamp()
    });
    if (asama === 'ik' && karar === 'onay') yeni.ikDeg = ikDeg;
    /* e-posta yalnız direktör onayında İK Direktörüne (CEO'ya e-posta yok: CEO sisteme girmez) */
    const alici = karar === 'onay' && asama === 'direktor' ? 'ik' : null;
    let qref = null;
    if (alici && T.epostaGecerli(o.zincir[alici].eposta)) { qref = doc(collection(db, 'epostaKuyrugu')); yeni.sonBildirim = qref.id; }
    tx.set(ref, yeni);
    if (qref) tx.set(qref, epostaKaydi(alici, yeni, id));
    if (asama === 'ceo' && karar === 'onay') tx.set(doc(db, 'acikPozisyonlar', id), pozisyonKaydi(yeni, id));
  });
}
