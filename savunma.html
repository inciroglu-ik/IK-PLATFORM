<!--

  Müdür kendi ekibindeki çalışan için savunma talebi açar (ekip = Kolay İK Çalışan Listesi "Müdürlük" alanı; İK ekibi personel
  listesinden üretir: savunmaKadro/{hid}). Talep İK'ya düşer; Hukukçu şablonu (ortak/savunma.js; 27.11.2026'dan beri şirket hukuk biriminin
  formları) SAVUNMA TALEBİ'ni (+ m.109 tebliğ tutanağı) ve olay tespit tutanağını anında hazırlar, ofis sahibi "ofis" yazınca Ajan Ofisi'ndeki
  Hukukçu talebe özel gözden geçirir (ik/taslak, kaynak hukukcu). İK ekranında "İK Kontrol ve Hukuki Değerlendirme Notu" + kontrol listesi;
  "[… TEYİDİ GEREKLİ …]" işareti kalan belge onaylanamaz. Talep kapandıktan sonra İK isterse UYARI BİLDİRİMİ hazırlar (ik/uyari) ve
  tebliğ edildiğini işaretler (talep.uyari).
  İK belgeleri onaylayınca PDF'ler (pdfmake, tarayıcıda) ekler/ altına yazılır ve müdüre otomatik e-posta (ekli 2 PDF + yükleme
  bağlantısı) kuyruğa girer. Müdür imzalı belgeleri tarayıp PDF olarak yükler ya da "çalışan imtina etti" işaretler → talep kapanır,
  çalışanın direktörüne otomatik bilgilendirme e-postası gider. İK "fiziki evrak iletildi" işaretini ayrıca tutar; imtina tutanağını indirir.
  GÖRENLER: talebi açan müdür (kendi talepleri), direktörler (tümü; taslak ve onay PDF'leri hariç), İK ekibi (kurucu + savunmaAyar/erisim).
  Kişisel veri bu depoda YOKTUR; Firestore savunmalar koleksiyonundadır. Kurallar: guvenlik/firestore.rules → SAVUNMA TALEPLERİ.
-->

<script type="module">

let KADRO = null;
try { const s = await getDoc(doc(db, 'savunmaKadro', HID)); KADRO = s.exists() ? s.data() : null; } catch (e) { KADRO = null; }

/* ============================================================== DURUM */
const TALEP = new Map();
let TALEP_HAZIR = false, TALEP_HATA = null, ESLEME = null, MESGUL = false;   /* ESLEME_HATA aşağıda */
const F = { durum: 'acik', ara: '' };
const TASLAK = new Map();                /* id → { istem, tutanak, imtina, kaynak } (İK ekranında düzenlenen) */
const UYARI_TASLAK = new Map();          /* id → uyarı bildirimi taslağı (İK ekranında düzenlenen; yeniden çizimde kaybolmasın) */

function hataMetni(e) {
  const k = (e && e.code) || '';
  if (k === 'permission-denied') return 'Yetkiniz yok ya da güvenlik kuralı henüz yayınlanmamış. İnsan Kaynakları ile görüşün.';
  if (k === 'unavailable' || k === 'deadline-exceeded') return 'Bağlantı kurulamadı. İnternet bağlantınızı kontrol edip yeniden deneyin.';
  return (e && e.message) || 'Beklenmeyen bir hata oluştu.';
}
/* Hata penceresi + yetki tanısı (26.11.2026): kaybolan bildirim yerine pencere. Yetki hatasında hangi işlemin reddedildiği ve
   güvenlik kuralının bu oturumu İK ekibi sayıp saymadığı (savunmaAyar/erisim okunabiliyor mu) gösterilir. Kişisel veri yok:
   yalnız oturum sahibinin kendi adı. */
async function hataPenceresi(baslik, islem, e) {
  try { console.warn('[savunma]', islem, e && e.code, e && e.message); } catch (x) { /* yok */ }
  const tamam = [{ metin: 'Tamam', sinif: 'btn-lacivert' }];

  let kural = 'denetlenemedi';
  try { await getDoc(doc(db, 'savunmaAyar', 'erisim')); kural = 'var'; } catch (x) { kural = x && x.code === 'permission-denied' ? 'yok' : 'denetlenemedi'; }
  const listede = !!(ERISIM && Array.isArray(ERISIM.hidler) && ERISIM.hidler.indexOf(HID) >= 0);
  const yorum = kural === 'yok'
    ? (IKEKIP ? 'Sayfa sizi İK ekibi olarak açtı, ancak güvenlik kuralı şu anda bu oturumu İK ekibi saymıyor. Sağ üstten çıkış yapıp yeniden giriş yapın ve tekrar deneyin; sürerse bu pencerenin ekran görüntüsünü gönderin.'
      : 'Bu işlem yalnız Savunma İK ekibine açık. Kurulum İK hesabı Ayarlar › İK ekibi bölümünden sizi eklemeli.')
    : kural === 'var' ? 'Hesabınız güvenlik kuralına göre İK ekibinde; kayıt, kuralın veri denetimine takıldı. Bu pencerenin ekran görüntüsünü gönderin: hangi adımın takıldığı aşağıda yazıyor.'
      : 'Yetki denetimi yapılamadı (bağlantı). Sayfayı yenileyip tekrar deneyin.';
  modal({ baslik, govde: el('div', null, el('div', { text: yorum }), el('dl', { class: 'sv-dl', style: { marginTop: '10px' } },
    el('dt', { text: 'İşlem' }), el('dd', { text: islem }),
    el('dt', { text: 'Oturum' }), el('dd', { text: AD + (KURUCU ? ' · kurulum İK hesabı' : '') + (IKEKIP ? ' · sayfada İK ekibi' : '') }),
    el('dt', { text: 'İK ekibi listesinde' }), el('dd', { text: KURUCU ? 'gerekmiyor (kurulum hesabı)' : (listede ? 'evet' : 'hayır') }),
    el('dt', { text: 'Kurala göre İK yetkisi' }), el('dd', { text: kural }),
    el('dt', { text: 'Hata kodu' }), el('dd', { text: 'permission-denied' }))), dugmeler: tamam });

function zaman(ts) { try { const d = ts && typeof ts.toDate === 'function' ? ts.toDate() : (ts && ts.seconds ? new Date(ts.seconds * 1000) : (ts ? new Date(ts) : null)); return d && !isNaN(d) ? d : null; } catch (e) { return null; } }

function modal({ baslik, govde, dugmeler = [] }) {

let PDF_YUK = null;
function pdfHazir() {
  if (window.pdfMake && window.pdfMake.vfs) return Promise.resolve(window.pdfMake);
  if (PDF_YUK) return PDF_YUK;

  PDF_YUK = yukle('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js').then(() => yukle('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js')).then(() => window.pdfMake)
    .catch((e) => { PDF_YUK = null; throw e; });
  return PDF_YUK;
}

function base64Ac(b64, ad, indir) {
  const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);

  else { const a = el('a', { href: url, target: '_blank', rel: 'noopener' }); document.body.append(a); a.click(); a.remove(); }   /* yeni sekmede açılır (indirmeden) */
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function kapat(t, f, imtina, not, btn) {

  let b64 = '', boyut = 0, ad = '';

    try {
      const ilk = new Uint8Array(await f.slice(0, 4).arrayBuffer());
      if (!(ilk[0] === 0x25 && ilk[1] === 0x50 && ilk[2] === 0x44 && ilk[3] === 0x46)) { O.bildirim('Seçilen dosya geçerli bir PDF değil.'); return; }
      b64 = await new Promise((ok, ret) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => ret(r.error); r.readAsDataURL(f); });
    } catch (e) { O.bildirim('Dosya okunamadı: ' + ((e && e.message) || e)); return; }
    boyut = f.size; ad = (t.no + '_imzali_belgeler.pdf');
  }
  const soru = imtina ? 'Çalışanın imtina ettiği kaydedilecek ve çalışanın direktörüne otomatik bilgilendirme e-postası gidecek.' : 'Taranmış belge yüklenecek, talep tamamlanacak ve çalışanın direktörüne otomatik bilgilendirme e-postası gidecek.';

    kpt(); if (MESGUL) return; MESGUL = true; btn.disabled = true; btn.textContent = 'Kaydediliyor…';
    let adim = 'hazırlık';
    try {
      const parca = [];
      for (let i = 0; i < b64.length; i += 900000) parca.push(b64.slice(i, i + 900000));
      if (parca.length > 10) throw new Error('Dosya çok büyük.');
      for (let i = 0; i < parca.length; i++) { adim = 'taranmış belge yükleme (parça ' + (i + 1) + '/' + parca.length + ')'; await setDoc(doc(db, 'savunmalar', t.id, 'tarama', 'x_' + i), { veri: parca[i] }); }
      adim = 'talebi kapatma' + (t.direktorEposta ? ' + direktör e-postası' : '');
      const qref = t.direktorEposta ? doc(collection(db, 'epostaKuyrugu')) : null;
      const kap = { tur: imtina ? 'imtina' : 'tarama', ad: HAM_AD, zaman: serverTimestamp(), not: String(not || '').replace(/[<>]/g, '').trim().slice(0, S.SINIR.not) };

    } catch (e) { MESGUL = false; btn.disabled = false; btn.textContent = 'Yeniden dene'; hataPenceresi('Tamamlanamadı', 'Talebi tamamla › ' + adim + ' · ' + t.no + (imtina ? ' (imtina)' : ''), e); }

function arsivSayfasi(kok) {
  kaput('Savunma Arşivi', 'Çalışan bazında tüm savunma talepleri: tarih, başlık, durum ve uyarı bildirimleri. Aynı konudan ikinci savunma “tekrar” olarak işaretlenir (25/II-h ısrar).');

  const hAd = new Map(hesaplar.map((h) => [h.hid, h.ad]));
  const yonetici = hesaplar.filter((h) => h.aktif !== false && (h.roller || []).some((r) => ['mudur', 'satis_mudur', 'servis_mudur', 'idari_mudur', 'direktor'].indexOf(r) >= 0)).sort((a, b) => String(a.ad).localeCompare(String(b.ad), 'tr'));
  const adlar = S.yoneticiAdlari(personel);
  const ek = JSON.parse(JSON.stringify((ESLEME && ESLEME.ekMudurluk) || {}));
  const ep = Object.assign({}, (ESLEME && ESLEME.eposta) || {});

  /* (a) İK ekibi */
  const ekip = new Set((ERISIM && ERISIM.hidler) || [HID]);
  const ekipKart = el('section', { class: 'sv-kart' }, el('h3', { text: 'İK ekibi' }), el('div', { class: 'sv-kart-alt', text: 'Tüm talepleri, Hukukçu taslaklarını görür ve onaylar. Listeyi yalnız kurulum İK hesabı değiştirir (en çok 10 kişi).' }));
  const ekipListe = el('div'); ekipKart.append(ekipListe);
  const ekipCiz = () => { ekipListe.textContent = ''; ekip.forEach((h) => ekipListe.append(el('span', { class: 'sv-etiket' }, kisiAd(hAd.get(h) || h), KURUCU && h !== HID ? el('button', { type: 'button', 'aria-label': 'Çıkar', text: '×', on: { click: () => { ekip.delete(h); ekipCiz(); } } }) : null))); };
  ekipCiz();
  if (KURUCU) {
    const sec = el('select', { class: 'secim' }, el('option', { value: '', text: 'Kişi ekle…' }), ...hesaplar.filter((h) => h.aktif !== false).sort((a, b) => String(a.ad).localeCompare(String(b.ad), 'tr')).map((h) => el('option', { value: h.hid, text: kisiAd(h.ad) })));
    sec.addEventListener('change', () => { if (sec.value) { if (ekip.size >= 10) O.bildirim('En çok 10 kişi.'); else ekip.add(sec.value); sec.value = ''; ekipCiz(); } });
    ekipKart.append(el('div', { class: 'sv-dugmeler' }, sec, el('button', { class: 'btn btn-lacivert', type: 'button', text: 'İK ekibini kaydet', on: { click: async () => {
      try { ekip.add(HID); await setDoc(doc(db, 'savunmaAyar', 'erisim'), { hidler: Array.from(ekip).slice(0, 10), guncelleme: serverTimestamp(), guncelleyen: HAM_AD }); O.bildirim('İK ekibi kaydedildi.'); }
      catch (e) { hataPenceresi('Kaydedilemedi', 'İK ekibi listesi (' + Math.min(ekip.size, 10) + ' kişi)', e); }
    } } })));
  }
  form.append(ekipKart);

  /* (b) ekip listeleri */
  const kadroKart = el('section', { class: 'sv-kart' }, el('h3', { text: 'Ekip listeleri' }),
    el('div', { class: 'sv-kart-alt', text: 'Müdür, Kolay İK Çalışan Listesi’nde “Müdürlük” alanında adı yazan çalışanları görür. Kaynak: İK Sistemi personel listesi (' + personel.length + ' aktif çalışan). Vekâlet için müdüre ek müdürlük ekleyin.' }));
  const kadroSonuc = el('div', { class: 'sv-alt' });
  const satirlar = el('div');
  yonetici.forEach((h) => {
    const say = personel.filter((p) => [h.ad].concat(ek[h.hid] || []).map(S.adAnahtari).indexOf(S.adAnahtari(p.mudurluk)) >= 0 && S.adAnahtari(p.ad) !== S.adAnahtari(h.ad)).length;
    const etk = el('div');
    const etkCiz = () => { etk.textContent = ''; (ek[h.hid] || []).forEach((m) => etk.append(el('span', { class: 'sv-etiket' }, '+ ' + kisiAd(m), el('button', { type: 'button', text: '×', 'aria-label': 'Kaldır', on: { click: () => { ek[h.hid] = (ek[h.hid] || []).filter((x) => x !== m); if (!ek[h.hid].length) delete ek[h.hid]; etkCiz(); } } })))); };
    etkCiz();
    const sec = el('select', { class: 'secim' }, el('option', { value: '', text: 'Ek müdürlük (vekâlet)…' }), ...adlar.mudurlukler.filter((m) => S.adAnahtari(m) !== S.adAnahtari(h.ad)).map((m) => el('option', { value: m, text: kisiAd(m) })));
    sec.addEventListener('change', () => { if (sec.value) { ek[h.hid] = Array.from(new Set((ek[h.hid] || []).concat([sec.value]))).slice(0, 5); sec.value = ''; etkCiz(); } });
    satirlar.append(el('div', { class: 'sv-liste-satir' }, el('div', null, el('b', { text: kisiAd(h.ad) }), el('small', { text: (h.roller || []).map((r) => ROL_ADI[r] || r).join(', ') + ' · ekibinde ' + say + ' kişi' }), etk), sec));
  });
  kadroKart.append(satirlar);
  const kadroBtn = el('button', { class: 'btn btn-lacivert', type: 'button', text: 'Ekip listelerini güncelle', on: { click: async () => {
    if (!personel.length || !hesaplar.length) { O.bildirim('Personel ya da hesap listesi okunamadı.'); return; }
    kadroBtn.disabled = true; kadroBtn.textContent = 'Güncelleniyor…';
    let adim = 'e-posta/vekâlet kaydı';
    try {
      await eslemeKaydet(ep, ek);
      const K = S.kadroKur(personel, hesaplar, ek);
      adim = 'mevcut ekip listelerini okuma';
      const mevcut = await getDocs(collection(db, 'savunmaKadro'));
      /* Güvenlik kuralı her yazımda erişim listesini okur; toplu yazmada istek başına belge okuma sınırı (20) aşılmasın diye
         işlemler 4'erli parçalarla gönderilir (ayrilis.html / oryantasyon-sorumlu.html ile aynı yaklaşım). */
      const isler = Object.keys(K).map((hid) => (b) => b.set(doc(db, 'savunmaKadro', hid), Object.assign({}, K[hid], { guncelleme: serverTimestamp(), guncelleyen: HAM_AD })));
      mevcut.forEach((d) => { if (!K[d.id]) isler.push((b) => b.delete(d.ref)); });
      for (let i = 0; i < isler.length; i += 4) { adim = 'ekip listesi yazımı (' + (i / 4 + 1) + '/' + Math.ceil(isler.length / 4) + ')'; const b = writeBatch(db); isler.slice(i, i + 4).forEach((f) => f(b)); await b.commit(); }
      const kisi = Object.values(K).reduce((a, x) => a + x.liste.length, 0);
      const bagli = new Set(); Object.values(K).forEach((x) => x.liste.forEach((p) => bagli.add(S.adAnahtari(p.ad))));
      const sahipsiz = personel.filter((p) => p.mudurluk && !bagli.has(S.adAnahtari(p.ad))).length;
      kadroSonuc.textContent = Object.keys(K).length + ' yönetici için ekip listesi yazıldı (' + kisi + ' çalışan). Müdürlüğündeki kişinin portal hesabı olmayan ' + sahipsiz + ' çalışan listede yok.';
      O.bildirim('Ekip listeleri güncellendi.');
    } catch (e) { hataPenceresi('Güncellenemedi', 'Ekip listelerini güncelle › ' + adim, e); }
    kadroBtn.disabled = false; kadroBtn.textContent = 'Ekip listelerini güncelle';
  } } });
  kadroBtn.disabled = KAYIT_KAPALI;
  kadroKart.append(el('div', { class: 'sv-dugmeler' }, kadroBtn), kadroSonuc);
  form.append(kadroKart);

  /* (c) e-posta adresleri */
  const epKart = el('section', { class: 'sv-kart' }, el('h3', { text: 'E-posta adresleri' }), el('div', { class: 'sv-kart-alt', text: 'Onay e-postası talebi açan müdüre, kapanış bilgisi çalışanın direktörüne gider. Yalnız @inciroglu.com.tr adresleri.' }));
  const kisiler = new Map();
  yonetici.forEach((h) => kisiler.set(S.adAnahtari(h.ad), { ad: h.ad, tur: 'Yönetici' }));
  adlar.direktorler.forEach((d) => { const k = S.adAnahtari(d); if (!kisiler.has(k)) kisiler.set(k, { ad: d, tur: 'Direktör' }); else kisiler.get(k).tur = 'Direktör / yönetici'; });
  const epGirdi = new Map();
  Array.from(kisiler.entries()).sort((a, b) => String(a[1].ad).localeCompare(String(b[1].ad), 'tr')).forEach(([k, v]) => {
    const g = el('input', { class: 'girdi', type: 'email', value: ep[k] || '', placeholder: 'ad.soyad@inciroglu.com.tr' });
    epGirdi.set(k, g);
    epKart.append(el('div', { class: 'sv-liste-satir' }, el('div', null, el('b', { text: kisiAd(v.ad) }), el('small', { text: v.tur })), g));
  });
  const doldur = el('button', { class: 'btn', type: 'button', text: 'Personel Talepleri ayarlarından doldur', on: { click: async () => {
    try {
      const s = await getDoc(doc(db, 'talepAyar', 'zincir')); const z = s.exists() ? s.data() : {}; let n = 0;
      const koy = (kisi) => { if (!kisi || !kisi.ad || !S.epostaGecerli(kisi.eposta)) return; const g = epGirdi.get(S.adAnahtari(kisi.ad)); if (g && !g.value) { g.value = kisi.eposta; n++; } };
      Object.values(z.departmanlar || {}).forEach((d) => koy(d.direktor)); koy(z.ikDirektor);
      O.bildirim(n + ' adres dolduruldu. Kaydetmeyi unutmayın.');
    } catch (e) { O.bildirim('Okunamadı: ' + hataMetni(e)); }
  } } });
  const kaydet = el('button', { class: 'btn btn-lacivert', type: 'button', text: 'E-posta ve vekâletleri kaydet', on: { click: async () => {
    const yeni = {}; let bozuk = 0;
    epGirdi.forEach((g, k) => { const v = g.value.trim().toLowerCase(); if (!v) return; if (S.epostaGecerli(v)) yeni[k] = v; else bozuk++; });
    if (bozuk) { O.bildirim(bozuk + ' adres geçersiz (@inciroglu.com.tr olmalı).'); return; }
    try { await eslemeKaydet(yeni, ek); Object.keys(ep).forEach((x) => delete ep[x]); Object.assign(ep, yeni); O.bildirim('Kaydedildi.'); } catch (e) { hataPenceresi('Kaydedilemedi', 'E-posta ve vekâletler (' + Object.keys(yeni).length + ' adres)', e); }
  } } });
  kaydet.disabled = KAYIT_KAPALI;
  epKart.append(el('div', { class: 'sv-dugmeler' }, kaydet, doldur));
  form.append(epKart);
}
async function eslemeKaydet(eposta, ekMudurluk) {
  const temizEk = {}; Object.keys(ekMudurluk || {}).forEach((h) => { const l = (ekMudurluk[h] || []).filter(Boolean).slice(0, 5); if (l.length) temizEk[h] = l; });
  const veri = { eposta: eposta || {}, ekMudurluk: temizEk, guncelleme: serverTimestamp(), guncelleyen: HAM_AD };
  await setDoc(doc(db, 'savunmaAyar', 'esleme'), veri);
  ESLEME = { eposta: veri.eposta, ekMudurluk: temizEk };
}

if (TALEP_HAZIR) ciz();
setTimeout(() => { if (!TALEP_HAZIR) { acilisGizle(); ciz(); } }, 8000);
if (TEST_KANCA()) window.__SV = { S, TALEP, ciz, rota, IKEKIP: () => IKEKIP, KADRO: () => KADRO };
function TEST_KANCA() { return !!window.__TEST; }
</script>
</body>
</html>
