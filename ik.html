<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İnciroğlu İK · Personel Yönetim Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#132a44; --navy-2:#1c3d5f; --navy-900:#0c1c2e;
  --brass:#c9a227; --brass-2:#e0be4f;
  --page:#f1f4f7; --surface:#ffffff; --ink:#0e1b28; --ink-2:#52606b; --muted:#8a929b;
  --line:#e0e5ea; --line-2:#d5dbe1; --ok:#1b8a4b; --ok-bg:#eaf7ef; --bad:#c0392b; --bad-bg:#fbeceb;
  --warn:#b26a00; --warn-bg:#fff4e0; --blue:#2563eb; --blue-bg:#eef2fb;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
  --sb:244px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--page);color:var(--ink);line-height:1.5}
.hidden{display:none!important}
button{font-family:var(--font);cursor:pointer}
a{color:var(--navy-2);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cdd4db;border-radius:8px;border:2px solid var(--page)}
.sb{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.sb .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.sb .brand .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--navy-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;font-family:var(--serif)}
.sb .brand b{font-family:var(--serif);font-size:15px;color:var(--navy);line-height:1.15;font-weight:700}
.sb .brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:1px}
.sb nav{flex:1;overflow:auto;padding:8px 10px}
.sb .nav-sec{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.sb a.item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--ink-2);font-size:13.5px;font-weight:500;margin-bottom:1px}
.sb a.item:hover{background:var(--page);color:var(--navy)}
.sb a.item.on{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;font-weight:600;box-shadow:0 8px 18px -10px rgba(19,42,68,.8)}
.sb a.item svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sb a.item .cnt{margin-left:auto;font-size:10px;font-weight:700;background:#eef1f4;color:var(--ink-2);border-radius:20px;padding:1px 8px}
.sb a.item.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.sb .foot{padding:10px;border-top:1px solid var(--line)}
.sb .who{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px}
.sb .who .av{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brass),var(--brass-2));color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sb .who b{display:block;font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.15}.sb .who small{display:block;font-size:10.5px;color:var(--muted)}
.sb .lo{margin-top:4px;width:100%;text-align:left;background:none;border:none;color:var(--muted);font-size:12px;padding:7px 10px;border-radius:8px}
.sb .lo:hover{background:var(--bad-bg);color:var(--bad)}
.main{margin-left:var(--sb);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:60px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:20}
.topbar h1{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--navy)}
.topbar .sp{flex:1}
.gsearch{position:relative;width:min(300px,30vw)}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line-2);border-radius:9px;font-size:13px;outline:none;background:var(--page)}
.gsearch input:focus{border-color:var(--navy-2);background:#fff;box-shadow:0 0 0 3px rgba(28,61,95,.1)}
.gsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.content{flex:1;padding:24px 26px 70px;max-width:1380px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:0 1px 2px rgba(16,27,40,.04),0 2px 6px -3px rgba(16,27,40,.07)}.pad{padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 18px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(16,27,40,.04),0 2px 6px -3px rgba(16,27,40,.07)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--brass),var(--brass-2))}
.kpi .ic{width:36px;height:36px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.kpi .ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9}
.kpi .n{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--navy);line-height:1}
.kpi .l{font-size:11.5px;color:var(--ink-2);margin-top:5px;font-weight:600}
.kpi.warn .n{color:var(--warn)}.kpi.warn .ic{background:var(--warn)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sec-h h2{font-family:var(--serif);font-size:16.5px;font-weight:700;color:var(--navy)}.sec-h .mini{font-size:12px;color:var(--muted)}
.btn{border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy-2));box-shadow:0 8px 18px -12px rgba(19,42,68,.8);display:inline-flex;align-items:center;gap:7px}
.btn:hover{filter:brightness(1.1)}.btn.g{background:#fff;color:var(--navy);border:1px solid var(--line-2);box-shadow:none}.btn.sm{padding:7px 12px;font-size:12px}
.btn.ok{background:linear-gradient(135deg,#1b8a4b,#15713d)}.btn.bad{background:linear-gradient(135deg,#b23a2b,#c0392b)}.btn.warn{background:linear-gradient(135deg,#b26a00,#946100)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:7px 12px;border:1px solid var(--line-2);border-radius:9px;background:#fff;cursor:pointer;user-select:none}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:2px 10px;white-space:nowrap;background:#eef2f6;color:var(--navy-2);border:1px solid #dce6f0}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:#c7e8d4}.b-bad{background:var(--bad-bg);color:var(--bad);border-color:#f0cdc8}
.b-bol{background:#eef7f0;color:#1b6b3a;border-color:#cfe8d6}.b-warn{background:var(--warn-bg);color:var(--warn);border-color:#e9c48f}.b-gray{background:#f0f1f4;color:#6b7280;border-color:#e2e5ea}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line-2);border-radius:9px;font-size:14px;outline:none}
.search input:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(28,61,95,.1)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.sel{padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;font-size:13px;background:#fff;outline:none}
.empcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:14px}
.ec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;box-shadow:0 1px 2px rgba(16,27,40,.04),0 2px 6px -3px rgba(16,27,40,.07);transition:transform .16s,box-shadow .18s,border-color .16s}
.ec:hover{transform:translateY(-3px);box-shadow:0 16px 34px -20px rgba(15,26,32,.5);border-color:#cdd6df}
.ec .av{width:60px;height:60px;border-radius:14px;margin:0 auto 11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;font-family:var(--serif)}
.ec .nm{font-weight:600;color:var(--navy);font-size:13.5px;line-height:1.2}.ec .de{font-size:11.5px;color:var(--ink-2);margin-top:3px}.ec .em{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
table.tbl thead th{background:#f6f8fa;text-align:left;padding:11px 14px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
table.tbl thead th.srt{cursor:pointer}
table.tbl tbody td{padding:11px 14px;border-bottom:1px solid #eef1f4;vertical-align:middle}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tbody tr:nth-child(even) td{background:#fafbfc}
table.tbl tbody tr.clk{cursor:pointer}table.tbl tbody tr.clk:hover td{background:#eef3f8}
.ar{opacity:.5;font-size:10px;margin-left:3px}.mini{font-size:11.5px;color:var(--muted)}
.empty{padding:48px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.subtabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtab{border:none;background:none;padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--ink-2);border-bottom:2.5px solid transparent;white-space:nowrap}
.subtab.on{color:var(--navy);border-bottom-color:var(--brass)}
.pf-head{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.pf-av{width:82px;height:82px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:29px;color:#fff;font-family:var(--serif);flex:none;box-shadow:0 10px 22px -12px rgba(15,26,32,.55)}
.pf-head h2{font-family:var(--serif);font-size:23px;color:var(--navy);font-weight:700;line-height:1.15}.pf-head .sub{color:var(--ink-2);font-size:13.5px;margin-top:3px}
/* Çalışan kartı — iki sütun */
.pf-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:500}
.pf-back:hover{color:var(--navy)}
.pf-grid{display:grid;grid-template-columns:minmax(0,1fr) 324px;gap:18px;align-items:start}
.pf-main{min-width:0}
.pf-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.pf-side .card{padding:16px 18px}
.side-h{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);margin-bottom:13px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.mgr{display:flex;align-items:center;gap:11px}
.mgr .mgr-av{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;font-family:var(--serif);flex:none}
.mgr b{display:block;font-size:13.5px;color:var(--navy);font-weight:600;line-height:1.25;word-break:break-word}
.mgr small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.ci{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid #f0f2f5}
.ci:first-child{padding-top:0}.ci:last-child{border-bottom:none;padding-bottom:0}
.ci-ic{width:30px;height:30px;border-radius:8px;background:var(--page);display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.ci-ic svg{width:15px;height:15px;stroke:var(--navy-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ci-t{min-width:0;flex:1}
.ci-t small{display:block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ci-v{font-size:13px;color:var(--ink);font-weight:500;word-break:break-word}
.side-kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f0f2f5;font-size:13px}
.side-kv:first-child{padding-top:0}.side-kv:last-child{border-bottom:none;padding-bottom:0}
.side-kv span{color:var(--ink-2)}.side-kv b{color:var(--navy);font-weight:600}
@media(max-width:980px){.pf-grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin:18px 0 0;overflow-x:auto}
.tab{border:none;background:none;padding:11px 15px;font-size:13.5px;font-weight:600;color:var(--ink-2);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--brass)}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px 28px}
.fld-v .k{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.fld-v .v{font-size:14px;color:var(--ink);font-weight:500;word-break:break-word}.fld-v .v.em{color:var(--muted);font-style:italic;font-weight:400}
.grp{margin-bottom:18px}.grp>.gh{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brass);margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.ba-wrap{height:9px;background:#eceff3;border-radius:6px;overflow:hidden;margin:7px 0}
.ba-wrap i{display:block;height:100%}
.ovl{position:fixed;inset:0;background:rgba(12,28,46,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
.ovl.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.modal.wide{width:min(820px,100%)}
.modal .mh{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}
.modal .mh h3{font-family:var(--serif);font-size:19px;color:var(--navy)}.modal .mx{background:none;border:none;font-size:22px;color:var(--muted)}
.modal .mb{padding:18px 22px}.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.f{margin-bottom:12px}.f.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f label{display:block;font-size:11px;font-weight:700;color:var(--ink-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.f input,.f select,.f textarea{width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;font-size:14px;font-family:var(--font);outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(28,61,95,.1)}
.f .chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}.f .chk input{width:auto}
.menu{position:absolute;z-index:80;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 36px -12px rgba(0,0,0,.35);padding:5px;min-width:200px}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 11px;font-size:13px;color:var(--ink);border-radius:7px}
.menu button:hover{background:#f1f4f8}.menu button.dng{color:var(--bad)}.menu button.dng:hover{background:var(--bad-bg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px}
.cal .dc{min-height:92px;border:1px solid var(--line);border-radius:9px;padding:5px 6px;background:#fff;font-size:11px}
.cal .dc.off{background:#fafbfc;color:var(--muted)}.cal .dc .dn{font-weight:700;color:var(--ink-2);font-size:12px;margin-bottom:3px}
.cal .ev{font-size:10px;border-radius:5px;padding:1px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.rep-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.rc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;box-shadow:0 1px 2px rgba(16,27,40,.04),0 2px 6px -3px rgba(16,27,40,.07);transition:transform .15s,box-shadow .18s,border-color .16s}
.rc:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(15,26,32,.5);border-color:#cdd6df}
.rc .ic{width:40px;height:40px;border-radius:10px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.rc .ic svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:1.8}
.rc h3{font-size:14px;color:var(--navy);font-weight:700;margin-bottom:4px}.rc p{font-size:12px;color:var(--ink-2)}
.rc-kat{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);background:var(--blue-bg);border-radius:6px;padding:2px 8px;margin-bottom:9px}
.rb-grid{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr auto;gap:14px;align-items:end}
.rb-grid .f{margin:0}.rb-grid .rb-btn{display:flex}.rb-grid .rb-btn .btn{width:100%;white-space:nowrap}
.rb-grid select:disabled{background:#f0f2f5;color:var(--muted);cursor:not-allowed}
@media(max-width:760px){.rb-grid{grid-template-columns:1fr 1fr}.rb-grid .rb-btn{grid-column:1/-1}}
.pz{overflow:auto}.pz table{border-collapse:collapse;font-size:12px;white-space:nowrap}
.pz th,.pz td{border:1px solid var(--line);padding:5px 7px;text-align:center}.pz th{background:#f6f8fa;position:sticky;top:0}
.pz td.nm{text-align:left;font-weight:600;color:var(--navy);position:sticky;left:0;background:#fff;min-width:160px}
.pz .cell{cursor:pointer;min-width:30px}.pz .c-C{background:#eaf7ef;color:#15713d}.pz .c-I{background:#eef2fb;color:#2563eb}.pz .c-T{background:#fff4e0;color:#b26a00}.pz .c-R{background:#f6ecfb;color:#8e44ad}.pz .c-Y{background:#fff;color:#cbd2da}
.tag{display:inline-block;font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;background:#eef1f4;color:var(--ink-2)}
.gate{max-width:460px;margin:90px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px;text-align:center}
.gate h2{font-family:var(--serif);color:var(--navy);margin-bottom:8px}.gate p{color:var(--ink-2);font-size:14px;margin-bottom:16px}
@media(max-width:860px){ :root{--sb:0px} .sb{transform:translateX(-100%)} .main{margin-left:0} .f.two,.f.three{grid-template-columns:1fr} }
@media(max-width:560px){ .content{padding:18px 16px 60px} .topbar{padding:0 16px;gap:10px} .topbar h1{font-size:17px} .pad{padding:15px 16px} }
</style>
</head>
<body>

<div id="gate" class="gate hidden"><h2 id="gateH">Oturum bulunamadı</h2><p id="gateP">Bu sisteme İK Portalı üzerinden giriş yaparak ulaşabilirsiniz.</p><a class="btn" href="portal.html">İK Portalı'na git →</a></div>

<aside class="sb" id="sb">
  <div class="brand"><div class="mk">İH</div><div><b>İnciroğlu İK</b><small>Personel Yönetim Sistemi</small></div></div>
  <nav id="nav"></nav>
  <div class="foot"><div class="who"><div class="av" id="meAv">İK</div><div><b id="meAd">İnsan Kaynakları</b><small id="meRol">İK / Tam Yetki</small></div></div>

<script type="module">

/* ===== OTURUM (yalnız İK) ===== */

function trTitle(s){return trLower(s).split(/\s+/).map(w=>{if(!w)return w;const f=w.charAt(0);const up=(f==='i')?'İ':(f==='ı'?'I':f.toLocaleUpperCase('tr'));return up+w.slice(1);}).join(' ');}

/* ===== FIREBASE ===== */
const firebaseConfig={apiKey:"AIzaSyCWlB0nU-ETZxuo9xa6gG4VMYVu09P3fnE",authDomain:"yetenek-havuzu.firebaseapp.com",projectId:"yetenek-havuzu",storageBucket:"yetenek-havuzu.firebasestorage.app",messagingSenderId:"714642441227",appId:"1:714642441227:web:bf49ac51367c6d9437b30e"};

/* ===== DURUM ===== */
const SEED_AKTIF=(window.MR_AKTIF||[]), SEED_AYRILAN=(window.MR_AYRILAN||[]);
let AKTIF=[], AYRILAN=[], IZIN=[], HARC=[], PUAN={}, AYAR=null, TALEP=[], OZLUK={}, BAKIYE={};
/* Özlük (hassas) verisi ayrı doküman; TC'ye göre roster üstüne bindirilir */
function mergeOzluk(){
  if(!OZLUK||!Object.keys(OZLUK).length) return;
  [AKTIF,AYRILAN].forEach(arr=>arr.forEach(p=>{
    const o=OZLUK[p.tc]; if(!o) return;
    for(const k in o){ if(o[k]!=null && o[k]!=='' && (p[k]==null||p[k]==='')) p[k]=o[k]; }
  }));
}
/* İzin bakiyesi Kolay İK "Çalışan İzin Bakiye Raporu"ndan; KENDİMİZ HESAPLAMIYORUZ. TC->{hak,kull,kalan} */
function mergeBakiye(){
  if(!BAKIYE||!Object.keys(BAKIYE).length) return;
  [AKTIF,AYRILAN].forEach(arr=>arr.forEach(p=>{
    const b=BAKIYE[p.tc]; if(!b) return;
    p.izinHak=b.hak; p.izinKullanilan=b.kull; p.izinKalan=b.kalan;
  }));
}
let ST={q:'',durum:'aktif',dep:'',bol:'',sortCol:'ad',sortDir:1,view:'grid',izTab:'yaklasan',pzAy:ym(new Date()),tlTab:'bekliyor',tlTip:'',rapSel:'calisan',rapBirim:'',rapAy:0,rapYil:0,izAltTab:'ozet',izTur:''};
let pfTab='profil';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function nkey(s){return trLower(s).replace(/\s+/g,' ').trim();}
function dkey(s){const m=String(s||'').match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);if(!m)return 0;return (+m[3])*10000+(+m[2])*100+(+m[1]);}
function dObj(s){const m=String(s||'').match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);if(!m)return null;const d=new Date(+m[3],+m[2]-1,+m[1]);return isNaN(d)?null:d;}
function uid(p){return (p||'p')+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function trFromISO(s){try{const[y,m,d]=s.split('-');return d+'.'+m+'.'+y;}catch(e){return s;}}
function isoFromTR(s){const m=String(s).match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);if(!m)return '';return m[3].padStart(4,'20')+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
const AVC=['#2f6fed','#1b8a4b','#b26a00','#8e44ad','#c0392b','#0d9488','#4f46e5','#be123c','#0369a1','#7c3aa6','#ca8a04'];
function avColor(s){let h=0;for(const c of String(s)){h=(h*31+c.charCodeAt(0))>>>0;}return AVC[h%AVC.length];}
function initials(ad){const p=String(ad||'').trim().split(/\s+/);return ((p[0]||'?').charAt(0)+((p[p.length-1]||' ').charAt(0))).toLocaleUpperCase('tr');}
function kidemYil(giris){const d=dObj(giris);if(!d)return 0;return (new Date()-d)/(1000*3600*24*365.25);}
function calismaSuresi(giris){const d=dObj(giris);if(!d)return '—';const now=new Date();let y=now.getFullYear()-d.getFullYear(),m=now.getMonth()-d.getMonth(),gn=now.getDate()-d.getDate();if(gn<0){m--;gn+=new Date(now.getFullYear(),now.getMonth(),0).getDate();}if(m<0){y--;m+=12;}const parts=[];if(y>0)parts.push(y+' yıl');if(m>0)parts.push(m+' ay');parts.push(gn+' gün');return parts.join(' ');}
function allEmp(){return AKTIF.concat(AYRILAN);}
function empById(id){return AKTIF.find(x=>x.id===id)||AYRILAN.find(x=>x.id===id);}
function empAktifMi(id){return !!AKTIF.find(x=>x.id===id);}
function buYil(){return new Date().getFullYear();}
function yilEq(d,yy){const k=dkey(d);return !!k&&Math.floor(k/10000)===yy;}
/* Turnover/giriş-çıkış sayımına DAHİL EDİLMEYENLER: stajyer, analist öğrenci, departman V.İ. */
function turnoverHaric(p){const u=(p&&p.unvan||'').toLocaleLowerCase('tr');const d=(p&&p.departman||'').trim();return u.indexOf('staj')>=0||u.indexOf('öğrenci')>=0||d==='V.İ.'||d==='V.I.';}
function ayrilanBuYil(){return AYRILAN.filter(p=>yilEq(p.cikis,buYil())&&!turnoverHaric(p)).length;}
function girenBuYil(){return allEmp().filter(p=>yilEq(p.giris,buYil())&&!turnoverHaric(p)).length;}
/* Tüm talepler (izin+harcama+mesai/avans) birleşik görünüm */
function allTalepler(){
  const L=[];
  IZIN.forEach(z=>L.push({tip:'İzin',empAd:z.empAd,ozet:z.tur+' · '+z.gun+' gün',alt:(z.baslangic||'')+' → '+(z.bitis||''),tarih:z.baslangic,durum:z.durum,statusBadge:izinAsamaBadge(z),k:'izin',id:z.id}));
  HARC.forEach(h=>L.push({tip:'Harcama',empAd:h.empAd,ozet:h.tur+' · '+h.tutar+' TL',alt:h.aciklama||'',tarih:h.tarih,durum:h.durum,statusBadge:izinAsamaBadge(h),k:'harc',id:h.id}));
  TALEP.forEach(t=>L.push({tip:t.tip,empAd:t.empAd,ozet:t.ozet,alt:t.aciklama||'',tarih:t.tarih,durum:t.durum,statusBadge:izinAsamaBadge(t),k:'talep',id:t.id}));
  return L;
}
function bekleyenToplam(){return IZIN.filter(z=>z.durum==='bekliyor').length+HARC.filter(h=>h.durum==='bekliyor').length+TALEP.filter(t=>t.durum==='bekliyor').length;}

/* AYAR varsayılanları */
function ensureAyar(){
  const dist=f=>[...new Set(allEmp().map(p=>p[f]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'tr'));
  const d=AYAR||{};
  const pick=(key,der)=>(d[key]&&d[key].length)?d[key]:der;
  const sir=dist('sirket');
  return {
    sirketler:pick('sirketler',sir.length?sir:['İNCİROĞLU OTOMOTİV']),
    unvanlar:pick('unvanlar',dist('unvan')),
    departmanlar:pick('departmanlar',dist('departman')),
    bolumler:pick('bolumler',dist('bolum')),
    mudurlukler:pick('mudurlukler',dist('mudurluk')),
    direktorler:pick('direktorler',dist('direktor')),
    izinOnaylari:pick('izinOnaylari',dist('izinOnay')),
    harcamaOnaylari:pick('harcamaOnaylari',dist('harcamaOnay')),
    avansOnaylari:pick('avansOnaylari',dist('avansOnay')),
    mesaiOnaylari:pick('mesaiOnaylari',dist('mesaiOnay')),
    izinTurleri:pick('izinTurleri',['Yıllık İzin','Ücretsiz İzin','Rapor (İstirahat)','Mazeret İzni','Doğum İzni','Evlilik İzni','Ölüm İzni','İdari İzin']),
    harcamaTurleri:pick('harcamaTurleri',['Yol','Yemek','Konaklama','Akaryakıt','Ofis/Kırtasiye','Temsil/Ağırlama','Diğer']),
    yillikKural:(d.yillikKural&&d.yillikKural.length)?d.yillikKural:[{min:0,max:5,gun:14},{min:5,max:15,gun:20},{min:15,max:99,gun:26}]
  };
}
function yillikHak(giris){const y=kidemYil(giris);if(y<1)return 0;/* İş Kanunu md.53: 1 yılı doldurmadan yıllık izne hak kazanılmaz */const k=ensureAyar().yillikKural;for(const r of k){if(y>=r.min&&y<r.max)return r.gun;}return k.length?k[k.length-1].gun:14;}
function izinKullanilan(empId){return IZIN.filter(z=>z.empId===empId&&z.durum==='onaylandi'&&/yıllık/i.test(z.tur)).reduce((s,z)=>s+(+z.gun||0),0);}
/* İzin bakiyesi KENDİMİZ HESAPLAMIYORUZ — Kolay İK'nın kümülatif/mahsup mantığı var.
   Yalnız Kolay İK bakiye raporundan yüklenen değerleri (izinHak/izinKullanilan/izinKalan) gösteririz. */
function izinBakiye(emp){
  if(emp&&(emp.izinKalan!=null||emp.izinHak!=null)){
    const hak=(emp.izinHak!=null)?emp.izinHak:null;
    const kull=(emp.izinKullanilan!=null)?emp.izinKullanilan:null;
    const kalan=(emp.izinKalan!=null)?emp.izinKalan:((hak!=null&&kull!=null)?hak-kull:null);
    return {hak,kullanilan:kull,kalan,bilinmiyor:false};
  }
  return {hak:null,kullanilan:null,kalan:null,bilinmiyor:true};
}

/* ===== MENÜ ===== */
function NAVDEF(){return [
  {sec:'Genel'},
  {id:'',ad:'Ana Sayfa',svg:'<rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/>'},
  {id:'calisanlar',ad:'Çalışanlar',cnt:AKTIF.length,svg:'<circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/><path d="M21 21v-2a4 4 0 0 0-3-3.8"/>'},

/* ===== ROUTER ===== */
function route(){ const h=(location.hash||'#/').replace(/^#\//,''); const parts=h.split('/'); return {page:parts[0]||'', arg:parts[1]||''}; }

const TITLES={'':'Ana Sayfa',calisanlar:'Çalışanlar',calisan:'Çalışan Kartı',talepler:'Talepler',izinler:'İzinler',takvim:'Takvim',harcamalar:'Harcamalar',puantaj:'Puantaj',raporlar:'Raporlar',ayarlar:'Ayarlar'};

/* ===== BOOT ===== */
function sub(ref,cb){ onSnapshot(ref,s=>{cb(s.exists()?s.data():null);},e=>console.error(e)); }
let ready=0;
function boot(){
  bindGlobal();
  sub(refPers,d=>{ if(d&&(Array.isArray(d.aktif)||Array.isArray(d.ayrilan))){AKTIF=d.aktif||[];AYRILAN=d.ayrilan||[];} else {AKTIF=SEED_AKTIF.slice();AYRILAN=SEED_AYRILAN.slice();setDoc(refPers,{aktif:AKTIF,ayrilan:AYRILAN,guncelleme:new Date().toISOString(),_init:true},{merge:true}).catch(()=>{});} mergeOzluk(); mergeBakiye(); ready=1; render(); });
  sub(refOzluk,d=>{ OZLUK=(d&&d.veri)?d.veri:{}; mergeOzluk(); if(ready)render(); });
  sub(refIzinBakiye,d=>{ BAKIYE=(d&&d.veri)?d.veri:{}; mergeBakiye(); if(ready)render(); });
  sub(refIzin,d=>{ IZIN=(d&&Array.isArray(d.izinler))?d.izinler:[]; if(ready)render(); });
  sub(refHarc,d=>{ HARC=(d&&Array.isArray(d.harcamalar))?d.harcamalar:[]; if(ready)render(); });
  sub(refPuan,d=>{ PUAN=(d&&d.veri)?d.veri:{}; if(ready)render(); });
  sub(refAyar,d=>{ AYAR=d||null; if(ready)render(); });
  sub(refTalep,d=>{ TALEP=(d&&Array.isArray(d.talepler))?d.talepler:[]; if(ready)render(); });
}
/* Özlük verisini Firestore'a yükleme kancası (yalnız İK; CDP ile toplu yükleme için) */
window.__seedOzluk=async function(veri){ if(!IS_IK) throw new Error('yetki yok'); await setDoc(refOzluk,{veri,guncelleme:new Date().toISOString()},{merge:false}); OZLUK=veri; mergeOzluk(); if(ready)render(); return Object.keys(veri).length; };
window.__seedBakiye=async function(veri){ if(!IS_IK) throw new Error('yetki yok'); await setDoc(refIzinBakiye,{veri,guncelleme:new Date().toISOString()},{merge:false}); BAKIYE=veri; mergeBakiye(); if(ready)render(); return Object.keys(veri).length; };
/* Bir kerelik: şişmiş mrPersonel'deki zengin alanları mrOzluk'a taşı, sonra mrPersonel'i yalın yaz (veri kaybı yok) */
window.__leanMigrate=async function(){ if(!IS_IK) throw new Error('yetki yok');
  [...AKTIF,...AYRILAN].forEach(p=>{ if(!p.tc)return; const o=Object.assign({},OZLUK[p.tc]||{}); for(const k in p){ if(ROSTER_BASE.indexOf(k)<0 && p[k]!=null && p[k]!=='') o[k]=p[k]; } OZLUK[p.tc]=o; });
  await kaydetOzluk(); await kaydetPers(); return 'ozluk='+Object.keys(OZLUK).length+' aktif='+AKTIF.length+' ayrilan='+AYRILAN.length; };
/* mrPersonel YALIN tutulur (Firestore 1MB limiti): yalnız temel roster alanları yazılır.
   Zengin özlük alanları mrOzluk'ta (OZLUK) saklanır; her açılışta mergeOzluk ile bindirilir. */
const ROSTER_BASE=['id','ad','tc','giris','cikis','departman','bolum','unvan','mudurluk','direktor','yonetici','calismaSekli','sirket','ayrilmaNedeni','calismaSuresi','sozlesmeTuru','sozlesmeBitis','pozBaslama','pozGecmisi'];
function leanRec(p){const o={};ROSTER_BASE.forEach(k=>{if(p[k]!=null&&p[k]!=='')o[k]=p[k];});return o;}
async function kaydetPers(){ try{await setDoc(refPers,{aktif:AKTIF.map(leanRec),ayrilan:AYRILAN.map(leanRec),guncelleme:new Date().toISOString()},{merge:true});}catch(e){alert('Kaydedilemedi: '+e.message);} }

/* Bir çalışanın zengin özlük alanlarını OZLUK[tc]'ye yaz + mrOzluk'a kaydet + yerel bindir */
async function ozlukGuncelle(tc,alanlar){ if(!tc)return; const o=Object.assign({},OZLUK[tc]||{}); for(const k in alanlar){ o[k]=alanlar[k]; } OZLUK[tc]=o; const emp=[...AKTIF,...AYRILAN].find(x=>x.tc===tc); if(emp){ for(const k in alanlar){ emp[k]=alanlar[k]; } } await kaydetOzluk(); }
async function kaydetIzin(){ try{await setDoc(refIzin,{izinler:IZIN,guncelleme:new Date().toISOString()},{merge:true});}catch(e){alert('Kaydedilemedi: '+e.message);} }
async function kaydetHarc(){ try{await setDoc(refHarc,{harcamalar:HARC,guncelleme:new Date().toISOString()},{merge:true});}catch(e){alert('Kaydedilemedi: '+e.message);} }
async function kaydetPuan(){ try{await setDoc(refPuan,{veri:PUAN,guncelleme:new Date().toISOString()},{merge:true});}catch(e){alert('Kaydedilemedi: '+e.message);} }
async function kaydetAyar(a){ try{await setDoc(refAyar,Object.assign({guncelleme:new Date().toISOString()},a),{merge:true});}catch(e){alert('Kaydedilemedi: '+e.message);} }
async function kaydetTalep(){ try{await setDoc(refTalep,{talepler:TALEP,guncelleme:new Date().toISOString()},{merge:true});}catch(e){alert('Kaydedilemedi: '+e.message);} }

/* ===== ANA SAYFA ===== */
function depDagilim(){const o={};AKTIF.forEach(p=>{const d=p.departman||'—';o[d]=(o[d]||0)+1;});return Object.entries(o).sort((a,b)=>b[1]-a[1]);}
function bolDagilim(){const o={};AKTIF.forEach(p=>{const d=p.bolum||'—';o[d]=(o[d]||0)+1;});return Object.entries(o).sort((a,b)=>b[1]-a[1]);}
function yaklasanIzin(){const bugun=new Date();bugun.setHours(0,0,0,0);const son=new Date(bugun);son.setDate(son.getDate()+30);return IZIN.filter(z=>z.durum==='onaylandi').map(z=>({z,d:dObj(z.baslangic)})).filter(x=>x.d&&x.d>=bugun&&x.d<=son).sort((a,b)=>a.d-b.d).slice(0,8);}
function viewAna(){
  const dep=depDagilim(),bol=bolDagilim();
  const bekizin=IZIN.filter(z=>z.durum==='bekliyor').length, bekharc=HARC.filter(h=>h.durum==='bekliyor').length;
  const kpi=(svg,n,l,w)=>'<div class="kpi'+(w?' warn':'')+'"><div class="ic"><svg viewBox="0 0 24 24">'+svg+'</svg></div><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';
  const bolRow=bol.map(([k,v])=>{const pct=AKTIF.length?Math.round(v/AKTIF.length*100):0;return '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><b style="color:var(--navy)">'+esc(k)+'</b><span style="color:var(--muted)">'+v+' kişi · %'+pct+'</span></div><div class="ba-wrap"><i style="width:'+pct+'%;background:linear-gradient(90deg,var(--navy),var(--navy-2))"></i></div></div>';}).join('');
  const yak=yaklasanIzin();

  const adName='İK Ekibi';
  return '<div style="margin-bottom:18px"><div style="font-family:var(--serif);font-size:22px;color:var(--navy);font-weight:700">Hoş geldiniz, '+adName+'</div><div style="color:var(--ink-2);font-size:13.5px;margin-top:3px">'+new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div></div>'
    +'<div class="kpis">'
    +kpi('<circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>',AKTIF.length,'Aktif Çalışan')
    +kpi('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',ayrilanBuYil(),'İşten Ayrılan ('+buYil()+')')
    +kpi('<path d="M3 11l19-9-9 19-2-8-8-2z"/>',bekizin,'Bekleyen İzin',bekizin>0)
    +kpi('<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>',bekharc,'Bekleyen Harcama',bekharc>0)
    +kpi('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/>',dep.length,'Departman')
    +'</div>'
    +'<div class="grid2">'
    +'<div class="card pad"><div class="sec-h"><h2>Departman Dağılımı</h2><span class="mini">'+AKTIF.length+' aktif çalışan</span></div><div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap"><div style="width:220px;height:220px;flex:none"><canvas id="depChart"></canvas></div><div style="flex:1;min-width:170px;max-height:230px;overflow:auto" id="depLeg"></div></div></div>'
    +'<div><div class="card pad" style="margin-bottom:18px"><div class="sec-h"><h2>Yaklaşan İzinler</h2></div>'+yakHtml+'</div>'
    +'<div class="card pad"><div class="sec-h"><h2>Bölüm Dağılımı</h2></div>'+(bolRow||'<div class="mini">—</div>')+'</div></div>'
    +'</div>';
}

/* ===== ÇALIŞANLAR ===== */
function listesi(){return ST.durum==='aktif'?AKTIF:AYRILAN;}
function filtreli(){
  const q=nkey(ST.q);
  let L=listesi().filter(p=>(!q||nkey(p.ad).indexOf(q)>=0)&&(!ST.dep||p.departman===ST.dep)&&(!ST.bol||p.bolum===ST.bol));
  const c=ST.sortCol,d=ST.sortDir;
  return L.slice().sort((a,b)=>{let r;if(c==='giris'||c==='cikis')r=dkey(a[c])-dkey(b[c]);else r=String(a[c]||'').localeCompare(String(b[c]||''),'tr');return r*d;});
}
function viewCalisanlar(){
  const ay=ensureAyar();
  const L=filtreli();
  let body=!L.length?'<div class="card"><div class="empty">Kayıt bulunamadı.</div></div>':(ST.view==='grid'?'<div class="empcards">'+L.map(cardHtml).join('')+'</div>':tableHtml(L));
  return '<div class="toolbar">'
    +'<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="lq" placeholder="İsimle ara…" value="'+esc(ST.q)+'"></div>'
    +'<select class="sel" id="fDurum"><option value="aktif"'+(ST.durum==='aktif'?' selected':'')+'>Aktif Çalışanlar ('+AKTIF.length+')</option><option value="ayrilan"'+(ST.durum==='ayrilan'?' selected':'')+'>İşten Ayrılanlar ('+AYRILAN.length+')</option></select>'
    +'<select class="sel" id="fDep"><option value="">Tüm Departmanlar</option>'+ay.departmanlar.map(d=>'<option'+(ST.dep===d?' selected':'')+'>'+esc(d)+'</option>').join('')+'</select>'
    +'<select class="sel" id="fBol"><option value="">Tüm Bölümler</option>'+ay.bolumler.map(d=>'<option'+(ST.bol===d?' selected':'')+'>'+esc(d)+'</option>').join('')+'</select>'
    +'<div class="chip'+(ST.view==='grid'?' on':'')+'" data-view="grid">Kart</div><div class="chip'+(ST.view==='list'?' on':'')+'" data-view="list">Liste</div>'
    +'<button class="btn" id="btnNew">+ Yeni Çalışan</button></div>'
    +'<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">'+L.length+' kişi gösteriliyor</div>'+body;
}
function cardHtml(p){return '<div class="ec" data-id="'+esc(p.id)+'"><div class="av" style="background:'+avColor(p.ad)+'">'+esc(initials(p.ad))+'</div><div class="nm">'+esc(trTitle(p.ad))+'</div><div class="de">'+esc(p.departman||'—')+' · '+esc(p.bolum||'—')+'</div><div class="em">'+esc(p.unvan||'')+'</div></div>';}
function th(c,l){const on=ST.sortCol===c;return '<th class="srt" data-sort="'+c+'">'+l+'<span class="ar">'+(on?(ST.sortDir>0?'▲':'▼'):'')+'</span></th>';}
function tableHtml(L){const ayr=ST.durum==='ayrilan';return '<div class="card" style="overflow:auto"><table class="tbl"><thead><tr>'+th('ad','Ad Soyad')+th('departman','Departman')+th('bolum','Bölüm')+th('unvan','Unvan')+th('mudurluk','Müdür')+th('direktor','Direktör')+th('giris','İşe Giriş')+(ayr?th('cikis','İşten Çıkış')+'<th>Ayrılma Nedeni</th>':'')+'</tr></thead><tbody>'+L.map(p=>'<tr class="clk" data-id="'+esc(p.id)+'"><td><div style="display:flex;align-items:center;gap:10px"><div style="width:30px;height:30px;border-radius:8px;font-size:11px;background:'+avColor(p.ad)+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">'+esc(initials(p.ad))+'</div><b style="color:var(--navy);font-weight:600">'+esc(trTitle(p.ad))+'</b></div></td><td><span class="badge">'+esc(p.departman||'—')+'</span></td><td><span class="badge b-bol">'+esc(p.bolum||'—')+'</span></td><td>'+esc(p.unvan||'—')+'</td><td class="mini">'+esc(p.mudurluk?trTitle(p.mudurluk):'—')+'</td><td class="mini">'+esc(p.direktor?trTitle(p.direktor):'—')+'</td><td class="mini">'+esc(p.giris||'')+'</td>'+(ayr?'<td style="color:var(--bad)">'+esc(p.cikis||'')+'</td><td class="mini">'+esc(p.ayrilmaNedeni||'')+'</td>':'')+'</tr>').join('')+'</tbody></table></div>';}

/* ===== ÇALIŞAN KARTI ===== */
function fv(k,v,em){return '<div class="fld-v"><div class="k">'+k+'</div><div class="v'+(em?' em':'')+'">'+(v&&String(v).length?v:(em||'—'))+'</div></div>';}
function miniTbl(cols,rows){return '<div class="card" style="overflow:auto"><table class="tbl"><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+r.map(c=>'<td>'+(c==null?'':c)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+cols.length+'" class="empty">Kayıt yok.</td></tr>')+'</tbody></table></div>';}
function gunNum(g){return +String(g==null?'':g).replace(/[^\d.]/g,'')||0;}
function izinKullanilanTum(emp){let s=izinKullanilan(emp.id);(emp.izinler||[]).forEach(z=>{if(/yıl/i.test(z.tur||'')&&/onay/i.test(z.durum||''))s+=gunNum(z.gun);});return s;}
/* Bu kişiye bağlı astlar (müdürlük/direktör/yönetici = bu kişi) */
function astlari(p){const ad=trLower(p.ad||'');if(!ad)return [];return AKTIF.filter(x=>x.id!==p.id&&(trLower(x.mudurluk||'')===ad||trLower(x.direktor||'')===ad||trLower(x.yonetici||'')===ad));}
function yonAstSection(p){
  const as=astlari(p);
  const birimler=[...new Set(as.map(x=>(x.departman||'')+(x.bolum?' / '+x.bolum:'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
  const birHtml=birimler.length?'<div style="display:flex;flex-wrap:wrap;gap:8px">'+birimler.map(b=>'<span class="badge">'+esc(b)+'</span>').join('')+'</div>':'<div class="mini">Çalışan henüz bir birime yetkili olarak atanmamış.</div>';
  const astHtml=as.length?'<div class="empcards" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">'+as.slice().sort((a,b)=>String(a.ad).localeCompare(String(b.ad),'tr')).map(x=>'<div class="ec clk" data-id="'+esc(x.id)+'"><div class="av" style="width:34px;height:34px;background:'+avColor(x.ad)+'">'+esc(initials(x.ad))+'</div><div class="nm" style="font-size:12.5px">'+esc(trTitle(x.ad))+'</div><div class="de">'+esc(x.unvan||x.departman||'')+'</div></div>').join('')+'</div>':'<div class="mini">Çalışanın henüz astı bulunmuyor.</div>';
  return '<div style="height:16px"></div><div class="card pad"><div class="sec-h"><h2 style="font-size:15px">Yönettiği Birimler</h2></div>'+birHtml+'</div>'
    +'<div style="height:16px"></div><div class="card pad"><div class="sec-h"><h2 style="font-size:15px">Astları</h2><span class="mini">'+as.length+' kişi</span></div>'+astHtml+'</div>';
}
/* Özlük doluluk oranı (izlenen alanların doluluğu) */
const OZLUK_ALANLARI=['dogum','cinsiyet','medeni','cocuk','uyruk','kanGrubu','egitimDurumu','egitimSeviye','egitimKurum','adres2','sehir','postaKodu','bankaAd','iban','hesapNo','acilAd','acilTel','acilYakin','epostaIs','telIs','epostaKisisel','telKisisel'];
function ozlukDoluluk(p){const dolu=OZLUK_ALANLARI.filter(k=>p[k]!=null&&String(p[k]).trim()!=='').length;return {dolu,toplam:OZLUK_ALANLARI.length,pct:Math.round(dolu/OZLUK_ALANLARI.length*100)};}
/* Pozisyon geçmişi (şu an sadece güncel pozisyon; Kolay İK pozisyon hareketleri raporu gelince genişler) */

      +fv('Unvan',esc(p.unvan))+fv('Departman',esc(p.departman))+fv('Bölüm',esc(p.bolum))

      +ci(mailIc,'E-Posta (İş)',p.epostaIs)+ci(telIc,'Telefon (İş)',p.telIs)+ci(mailIc,'E-posta (Kişisel)',p.epostaKisisel)+ci(telIc,'Telefon (Kişisel)',p.telKisisel)
    +'</div>'
    +'<div class="card pad"><div class="side-h">Erişim</div>'
      +'<div class="side-kv"><span>Erişim Tipi</span><b>Çalışan</b></div>'
      +'<div class="side-kv"><span>Son Giriş Zamanı</span><b>—</b></div>'

/* ===== İZİNLER ===== */
function durumBadge(d){return d==='onaylandi'?'<span class="badge b-ok">Onaylandı</span>':d==='reddedildi'?'<span class="badge b-bad">Reddedildi</span>':'<span class="badge b-warn">Onay Bekliyor</span>';}
/* ---- ONAY AKIŞI (Müdür → Direktör → İnsan Kaynakları) + DENETİM İZİ ---- */
function ikOnaycisi(emp){
  const raw=emp&&emp.izinOnay; if(!raw) return 'İnsan Kaynakları';
  const s=String(raw).replace(/\s*(İZİN|HARCAMA|AVANS|MESAİ)\s+ONAY.*$/i,'').replace(/\s+ONAY\s+SÜRE(Cİ|Ç).*$/i,'');
  const parts=s.split(',').map(x=>x.trim()).filter(Boolean);
  const mud=(emp.mudurluk||'').toLocaleUpperCase('tr'), dir=(emp.direktor||'').toLocaleUpperCase('tr');
  const rem=parts.filter(x=>{const u=x.toLocaleUpperCase('tr');return u!==mud&&u!==dir;});
  return rem.length?trTitle(rem[rem.length-1]):'İnsan Kaynakları';
}
function onayZinciri(emp){
  const c=[];
  if(emp&&emp.mudurluk) c.push({rol:'Müdür',ad:emp.mudurluk,durum:'bekliyor'});
  if(emp&&emp.direktor&&trLower(emp.direktor)!==trLower(emp.mudurluk||'')) c.push({rol:'Direktör',ad:emp.direktor,durum:'bekliyor'});
  c.push({rol:'İnsan Kaynakları',ad:ikOnaycisi(emp),durum:'bekliyor'});
  return c;
}
function curStep(z){return (z.onayAkis||[]).find(s=>s.durum==='bekliyor');}
function izinAsamaBadge(z){
  if(z.durum==='onaylandi') return '<span class="badge b-ok">Onaylandı</span>';
  if(z.durum==='reddedildi'){const r=(z.onayAkis||[]).find(s=>s.durum==='reddedildi');return '<span class="badge b-bad">Reddedildi'+(r?' · '+esc(r.rol):'')+'</span>';}
  const cur=curStep(z); return '<span class="badge b-warn">'+(cur?esc(cur.rol)+' onayında':'Bekliyor')+'</span>';
}
function onayFind(k,id){return (k==='izin'?IZIN:k==='harc'?HARC:TALEP).find(x=>x.id===id);}
async function onayKaydet(k){return k==='izin'?kaydetIzin():k==='harc'?kaydetHarc():kaydetTalep();}
async function genOnayla(k,id){
  const z=onayFind(k,id); if(!z) return;
  if(!z.onayAkis||!z.onayAkis.length){ z.durum='onaylandi'; await onayKaydet(k); return; }
  const cur=curStep(z); if(!cur) return;
  cur.durum='onaylandi'; cur.tarih=new Date().toISOString(); cur.kaydeden=(SES&&SES.ad)||'İK';
  if(!z.onayAkis.some(s=>s.durum==='bekliyor')) z.durum='onaylandi';
  await onayKaydet(k);
}
async function genReddet(k,id){
  const z=onayFind(k,id); if(!z) return;
  const cur=curStep(z); if(cur){ cur.durum='reddedildi'; cur.tarih=new Date().toISOString(); cur.kaydeden=(SES&&SES.ad)||'İK'; }
  z.durum='reddedildi'; await onayKaydet(k);
}
async function izinOnayla(id){return genOnayla('izin',id);}
async function izinReddet(id){return genReddet('izin',id);}
/* Onay akışı metin özeti (rapor/export için) */
function onayOzet(z){
  if(!z.onayAkis||!z.onayAkis.length) return z.durum==='onaylandi'?'Doğrudan onaylı':(z.durum==='reddedildi'?'Reddedildi':'Onay bekliyor');
  return z.onayAkis.map(s=>{
    const d=s.durum==='onaylandi'?'Onayladı':s.durum==='reddedildi'?'Reddetti':'Bekliyor';
    const t=s.tarih?' ('+new Date(s.tarih).toLocaleDateString('tr-TR')+')':'';
    return s.rol+': '+d+t;
  }).join('  →  ');
}
function onayAsama(z){
  if(z.durum==='onaylandi') return 'Onaylandı';
  if(z.durum==='reddedildi'){const r=(z.onayAkis||[]).find(s=>s.durum==='reddedildi');return 'Reddedildi'+(r?' ('+r.rol+')':'');}
  const c=curStep(z); return c?c.rol+' onayında':'Onay bekliyor';
}
function akisGoster(k,id){
  if(id===undefined){id=k;k='izin';}
  const z=onayFind(k,id); if(!z) return;
  const akis=z.onayAkis||[];
  const curIdx=akis.findIndex(s=>s.durum==='bekliyor');
  const rows=akis.length?akis.map((s,i)=>{
    const ic=s.durum==='onaylandi'?'✓':s.durum==='reddedildi'?'✕':(i===curIdx?'●':'○');
    const col=s.durum==='onaylandi'?'var(--ok)':s.durum==='reddedildi'?'var(--bad)':(i===curIdx?'var(--warn)':'var(--muted)');
    const dur=s.durum==='onaylandi'?'Onaylandı':s.durum==='reddedildi'?'Reddedildi':(i===curIdx?'Onay bekliyor':'Sırada');
    return '<div style="display:flex;gap:13px;padding:11px 0;border-bottom:1px solid #f0f2f5"><div style="width:26px;height:26px;border-radius:50%;background:'+col+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none">'+ic+'</div>'
      +'<div style="flex:1"><div><b style="color:var(--navy)">'+(i+1)+'. '+esc(s.rol)+'</b>'+(s.ad&&s.ad!=='İnsan Kaynakları'?' · '+esc(trTitle(s.ad)):'')+'</div>'
      +'<div class="mini">'+dur+(s.tarih?' · '+new Date(s.tarih).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'')+(s.kaydeden?' · <b>işlemi yapan:</b> '+esc(trTitle(s.kaydeden)):'')+'</div></div></div>';
  }).join(''):'<div class="mini">Bu talep onay akışı olmadan (doğrudan onaylı) eklenmiş.</div>';
  const tipAd=k==='izin'?'İzin':k==='harc'?'Harcama':(z.tip||'Talep');
  let alt='';
  if(k==='izin') alt=esc(z.tur)+' · '+esc(z.gun)+' gün · '+esc(z.baslangic)+' → '+esc(z.bitis);
  else if(k==='harc') alt=esc(z.tur)+' · '+esc(z.tutar)+' TL · '+esc(z.tarih);
  else alt=esc(z.ozet||'')+' · '+esc(z.tarih);
  document.getElementById('akisBody').innerHTML='<div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)"><b style="color:var(--navy);font-size:15px">'+esc(trTitle(z.empAd))+'</b> '+tipBadge(tipAd)+'<div class="mini" style="margin-top:3px">'+alt+'</div></div>'
    +'<div style="font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Onay Sırası</div>'+rows
    +(z.olusturma?'<div class="mini" style="margin-top:14px">Talep oluşturulma: '+new Date(z.olusturma).toLocaleString('tr-TR')+'</div>':'');
  document.getElementById('akisOvl').classList.add('on');
}
function izinRow(z,inProfile){
  let act='';
  if(z.durum==='bekliyor') act='<button class="btn ok sm" data-izonay="'+esc(z.id)+'">Onayla</button> <button class="btn bad sm" data-izred="'+esc(z.id)+'">Reddet</button> ';
  act+='<button class="btn g sm" data-izakis="'+esc(z.id)+'">Akış</button> <button class="btn g sm" data-izform="'+esc(z.id)+'">Form</button> <button class="btn g sm" data-izsil="'+esc(z.id)+'" style="color:var(--bad)">Sil</button>';
  return '<tr>'+(inProfile?'':'<td><b style="color:var(--navy)">'+esc(trTitle(z.empAd))+'</b></td>')+'<td class="mini">'+esc(z.baslangic)+'</td><td class="mini">'+esc(z.bitis)+'</td><td><b>'+esc(z.gun)+'</b></td><td>'+esc(z.tur)+'</td><td class="mini">'+esc(z.aciklama||'')+'</td><td>'+izinAsamaBadge(z)+'</td><td style="white-space:nowrap">'+act+'</td></tr>';
}

  let L=IZIN.slice();

  else if(ST.izTab!=='tumu') L=L.filter(z=>z.durum===ST.izTab);

  const cnt=t=>t==='tumu'?IZIN.length:(t==='yaklasan'?IZIN.filter(z=>z.durum==='onaylandi'&&dObj(z.bitis)&&dObj(z.bitis)>=bugun).length:IZIN.filter(z=>z.durum===t).length);

    +'<div class="subtabs">'+tabs.map(t=>'<button class="subtab'+(ST.izTab===t[0]?' on':'')+'" data-iztab="'+t[0]+'">'+t[1]+' <span class="tag">'+cnt(t[0])+'</span></button>').join('')+'</div>'
    +'<div class="card" style="overflow:auto"><table class="tbl"><thead><tr><th>Ad Soyad</th><th>Başlangıç</th><th>Bitiş</th><th>Gün</th><th>Tür</th><th>Açıklama</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>'
    +(L.length?L.map(z=>izinRow(z,false)).join(''):'<tr><td colspan="8" class="empty">Kayıt yok.</td></tr>')+'</tbody></table></div>';
}

/* ===== TAKVİM ===== */
function viewTakvim(){

  const dh=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];

  for(let d=1;d<=gun;d++){const evs=(izinGun[d]||[]).slice(0,4).map(z=>'<div class="ev" style="background:'+(/ücretsiz/i.test(z.tur)?'#b26a00':/rapor/i.test(z.tur)?'#8e44ad':'#1b8a4b')+'">'+esc(trTitle(z.empAd.split(' ')[0]))+' · '+esc(z.tur.split(' ')[0])+'</div>').join('');const extra=(izinGun[d]||[]).length>4?'<div class="mini">+'+((izinGun[d].length)-4)+' daha</div>':'';cells+='<div class="dc"><div class="dn">'+d+'</div>'+evs+extra+'</div>';}
  return '<div class="toolbar"><button class="btn g sm" id="ayGeri">←</button><div style="font-family:var(--serif);font-size:18px;font-weight:700;color:var(--navy);min-width:150px;text-align:center">'+ayAd(ST.pzAy)+'</div><button class="btn g sm" id="ayIleri">→</button><div style="flex:1"></div><span class="badge b-ok">Yıllık</span><span class="badge b-warn">Ücretsiz</span><span class="badge" style="background:#f6ecfb;color:#8e44ad;border-color:#e3d0f2">Rapor</span></div>'
    +'<div class="card pad"><div class="cal">'+dh.map(d=>'<div class="dh">'+d+'</div>').join('')+cells+'</div></div>';
}

}

/* ===== PUANTAJ ===== */
function ayGunSayi(ym){const [Y,M]=ym.split('-').map(Number);return new Date(Y,M,0).getDate();}
function ayAd(ym){const [Y,M]=ym.split('-').map(Number);return new Date(Y,M-1,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'}).replace(/^\w/,c=>c.toLocaleUpperCase('tr'));}
const PZ_NEXT={'Y':'C','C':'I','I':'T','T':'R','R':'Y'}; const PZ_AD={C:'Çalıştı',I:'İzinli',T:'Tatil',R:'Rapor',Y:'—'};
function puanIzinUygula(){ // onaylı izinleri puantaja yansıt (sadece boş hücreler)
  const [Y,M]=ST.pzAy.split('-').map(Number); const av=PUAN[ST.pzAy]=PUAN[ST.pzAy]||{};
  IZIN.filter(z=>z.durum==='onaylandi').forEach(z=>{let a=dObj(z.baslangic),b=dObj(z.bitis);if(!a||!b)return;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){if(d.getFullYear()===Y&&d.getMonth()===M-1){const row=av[z.empId]=av[z.empId]||{};const dd=d.getDate();if(!row[dd]||row[dd]==='Y')row[dd]=/rapor/i.test(z.tur)?'R':'I';}}});
}
function viewPuantaj(){
  puanIzinUygula();
  const gun=ayGunSayi(ST.pzAy); const [Y,M]=ST.pzAy.split('-').map(Number);
  const emps=AKTIF.slice().sort((a,b)=>String(a.ad).localeCompare(String(b.ad),'tr'));
  const av=PUAN[ST.pzAy]||{};
  let head='<tr><th class="nm" style="text-align:left">Çalışan</th>';for(let d=1;d<=gun;d++){const wd=(new Date(Y,M-1,d).getDay());const we=(wd===0||wd===6);head+='<th'+(we?' style="background:#eef1f4"':'')+'>'+d+'</th>';}head+='<th>Top.</th></tr>';
  let rows=emps.map(p=>{const row=av[p.id]||{};let c=0;let tds='';for(let d=1;d<=gun;d++){const v=row[d]||'Y';if(v==='C')c++;tds+='<td class="cell c-'+v+'" data-emp="'+esc(p.id)+'" data-gun="'+d+'" title="'+PZ_AD[v]+'">'+(v==='Y'?'·':v)+'</td>';}return '<tr><td class="nm">'+esc(trTitle(p.ad))+'</td>'+tds+'<td><b>'+c+'</b></td></tr>';}).join('');
  return '<div class="toolbar"><button class="btn g sm" id="ayGeri">←</button><div style="font-family:var(--serif);font-size:18px;font-weight:700;color:var(--navy);min-width:160px;text-align:center">'+ayAd(ST.pzAy)+'</div><button class="btn g sm" id="ayIleri">→</button><div style="flex:1"></div>'
    +'<span class="badge" style="background:#eaf7ef;color:#15713d">C Çalıştı</span><span class="badge" style="background:#eef2fb;color:#2563eb">I İzinli</span><span class="badge" style="background:#fff4e0;color:#b26a00">T Tatil</span><span class="badge" style="background:#f6ecfb;color:#8e44ad">R Rapor</span></div>'
    +'<div class="mini" style="margin-bottom:10px">Hücreye tıklayarak durumu değiştirin (· → C → I → T → R). Onaylı izinler otomatik işlenir.</div>'
    +'<div class="card pad pz"><table>'+head+rows+'</table></div>';
}

/* ===== RAPORLAR ===== */
const RAPORLAR=[
  {id:'calisan',kat:'Çalışan',ad:'Çalışan Listesi',ac:'Tüm aktif çalışanlar ve bilgileri',uses:['birim']},
  {id:'calismasuresi',kat:'Çalışan',ad:'Çalışma Süresi',ac:'Kıdem / çalışma süresi dökümü',uses:['birim']},
  {id:'ayrilan',kat:'İdari',ad:'İşten Ayrılan Çalışanlar',ac:'Seçili dönemde işten ayrılanlar',uses:['birim','ay','yil']},
  {id:'isealim',kat:'İdari',ad:'İşe Alım Raporu',ac:'Seçili dönemde işe alınanlar',uses:['birim','ay','yil']},
  {id:'turnover',kat:'İdari',ad:'Turnover (Dönüşüm) Raporu',ac:'Giriş/çıkış ve devir oranı',uses:['yil']},
  {id:'izinbakiye',kat:'İdari',ad:'İzin Bakiye Raporu',ac:'Çalışan bazında yıllık izin bakiyesi',uses:['birim']},
  {id:'izinkullanim',kat:'İdari',ad:'Kullanılan İzin Raporu',ac:'Seçili dönemde onaylı izinler + onay akışı',uses:['birim','ay','yil']},
  {id:'onaysurec',kat:'İdari',ad:'Onay Süreçleri Raporu',ac:'İzin / avans / mesai / harcama onay akışları',uses:['birim','ay','yil']},
  {id:'departman',kat:'İdari',ad:'Departman Dağılımı',ac:'Departman bazında çalışan sayısı',uses:[]},
  {id:'maas',kat:'Finans',ad:'Maaş Bilgileri',ac:'Maaş girilmiş çalışanlar',uses:['birim']},
  {id:'harcama',kat:'Finans',ad:'Harcama Raporu',ac:'Seçili dönemde harcamalar + onay akışı',uses:['birim','ay','yil']}
];
const RAP_AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function dYil(s){const m=/(\d{4})\s*$/.exec(s||'');return m?+m[1]:null;}
function dAy(s){const p=(s||'').split('.');return p.length===3?+p[1]:null;}
function rapYillar(){const set=new Set();allEmp().forEach(p=>{const g=dYil(p.giris);if(g)set.add(g);const c=dYil(p.cikis);if(c)set.add(c);});set.add(buYil());return [...set].sort((a,b)=>b-a);}
function inBirim(p,f){return !f.birim||p.departman===f.birim;}
function inDonem(ds,f){if(f.yil&&dYil(ds)!==f.yil)return false;if(f.ay&&dAy(ds)!==f.ay)return false;return true;}
function recEmp(z){return empById(z.empId)||{};}
function viewRaporlar(){
  const deps=ensureAyar().departmanlar;
  const yillar=rapYillar();
  const kats=['Çalışan','İdari','Finans'];
  const optg=kats.map(k=>'<optgroup label="'+k+'">'+RAPORLAR.filter(r=>r.kat===k).map(r=>'<option value="'+r.id+'"'+(ST.rapSel===r.id?' selected':'')+'>'+esc(r.ad)+'</option>').join('')+'</optgroup>').join('');
  return '<div class="sec-h"><h2 style="font-family:var(--serif);font-size:17px">Rapor Oluştur</h2><span class="mini">Rapor türünü seçin, birim ve dönemi filtreleyin, Excel olarak indirin.</span></div>'
    +'<div class="card pad"><div class="rb-grid">'
      +'<div class="f"><label>Rapor</label><select id="rpSel">'+optg+'</select></div>'
      +'<div class="f"><label>Birim</label><select id="rpBirim"><option value="">Tüm Birimler</option>'+deps.map(d=>'<option'+(ST.rapBirim===d?' selected':'')+'>'+esc(d)+'</option>').join('')+'</select></div>'
      +'<div class="f"><label>Ay</label><select id="rpAy"><option value="0">Tüm Aylar</option>'+RAP_AYLAR.map((a,i)=>'<option value="'+(i+1)+'"'+(ST.rapAy===(i+1)?' selected':'')+'>'+a+'</option>').join('')+'</select></div>'
      +'<div class="f"><label>Yıl</label><select id="rpYil"><option value="0">Tüm Yıllar</option>'+yillar.map(y=>'<option value="'+y+'"'+(ST.rapYil===y?' selected':'')+'>'+y+'</option>').join('')+'</select></div>'
      +'<div class="f rb-btn"><button class="btn" id="rpOlustur">Oluştur</button></div>'
    +'</div></div>'
    +'<div class="sec-h" style="margin-top:24px"><h2 style="font-family:var(--serif);font-size:15px">Hazır Şablonlar</h2><span class="mini">Kartlar tüm kayıtları getirir; yukarıdaki filtrelerle daraltabilirsiniz.</span></div>'
    +'<div class="rep-cards">'+RAPORLAR.map(r=>'<div class="rc" data-rap="'+r.id+'"><div class="rc-kat">'+r.kat+'</div><h3>'+esc(r.ad)+'</h3><p>'+esc(r.ac)+'</p></div>').join('')+'</div>'
    +'<div id="rapOut" style="margin-top:22px"></div>';
}
function raporData(id,f){
  f=f||{birim:'',ay:0,yil:0};
  const bf=p=>inBirim(p,f);
  if(id==='calisan') return {baslik:'Çalışan Listesi',cols:['Ad Soyad','TC Kimlik','Departman','Bölüm','Unvan','İşe Giriş','Müdür','Direktör'],rows:AKTIF.filter(bf).map(p=>[trTitle(p.ad),p.tc,p.departman,p.bolum,p.unvan,p.giris,trTitle(p.mudurluk||''),trTitle(p.direktor||'')])};
  if(id==='calismasuresi') return {baslik:'Çalışma Süresi',cols:['Ad Soyad','TC Kimlik','Departman','Bölüm','Unvan','İşe Giriş','Çalışma Süresi'],rows:AKTIF.filter(bf).map(p=>[trTitle(p.ad),p.tc,p.departman,p.bolum,p.unvan,p.giris,calismaSuresi(p.giris)])};
  if(id==='ayrilan') return {baslik:'İşten Ayrılan Çalışanlar',cols:['Ad Soyad','TC Kimlik','Departman','Bölüm','Unvan','Müdür','Direktör','İşe Giriş','İşten Çıkış','Ayrılma Nedeni','Çalışma Süresi'],rows:AYRILAN.filter(bf).filter(p=>inDonem(p.cikis,f)).map(p=>[trTitle(p.ad),p.tc,p.departman,p.bolum,p.unvan,trTitle(p.mudurluk||''),trTitle(p.direktor||''),p.giris,p.cikis,p.ayrilmaNedeni,p.calismaSuresi])};
  if(id==='isealim') return {baslik:'İşe Alım Raporu',cols:['Ad Soyad','TC Kimlik','Departman','Bölüm','Unvan','İşe Giriş','Müdür','Direktör'],rows:AKTIF.filter(bf).filter(p=>inDonem(p.giris,f)).map(p=>[trTitle(p.ad),p.tc,p.departman,p.bolum,p.unvan,p.giris,trTitle(p.mudurluk||''),trTitle(p.direktor||'')])};
  if(id==='izinbakiye') return {baslik:'İzin Bakiye Raporu',cols:['Ad Soyad','TC Kimlik','Departman','Kıdem','Hak Edilen','Kullanılan','Kalan'],rows:AKTIF.filter(bf).map(p=>{const b=izinBakiye(p);const g=x=>x==null?'—':x;return [trTitle(p.ad),p.tc,p.departman,calismaSuresi(p.giris),g(b.hak),g(b.kullanilan),g(b.kalan)];})};
  if(id==='izinkullanim') return {baslik:'Kullanılan İzin Raporu',cols:['Ad Soyad','TC Kimlik','Tür','Başlangıç','Bitiş','Gün','Durum','Onay Akışı'],rows:IZIN.filter(z=>z.durum==='onaylandi').filter(z=>{const e=recEmp(z);return (!f.birim||e.departman===f.birim)&&inDonem(z.baslangic,f);}).map(z=>[trTitle(z.empAd),recEmp(z).tc||'',z.tur,z.baslangic,z.bitis,z.gun,'Onaylandı',onayOzet(z)])};
  if(id==='onaysurec'){
    const rows=[];
    const push=(z,tip,ozet,tarih)=>{const e=recEmp(z);if(f.birim&&e.departman!==f.birim)return;if(!inDonem(tarih,f))return;rows.push([trTitle(z.empAd),e.tc||'',tip,ozet,tarih,onayAsama(z),onayOzet(z)]);};
    IZIN.forEach(z=>push(z,'İzin',z.tur+' · '+z.gun+' gün',z.baslangic));
    HARC.forEach(h=>push(h,'Harcama',h.tur+' · '+h.tutar+' TL',h.tarih));
    TALEP.forEach(t=>push(t,t.tip,t.ozet,t.tarih));
    rows.sort((a,b)=>dkey(b[4])-dkey(a[4]));
    return {baslik:'Onay Süreçleri Raporu',cols:['Ad Soyad','TC Kimlik','Tür','Özet','Tarih','Aşama','Onay Akışı'],rows};
  }
  if(id==='departman'){const d=depDagilim();return {baslik:'Departman Dağılımı',cols:['Departman','Çalışan Sayısı','Oran %'],rows:d.map(([k,v])=>[k,v,Math.round(v/AKTIF.length*100)])};}
  if(id==='maas') return {baslik:'Maaş Bilgileri',cols:['Ad Soyad','TC Kimlik','Departman','Unvan','Maaş','Periyot','Net/Brüt'],rows:AKTIF.filter(bf).filter(p=>p.maas).map(p=>[trTitle(p.ad),p.tc,p.departman,p.unvan,p.maas+' '+(p.maasBirim||'TL'),p.maasPeriyot||'Aylık',p.netBrut||''])};
  if(id==='harcama') return {baslik:'Harcama Raporu',cols:['Ad Soyad','TC Kimlik','Tür','Tutar','Tarih','Aşama','Onay Akışı'],rows:HARC.filter(h=>{const e=recEmp(h);return (!f.birim||e.departman===f.birim)&&inDonem(h.tarih,f);}).map(h=>[trTitle(h.empAd),recEmp(h).tc||'',h.tur,h.tutar+' TL',h.tarih,onayAsama(h),onayOzet(h)])};
  if(id==='turnover'){
    const y=f.yil||buYil();
    const giris=allEmp().filter(p=>dYil(p.giris)===y&&!turnoverHaric(p)).length;
    const cikis=AYRILAN.filter(p=>dYil(p.cikis)===y&&!turnoverHaric(p)).length;
    const rows=[['Yıl',y],['İşe giren',giris],['İşten ayrılan',cikis],['Net değişim',giris-cikis]];
    if(y===buYil()) rows.push(['Aktif çalışan (bugün)',AKTIF.filter(p=>!turnoverHaric(p)).length]);
    return {baslik:'Turnover (Dönüşüm) Raporu — '+y+' (stajyer/öğrenci/V.İ. hariç)',cols:['Gösterge','Değer'],rows};
  }
  return {baslik:'—',cols:[],rows:[]};
}
function rapFiltreOzet(f){const a=[];if(f){if(f.birim)a.push('Birim: '+f.birim);if(f.ay)a.push('Ay: '+RAP_AYLAR[f.ay-1]);if(f.yil)a.push('Yıl: '+f.yil);}return a;}
function renderRapor(id,f){
  f=f||{birim:ST.rapBirim||'',ay:ST.rapAy||0,yil:ST.rapYil||0};
  const d=raporData(id,f); const fo=rapFiltreOzet(f);
  const html='<div class="card pad"><div class="sec-h"><h2>'+esc(d.baslik)+' <span class="mini">('+d.rows.length+' kayıt'+(fo.length?' · '+esc(fo.join(' · ')):'')+')</span></h2><button class="btn sm" id="rapCsv">⬇ Excel indir</button></div>'
    +'<div style="overflow:auto"><table class="tbl"><thead><tr>'+d.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+(d.rows.length?d.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c==null?'':c)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+d.cols.length+'" class="empty">Kayıt yok.</td></tr>')+'</tbody></table></div></div>';
  document.getElementById('rapOut').innerHTML=html;
  document.getElementById('rapCsv').onclick=()=>xlsIndir(d,fo);
  document.getElementById('rapOut').scrollIntoView({behavior:'smooth',block:'start'});
}
function xlsIndir(d,fo){
  const h=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const head='<tr>'+d.cols.map(c=>'<th>'+h(c)+'</th>').join('')+'</tr>';
  const body=d.rows.map(r=>'<tr>'+r.map(c=>'<td>'+h(c)+'</td>').join('')+'</tr>').join('');
  const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'
    +'<style>table{border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:11pt}'
    +'caption{font-size:14pt;font-weight:bold;color:#132a44;text-align:left;padding:8px 0;mso-number-format:"\\@"}'
    +'th{background:#132a44;color:#ffffff;font-weight:bold;border:1px solid #0c1c2e;padding:7px 12px;text-align:left;white-space:nowrap}'
    +'td{border:1px solid #d5dbe1;padding:5px 11px;vertical-align:top;mso-number-format:"\\@"}'
    +'tr:nth-child(even) td{background:#f6f8fa}</style></head><body>'
    +'<table><caption>'+h(d.baslik)+' — İnciroğlu Otomotiv ('+new Date().toLocaleDateString('tr-TR')+')'+((fo&&fo.length)?'  ['+h(fo.join(' · '))+']':'')+'</caption><thead>'+head+'</thead><tbody>'+body+'</tbody></table></body></html>';
  const blob=new Blob(['﻿'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(d.baslik.replace(/[^\wğüşıöçĞÜŞİÖÇ ]/g,'').trim()||'rapor')+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

  }
  if(r.page==='takvim'||r.page==='puantaj'){
    const g=document.getElementById('ayGeri'),i=document.getElementById('ayIleri');
    if(g)g.onclick=()=>{ST.pzAy=ayKaydir(ST.pzAy,-1);render();}; if(i)i.onclick=()=>{ST.pzAy=ayKaydir(ST.pzAy,1);render();};

  }

function ayKaydir(ym,n){let[Y,M]=ym.split('-').map(Number);M+=n;while(M<1){M+=12;Y--;}while(M>12){M-=12;Y++;}return Y+'-'+String(M).padStart(2,'0');}

function bindRows(){document.querySelectorAll('.ec[data-id]').forEach(c=>c.onclick=()=>{pfTab='profil';go('calisan/'+c.getAttribute('data-id'));});document.querySelectorAll('tr.clk[data-id]').forEach(tr=>tr.onclick=()=>{pfTab='profil';go('calisan/'+tr.getAttribute('data-id'));});document.querySelectorAll('thead th.srt[data-sort]').forEach(h=>h.onclick=()=>{const c=h.getAttribute('data-sort');if(ST.sortCol===c)ST.sortDir*=-1;else{ST.sortCol=c;ST.sortDir=1;}render();});}

  const w=window.open('','_blank');if(!w){alert('Açılır pencere engellendi.');return;}
  w.document.write('<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>İzin Formu</title><style>body{font-family:Arial,sans-serif;color:#1c2530;padding:40px;max-width:800px;margin:auto;font-size:13px}h1{font-family:Georgia,serif;color:#132a44;font-size:20px}.row{display:flex;border-bottom:1px solid #e5e5e5;padding:7px 0}.k{width:190px;color:#667;font-weight:bold}.v{flex:1}.sec{font-weight:bold;margin:22px 0 6px;color:#132a44}.sign{display:flex;gap:40px;margin-top:50px}.sign div{flex:1;border-top:1px solid #333;padding-top:6px;font-size:12px}@media print{.noprint{display:none}}</style></head><body>'
    +'<div style="display:flex;justify-content:space-between;align-items:center"><h1>İnciroğlu Otomotiv</h1><div>'+new Date().toLocaleDateString('tr-TR')+'</div></div><hr>'
    +'<div class="sec">Çalışan Bilgileri</div>'
    +row('Adı Soyadı',trTitle(e.ad||z.empAd))+row('TC Kimlik No',e.tc||'')+row('Departman / Bölüm',(e.departman||'')+' / '+(e.bolum||''))+row('Unvan',e.unvan||'')+row('İşe Başlama Tarihi',e.giris||'')+row('Telefon',e.telefonIs||e.telefonKisisel||'')+row('Yerine Bakacak Kişi',z.yerine||'')
    +'<div class="sec">İzin Detayları</div>'
    +row('İzin Türü',z.tur)+row('Kullanılan Gün Sayısı',z.gun)+row('Başlangıç Tarihi',z.baslangic)+row('Bitiş Tarihi',z.bitis)+row('Toplam Kalan İzin',b.kalan!=null?b.kalan+' gün':'—')+row('Açıklama',z.aciklama||'')
    +'<p style="margin-top:24px">Yukarıda belirttiğim tarihler arasında izin hakkımı kullanacağımı beyan ederim.</p>'
    +'<div class="sign"><div>Çalışan<br>'+trTitle(e.ad||z.empAd)+'<br>İmza</div><div>Yönetici Onayı<br>'+(e.yonetici||'')+'</div><div>İnsan Kaynakları Onayı</div></div>'
    +'<div class="noprint" style="margin-top:30px;text-align:center"><button onclick="window.print()" style="padding:10px 22px;font-size:14px;cursor:pointer">Yazdır / PDF</button></div>'
    +'</body></html>');
  w.document.close();
  function row(k,v){return '<div class="row"><div class="k">'+k+'</div><div class="v">'+String(v==null?'':v)+'</div></div>';}
}

/* ===== HARCAMA ===== */
function openHarc(){
  const a=ensureAyar(); const emps=AKTIF.slice().sort((x,y)=>String(x.ad).localeCompare(String(y.ad),'tr'));
  document.getElementById('harcBody').innerHTML=
    '<div class="f"><label>Çalışan</label><select id="hcEmp"><option value=""></option>'+emps.map(e=>'<option value="'+e.id+'">'+esc(trTitle(e.ad))+'</option>').join('')+'</select></div>'
    +'<div class="f two"><div><label>Tür</label><select id="hcTur">'+a.harcamaTurleri.map(t=>'<option>'+esc(t)+'</option>').join('')+'</select></div><div><label>Tutar (TL)</label><input id="hcTutar" type="number" min="0" step="0.01"></div></div>'
    +'<div class="f"><label>Tarih</label><input id="hcTarih" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
    +'<div class="f"><label>Açıklama</label><textarea id="hcAcik" rows="2"></textarea></div>'
    +'<div class="f"><label class="chk"><input type="checkbox" id="hcOnayli"> Doğrudan onaylı ekle (onay akışını atla)</label></div>';
  document.getElementById('harcOvl').classList.add('on');
}
async function saveHarc(){
  const empId=v('hcEmp'); if(!empId){alert('Çalışan seçin.');return;} const t=v('hcTutar'); if(!t){alert('Tutar girin.');return;}
  const e=empById(empId); const tr=v('hcTarih');
  const oc=document.getElementById('hcOnayli'); const onayli=oc&&oc.checked;
  const akis=onayZinciri(e);
  if(onayli) akis.forEach(s=>{s.durum='onaylandi';s.tarih=new Date().toISOString();s.kaydeden=(SES&&SES.ad)||'İK';});
  HARC=HARC.concat([{id:uid('h'),empId,empAd:e?e.ad:'',tur:v('hcTur'),tutar:+t,tarih:tr?trFromISO(tr):'',aciklama:v('hcAcik'),durum:onayli?'onaylandi':'bekliyor',onayAkis:akis,odendi:false,olusturma:new Date().toISOString()}]);
  await kaydetHarc(); closeModals();
}
async function hcDurum(id,d){const h=HARC.find(x=>x.id===id);if(!h)return;h.durum=d;await kaydetHarc();}
async function hcOdendi(id){const h=HARC.find(x=>x.id===id);if(!h)return;h.odendi=true;await kaydetHarc();}
async function hcSil(id){if(!confirm('Harcama silinsin mi?'))return;HARC=HARC.filter(x=>x.id!==id);await kaydetHarc();}

/* ===== MESAİ / AVANS TALEP ===== */
let talepTip=null;
function yeniTalep(tip){ if(tip==='İzin')return openIzin(); if(tip==='Harcama')return openHarc(); openTalep(tip); }
function openTalep(tip){
  talepTip=tip; const emps=AKTIF.slice().sort((x,y)=>String(x.ad).localeCompare(String(y.ad),'tr'));
  document.getElementById('talepTitle').textContent=tip+' Talebi';
  const opt='<option value=""></option>'+emps.map(e=>'<option value="'+e.id+'">'+esc(trTitle(e.ad))+'</option>').join('');
  let f='<div class="f"><label>Çalışan</label><select id="tlEmp">'+opt+'</select></div><div class="f"><label>Tarih</label><input id="tlTarih" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>';
  if(tip==='Mesai') f+='<div class="f"><label>Mesai Süresi (saat)</label><input id="tlVal" type="number" min="0" step="0.5" placeholder="örn. 3"></div>';
  else f+='<div class="f"><label>Avans Tutarı (TL)</label><input id="tlVal" type="number" min="0" step="0.01"></div>';
  f+='<div class="f"><label>Açıklama</label><textarea id="tlAcik" rows="2"></textarea></div><div class="f"><label class="chk"><input type="checkbox" id="tlOnayli"> Doğrudan onaylı ekle (onay akışını atla)</label></div>';
  document.getElementById('talepBody').innerHTML=f;
  document.getElementById('talepOvl').classList.add('on');
}
async function saveTalep(){
  const empId=v('tlEmp'); if(!empId){alert('Çalışan seçin.');return;}
  const val=v('tlVal'); if(!val){alert(talepTip==='Mesai'?'Mesai süresi girin.':'Tutar girin.');return;}
  const e=empById(empId); const tr=v('tlTarih');
  const ozet=talepTip==='Mesai'?(val+' saat mesai'):(val+' TL avans');
  const onayli=document.getElementById('tlOnayli').checked;
  const akis=onayZinciri(e);
  if(onayli) akis.forEach(s=>{s.durum='onaylandi';s.tarih=new Date().toISOString();s.kaydeden=(SES&&SES.ad)||'İK';});
  TALEP=TALEP.concat([{id:uid('t'),tip:talepTip,empId,empAd:e?e.ad:'',tarih:tr?trFromISO(tr):'',deger:+val,ozet,aciklama:v('tlAcik'),durum:onayli?'onaylandi':'bekliyor',onayAkis:akis,olusturma:new Date().toISOString()}]);
  await kaydetTalep(); closeModals();
}
async function talepDurum(spec,d){ const i=spec.indexOf('|'); const k=spec.slice(0,i),id=spec.slice(i+1);
  if(k==='izin'){const z=IZIN.find(x=>x.id===id);if(z){z.durum=d;await kaydetIzin();}}
  else if(k==='harc'){const h=HARC.find(x=>x.id===id);if(h){h.durum=d;await kaydetHarc();}}
  else {const t=TALEP.find(x=>x.id===id);if(t){t.durum=d;await kaydetTalep();}}
}

/* ===== İŞTEN AYRILDI ===== */
let delId=null;
function openDel(id){const p=AKTIF.find(x=>x.id===id);if(!p)return;delId=id;document.getElementById('delWho').innerHTML='<b>'+esc(trTitle(p.ad))+'</b> — '+esc(p.departman||'')+' · '+esc(p.bolum||'');document.getElementById('delCikis').value=new Date().toISOString().slice(0,10);document.getElementById('delOvl').classList.add('on');}
async function doDel(){if(!delId)return;const p=AKTIF.find(x=>x.id===delId);if(!p)return;const c=v('delCikis')||document.getElementById('delCikis').value;AKTIF=AKTIF.filter(x=>x.id!==delId);AYRILAN=[Object.assign({},p,{cikis:c?trFromISO(c):new Date().toLocaleDateString('tr-TR')})].concat(AYRILAN);await kaydetPers();closeModals();go('calisanlar');}
async function silEmp(id){const p=empById(id);if(!p)return;if(!confirm(trTitle(p.ad)+' kaydı sistemden KALICI olarak silinecek. Bu işlem geri alınamaz. Emin misiniz?'))return;AKTIF=AKTIF.filter(x=>x.id!==id);AYRILAN=AYRILAN.filter(x=>x.id!==id);await kaydetPers();go('calisanlar');}

/* ===== AYARLAR CRUD ===== */
async function ayarEkle(key){const el=document.getElementById('add_'+key);const val=(el.value||'').trim();if(!val)return;const a=ensureAyar();const arr=a[key].slice();if(!arr.includes(val))arr.push(val);arr.sort((x,y)=>x.localeCompare(y,'tr'));const o={};o[key]=arr;await kaydetAyar(o);}
async function ayarSil(spec){const i=spec.indexOf('|');const key=spec.slice(0,i),val=spec.slice(i+1);const a=ensureAyar();const o={};o[key]=a[key].filter(x=>x!==val);await kaydetAyar(o);}

/* ===== ORTAK ===== */
function closeModals(){['empOvl','izinOvl','harcOvl','talepOvl','akisOvl','delOvl'].forEach(id=>document.getElementById(id).classList.remove('on'));delId=null;editId=null;izEmpFix=null;talepTip=null;}
let openMenu=null; function closeMenu(){if(openMenu){openMenu.remove();openMenu=null;}}
function bindGlobal(){
  document.getElementById('logout').onclick=()=>{location.href='portal.html';};
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);
  document.getElementById('eSave').onclick=saveEmp;
  document.getElementById('izSave').onclick=saveIzin;
  document.getElementById('hcSave').onclick=saveHarc;
  document.getElementById('tlSave').onclick=saveTalep;
  document.getElementById('delGo').onclick=doDel;
  const gq=document.getElementById('gq');gq.oninput=()=>{if(route().page!=='calisanlar'){ST.q=gq.value;go('calisanlar');}else{ST.q=gq.value;const lq=document.getElementById('lq');if(lq)lq.value=gq.value;softList();}};
  window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals();});
}

if(SES&&SES.ok&&IS_IK){ if(!location.hash)location.hash='#/'; boot(); }
</script>
</body>
</html>
